,\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:null\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"LinguAI Bridge\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Computer-delivered IELTS listening practice\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"10:\"$b:metadata\"\n"])</script><script>self.__next_f.push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"779\",\"static/chunks/app/practice/reading/single/%5Btest%5D/page-c8475733dad30162.js\"],\"default\"]\n13:T14ba,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eThe University of Life\u003c/h2\u003e\n\u003cp class=\"p-sub-inline\"\u003eKatherine Demopoulos meets students who took a break from study to volunteer overseas and returned with a new sense of purpose\u003c/p\u003e\n\n\u003cp\u003eThe majority of 18-year-old students entering higher education go straight from school to university. For many school leavers, however, there is the irresistible attraction of the ‘gap year’, a time between school and university when they decide to experience something new, different or exciting. Many of these so-called ‘gappers’ go off travelling around the world, often supplementing their limited funds by taking on casual work, while others may do voluntary work in a village in a distant part of the world.\u003c/p\u003e\n\n\u003cp\u003eFor the majority of gappers, the gap year is simply a chance to enjoy life as an independent adult for the first time. Increasingly, however, they are also proving a great way of reinvigorating a lapsed or flagging interest in education, offering a chance to think about why you should study, or if you need to study at all. A growing number of students, having taken a break after school, are heading back into further and higher education via a roundabout route of working and ‘gapping’. According to the latest data from the British university admissions service, UCAS, 105,000 students aged 19, and 44,400 aged 20, entered higher education last year – figures that show a steady annual increase in this age group over the previous three years.\u003c/p\u003e\n\n\u003cp\u003e19-year-old student Christine Samways is a typical example. She left school at 16 with nine good exam passes at grades A to C, but did not want to continue studying at the time. She was also worried that, despite having all the attributes of a good student, she would find the challenges of higher education too great and would be forced to drop out. Instead, she gained a vocational qualification in hairdressing. However, she very quickly began to realise it was not quite what she wanted and that going back into some kind of education could be her next step. Like many 16-year-old school leavers starting work for the first time, it dawned on her that if you don’t have qualifications, or the right qualifications, you have fewer work choices. ‘The things that you want to do just aren’t available to you,’ she says.\u003c/p\u003e\n\n\u003cp\u003eUnsure of what her next step should be, Christine decided to head to Mexico to do voluntary work at a children’s home. She was there for a year under the auspices of the International Cultural Youth Exchange (ICYE) – an organisation which has been running since 1949, when it sent 50 German students to the US as peace ambassadors. She never expected that working in Mexico would give her such a sense of confidence and, perhaps just as importantly, direction. On returning home to the UK, she decided to make a fresh start in education by enrolling on a course in Social Sciences and Humanities to prepare herself for university. Her new sense of confidence helped at her college interview. Previously, a formal interview would have made her very nervous, but she now found it much easier to talk on an informal and formal level to people she didn’t know. ‘I feel more comfortable in these situations,’ she says. ‘Mexico was the first time I’d been out of my comfort zone. Now I think I can cope with things better.’\u003c/p\u003e\n\n\u003cp\u003eChristine is now working towards a degree in International Development at Bath University, a choice of subject informed by her experience of working with Mexican children. And, as well as finding some direction in her career, she now speaks good Spanish – a skill she says she intends to keep up, perhaps by working abroad. She knows that the Mexican children’s home benefited from her time there, just as she did. As well as being ‘an extra pair of hands’, she helped to streamline the children’s timetable so they spent more structured time on homework. The children began to do better in school, she says. ‘You only move up a year if you pass a year – I got four children that at the beginning of the year were told they were going to stay down, but they moved up. It’s a good feeling.’\u003c/p\u003e\n\n\u003cp\u003eICYE also brings students to Europe from the countries that European students traditionally visit. Agnes Eldad, from Kampala, Uganda, has just graduated with a degree in Social Work. She came to the UK in January this year, getting a voluntary work placement relieving full-time carers of elderly people in Bexleyheath, Kent. With her social work background, she wanted to understand how elderly people were treated in Britain and to see for herself how their relationships with their children, grandchildren and in-laws worked.\u003c/p\u003e\n\n\u003cp\u003eAgnes found the experience extremely beneficial, but says that the ICYE only really works if participants have a focus for what they want to do, see and study. Ironically, for her, this could be the only chance to work with elderly people before she goes back home in January. In Uganda, old people live with, and are supported by, their families, so she won’t have an opportunity to work with them. Instead, she now wants to set up her own vocational training programme for young girls in northern Uganda. Agnes says her time in the UK has helped her to set her goals for the future.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"14:T2285,"])</script><script>self.__next_f.push([1,"\n  \u003cdiv class=\"q-head\"\u003eQuestions 1–13\u003c/div\u003e\n\n  \u003cdiv class=\"q-sub\"\u003eQuestions 1–5\u003c/div\u003e\n  \u003cdiv class=\"q-instr\"\u003e\u003cp\u003eDo the following statements agree with the information given in Reading Passage 1?\u003c/p\u003e\u003cp\u003eIn boxes 1–5 on your answer sheet, write\u003c/p\u003e\u003c/div\u003e\n  \u003cdiv class=\"tfkey\"\u003e\n    \u003cp\u003e\u003cb\u003eTRUE\u003c/b\u003e  if the statement agrees with the information\u003c/p\u003e\n    \u003cp\u003e\u003cb\u003eFALSE\u003c/b\u003e  if the statement contradicts the information\u003c/p\u003e\n    \u003cp\u003e\u003cb\u003eNOT GIVEN\u003c/b\u003e  if there is no information on this\u003c/p\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"q-item q-card ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e1\u003c/strong\u003e\u003cspan class=\"q-num\"\u003e1\u003c/span\u003e\u003cdiv class=\"q-body\"\u003e\u003cp\u003eThe majority of young people who go travelling during their gap year must work in order to finance their trip.\u003c/p\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_1\" value=\"TRUE\" id=\"practice_single_reading_10_1_TRUE\" autocomplete=\"off\" aria-label=\"Question 1: TRUE\"\u003e\u003cspan\u003eTRUE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_1\" value=\"FALSE\" id=\"practice_single_reading_10_1_FALSE\" autocomplete=\"off\" aria-label=\"Question 1: FALSE\"\u003e\u003cspan\u003eFALSE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_1\" value=\"NOT GIVEN\" id=\"practice_single_reading_10_1_NOT GIVEN\" autocomplete=\"off\" aria-label=\"Question 1: NOT GIVEN\"\u003e\u003cspan\u003eNOT GIVEN\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\"q-item q-card ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e2\u003c/strong\u003e\u003cspan class=\"q-num\"\u003e2\u003c/span\u003e\u003cdiv class=\"q-body\"\u003e\u003cp\u003eTaking a gap year can give young people time to consider whether or not they want to continue with their studies.\u003c/p\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_2\" value=\"TRUE\" id=\"practice_single_reading_10_2_TRUE\" autocomplete=\"off\" aria-label=\"Question 2: TRUE\"\u003e\u003cspan\u003eTRUE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_2\" value=\"FALSE\" id=\"practice_single_reading_10_2_FALSE\" autocomplete=\"off\" aria-label=\"Question 2: FALSE\"\u003e\u003cspan\u003eFALSE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_2\" value=\"NOT GIVEN\" id=\"practice_single_reading_10_2_NOT GIVEN\" autocomplete=\"off\" aria-label=\"Question 2: NOT GIVEN\"\u003e\u003cspan\u003eNOT GIVEN\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\"q-item q-card ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e3\u003c/strong\u003e\u003cspan class=\"q-num\"\u003e3\u003c/span\u003e\u003cdiv class=\"q-body\"\u003e\u003cp\u003eThe number of university students has increased in the last few years.\u003c/p\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_3\" value=\"TRUE\" id=\"practice_single_reading_10_3_TRUE\" autocomplete=\"off\" aria-label=\"Question 3: TRUE\"\u003e\u003cspan\u003eTRUE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_3\" value=\"FALSE\" id=\"practice_single_reading_10_3_FALSE\" autocomplete=\"off\" aria-label=\"Question 3: FALSE\"\u003e\u003cspan\u003eFALSE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_3\" value=\"NOT GIVEN\" id=\"practice_single_reading_10_3_NOT GIVEN\" autocomplete=\"off\" aria-label=\"Question 3: NOT GIVEN\"\u003e\u003cspan\u003eNOT GIVEN\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\"q-item q-card ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e4\u003c/strong\u003e\u003cspan class=\"q-num\"\u003e4\u003c/span\u003e\u003cdiv class=\"q-body\"\u003e\u003cp\u003eChristine Samways lacks the right qualities to be a good student.\u003c/p\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_4\" value=\"TRUE\" id=\"practice_single_reading_10_4_TRUE\" autocomplete=\"off\" aria-label=\"Question 4: TRUE\"\u003e\u003cspan\u003eTRUE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_4\" value=\"FALSE\" id=\"practice_single_reading_10_4_FALSE\" autocomplete=\"off\" aria-label=\"Question 4: FALSE\"\u003e\u003cspan\u003eFALSE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_4\" value=\"NOT GIVEN\" id=\"practice_single_reading_10_4_NOT GIVEN\" autocomplete=\"off\" aria-label=\"Question 4: NOT GIVEN\"\u003e\u003cspan\u003eNOT GIVEN\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\"q-item q-card ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e5\u003c/strong\u003e\u003cspan class=\"q-num\"\u003e5\u003c/span\u003e\u003cdiv class=\"q-body\"\u003e\u003cp\u003eChristine Samways believes that if you lack educational qualifications, your career options are reduced.\u003c/p\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_5\" value=\"TRUE\" id=\"practice_single_reading_10_5_TRUE\" autocomplete=\"off\" aria-label=\"Question 5: TRUE\"\u003e\u003cspan\u003eTRUE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_5\" value=\"FALSE\" id=\"practice_single_reading_10_5_FALSE\" autocomplete=\"off\" aria-label=\"Question 5: FALSE\"\u003e\u003cspan\u003eFALSE\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"opt\"\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_single_reading_10_5\" value=\"NOT GIVEN\" id=\"practice_single_reading_10_5_NOT GIVEN\" autocomplete=\"off\" aria-label=\"Question 5: NOT GIVEN\"\u003e\u003cspan\u003eNOT GIVEN\u003c/span\u003e\u003c/label\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"q-sub\"\u003eQuestions 6–10\u003c/div\u003e\n  \u003cdiv class=\"q-instr\"\u003e\u003cp\u003eComplete the notes below.\u003c/p\u003e\u003cp\u003eChoose \u003cb\u003eNO MORE THAN TWO WORDS\u003c/b\u003e from the passage for each answer.\u003c/p\u003e\u003c/div\u003e\n  \u003cdiv class=\"notes\"\u003e\n    \u003cdiv class=\"n-title\"\u003eChristin я, «несмотря на то, что у нее есть все качества хорошей ученицы». Значит, у нее есть нужные качества.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"2712a59be947fde1527c7f84a1340367bd093b2ae1244edda636e598da87e3ca\"}}},\"5\":{\"part\":1,\"en\":\"TRUE — Paragraph 3: “it dawned on her that if you don’t have qualifications, or the right qualifications, you have fewer work choices.”\",\"uz\":\"TRUE — 3-paragraf: u malaka yoki to‘g‘ri malaka bo‘lmasa, ish tanlash imkoniyati kamayishini tushunib yetgan.\",\"quotes\":[\"you have fewer work choices\"],\"ru\":\"TRUE — Параграф 3: «Ей пришло в голову, что если у вас нет квалификации или нужной квалификации, у вас меньше вариантов работы».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"864f9f837c2ba9b141df225bb082719eb06a19114c132bf5a49abd7312820f2b\"}}},\"6\":{\"part\":1,\"en\":\"voluntary work — Paragraph 4: “Christine decided to head to Mexico to do voluntary work at a children’s home. She was there for a year.”\",\"uz\":\"voluntary work — 4-paragraf: Christine Meksikaga bolalar uyida ko‘ngilli ishlash (voluntary work) uchun borgan va u yerda bir yil turgan.\",\"quotes\":[\"decided to head to Mexico to do voluntary work\"],\"ru\":\"волонтерская работа — Параграф 4: «Кристина решила поехать в Мексику, чтобы заняться волонтерской работой в детском доме. Она пробыла там год».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"8df9efe623388fcf1a5531b0cc7aac8f4a1fb99bf64543a53ae45020955815a5\"}}},\"7\":{\"part\":1,\"en\":\"confidence — Paragraph 4: “She never expected that working in Mexico would give her such a sense of confidence.”\",\"uz\":\"confidence — 4-paragraf: Meksikadagi ish unga shunchalik ishonch (confidence) tuyg‘usini berishini u kutmagan edi.\",\"quotes\":[\"would give her such a sense of confidence\"],\"ru\":\"уверенность — Параграф 4: «Она никогда не ожидала, что работа в Мексике даст ей такое чувство уверенности».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"e1eb7ef4edbd0625ece33dc84b77fe4bdfca2bbc8030533da94e0a8fdd5580f3\"}}},\"8\":{\"part\":1,\"en\":\"education — Paragraph 4: “she decided to make a fresh start in education by enrolling on a course in Social Sciences and Humanities.”\",\"uz\":\"education — 4-paragraf: Buyuk Britaniyaga qaytgach, u ta’limni (education) yangidan boshlashga qaror qilib, kursga yozilgan.\",\"quotes\":[\"she decided to make a fresh start in education\"],\"ru\":\"образование — Параграф 4: «она решила начать образование заново, записавшись на курс социальных и гуманитарных наук».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"5e2a6930240a83dcaefdab8110758769db2d369be14fdb8775bc9a80b082efb3\"}}},\"9\":{\"part\":1,\"en\":\"international development — Paragraph 5: “Christine is now working towards a degree in International Development at Bath University.”\",\"uz\":\"international development — 5-paragraf: Christine hozir Bath universitetida “International Development” yo‘nalishida o‘qimoqda.\",\"quotes\":[\"working towards a degree in International Development at Bath University\"],\"ru\":\"международное развитие — Параграф 5: «Кристин сейчас работает над получением степени по международному развитию в Университете Бата».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"84291466031fc65bf6ad7892c177bdc1c7b349a10fc976008e6855f66033c4c1\"}}},\"10\":{\"part\":1,\"en\":\"working abroad — Paragraph 5: “she now speaks good Spanish – a skill she says she intends to keep up, perhaps by working abroad.”\",\"uz\":\"working abroad — 5-paragraf: u yaxshi ispancha gapiradi va bu ko‘nikmani, ehtimol, chet elda ishlash (working abroad) orqali saqlab qolmoqchi.\",\"quotes\":[\"she intends to keep up, perhaps by working abroad\"],\"ru\":\"работа за границей — Параграф 5: «Теперь она хорошо говорит по-испански — этот навык, по ее словам, она намерена поддерживать, возможно, работая за границей».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"086c9f9ce5ff996e5f00f2ed88727bea7e03f708f8e95bdda23aa992aa34ea67\"}}},\"11\":{\"part\":1,\"en\":\"a focus — Paragraph 7: “the ICYE only really works if participants have a focus for what they want to do, see and study.”\",\"uz\":\"a focus — 7-paragraf: ICYE faqat ishtirokchilarda nima qilish, ko‘rish va o‘rganishni istashiga aniq maqsad (a focus) bo‘lgandagina samarali bo‘ladi.\",\"quotes\":[\"participants have a focus for what they want to do, see and study\"],\"ru\":\"Фокус — Параграф 7: «ICYE действительно работает только в том случае, если участники фокусируются на том, что они хотят делать, видеть и изучать».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"60a96c60f9ca60287c439482919febb8a1e520d163888d8135a014bc65bf073c\"}}},\"12\":{\"part\":1,\"en\":\"young girls — Paragraph 7: “she now wants to set up her own vocational training programme for young girls in northern Uganda.”\",\"uz\":\"young girls — 7-paragraf: u shimoliy Ugandadagi yosh qizlar (young girls) uchun kasb-hunar o‘quv dasturini tashkil qilmoqchi.\",\"quotes\":[\"vocational training programme for young girls in northern Uganda\"],\"ru\":\"молодые девушки — Параграф 7: «Теперь она хочет создать собственную программу профессиональной подготовки для молодых девушек на севере Уганды».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"de8e4707da9768e32677edfd954c68d20fa71be7907bac6eab4e0ffa63cf866e\"}}},\"13\":{\"part\":1,\"en\":\"goals — Paragraph 7 ends: “Agnes says her time in the UK has helped her to set her goals for the future.”\",\"uz\":\"goals — 7-paragraf oxiri: Agnesning aytishicha, Britaniyada o‘tkazgan vaqti unga kelajak uchun maqsadlarini (goals) belgilashga yordam bergan.\",\"quotes\":[\"has helped her to set her goals for the future\"],\"ru\":\"цели — Параграф 7 заканчивается словами: «Агнес говорит, что время, проведенное в Великобритании, помогло ей поставить цели на будущее».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"e16030109a110f72f774c1cd40fff8780816693990cc94296b4e94b5d61e02b1\"}}}}}]]\n"])</script></body></html>
