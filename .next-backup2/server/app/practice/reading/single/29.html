,\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:null\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"LinguAI Bridge\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Computer-delivered IELTS listening practice\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"10:\"$b:metadata\"\n"])</script><script>self.__next_f.push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"779\",\"static/chunks/app/practice/reading/single/%5Btest%5D/page-c8475733dad30162.js\"],\"default\"]\n13:T1c79,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eMind Music\u003c/h2\u003e\n      \u003cdiv class=\"watermark\"\u003e@reading_cdi\u003c/div\u003e\n      \u003cdiv class=\"passage-label\"\u003eREADING PASSAGE 2\u003c/div\u003e\n      \u003cdiv class=\"passage-title\"\u003eMind Music\u003c/div\u003e\n      \u003cdiv class=\"passage-subtitle\"\u003eScientists investigate \"earworms\": the music we can't get out of our head.\u003c/div\u003e\n\n      \u003cp class=\"passage-text\" id=\"para-A\"\u003e\u003cspan class=\"para-label\"\u003eA\u003c/span\u003eEver had a song stuck in your head, playing on an endless loop? Scientists call them \"\u003cspan class=\"vocab-word\"\u003einvoluntary\u003c/span\u003e musical images\", or \u003cstrong\u003eearworms\u003c/strong\u003e, and a wave of new research is shining light on why they occur and what can be learned from them. Some neuroscientists and cognitive psychologists are studying earworms to explore the mysteries of memory and the part of the brain that is beyond our conscious control. \u003cspan id=\"loc15\"\u003e\"The idea that we have full control over our thought processes is an \u003cspan class=\"vocab-word\"\u003eillusion\u003c/span\u003e,\" says psychologist Lauren Stewart\u003c/span\u003e, who founded the master's program in music, mind and brain at Goldsmiths, University of London, where recent research has taken place. Researchers haven't been able to watch what happens in the brain when earworms occur, because they happen \u003cspan class=\"vocab-word\"\u003eunpredictably\u003c/span\u003e. Much of what is known about them comes from surveys, questionnaires, diaries and lab experiments.\u003c/p\u003e\n\n      \u003cp class=\"passage-text\" id=\"para-B\"\u003e\u003cspan class=\"para-label\"\u003eB\u003c/span\u003eA Goldsmiths study published in the journal \u003cem\u003eMemory \u0026amp; Cognition\u003c/em\u003e showed that the singing we hear in our heads tends to be true to actual recordings. Researchers had 17 volunteers tap to the beat of any earworm they heard during a four-day period while a device attached to their \u003cspan id=\"loc18\"\u003e\u003cspan class=\"vocab-word\"\u003ewrist\u003c/span\u003e\u003c/span\u003e recorded their movements. The tapping tempos were within 10% of the tempos of the original recordings. Another Goldsmiths study, published in \u003cem\u003eConsciousness and Cognition\u003c/em\u003e, found that people who report hearing earworms often, and find them most \u003cspan class=\"vocab-word\"\u003eintrusive\u003c/span\u003e, have slightly different brain structures, with more gray matter in areas associated with processing \u003cspan id=\"loc19\"\u003eemotions\u003c/span\u003e.\u003c/p\u003e\n\n      \u003cp class=\"passage-text\" id=\"para-C\"\u003e\u003cspan class=\"para-label\"\u003eC\u003c/span\u003eStudies also show that the music in our heads often starts playing during times of \"low \u003cspan class=\"vocab-word\"\u003ecognitive\u003c/span\u003e load\", such as while showering, getting dressed, walking, or doing chores. Dr Stewart \u003cspan class=\"vocab-word\"\u003elikens\u003c/span\u003e earworms to \"sonic screen savers\" that keep the mind \u003cspan id=\"loc20\"\u003eentertained\u003c/span\u003e while it is otherwise \u003cspan class=\"vocab-word\"\u003eunoccupied\u003c/span\u003e. She and her colleagues tested that theory by having volunteers listen to songs and giving them various tasks afterwards. The volunteers who sat idly for the next five minutes were the most likely to report hearing the music in their heads. Dr Stewart observed that the more \u003cspan id=\"loc21\"\u003e\u003cspan class=\"vocab-word\"\u003echallenging\u003c/span\u003e\u003c/span\u003e the activity, the less likely the volunteers were to hear the music. Diary studies also show songs tend to match people's moods and therefore they are not random. If you are energized and upbeat, an earworm that occurs is likely to be uptempo too.\u003c/p\u003e\n\n      \u003cp class=\"passage-text\" id=\"para-D\"\u003e\u003cspan class=\"para-label\"\u003eD\u003c/span\u003eSongs the brain \u003cspan class=\"vocab-word\"\u003efixates\u003c/span\u003e on are usually those it has been exposed to recently, surveys show, which is why tunes getting heavy radio play frequently top the earworm charts. Even tunes you may have heard but didn't pay attention to can worm their way into your \u003cspan class=\"vocab-word\"\u003esubconscious\u003c/span\u003e, says \u003cspan id=\"loc24\"\u003eIra Hyman\u003c/span\u003e, a psychologist at Western Washington University in Bellingham, USA. In an unpublished study there, participants who listened to music while doing other tasks were more likely to report that the songs returned as earworms later on, compared with participants who simply listened.\u003c/p\u003e\n\n      \u003cp class=\"passage-text\" id=\"para-E\"\u003e\u003cspan class=\"para-label\"\u003eE\u003c/span\u003eSome earworms are just \u003cspan class=\"vocab-word\"\u003efragments\u003c/span\u003e of a song that repeat like a broken record. So, when the mind hits a part of a song it can't remember, it loops back rather than moving on. That could make an earworm even more \u003cspan class=\"vocab-word\"\u003eentrenched\u003c/span\u003e, Dr Hyman says. According to a theory known as the \u003cspan id=\"loc26\"\u003e\u003cspan class=\"vocab-word\"\u003eZeigarnik\u003c/span\u003e effect\u003c/span\u003e, named for the Soviet psychologist Bluma Zeigarnik, unfinished thoughts and activities weigh on the mind more heavily than those that are completed, although experiments exposing students to interrupted songs have yielded mixed results.\u003c/p\u003e\n\n      \u003cp class=\"passage-text\" id=\"para-F\"\u003e\u003cspan class=\"para-label\"\u003eF\u003c/span\u003eResearchers say they can't \u003cspan class=\"vocab-word\"\u003epinpoint\u003c/span\u003e a spot in the brain where earworms live. Imaging studies by \u003cspan id=\"loc25\"\u003eAndrea Halpern\u003c/span\u003e at Bucknell University (USA) have shown that deliberately imagining music and actually listening to music activate many of the same \u003cspan class=\"vocab-word\"\u003eneurological\u003c/span\u003e networks. Dr Halpern's earlier studies showed that when subjects listened to the first few notes of familiar music, areas in the right frontal and superior temporal portions of the brain became activated, along with the supplementary motor area at the top, which is typically involved in remembering sequences. When the same subjects listened to unfamiliar music and were asked to recall it, there was activity in the left frontal portions of the brain instead.\u003c/p\u003e\n\n      \u003cp class=\"passage-text\" id=\"para-G\"\u003e\u003cspan class=\"para-label\"\u003eG\u003c/span\u003eOne factor that makes some songs stick might be \u003cspan class=\"vocab-word\"\u003erepetition\u003c/span\u003e. \"Repetition leads to familiarity which leads to \u003cspan class=\"vocab-word\"\u003eanticipation\u003c/span\u003e, which is satisfied by hearing the song,\" says \u003cspan id=\"loc22\"\u003eJohn Seabrook\u003c/span\u003e, author of \u003cem\u003eThe Song Machine: Inside the Hit Factory\u003c/em\u003e, about how producers pump pop songs full of aural \"hooks\", the punchy melodic phrases designed to target the brain and leave it wanting more. Researchers are comparing the melodic structure of 100 often-mentioned songs with 100 similarly popular songs that weren't cited as earworms, to assess the difference. Songs with earworm potential appear to share certain features: \u003cspan id=\"loc14\"\u003ea repeating pattern of ups and downs in pitch, and an \u003cspan class=\"vocab-word\"\u003eirregular\u003c/span\u003e musical interval\u003c/span\u003e.\u003c/p\u003e\n\n      \u003cp class=\"passage-text\" id=\"para-H\"\u003e\u003cspan class=\"para-label\"\u003eH\u003c/span\u003eThe researchers plan next to test their results in reverse, and play ringtones from songs of both the earworm and non-earworm variety for volunteers several times a day to see which ones get stuck. Drs Stewart and Halpern are now working together to \u003cspan class=\"vocab-word\"\u003erecruit\u003c/span\u003e survey participants for a study looking at whether people at different stages of life experience earworms differently. \u003cspan id=\"loc17\"\u003e\"You can argue that older people might get them more often because they know more songs,\" Dr Halpern says. \"But the few responses we have so far indicate that they have earworms less often.\"\u003c/span\u003e\u003c/p\u003e\n    "])</script><script>self.__next_f.push([1,"14:T2768,"])</script><script>self.__next_f.push([1,"\n\n      \n      \u003cdiv class=\"q-section-hdr\"\u003e\n        \u003ch3\u003eQuestions 14–17\u003c/h3\u003e\n        \u003cp\u003eThe reading passage has eight paragraphs, \u003cb\u003eA–H\u003c/b\u003e.\u003cbr\u003e\n        Which paragraph contains the following information?\u003cbr\u003e\n        Write the correct letter, \u003cb\u003eA–H\u003c/b\u003e, in the boxes below.\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv id=\"para-blocks\"\u003e\u003cdiv class=\"para-block\" id=\"parablock-14\"\u003e\n      \u003cdiv class=\"para-row\"\u003e\u003cspan class=\"para-num\"\u003e14\u003c/span\u003e\u003cspan class=\"para-stmt\"\u003ea description of the characteristics common to songs that become earworms\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"para-select-wrap\"\u003e\n        \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e14\u003c/strong\u003e\u003cselect class=\"para-select\" id=\"practice_single_reading_29_14_\" name=\"practice_single_reading_29_14\" autocomplete=\"off\" aria-label=\"Question 14\"\u003e\n          \u003coption value=\"\"\u003eChoose A–H\u003c/option\u003e\n          \u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003coption value=\"G\"\u003eG\u003c/option\u003e\u003coption value=\"H\"\u003eH\u003c/option\u003e\n        \u003c/select\u003e\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\u003cdiv class=\"para-block\" id=\"parablock-15\"\u003e\n      \u003cdiv class=\"para-row\"\u003e\u003cspan class=\"para-num\"\u003e15\u003c/span\u003e\u003cspan class=\"para-stmt\"\u003ea justification for research into earworms\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"para-select-wrap\"\u003e\n        \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e15\u003c/strong\u003e\u003cselect class=\"para-select\" id=\"practice_single_reading_29_15_\" name=\"practice_single_reading_29_15\" autocomplete=\"off\" aria-label=\"Question 15\"\u003e\n          \u003coption value=\"\"\u003eChoose A–H\u003c/option\u003e\n          \u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003coption value=\"G\"\u003eG\u003c/option\u003e\u003coption value=\"H\"\u003eH\u003c/option\u003e\n        \u003c/select\u003e\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\u003cdiv class=\"para-block\" id=\"parablock-16\"\u003e\n      \u003cdiv class=\"para-row\"\u003e\u003cspan class=\"para-num\"\u003e16\u003c/span\u003e\u003cspan class=\"para-stmt\"\u003ea description of the brain's reaction to known and unknown songs\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"para-select-wrap\"\u003e\n        \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e16\u003c/strong\u003e\u003cselect class=\"para-select\" id=\"practice_single_reading_29_16_\" name=\"practice_single_reading_29_16\" autocomplete=\"off\" aria-label=\"Question 16\"\u003e\n          \u003coption value=\"\"\u003eChoose A–H\u003c/option\u003e\n          \u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003coption value=\"G\"\u003eG\u003c/option\u003e\u003coption value=\"H\"\u003eH\u003c/option\u003e\n        \u003c/select\u003e\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\u003cdiv class=\"para-block\" id=\"parablock-17\"\u003e\n      \u003cdiv class=\"para-row\"\u003e\u003cspan class=\"para-num\"\u003e17\u003c/span\u003e\u003cspan class=\"para-stmt\"\u003edetails of proposed research into the frequency of earworms in different age groups\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"para-select-wrap\"\u003e\n        \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e17\u003c/strong\u003e\u003cselect class=\"para-select\" id=\"practice_single_reading_29_17_\" name=\"practice_single_reading_29_17\" autocomplete=\"off\" aria-label=\"Question 17\"\u003e\n          \u003coption value=\"\"\u003eChoose A–H\u003c/option\u003e\n          \u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003coption value=\"G\"\u003eG\u003c/option\u003e\u003coption value=\"H\"\u003eH\u003c/option\u003e\n        \u003c/select\u003e\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\u003c/div\u003e\n\n      \n      \u003cdiv class=\"q-section-hdr\"\u003e\n        \u003ch3\u003eQuestions 18–21\u003c/h3\u003e\n        \u003cp\u003eComplete the summary below. Write \u003cb\u003eONE WORD ONLY\u003c/b\u003e from the passage for each answer.\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"note-box\"\u003e\n        \u003cdiv class=\"note-title\"\u003eGoldsmiths Study on Earworms\u003c/div\u003e\n\n        \u003cdiv class=\"note-row\"\u003eResearchers from Goldsmiths concluded that the music we imagine in our minds is quite similar to recordings. They proved this by asking volunteers to record the rhythm of music using a monitor on their \u003cspan class=\"note-badge\"\u003e18\u003c/span\u003e \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e18\u003c/strong\u003e\u003cinput class=\"fill-input\" id=\"practice_single_reading_29_18_\" placeholder=\"Answer\" type=\"text\" name=\"practice_single_reading_29_18\" autocomplete=\"off\" aria-label=\"Question 18\"\u003e\u003c/span\u003e.\u003c/div\u003e\n\n        \u003cdiv class=\"note-row\"\u003eFurther research has demonstrated that those who hear earworms more frequently have brains that may deal with \u003cspan class=\"note-badge\"\u003e19\u003c/span\u003e \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e19\u003c/strong\u003e\u003cinput class=\"fill-input\" id=\"practice_single_reading_29_19_\" placeholder=\"Answer\" type=\"text\" name=\"practice_single_reading_29_19\" autocomplete=\"off\" aria-label=\"Question 19\"\u003e\u003c/span\u003e differently from other people.\u003c/div\u003e\n\n        \u003cdiv class=\"note-row\"\u003eDr Stewart also believes that the brain is \u003cspan class=\"note-badge\"\u003e20\u003c/span\u003e \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e20\u003c/strong\u003e\u003cinput class=\"fill-input\" id=\"practice_single_reading_29_20_\" placeholder=\"Answer\" type=\"text\" name=\"practice_single_reading_29_20\" autocomplete=\"off\" aria-label=\"Question 20\"\u003e\u003c/span\u003e by earworms when it is not focused on a task.\u003c/div\u003e\n\n        \u003cdiv class=\"note-row\"\u003eIn fact, a reduction in the occurrence of earworms was found to be directly related to how \u003cspan class=\"note-badge\"\u003e21\u003c/span\u003e \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e21\u003c/strong\u003e\u003cinput class=\"fill-input\" id=\"practice_single_reading_29_21_\" placeholder=\"Answer\" type=\"text\" name=\"practice_single_reading_29_21\" autocomplete=\"off\" aria-label=\"Question 21\"\u003e\u003c/span\u003e the task was.\u003c/div\u003e\n      \u003c/div\u003e\n\n      \n      \u003cdiv class=\"q-section-hdr\"\u003e\n        \u003ch3\u003eQuestions 22–26\u003c/h3\u003e\n        \u003cp\u003eLook at the following statements and the list of researchers below.\u003cbr\u003e\n        Match each statement with the correct researcher, \u003cb\u003eA–D\u003c/b\u003e.\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"match-key-box\"\u003e\n        \u003cb\u003eList of Researchers\u003c/b\u003e\u003cbr\u003e\n        A   Lauren Stewart\u003cbr\u003e\n        B   Ira Hyman\u003cbr\u003e\n        C   Andrea Halpern\u003cbr\u003e\n        D   John Seabrook\n      \u003c/div\u003e\n\n      \u003cdiv id=\"match-blocks\"\u003e\u003cdiv class=\"match-block\" id=\"matchblock-22\"\u003e\n      \u003cdiv class=\"match-row\"\u003e\u003cspan class=\"match-num\"\u003e22\u003c/span\u003e\u003cspan class=\"match-stmt\"\u003eSome musicians create music that is intentionally memorable.\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"match-select-wrap\"\u003e\n        \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e22\u003c/strong\u003e\u003cselect class=\"match-select\" id=\"practice_single_reading_29_22_\" name=\"practice_single_reading_29_22\" autocomplete=\"off\" aria-label=\"Question 22\"\u003e\n          \u003coption value=\"\"\u003eChoose A–D\u003c/option\u003e\n          \u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\n        \u003c/select\u003e\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\u003cdiv class=\"match-block\" id=\"matchblock-23\"\u003e\n      \u003cdiv class=\"match-row\"\u003e\u003cspan class=\"match-num\"\u003e23\u003c/span\u003e\u003cspan class=\"match-stmt\"\u003ePeople are unable to completely regulate how they think.\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"match-select-wrap\"\u003e\n        \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e23\u003c/strong\u003e\u003cselect class=\"match-select\" id=\"practice_single_reading_29_23_\" name=\"practice_single_reading_29_23\" autocomplete=\"off\" aria-label=\"Question 23\"\u003e\n          \u003coption value=\"\"\u003eChoose A–D\u003c/option\u003e\n          \u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\n        \u003c/select\u003e\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\u003cdiv class=\"match-block\" id=\"matchblock-24\"\u003e\n      \u003cdiv class=\"match-row\"\u003e\u003cspan class=\"match-num\"\u003e24\u003c/span\u003e\u003cspan class=\"match-stmt\"\u003eWe can remember songs without knowing that we have heard them.\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"match-select-wrap\"\u003e\n        \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e24\u003c/strong\u003e\u003cselect class=\"match-select\" id=\"practice_single_reading_29_24_\" name=\"practice_single_reading_29_24\" autocomplete=\"off\" aria-label=\"Question 24\"\u003e\n          \u003coption value=\"\"\u003eChoose A–D\u003c/option\u003e\n          \u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\n        \u003c/select\u003e\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\u003cdiv class=\"match-block\" id=\"matchblock-25\"\u003e\n      \u003cdiv class=\"match-row\"\u003e\u003cspan class=\"match-num\"\u003e25\u003c/span\u003e\u003cspan class=\"match-stmt\"\u003eThinking about music has a similar effect on the brain to hearing music.\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"match-select-wrap\"\u003e\n        \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e25\u003c/strong\ nown and unknown songs.\",\"uz\":\"TO'G'RI: F. F xatboshi Halpern doktoraning tanish va notanish musiqa uchun turli miya hududlari faollashishini ko'rsatgan tadqiqotlarini tavsiflaydi.\",\"quotes\":[],\"ru\":\"ПРАВИЛЬНО: F. В параграфе F описаны исследования доктора Халперна, показавшие, что разные области мозга активируются под знакомую и незнакомую музыку, что напрямую описывает реакцию мозга на известные и неизвестные песни.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"7b8ebe1465a7b6870aa0d6aa8797e3f851d465d5c729c503b4a2f14e57fc2a09\"}}},\"17\":{\"part\":1,\"en\":\"CORRECT: H. Paragraph H mentions the planned study by Drs Stewart and Halpern 'looking at whether people at different stages of life experience earworms differently' — this is about age groups.\",\"uz\":\"TO'G'RI: H. H xatboshida Stewart va Halpern doktoralarning 'turli hayot bosqichlaridagi odamlar earwormlarni boshqacha boshdan kechiradimi' degan tadqiqoti tilga olinadi.\",\"quotes\":[],\"ru\":\"ПРАВИЛЬНО: H. В пункте H упоминается запланированное исследование докторов Стюарта и Халперна, «смотрящее на то, по-разному ли люди на разных этапах жизни испытывают ушные черви» — речь идет о возрастных группах.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"75afd5a47e5f9d5af83158bd29ea4affdcd625c70980af51568138aaff17dc47\"}}},\"18\":{\"part\":1,\"en\":\"CORRECT: wrist. The passage states volunteers used 'a device attached to their wrist' to record tapping tempos during earworm episodes.\",\"uz\":\"TO'G'RI: wrist (bilak). Matnda ishtirokachilar earworm paytida urish tempini yozib olish uchun 'bilaklariga biriktirilgan qurilma' ishlatgani aytiladi.\",\"quotes\":[],\"ru\":\"ПРАВИЛЬНО: запястье. В отрывке говорится, что добровольцы использовали «устройство, прикрепленное к их запястью», чтобы записывать темп
