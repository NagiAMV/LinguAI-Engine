,\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:null\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"LinguAI Bridge\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Computer-delivered IELTS listening practice\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"10:\"$b:metadata\"\n"])</script><script>self.__next_f.push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"779\",\"static/chunks/app/practice/reading/single/%5Btest%5D/page-c8475733dad30162.js\"],\"default\"]\n13:T19d7,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eThe Placebo Effect — The Power of Nothing\u003c/h2\u003e\n\u003cp class=\"p-sub-inline\"\u003eWhy belief in a treatment can heal – and what that means for alternative medicine\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e1\u003c/span\u003eWant to devise a new form of alternative medicine? No problem. Here is the recipe. Be warm, sympathetic, reassuring and enthusiastic. Your treatment should involve physical contact, and each session with your patients should last at least half an hour. Encourage your patients to take an active part in their treatment and understand how their disorders relate to the rest of their lives. Tell them that their own bodies possess the true power to heal. Make them pay you out of their own pockets. Describe your treatment in familiar words, but embroidered with a hint of mysticism: energy fields, energy flows, energy blocks, meridians, forces, auras, rhythms and the like. Refer to the knowledge of an earlier age: wisdom carelessly swept aside by the rise and rise of blind, mechanistic science. Oh, come off it, you are saying. Something invented off the top of your head could not possibly work, could it?\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e2\u003c/span\u003eWell yes, it could – and often well enough to earn you a living. A good living if you are sufficiently convincing, or better still, really believe in your therapy. Many illnesses get better on their own, so if you are lucky and administer your treatment at just the right time you will get the credit. But that’s only part of it. Some of the improvement really would be down to you. Your healing power would be the outcome of a paradoxical force that conventional medicine recognizes but remains oddly ambivalent about: the placebo effect.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e3\u003c/span\u003ePlacebos are treatments that have no direct effect on the body, yet still work because the patient has faith in their power to heal. Most often the term refers to a dummy pill, but it applies just as much to any device or procedure, from a sticking plaster to a crystal to an operation. The existence of the placebo effect implies that even quackery may confer real benefits, which is why any mention of placebo is a touchy subject for many practitioners of complementary and alternative medicine, who are likely to regard it as tantamount to a charge of charlatanism. In fact, the placebo effect is a powerful part of all medical care, orthodox or otherwise, though its role is often neglected or misunderstood.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e4\u003c/span\u003eOne of the great strengths of CAM may be its practitioners’ skill in deploying the placebo effect to accomplish real healing. “Complementary practitioners are miles better at producing non-specific effects and good therapeutic relationships,” says Edzard Ernst, professor of CAM at Exeter University. The question is whether CAM could be integrated into conventional medicine, as some would like, without losing much of this power.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e5\u003c/span\u003eAt one level, it should come as no surprise that our state of mind can influence our physiology: anger opens the superficial blood vessels of the face; sadness pumps the tear glands.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e6\u003c/span\u003eBut exactly how placebos work their medical magic is still largely unknown. Most of the scant research to date has focused on the control of pain because it’s one of the commonest complaints and lends itself to experimental study. Here, attention has turned to the endorphins, natural counterparts of morphine that are known to help control pain. “Any of the neurochemicals involved in transmitting pain impulses or modulating them might also be involved in generating the placebo response,” says Don Price, an oral surgeon at the University of Florida who studies the placebo effect in dental pain.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e7\u003c/span\u003e“But endorphins are still out in front.” That case has been strengthened by the recent work of Fabrizio Benedetti of the University of Turin, who showed that the placebo effect can be abolished by a drug, naloxone, which blocks the effects of endorphins. Benedetti induced pain in human volunteers by inflating a blood-pressure cuff on the forearm. He did this several times a day for several days, using morphine each time to control the pain. On the final day, without saying anything, he replaced the morphine with a saline solution. This still relieved the subjects’ pain: a placebo effect. But when he added naloxone to the saline the pain relief disappeared. Here was direct proof that placebo analgesia is mediated, at least in part, by these natural opiates.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e8\u003c/span\u003eStill, no one knows how belief triggers endorphin release, or why most people can’t achieve placebo pain relief simply by willing it. Though scientists don’t know exactly how placebos work, they have accumulated a fair bit of knowledge about how to trigger the effect. A London rheumatologist found, for example, that red dummy capsules made more effective painkillers than blue, green or yellow ones. Research on American students revealed that blue pills make better sedatives than pink, a colour more suitable for stimulants. Even branding can make a difference: if Aspro or Tylenol is what you like to take for a headache, their chemically identical generic equivalents may be less effective.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e9\u003c/span\u003eIt matters, too, how the treatment is delivered. Decades ago, when the major tranquilliser chlorpromazine was being introduced, a doctor in Kansas categorised his colleagues according to whether they were keen on it, openly sceptical of its benefits, or took a “let’s try and see” attitude. His conclusion: the more enthusiastic the doctor, the better the drug performed. And this year Ernst surveyed published studies that compared doctors’ bedside manners. The studies turned up one consistent finding: “Physicians who adopt a warm, friendly and reassuring manner,” he reported, “are more effective than those whose consultations are formal and do not offer reassurance.”\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003e10\u003c/span\u003eWarm, friendly and reassuring are precisely CAM’s strong suits, of course. Many of the ingredients of that opening recipe – the physical contact, the generous swathes of time, the strong hints of supernormal healing power – are just the kind of thing likely to impress patients. It’s hardly surprising, then, that complementary practitioners are generally best at mobilising the placebo effect, says Arthur Kleinman, professor of social anthropology at Harvard University.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"14:T3edc,"])</script><script>self.__next_f.push([1,"\n  \u \"A — Paragraph 1: “Describe your treatment in familiar words” — the description should be easy to understand.\",\"uz\":\"A — 1-paragraf: davolashni tanish so'zlar bilan tushuntiring — ya'ni oson tushunarli bo'lishi kerak.\",\"quotes\":[\"Describe your treatment in familiar words\"],\"ru\":\"A — Параграф 1: «Опишите свое лечение знакомыми словами» — описание должно быть простым для понимания.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"1524b193c9ffacddaa3e8ec488c822e87fcdf9ce55755376bee14e14334374cb\"}}},\"3\":{\"part\":1,\"en\":\"G — Paragraph 2: “A good living if you are sufficiently convincing, or better still, really believe in your therapy.”\",\"uz\":\"G — 2-paragraf: agar ishonarli bo'lsangiz yoki o'z usulingizga chin dildan ishonsangiz, yaxshi daromad qilasiz.\",\"quotes\":[\"A good living if you are sufficiently convincing\"],\"ru\":\"G — Параграф 2: «Хорошая жизнь, если вы достаточно убедительны или, что еще лучше, действительно верите в свою терапию».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"a7f3a99f7863d8f2d598183e9eada98bf4b331789e7713516e6d65f2ef60c618\"}}},\"4\":{\"part\":1,\"en\":\"B — Paragraph 2: “Many illnesses get better on their own” — the illness improves by itself, and the practitioner gets the credit.\",\"uz\":\"B — 2-paragraf: ko'p kasalliklar o'z-o'zidan tuzaladi — shifokorga esa shu uchun rahmat aytiladi.\",\"quotes\":[\"Many illnesses get better on their own\"],\"ru\":\"B — Параграф 2: «Многие болезни излечиваются сами по себе» — болезнь проходит сама по себе, и врач получает признание.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"3fb6623e69df593358d863124bed639a118a8e40e44735e80f45180417ab0698\"}}},\"5\":{\"part\":1,\"en\":\"H — Paragraph 3: placebos “have no direct effect on the body”; the benefit does not depend on any specific treatment.\",\"uz\":\"H — 3-paragraf: platsebolar tanaga bevosita ta'sir qilmaydi — foyda muayyan davolashga bog'liq emas.\",\"quotes\":[\"Placebos are treatments that have no direct effect on the body\"],\"ru\":\"H — Параграф 3: плацебо «не оказывает прямого воздействия на организм»; польза не зависит от какого-либо конкретного лечения.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"8b1c2d4fd7208ec0b922a2f1977a74c52e09b1d06ee64b8a55ab5a5ff78fb3d9\"}}},\"6\":{\"part\":1,\"en\":\"F — Paragraph 2/3: conventional medicine “recognizes but remains oddly ambivalent about” the placebo effect and its role “is often neglected” — it deserves more recognition.\",\"uz\":\"F — An'anaviy tibbiyot platsebo ta'sirini tan oladi, lekin unga ikkilanib qaraydi va uning roli e'tibordan chetda qoladi — ko'proq e'tirof kerak.\",\"quotes\":[\"conventional medicine recognizes but remains oddly ambivalent about\"],\"ru\":\"F — Параграф 2/3: традиционная медицина «признает, но остается странно неоднозначной» в отношении эффекта плацебо, а его ролью «часто пренебрегают» — она заслуживает большего признания.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"3df310a116f790cd71fb4aa68cc5f68dabc8eb9c4d0cc47223b07e51d3ad7556\"}}},\"7\":{\"part\":1,\"en\":\"A — Paragraph 5: anger opens the blood vessels of the face and sadness pumps the tear glands — our state of mind influences our physiology.\",\"uz\":\"A — 5-paragraf: g'azab yuz tomirlarini kengaytiradi, qayg'u ko'z yoshi bezlarini ishga soladi — ruhiy holat tanaga ta'sir qiladi.\",\"quotes\":[\"anger opens the superficial blood vessels of the face; sadness pumps the tear glands\"],\"ru\":\"A — Параграф 5: гнев открывает кровеносные сосуды лица, \"But exactly how placebos work their medical magic is still largely unknown\"],\"ru\":\"NO — Параграф 6: «Как именно плацебо проявляют свою медицинскую магию, до сих пор в значительной степени неизвестно».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"2ed44175738fcb4c39804540b11ca2a5a072755a45c97a1cfe8e9868361ae1fc\"}}},\"11\":{\"part\":1,\"en\":\"NO — Paragraph 8: the London rheumatologist found red capsules were more effective painkillers; he never suggested removing them from the market.\",\"uz\":\"NO — 8-paragraf: London shifokori qizil kapsulalar samaraliroq ekanini aniqlagan; ularni bozordan olib tashlash haqida gap yo'q.\",\"quotes\":[\"red dummy capsules made more effective painkillers than blue, green or yellow ones\"],\"ru\":\"NO — Параграф 8: лондонский ревматолог обнаружил, что красные капсулы являются более эффективными обезболивающими; он никогда не предлагал убрать их с рынка.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"db6db5b80f77d54aecc32b086822eb6062cd4c0c5cd1f7f6436cce079514d2ac\"}}},\"12\":{\"part\":1,\"en\":\"YES — Paragraph 8: “Even branding can make a difference… their chemically identical generic equivalents may be less effective.”\",\"uz\":\"YES — 8-paragraf: brend ham ahamiyatli: kimyoviy jihatdan bir xil generiklar kamroq samarali bo'lishi mumkin.\",\"quotes\":[\"Even branding can make a difference\"],\"ru\":\"YES — Параграф 8: «Даже брендинг может иметь значение… их химически идентичные непатентованные эквиваленты могут быть менее эффективными».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"10c1296888e089d9835a52381c911334540e53c3e07eeffbaef6ecf8fd1a185b\"}}},\"13\":{\"part\":1,\"en\":\"YES — Paragraph 9: the Kansas doctor categorised colleagues as keen, openly sceptical, or “let’s try and see” — a range of views.\",\"uz\":\"YES — 9-paragraf: Kanzaslik shifokor hamkasblarini qiziquvchan, shubhali va “ko'ramiz” deydiganlarga ajratgan — turli qarashlar.\",\"quotes\":[\"a doctor in Kansas categorised his colleagues according to whether they were keen on it\"],\"ru\":\"YES — Параграф 9: доктор из Канзаса классифицировал своих коллег как увлеченных, откровенно скептически настроенных или «давайте попробуем и посмотрим» — разные точки зрения.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"eeede245ca95c5fd2a4e8b81a723be7752b3c75d0219bd190b6a0712e5801fd6\"}}},\"14\":{\"part\":1,\"en\":\"NO — Paragraph 10: “complementary practitioners are generally best at mobilising the placebo effect.”\",\"uz\":\"NO — 10-paragraf: muqobil tibbiyot mutaxassislari platsebo ta'siridan foydalanishda eng ustasi hisoblanadi.\",\"quotes\":[\"complementary practitioners are generally best at mobilising the placebo effect\"],\"ru\":\"NO — Параграф 10: «Практики комплементарной медицины, как правило, лучше всего мобилизуют эффект плацебо».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"8d8463c6abb8b3a27ce23f264ddc713b8dac9929c55d03756ae3d6f1c37ab095\"}}}}}]]\n"])</script></body></html>
