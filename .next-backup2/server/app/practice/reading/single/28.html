,\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:null\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"LinguAI Bridge\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Computer-delivered IELTS listening practice\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"10:\"$b:metadata\"\n"])</script><script>self.__next_f.push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"779\",\"static/chunks/app/practice/reading/single/%5Btest%5D/page-c8475733dad30162.js\"],\"default\"]\n13:T1bb2,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eEffects of Changes in World Population\u003c/h2\u003e\n      \u003cdiv class=\"watermark\"\u003e@reading_cdi\u003c/div\u003e\n      \u003cdiv class=\"passage-label\"\u003eREADING PASSAGE 2\u003c/div\u003e\n      \u003cdiv class=\"passage-title\"\u003eEffects of Changes in World Population\u003c/div\u003e\n      \u003cdiv class=\"passage-subtitle\"\u003eYou should spend about 20 minutes on Questions 14–26.\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-letter\"\u003eA\u003c/span\u003eHuman \u003cspan class=\"vocab-word\"\u003efertility\u003c/span\u003e rates around the world are dropping for a variety of complex reasons. While the population itself continues to increase, the rate of increase is slowing, and sometime in the next 80 years, world population will peak somewhere in the vicinity of nine billion before contracting. That raises an important question: is population \u003cspan class=\"vocab-word\"\u003econtraction\u003c/span\u003e a bad thing? Some think not. There is a school of thought that argues that smaller populations are good. Population control proponents claim variously that we do not have the food to sustain higher populations; our planet already suffers from overcrowding; the environmental impact of increased populations will bring catastrophe either through pollution or consumption of finite natural resources; or in contrast, they argue decreased populations will lead to higher wages and a better quality of life as available supplies exceed reduced demands. These arguments seem reasonable at first, but do not withstand \u003cspan class=\"vocab-word\"\u003escrutiny\u003c/span\u003e.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-letter\"\u003eB\u003c/span\u003eLet's start with food. The worry about mass starvation is a remnant of Paul Ehrlich's 1968 book The Population Bomb. Ehrlich, Professor of Population Studies in the department of Biological Sciences at Stanford University in California, wrote that in the face of expanding populations, the world will undergo famines and hundreds of millions of people are going to starve to death. As Ehrlich himself now admits, this prediction proved faulty. Instead, the availability of food has greatly increased, even with a growing population. \u003cspan class=\"vocab-word\"\u003eDemographer\u003c/span\u003e Philip Longman notes that food shortages have become a political problem, related to fair distribution, not an issue of inadequate supply. How did this happen? In 1965, Danish economist Ester Boserup proposed that population increase fosters agricultural innovation, which in turn increases production. Her theories have been borne out by events, which show that some areas of the world may lack sufficient supplies while the world has an overall \u003cspan class=\"vocab-word\"\u003esurplus\u003c/span\u003e.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-letter\"\u003eC\u003c/span\u003eWhat about overcrowding? Everywhere you go today, you find traffic jams and \u003cspan class=\"vocab-word\"\u003esprawl\u003c/span\u003e, with people packed into crowded places. But this is a problem of density, not population. There's plenty of land available out there. The problem is that people who used to live in the rural areas have relocated to cities. This massive migration into cities has caused \u003cspan class=\"vocab-word\"\u003eurbanization\u003c/span\u003e, which is different from overpopulation, and the problems associated with this include air pollution, lower wages, and limited access to healthcare and educational opportunities.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-letter\"\u003eD\u003c/span\u003eEnvironmental concerns are more interesting, but such end-of-the-world warnings are not new. Global warming and the fact that the Earth has only \u003cspan class=\"vocab-word\"\u003efinite\u003c/span\u003e amounts of natural resources that we will surely \u003cspan class=\"vocab-word\"\u003edeplete\u003c/span\u003e, are the two main concerns of environmentalists. This, too, is an argument we have heard before. As Massimo Livi-Bacci, Professor of Demography at the University of Florence, Italy, explains in his Concise History of World Population, more than 100 years ago economists feared that coal supplies would be exhausted, and about 30 years ago the Club of Rome made similar predictions regarding other natural resources. Instead, innovation stepped in to provide greater efficiency. For instance, in the America of 1850, you needed an average of 4.6 tons of petroleum equivalent to produce $1,000 of goods and services. By 1950, you needed only 1.8 tons, and by 1978, 1.5 tons.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-letter\"\u003eE\u003c/span\u003eThis leaves us with the economy. In 1971, Simon Smith Kuznets won the Nobel Prize in Economics for his theory of \"tested knowledge.\" Kuznets explained that more population means more creators and producers, both of goods along established production patterns and of new knowledge and inventions. Kuznets was \u003cspan class=\"vocab-word\"\u003ecodifying\u003c/span\u003e what others had noticed before. Political economist Adam Smith remarked that the most decisive mark of the prosperity of any country is the increase of the number of its inhabitants. As Livi-Bacci observes, all things being equal, population increase is followed by increased per capita production. So the proposed \"benefits\" of population decline are, at the very least, suspect. In addition, there are worrying potential costs of population decline. Of course, this worry is theoretical because we've never seen population decline on the massive scale that's coming our way. Or rather, we've never seen it in the modern world.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-letter\"\u003eF\u003c/span\u003eThere are, however, two historical examples. Between 400 BC and AD 1, world population increased from about 153 million to 252 million. For the next 200 years, growth slowed almost to a halt. Then, between AD 200 and AD 600, the population shrank from 257 million to 208 million. It took an additional 400 years for the population to recover to the level it had attained in AD 1. The other drop in population occurred between 1340 and 1400, when the Black Death, one of the most deadly pandemics in human history, \u003cspan class=\"vocab-word\"\u003eravaged\u003c/span\u003e the world. Global population fell from 442 million to 375 million. Neither of these drops was a particularly pleasant period in human history. Or, as Canadian journalist Mark Steyn notes in America Alone, there is no precedent in human history for economic growth on declining human capital. It is impossible to anticipate with certainty the effects of population decline. But there is good reason to believe it will be bad for us. Innovation will suffer as the demand for nearly everything slackens. Instead of producing \u003cspan class=\"vocab-word\"\u003ewindfalls\u003c/span\u003e of excess supply, economies will probably contract. As Livi-Bacci observes, historically, areas depopulated or in the process of losing population have almost always been characterized by \u003cspan class=\"vocab-word\"\u003ebackward\u003c/span\u003e economies. The real question therefore is whether or not falling populations will lead to the demise of civilization as we know it.\u003c/p\u003e\u003c/div\u003e\n    "])</script><script>self.__next_f.push([1,"14:T2705,"])</script><script>self.__next_f.push([1,"\n\n      \n      \u003cdiv class=\"q-section-hdr\"\u003e\n        \u003ch3\u003eQuestions 14–19\u003c/h3\u003e\n        \u003cp\u003eReading Passage 2 has six sections, A–F. Choose the correct heading for each section from the list of headings below.\u003cbr\u003e\n        \u003cb\u003ei\u003c/b\u003e Do we have sufficient resources to feed the human population?\u003cbr\u003e\n        \u003cb\u003eii\u003c/b\u003e Will population increase pose disaster for our supply of raw materials?\u003cbr\u003e\n        \u003cb\u003eiii\u003c/b\u003e Would population decline benefit the world?\u003cbr\u003e\n        \u003cb\u003eiv\u003c/b\u003e Is disease a key factor?\u003cbr\u003e\n        \u003cb\u003ev\u003c/b\u003e Is population decrease good for productivity?\u003cbr\u003e\n        \u003cb\u003evi\u003c/b\u003e What is the impact of population movement?\u003cbr\u003e\n        \u003cb\u003evii\u003c/b\u003e What can past events tell us about the effects of population decline?\u003cbr\u003e\n        \u003cb\u003eviii\u003c/b\u003e What can our governments do to guarantee supplies of food and resources?\u003c/p\u003e\n      \u003c/div\u003e\n  haqiqatan ham yomon narsami, va bu haqda tarafdor hamda qarshi fikrlarni sanab o'tadi.\",\"quotes\":[],\"ru\":\"iii – «Принесет ли миру пользу сокращение численности населения?» В разделе А представлен центральный вопрос отрывка: действительно ли сокращение численности населения — это плохо, и перечисляются аргументы, которые люди выдвигают за и против этого.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"8a6d49beb1868371032d3daa7dded47d554d4a183f90575238483ea5b11d1ec6\"}}},\"15\":{\"part\":1,\"en\":\"i – 'Do we have sufficient resources to feed the human population?' Section B discusses Ehrlich's famine predictions and shows that food availability has actually increased, addressing whether there is enough food.\",\"uz\":\"i – 'Inson populyatsiyasini oziq-ovqat bilan ta'minlash uchun yetarli resurslarimiz bormi?' B-band Erlixning ocharchilik bashoratlarini muhokama qiladi va oziq-ovqat yetarliligi masalasini ko'rib chiqadi.\",\"quotes\":[],\"ru\":\"я – «Есть ли у нас достаточно ресурсов, чтобы прокормить человеческое население?» В разделе B обсуждаются прогнозы Эрлиха о голоде и показано, что доступность продовольствия на самом деле увеличилась, а также вопрос о том, достаточно ли еды.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"08ffe20270bd208b2c5ab639da59170e62471aaa04179d34717300851cd1b39f\"}}},\"16\":{\"part\":1,\"en\":\"vi – 'What is the impact of population movement?' Section C explains that overcrowding is really about people migrating from rural areas into cities, which is a movement of population, not overpopulation.\",\"uz\":\"vi – 'Aholi ko'chishining ta'siri qanday?' C-band ortiqcha zichlik aslida qishloqdan shaharga ko'chish natijasi ekanini tushuntiradi — bu aholi harakati, aholi ko'payishi emas.\",\"quotes\":[],\"ru\":\"vi – «Каково влияние перемещения населения?» В разделе C объясняется, что перенаселенность на самом деле связана с миграцией людей из сельской местности в города, что представляет собой перемещение населения, а не перенаселение.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"27abe223e8f246d7ae8e2f5db4549920b26441acfb189b79ccd14d6f5dd6cd47\"}}},\"17\":{\"part\":1,\"en\":\"ii – 'Will population increase pose disaster for our supply of raw materials?' Section D covers environmental worries about depleting finite natural resources and how innovation has instead improved efficiency.\",\"uz\":\"ii – 'Aholi ko'payishi xomashyo zaxiralarimizga falokat keltiradimi?' D-band cheklangan tabiiy resurslarning tugashi haqidagi ekologik tashvishlarni va innovatsiya orqali samaradorlik oshganini yoritadi.\",\"quotes\":[],\"ru\":\"ii – «Не станет ли рост населения катастрофой для наших поставок сырья?» В разделе D рассказывается об экологических опасениях по поводу истощения ограниченных природных ресурсов и о том, как инновации вместо этого повысили эффективность.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"dfe934c4cbbdf8f410dd55866d9e1c775a0a76f3adb88ef3325c81fe050049d3\"}}},\"18\":{\"part\":1,\"en\":\"v – 'Is population decrease good for productivity?' Section E discusses Kuznets' and Adam Smith's ideas that more population means more producers and prosperity, implying that a smaller population could hurt productivity.\",\"uz\":\"v – 'Aholi kamayishi mahsuldorlik uchun foydalimi?' E-band Kuznets va Adam Smitning g'oyalarini muhokama qiladi: ko'proq aholi — ko'proq ishlab chiqaruvchi va farovonlik, demak kam aholi mahsuldorlikka zarar yetkazishi mumkin.\",\"quotes\":[],\"ru\":\"v – «Полезно ли сокращение численности населения для производительности?» В разделе E обсуждаются идеи Кузнеца и Адама Смита о том, что большее население означает больше производителей и процветание, подразумевая, что меньшее население может нанести ущерб производительности.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"e7e5ca8ed8dcdadffcd5e1dc6ca8bcfa88abc57c3498456dae741818773eca8b\"}}},\"19\":{\"part\":1,\"en\":\"vii – 'What can past events tell us about the effects of population decline?' Section F looks at two historical examples of population decline (after AD 200 and the Black Death) to predict what future decline might bring.\",\"uz\":\"vii – 'O'tmishdagi voqealar aholi kamayishining oqibatlari haqida bizga nima deydi?' F-band aholi kamayishining ikki tarixiy misolini (Milodiy 200-yildan keyin va O'lat davri) kelajakdagi kamayish oqibatlarini bashorat qilish uchun ko'rib chiqadi.\",\"quotes\":[],\"ru\":\"vii – «Что события прошлого могут сказать нам о последствиях сокращения численности населения?» В разделе F рассматриваются два исторических примера сокращения численности населения (после 200 г. н. э. и Черной смерти), чтобы предсказать, к чему может привести сокращение населения в будущем.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"f71f37117b9dba48f7dce57c73150fff0fd341ea3fa239751b4d282ac61c821f\"}}},\"20\":{\"part\":1,\"en\":\"surplus. Paragraph B states that Boserup's theory of population-driven agricultural innovation is 'borne out by events', showing some areas may lack supplies while the world as a whole has an overall surplus.\",\"uz\":\"surplus (ortiqcha). B-bandda Boserupning aholi ko'payishi qishloq xo'jaligi innovatsiyasini rag'batlantiradi degan nazariyasi tasdiqlangani aytiladi — ba'zi hududlarda yetishmovchilik bo'lsa-da, dunyo miqyosida umumiy ortiqcha (surplus) mavjud.\",\"quotes\":[],\"ru\":\"излишек. В параграфе B говорится, что теория Бозерапа о сельскохозяйственных инновациях, движимых населением, «подтверждается событиями», показывая, что в некоторых регионах может не хватать ресурсов, в то время как мир в целом имеет общий избыток.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"b47280f4d6d2b8d0618a49a44aab1d17134a53fce44e35c848238df7d82fd087\"}}},\"21\":{\"part\":1,\"en\":\"innovation. Paragraph D explains that instead of resources being exhausted as feared, 'innovation stepped in to provide greater efficiency', citing the drop in petroleum needed per $1,000 of output.\",\"uz\":\"innovation (innovatsiya). D-bandda resurslar tugaydi degan qo'rquvga qaramay, 'innovatsiya samaradorlikni oshirish uchun yordam berdi' deyiladi — $1000lik mahsulot uchun kerakli neft miqdori kamayganligi misol qilib keltiriladi.\",\"quotes\":[],\"ru\":\"инновации. В пункте D поясняется, что вместо того, чтобы ресурсы были исчерпаны, как опасались, «вмешались инновации для обеспечения большей эффективности», ссылаясь на снижение потребности в нефти на 1000 долларов продукции.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"b7c70f2d2fde69696a12537cc019a00b404065b85f85def8202ad94fac68fb6d\"}}},\"22\":{\"part\":1,\"en\":\"prosperity. Paragraph E quotes Adam Smith saying that the clearest sign of a country's prosperity is the growth in the number of its inhabitants.\",\"uz\":\"prosperity (farovonlik). E-bandda Adam Smitning fikri keltiriladi: mamlakat farovonligining eng aniq belgisi uning aholisi sonining o'sishidir.\",\"quotes\":[],\"ru\":\"процветание. В пункте E цитируется высказывание Адама Смита о том, что самым ярким признаком процветания страны является рост числа ее жителей.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"b438275bf7593a8e2bc75c2f58117d55780f0603b0838a86aead853f21f30d0c\"}}},\"23\":{\"part\":1,\"en\":\"A and E. Paragraph B confirms food availability has 'greatly increased', and paragraph C confirms people 'have relocated to cities' from rural areas — both are views the writer supports with evidence.\",\"uz\":\"A va E. B-band oziq-ovqat yetarliligi 'sezilarli darajada oshgani'ni tasdiqlaydi, C-band esa odamlarning qishloqdan shaharga 'ko'chib o'tganini' tasdiqlaydi — ikkalasi ham muallif dalillar bilan qo'llab-quvvatlagan fikrlar.\",\"quotes\":[],\"ru\":\"A и E. Параграф B подтверждает, что доступность продовольствия «значительно возросла», а параграф C подтверждает, что люди «переехали в города» из сельской местности — обе точки зрения автор подтверждает фактами.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"6b60f036002754e382b86684a7b319e9dff19dbd329b0ae7e55aeac20d1e5395\"}}},\"24\":{\"part\":1,\"en\":\"A and E (same pair as Q23 — order does not matter). The other options (B, C, D) are population-control claims the writer argues against, not views the writer agrees with.\",\"uz\":\"A va E (23-savol bilan bir xil juftlik — tartib muhim emas). Qolgan variantlar (B, C, D) muallif rad etadigan aholi nazorati tarafdorlarining da'volaridir, muallif fikri emas.\",\"quotes\":[],\"ru\":\"A и E (та же пара, что и Q23 — порядок не имеет значения). Другие варианты (B, C, D) — это утверждения о контроле над рождаемостью, против которых выступает автор, а не взгляды, с которыми автор согласен.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"41ae85bf2c9d38bd4c6fb4dd63c5d64d73c61f0614cd4c528c3e219e8bc3aa58\"}}},\"25\":{\"part\":1,\"en\":\"C and E. Paragraph F states that 'innovation will suffer' (fewer new ideas) and that 'economies will probably contract' (become smaller) as future consequences of population decline.\",\"uz\":\"C va E. F-bandda kelajakdagi aholi kamayishining oqibati sifatida 'innovatsiya zarar ko'radi' (yangi g'oyalar kamayadi) va 'iqtisodiyotlar kichrayishi mumkin' deyiladi.\",\"quotes\":[],\"ru\":\"C и E. В пункте F говорится, что «инновации пострадают» (меньше новых идей) и что «экономика, вероятно, сократится» (станет меньше) как будущие последствия сокращения численности населения.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"366e3be8673917a2c2c5e3c21dae358a5fa2714aaf138473f3e5e93b08467ef5\"}}},\"26\":{\"part\":1,\"en\":\"C and E (same pair as Q25 — order does not matter). Option D is explicitly contradicted since the writer says economies will contract instead of producing surplus supply.\",\"uz\":\"C va E (25-savol bilan bir xil juftlik — tartib muhim emas). D varianti matnga zid, chunki muallif iqtisodiyotlar ortiqcha ta'minot o'rniga kichrayishini aytadi.\",\"quotes\":[],\"ru\":\"C и E (та же пара, что и Q25 — порядок не имеет значения). Вариант D явно противоречит, поскольку автор утверждает, что экономика будет сокращаться, а не производить избыточное предложение.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"e8c4da9e5070e98b61c1a76d710ae2d05e1f8523a97ee32774b71923f6467f9b\"}}},\"23–24\":{\"part\":1,\"en\":\"A and E. Paragraph B confirms food availability has 'greatly increased', and paragraph C confirms people 'have relocated to cities' from rural areas — both are views the writer supports with evidence.\\n\\nA and E (same pair as Q23 — order does not matter). The other options (B, C, D) are population-control claims the writer argues against, not views the writer agrees with.\",\"uz\":\"A va E. B-band oziq-ovqat yetarliligi 'sezilarli darajada oshgani'ni tasdiqlaydi, C-band esa odamlarning qishloqdan shaharga 'ko'chib o'tganini' tasdiqlaydi — ikkalasi ham muallif dalillar bilan qo'llab-quvvatlagan fikrlar.\\n\\nA va E (23-savol bilan bir xil juftlik — tartib muhim emas). Qolgan variantlar (B, C, D) muallif rad etadigan aholi nazorati tarafdorlarining da'volaridir, muallif fikri emas.\",\"quotes\":[],\"ru\":\"A и E. Параграф B подтверждает, что доступность продовольствия «значительно возросла», а параграф C подтверждает, что люди «переехали в города» из сельской местности — обе точки зрения автор подтверждает фактами.\\n\\nA и E (та же пара, что и Q23 — порядок не имеет значения). Другие варианты (B, C, D) — это утверждения о контроле над рождаемостью, против которых выступает автор, а не взгляды, с которыми автор согласен.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"a644d987eff68b099eee5cb41b5456408424fa509c8b570f738f1b28c1b1699e\"}}},\"25–26\":{\"part\":1,\"en\":\"C and E. Paragraph F states that 'innovation will suffer' (fewer new ideas) and that 'economies will probably contract' (become smaller) as future consequences of population decline.\\n\\nC and E (same pair as Q25 — order does not matter). Option D is explicitly contradicted since the writer says economies will contract instead of producing surplus supply.\",\"uz\":\"C va E. F-bandda kelajakdagi aholi kamayishining oqibati sifatida 'innovatsiya zarar ko'radi' (yangi g'oyalar kamayadi) va 'iqtisodiyotlar kichrayishi mumkin' deyiladi.\\n\\nC va E (25-savol bilan bir xil juftlik — tartib muhim emas). D varianti matnga zid, chunki muallif iqtisodiyotlar ortiqcha ta'minot o'rniga kichrayishini aytadi.\",\"quotes\":[],\"ru\":\"C и E. В пункте F говорится, что «инновации пострадают» (меньше новых идей) и что «экономика, вероятно, сократится» (станет меньше) как будущие последствия сокращения численности населения.\\n\\nC и E (та же пара, что и Q25 — порядок не имеет значения). Вариант D явно противоречит, поскольку автор утверждает, что экономика будет сокращаться, а не производить избыточное предложение.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"8d9ccc718f1c785f65d9cc9f08a6c3c7aa18148a67f213566ab2eddb63eb7331\"}}}}}]]\n"])</script></body></html>
