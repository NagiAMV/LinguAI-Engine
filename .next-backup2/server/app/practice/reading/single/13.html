,\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:null\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"LinguAI Bridge\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Computer-delivered IELTS listening practice\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"10:\"$b:metadata\"\n"])</script><script>self.__next_f.push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"779\",\"static/chunks/app/practice/reading/single/%5Btest%5D/page-c8475733dad30162.js\"],\"default\"]\n13:T1385,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eTransport and transport systems during the Roman Empire\u003c/h2\u003e\u003cdiv\u003e\u003cp\u003e\u003cem\u003e400,000 kilometres of road, relays of fresh horses and a seat on somebody else’s cargo ship\u003c/em\u003e\u003c/p\u003e\u003cp\u003eAt the height of the Roman Empire in the 2nd century AD, it was not uncommon for Romans to travel long distances by road across Europe and beyond. In fact, it was actually quite easy to travel, thanks to the empire’s highly developed road and shipping networks. It has been calculated that Roman roads covered a total distance of over 400,000 kilometres, with more than 120,000 kilometres of this being of the type known as ‘public roads’ and a second system classified as ‘military roads’, both constructed by soldiers. The roads spread across the empire from Britain in the north to Morocco in the south, from Portugal in the west to Iraq in the east. Roads played a crucial role in the maintenance of the empire, allowing people and goods to move relatively swiftly. Tolls were charged for the use of many major roads, with stations where these tolls were paid often situated at bridges or at city gates.\u003c/p\u003e\u003cp\u003eHaving the elaborate road network also meant that Roman troops could be sent rapidly to various parts of the empire in the event of emergencies, such as internal revolts or external threats. Therefore, the existence of these roads reduced the number of large and costly garrisons* needed throughout the empire.\u003c/p\u003e\u003cp\u003eOrdinary Romans would travel in a \u003cem\u003eraeda\u003c/em\u003e, a carriage with four wooden wheels covered with iron and pulled by up to four horses. The raeda was the equivalent of the bus today. It had wooden benches inside for passengers, and a cloth top or sometimes no top at all. Rich Romans travelled in a \u003cem\u003ecarpentum\u003c/em\u003e, which was essentially a luxury vehicle for the wealthy. The carpentum had four wheels, a wooden arched rooftop and seats. It was pulled by many horses and was built incorporating a form of suspension to make the ride less bumpy and disagreeable. Romans also had a vehicle, called a \u003cem\u003eplaustrum\u003c/em\u003e, that did not normally carry passengers – what would be considered a truck today. The plaustrum, constructed with a flat wooden base over four thick wheels and drawn by two oxen, was designed to carry heavy loads. It was very slow and could cover only 15 to 25 kilometres per day.\u003c/p\u003e\u003cp\u003eThe fastest way to travel over heavily trafficked routes was by the \u003cem\u003ecursus publicus\u003c/em\u003e. This was like a state-run postal service, but was also used to transport government or military officials. A certificate issued by the emperor was required in order to use the service. A series of stations with fresh horses were built at short regular intervals of approximately 12 kilometres along the major road systems. It has been estimated that a typical trip by relays of horses was made at a rate of 66 to 103 kilometres per day.\u003c/p\u003e\u003cp\u003eBecause of their iron-shod wheels, Roman vehicles made a lot of noise and were therefore forbidden by law from entering the vicinity of big Roman cities during the day. Fortunately, many roads had stations, called \u003cem\u003emansiones\u003c/em\u003e, where Roman travellers could stop and break their journey, the equivalent of motorway rest areas today. These sometimes included inns where tired travellers could drink, eat and sleep. The stations were built by the government at regular intervals of 25 to 30 kilometres. One of the factors that meant such roads could be safely used for trade was the fact that they were patrolled by the Roman army. Merchants knew that they would usually be protected from bandits and highwaymen.\u003c/p\u003e\u003cp\u003eIt was not uncommon for well-to-do Romans to travel as tourists to places relatively far away such as Greece and Egypt. For this, they would often have to sail across the Mediterranean Sea, but as there were no regular passenger services, they travelled on ships which were transporting goods. Tourists had to find a ship, get the captain’s approval and negotiate a price with him. Fortunately, there were many merchant ships going back and forth regularly along established routes in the Mediterranean, so tourists had little difficulty finding a ship going to their chosen destination. Most Roman tourists would travel on the open deck of the ship, sometimes with hundreds of people crowded together. Food was not included in the price of transport, so passengers had to supply their own. Certain merchant ships provided cabins at the rear that could accommodate the richer passengers. Meanwhile, the wealthiest Romans had their own ships and employed a crew to sail them, much like on big private yachts today.\u003c/p\u003e\u003cp\u003eTravelling by ship in Roman times was relatively fast. For example, going from Brindisium in Italy to Patrae in Greece would take about three days. Commercial navigation was suspended during particularly bad storms, when the Mediterranean was too rough and dangerous for ships to sail.\u003c/p\u003e\u003cp\u003e\u003ci\u003e* garrison: a group of soldiers stationed in a fortress or town to defend it\u003c/i\u003e\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"14:T17d1,"])</script><script>self.__next_f.push([1,"\u003csection\u003e\u003ch3\u003eQuestions 1–7\u003c/h3\u003e\u003cp\u003eDo the following statements agree with the information given in Reading Passage 1? In boxes 1–7 on your answer sheet, write\u003c/p\u003e\u003cp\u003eTRUE / FALSE / NOT GIVEN\u003c/p\u003e\u003cdiv class=\"q-card\"\u003eThe Roman military was responsible for building the ‘public roads’. \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e1\u003c/strong\u003e\u003cselect name=\"practice_single_reading_13_1\" id=\"practice_single_reading_13_1_\" autocomplete=\"off\" aria-label=\"Question 1\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/div\u003e\u003cdiv class=\"q-card\"\u003eThe Roman road network made it necessary to establish more garrisons. \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e2\u003c/strong\u003e\u003cselect name=\"practice_single_reading_13_2\" id=\"practice_single_reading_13_2_\" autocomplete=\"off\" aria-label=\"Question 2\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/div\u003e\u003cdiv class=\"q-card\"\u003eTravel by \u003cem\u003eraeda\u003c/em\u003e was usually only for short distances. \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e3\u003c/strong\u003e\u003cselect name=\"practice_single_reading_13_3\" id=\"practice_single_reading_13_3_\" autocomplete=\"off\" aria-label=\"Question 3\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/div\u003e\u003cdiv class=\"q-card\"\u003eA \u003cem\u003ecarpentum\u003c/em\u003e was constructed with some consideration for passenger comfort. \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e4\u003c/strong\u003e\u003cselect name=\"practice_single_reading_13_4\" id=\"practice_single_reading_13_4_\" autocomplete=\"off\" aria-label=\"Question 4\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/div\u003e\u003cdiv class=\"q-card\"\u003ePeople wanting to use the \u003cem\u003ecursus publicus\u003c/em\u003e service needed official permission. \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e5\u003c/strong\u003e\u003cselect name=\"practice_single_reading_13_5\" id=\"practice_single_reading_13_5_\" autocomplete=\"off\" aria-label=\"Question 5\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/ ps\u003c/div\u003e\u003cdiv class=\"q-card\"\u003e \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e13\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_single_reading_13_13\" id=\"practice_single_reading_13_13_\" autocomplete=\"off\" aria-label=\"Question 13\" placeholder=\"Answer\"\u003e\u003c/span\u003e could sometimes cause sailings to be cancelled\u003c/div\u003e\u003c/section\u003e"])</script><script>self.__next_f.push([1,"7:[[\"$\",\"$L12\",\"single-reading-13\",{\"test\":{\"id\":\"single-reading-13\",\"resource\":\"reading\",\"test\":13,\"title\":\"Transport and transport systems during the Roman Empire\",\"backUrl\":\"/?view=reading\u0026format=single\",\"durationMinutes\":20,\"reviewLanguages\":[\"ru\",\"en\",\"uz\"],\"parts\":[{\"id\":1,\"passage\":\"$13\",\"questions\":\"$14\",\"fieldNames\":[\"practice_single_reading_13_1\",\"practice_single_reading_13_2\",\"practice_single_reading_13_3\",\"practice_single_reading_13_4\",\"practice_single_reading_13_5\",\"practice_single_reading_13_6\",\"practice_single_reading_13_7\",\"practice_single_reading_13_8\",\"practice_single_reading_13_9\",\"practice_single_reading_13_10\",\"practice_single_reading_13_11\",\"practice_single_reading_13_12\",\"practice_single_reading_13_13\"],\"fieldLabels\":{\"practice_single_reading_13_1\":\"Question 1\",\"practice_single_reading_13_2\":\"Question 2\",\"practice_single_reading_13_3\":\"Question 3\",\"practice_single_reading_13_4\":\"Question 4\",\"practice_single_reading_13_5\":\"Question 5\",\"practice_single_reading_13_6\":\"Question 6\",\"practice_single_reading_13_7\":\"Question 7\",\"practice_single_reading_13_8\":\"Question 8\",\"practice_single_reading_13_9\":\"Question 9\",\"practice_single_reading_13_10\":\"Question 10\",\"practice_single_reading_13_11\":\"Question 11\",\"practice_single_reading_13_12\":\"Question 12\",\"practice_single_reading_13_13\":\"Question 13\"}}],\"provenance\":{\"typ дорог уменьшало количество необходимых по всей империи крупных и дорогостоящих гарнизонов».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"23545cda1d25fd36d864e2424277d3aa334c9597ed943531d4da72ad2b423e95\"}}},\"3\":{\"part\":1,\"en\":\"NOT GIVEN.  The   raeda  is described – its wheels, horses, benches and cloth top – but the passage never says how far it typically went.\",\"uz\":\"NOT GIVEN —   Raeda  tasvirlangan: g‘ildiraklari, otlari, o‘rindiqlari, matodan tomi; lekin odatda qancha masofaga yurgani aytilmagan.\",\"quotes\":[\"The raeda was the equivalent of the bus today\"],\"ru\":\"NOT GIVEN.  Раэда описана – ее колеса, лошади, скамейки и тканевый верх – но в отрывке никогда не говорится, как далеко она обычно заходила.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"aa199dd45e3ee64d4fd5ec9c1a389e17b5522efeb8dbdaaafab137a6afc78c8e\"}}},\"4\":{\"part\":1,\"en\":\"TRUE.  It “was built incorporating a form of   suspension  to make the ride less bumpy and disagreeable” – that is comfort for the passenger.\",\"uz\":\"TRUE — U «yo‘lni kamroq silkitadigan va yoqimsiz qilmaydigan amortizatsiya tizimi bilan» qurilgan – ya’ni yo‘lovchi qulayligi.\",\"quotes\":[\"a form of suspension to make the ride less bumpy and disagreeable\"],\"ru\":\"TRUE.  Он «был построен с использованием такой формы подвески, чтобы сделать езду менее ухабистой и неприятной» – это комфорт для пассажира.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"8ce90367c817f8fd495e0cdbabdde3ec15dad83c7505546035f0b788a823c244\"}}},\"5\":{\"part\":1,\"en\":\"TRUE.  “A   certificate issued by the emperor  was required in order to use the service.”\",\"uz\":\"TRUE — «Xizmatdan foydalanish uchun imperator tomonidan berilgan guvohnoma talab qilingan».\",\"quotes\":[\"A certificate issued by the emperor was required\"],\"ru\":\"TRUE.  «Для пользования услугой требовалось свидетельство, выданное императором».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"719044ad8031c4d79754373eb17cf0a01808fb74f4ffd559fb8588eeed85be04\"}}},\"6\":{\"part\":1,\"en\":\"NOT GIVEN.  We are told the   mansiones  stood “at regular intervals of 25 to 30 kilometres”, but nothing says they were at junctions of several roads.\",\"uz\":\"NOT GIVEN —   Mansiones  «har 25–30 kilometrda» joylashgani aytiladi, lekin bir nechta yo‘l kesishgan joyda ekani haqida hech narsa yo‘q.\",\"quotes\":[\"The stations were built by the government at regular intervals of 25 to 30 kilometres\"],\"ru\":\"NOT GIVEN.  Нам говорят, что особняки стояли «через равные промежутки в 25–30 километров», но ничто не говорит о том, что они находились на перекрестках нескольких дорог.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"7ed26b47520a7c0c3d68d2a2020169df6a187576d0b63b9ef852df0896811eb5\"}}},\"7\":{\"part\":1,\"en\":\"FALSE.  “The stations were built by the   government ” – not by private businessmen.\",\"uz\":\"FALSE — «Bekatlar hukumat tomonidan qurilgan», xususiy tadbirkorlar tomonidan emas.\",\"quotes\":[\"where Roman travellers could stop and break their journey\"],\"ru\":\"FALSE.  «Станции построило правительство», а не частные бизнесмены.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"bc0231dba125bd91b9079f2b0fb4259fb1b202d535aea0a6bc9cd5585e2299e1\"}}},\"8\":{\"part\":1,\"en\":\"price.  “Tourists had to find a ship, get the captain’s approval and   negotiate a price  with him.”\",\"uz\":\"price — «Sayyohlar kema topishi, kapitanning roziligini olishi va u bilan narx bo‘yicha kelishishi kerak edi».\",\"quotes\":[\"negotiate a price with him\"],\"ru\":\"цена.  «Туристам нужно было найти корабль, получить одобрение капитана и договориться с ним о цене».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"45607b6bd3e2ba07e667696aaaad742017389c7ac3d81baeffbce8baac38d5e6\"}}},\"9\":{\"part\":1,\"en\":\"routes.  “There were many merchant ships going back and forth regularly along   established routes  in the Mediterranean, so tourists had little difficulty finding a ship.”\",\"uz\":\"routes — «O‘rta dengizda belgilangan yo‘nalishlar bo‘ylab muntazam qatnaydigan ko‘plab savdo kemalari bor edi».\",\"quotes\":[\"regularly along established routes in the Mediterranean\"],\"ru\":\"маршруты.  «По установленным маршрутам в Средиземном море регулярно курсировало множество торговых судов, поэтому туристам не составило труда найти корабль».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"ee7c8f96a41b9f9ed8cb18034068e212dbf00a9c6d9ba29299887de028eecfe3\"}}},\"10\":{\"part\":1,\"en\":\"deck.  “Most Roman tourists would travel on the open   deck  of the ship, sometimes with hundreds of people crowded together.”\",\"uz\":\"deck — «Rimlik sayyohlarning aksariyati kemaning ochiq palubasida, ba’zan yuzlab odam bilan birga yurgan».\",\"quotes\":[\"travel on the open deck of the ship\"],\"ru\":\"палуба.  «Большинство римских туристов путешествовали по открытой палубе корабля, иногда в компании сотен людей».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"e3fd62067a721e40140ab8b805f80e2bcadc059d1d3f5f537345056f05ba870e\"}}},\"11\":{\"part\":1,\"en\":\"cabins.  “Certain merchant ships provided   cabins  at the rear that could accommodate the richer passengers.”\",\"uz\":\"cabins — «Ba’zi savdo kemalarida orqa tomonda badavlat yo‘lovchilar uchun kayutalar bo‘lgan».\",\"quotes\":[\"provided cabins at the rear\"],\"ru\":\"каюты.  «Некоторые торговые суда предусматривали в кормовой части каюты, в которых могли разместиться более богатые пассажиры».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"059d06a97478c9f40447b594a6d8fa1f19e785944facdc2d2979039c963ebcc6\"}}},\"12\":{\"part\":1,\"en\":\"crew.  “The wealthiest Romans had their own ships and   employed a crew  to sail them.”\",\"uz\":\"crew — «Eng boy rimliklarning o‘z kemalari bor edi va ularni boshqarish uchun ekipaj yollashgan».\",\"quotes\":[\"employed a crew to sail them\"],\"ru\":\"экипаж.  «Самые богатые римляне имели собственные корабли и нанимали команду для управления ими».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"2d4809e35a372fffe65f80e7ed436b94e81a8f361d74ea6acd52e256dffc5493\"}}},\"13\":{\"part\":1,\"en\":\"storms.  “Commercial navigation was suspended during particularly bad   storms , when the Mediterranean was too rough and dangerous for ships to sail.”\",\"uz\":\"storms — «Kuchli bo‘ronlar paytida savdo kemalari qatnovi to‘xtatilgan, chunki O‘rta dengiz juda to‘lqinli va xavfli bo‘lgan».\",\"quotes\":[\"suspended during particularly bad storms\"],\"ru\":\"штормы.  «Коммерческое судоходство приостанавливалось во время особенно сильных штормов, когда Средиземное море было слишком бурным и опасным для плавания кораблей».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"bc2b966dc85feddf82943f34204cdd2e3ae4906f800c62a0fb709087381a0377\"}}}}}]]\n"])</script></body></html>
