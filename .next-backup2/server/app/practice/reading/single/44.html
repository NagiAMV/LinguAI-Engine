,\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:null\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"LinguAI Bridge\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Computer-delivered IELTS listening practice\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"10:\"$b:metadata\"\n"])</script><script>self.__next_f.push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"779\",\"static/chunks/app/practice/reading/single/%5Btest%5D/page-c8475733dad30162.js\"],\"default\"]\n13:T1454,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eLever Brothers' Sunlight Soap\u003c/h2\u003e\n      \u003cdiv class=\"watermark\"\u003e@reading_cdi\u003c/div\u003e\n      \u003cdiv class=\"passage-label\"\u003eREADING PASSAGE 2\u003c/div\u003e\n      \u003cdiv class=\"passage-title\"\u003eLever Brothers' Sunlight Soap\u003c/div\u003e\n      \u003cdiv class=\"passage-subtitle\"\u003eA revolution in hygiene and industry\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-tag\"\u003eA\u003c/span\u003eSunlight Soap, produced by the Lever Brothers in the late 19th century, was a \u003cspan class=\"vocab-word\"\u003egroundbreaking\u003c/span\u003e innovation in the world of consumer goods. At a time when \u003cspan class=\"vocab-word\"\u003ehygiene\u003c/span\u003e and cleanliness were not universally prioritised, Sunlight Soap not only introduced a revolutionary product but also played a crucial role in transforming industrial production, marketing strategies and public health. The success of Sunlight Soap laid the foundation for what would later become Unilever, one of the world's largest \u003cspan class=\"vocab-word\"\u003emultinational\u003c/span\u003e corporations.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-tag\"\u003eB\u003c/span\u003eThe story of Sunlight Soap begins in 1884, when William Hesketh Lever and his brother James Darcy Lever established the Lever Brothers company in England. They sought to create a high-quality soap that was both affordable and effective in promoting hygiene. Traditional soaps at the time were often harsh on the skin and required extensive preparation. The Lever Brothers aimed to change this by producing a soap that was easy to use and gentle while maintaining strong \u003cspan class=\"vocab-word\"\u003ecleansing\u003c/span\u003e properties.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003eThe innovation behind Sunlight Soap lay in its production process. Unlike the traditional method of soap-making, which relied on animal fats and wood ash, Sunlight Soap was manufactured using a blend of vegetable oils and alkali, resulting in a more \u003cspan class=\"vocab-word\"\u003econsistent\u003c/span\u003e and superior-quality product. This not only improved the soap's effectiveness but also made it a more ethical and sustainable option compared with its contemporaries.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-tag\"\u003eC\u003c/span\u003eBeyond the product itself, the Lever Brothers were \u003cspan class=\"vocab-word\"\u003epioneers\u003c/span\u003e in marketing and \u003cspan class=\"vocab-word\"\u003ebranding\u003c/span\u003e. They understood the power of advertising and created memorable, \u003cspan class=\"vocab-word\"\u003epersuasive\u003c/span\u003e campaigns for Sunlight Soap. These advertisements emphasised the soap's \u003cspan class=\"vocab-word\"\u003epurity\u003c/span\u003e, its ability to fight germs, and its role in maintaining a happy and healthy home. The company used a variety of media, from newspapers and magazines to colourful posters and collectable cards, to reach a wide audience. This aggressive and innovative marketing strategy helped create a strong brand identity and fostered customer loyalty.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-tag\"\u003eD\u003c/span\u003eThe company also revolutionised industrial relations and worker \u003cspan class=\"vocab-word\"\u003ewelfare\u003c/span\u003e. In 1888, Lever Brothers built a purpose-built factory and village called Port Sunlight on the Wirral Peninsula. This model village was designed to provide high-quality housing, amenities, and social benefits for its employees. It featured gardens, schools, a hospital, and \u003cspan class=\"vocab-word\"\u003erecreational\u003c/span\u003e facilities, which were considered revolutionary for the time. This approach was part of William Lever's philosophy of \"prosperity sharing,\" where he believed that a healthy and content workforce would lead to greater productivity and company success. Port Sunlight became a landmark in industrial planning and set a new standard for employee welfare.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-tag\"\u003eE\u003c/span\u003eThe impact of Sunlight Soap on public health was significant. By promoting the importance of cleanliness with an effective and accessible product, it contributed to improved hygiene practices among the general public. This was particularly important in an era before the widespread understanding of \u003cspan class=\"vocab-word\"\u003egerm theory\u003c/span\u003e. The widespread use of soap like Sunlight played a role in reducing the incidence of infectious diseases, thereby improving overall public health standards in Britain and beyond.\u003c/p\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"passage-para\"\u003e\u003cp class=\"passage-text\"\u003e\u003cspan class=\"para-tag\"\u003eF\u003c/span\u003eThe phenomenal success of Sunlight Soap provided the capital and brand recognition for the Lever Brothers to expand their operations globally. They began acquiring other soap and food companies, steadily growing their \u003cspan class=\"vocab-word\"\u003eportfolio\u003c/span\u003e. This expansion \u003cspan class=\"vocab-word\"\u003eculminated\u003c/span\u003e in 1930 with a \u003cspan class=\"vocab-word\"\u003emerger\u003c/span\u003e with the Dutch margarine company, Margarine Unie. This merger formed Unilever, a dual-headed company structure that remains unique to this day. The creation of Unilever marked the beginning of a new era, transforming a single soap product into a global consumer goods empire.\u003c/p\u003e\u003c/div\u003e\n\n    "])</script><script>self.__next_f.push([1,"14:T1cb6,"])</script><script>self.__next_f.push([1,"\n      \u003cdiv class=\"q-section-hdr\"\u003e\n        \u003ch3\u003eQuestions 14–19\u003c/h3\u003e\n        \u003cp\u003eReading Passage 2 has six paragraphs, \u003cb\u003eA–F\u003c/b\u003e.\u003cbr\u003eWhich paragraph contains the following information? Write the correct letter, \u003cb\u003eA–F\u003c/b\u003e.\u003cbr\u003e\u003cb\u003eNB\u003c/b\u003e You may use any letter more than once.\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"q-block\"\u003e\n        \u003cdiv class=\"q-row\"\u003e\n          \u003cspan class=\"q-label\"\u003e\u003cspan class=\"q-sub\"\u003eA description of the advertising methods used to promote the soap\u003c/span\u003e\u003c/span\u003e\n          \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e14\u003c/strong\u003e\u003cselect class=\"sel-input\" name=\"practice_single_reading_44_14\" id=\"practice_single_reading_ description of the methods used to promote the soap.\",\"uz\":\"C — C bandida reklama vositalari tasvirlangan: gazeta va jurnallardan rangli plakat va yig'iladigan kartochkalargacha. Bu sovunni targ'ib qilish usullaridir.\",\"quotes\":[\"The company used a variety of media, from newspapers and magazines to colourful posters and collectable cards\"],\"ru\":\"C — В пункте C описаны рекламные каналы: «от газет и журналов до красочных плакатов и коллекционных карточек». Это описание методов, используемых для продвижения мыла.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"af88efa5692691245b3f1c899ff488d922f143223dc6d2b423031561fa27ce3f\"}}},\"15\":{\"part\":1,\"en\":\"D — Paragraph D explains why Port Sunlight was built: 'to provide high-quality housing, amenities, and social benefits for its employees' — a healthy workforce would be more productive.\",\"uz\":\"D — D bandida Port Sunlight nima uchun qurilgani tushuntirilgan: xodimlarga sifatli uy-joy va ijtimoiy imkoniyatlar berish uchun.\",\"quotes\":[\"This model village was designed to provide high-quality housing, amenities, and social benefits for its employees\"],\"ru\":\"D — В параграфе D объясняется, почему Port Sunlight был построен: «чтобы обеспечить высококачественное жилье, удобства и социальные льготы для своих сотрудников» — здоровая рабочая сила была бы более продуктивной.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"375d06790d0a6aef2fef31e26870a03f89f37ce3466168c2180418e65fce6f87\"}}},\"16\":{\"part\":1,\"en\":\"F — Paragraph F traces the chain from the soap's success to global expansion, the 1930 merger with Margarine Unie, and the creation of Unilever.\",\"uz\":\"F — F bandida sovun muvaffaqiyatidan global kengayish, 1930-yilgi qo'shilish va Unilever tashkil topishigacha bo'lgan zanjir keltirilgan.\",\"quotes\":[\"The phenomenal success of Sunlight Soap provided the capital and brand recognition for the Lever Brothers to expand their operations globally\"],\"ru\":\"F — В параграфе F прослеживается цепочка от успеха мыла до глобального расширения, слияния в 1930 году с Margarine Unie и создания Unilever.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"55c29bf706db2cefa9520a5af613fae7b096ed54e1d16e0dc4b7045686068a93\"}}},\"17\":{\"part\":1,\"en\":\"B — Paragraph B compares old and new: 'Traditional soaps at the time were often harsh on the skin and required extensive preparation', whereas the new soap was easy to use and gentle.\",\"uz\":\"B — B bandida eski va yangi sovun taqqoslanadi: an'anaviy sovunlar terini qitiqlagan va uzoq tayyorgarlik talab qilgan.\",\"quotes\":[\"Traditional soaps at the time were often harsh on the skin and required extensive preparation\"],\"ru\":\"B — В абзаце Б сравнивается старое и новое: «Традиционное мыло того времени часто оказывало резкое воздействие на кожу и требовало тщательной подготовки», тогда как новое мыло было простым в использовании и нежным.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"93325dc329a4628d12b0344a913dd81d870e261bc3a55579b13ebc8a8e6a7b97\"}}},\"18\":{\"part\":1,\"en\":\"E — Paragraph E is about society-wide health benefits: better hygiene practices and 'reducing the incidence of infectious diseases'.\",\"uz\":\"E — E bandi jamiyat sog'lig'iga foyda haqida: gigiyena yaxshilangan va yuqumli kasalliklar kamaygan.\",\"quotes\":[\"The widespread use of soap like Sunlight played a role in reducing the incidence of infectious diseases\"],\"ru\":\"E — В пункте E речь идет о пользе для здоровья всего общества: улучшении гигиены и «снижении заболеваемости инфекционными заболеваниями».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"85f7912669a9b38d778f5c688b1c6d42c6a6cd62832027f006cfcdf3076e3462\"}}},\"19\":{\"part\":1,\"en\":\"B — Paragraph B states the founders' original aim: 'They sought to create a high-quality soap that was both affordable and effective in promoting hygiene.'\",\"uz\":\"B — B bandida asoschilarning dastlabki maqsadi aytilgan: arzon, sifatli va gigiyena uchun samarali sovun yaratish.\",\"quotes\":[\"They sought to create a high-quality soap that was both affordable and effective in promoting hygiene\"],\"ru\":\"B — В параграфе B изложена первоначальная цель основателей: «Они стремились создать высококачественное мыло, которое было бы одновременно доступным и эффективным в плане гигиены».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"a465fb9d016b33d9a0f00e132d37315d13b68b187d9637bdbe217461955a04de\"}}},\"20\":{\"part\":1,\"en\":\"The passage names both founders: 'William Hesketh Lever and his brother James Darcy Lever'.\",\"uz\":\"Matnda ikkala asoschi ham keltirilgan: William Hesketh Lever va uning akasi James Darcy Lever.\",\"quotes\":[\"his brother James Darcy Lever\"],\"ru\":\"В отрывке упоминаются оба основателя: «Уильям Хескет Левер и его брат Джеймс Дарси Левер».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"c860b06f858949ab56f7155db2842d30f8d5aec4b60119f52e4f119f931d88cf\"}}},\"21\":{\"part\":1,\"en\":\"Paragraph B: 'The story of Sunlight Soap begins in 1884, when ... [they] established the Lever Brothers company in England.'\",\"uz\":\"B bandi: Sunlight Soap tarixi 1884-yilda boshlanadi — kompaniya o'sha yili tashkil etilgan.\",\"quotes\":[\"begins in 1884\"],\"ru\":\"Параграф Б: «История Sunlight Soap начинается в 1884 году, когда… [они] основали компанию Lever Brothers в Англии».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"737c0f48fd02d831155914b058cce1b97c9f9f02b3970a5211679f37b3196cca\"}}},\"22\":{\"part\":1,\"en\":\"Instead of animal fats and wood ash, the soap was made 'using a blend of vegetable oils and alkali'.\",\"uz\":\"Hayvon yog'i va kul o'rniga sovun 'o'simlik moylari va ishqor' aralashmasidan tayyorlangan.\",\"quotes\":[\"using a blend of vegetable oils and alkali\"],\"ru\":\"Вместо животных жиров и древесной золы мыло изготавливалось «с использованием смеси растительных масел и щелочи».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"2b220c418650e293c97fa1f4b974c3f933e4c2383a99c4e950d550304cb59579\"}}},\"23\":{\"part\":1,\"en\":\"The new process gave 'a more consistent and superior-quality product' and made it 'a more ethical and sustainable option'. Either 'ethical' or 'sustainable' is accepted.\",\"uz\":\"Yangi jarayon mahsulotni 'ko'proq axloqiy va barqaror' qilgan. 'ethical' yoki 'sustainable' javobi qabul qilinadi.\",\"quotes\":[\"made it a more ethical and sustainable option\"],\"ru\":\"Новый процесс позволил получить «более стабильный и высококачественный продукт» и сделал его «более этичным и устойчивым вариантом». Принимается либо «этичный», либо «устойчивый».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"dd316e348720e2b70d3a7d6ba4ac527d4036fdee2fe81a83572da1bb7e08d76f\"}}},\"24\":{\"part\":1,\"en\":\"Paragraph C: the advertisements emphasised 'the soap's purity, its ability to fight germs, and its role in maintaining a happy and healthy home'.\",\"uz\":\"C bandi: reklamalarda sovunning tozaligi va 'mikroblarga qarshi kurashish' qobiliyati ta'kidlangan.\",\"quotes\":[\"its ability to fight germs\"],\"ru\":\"Параграф C: в рекламе подчеркивалась «чистота мыла, его способность бороться с микробами и его роль в поддержании счастливого и здорового дома».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"eaa87e53a3521ad21a1d4327deffe823120e064909d8e2d974826a08f1e64fb7\"}}},\"25\":{\"part\":1,\"en\":\"Paragraph D: in 1888 the company built 'a purpose-built factory and village called Port Sunlight on the Wirral Peninsula'.\",\"uz\":\"D bandi: 1888-yilda kompaniya 'Port Sunlight' deb nomlangan zavod va qishloqni qurgan.\",\"quotes\":[\"village called Port Sunlight\"],\"ru\":\"Параграф D: в 1888 году компания построила «специально построенную фабрику и деревню под названием Порт-Санлайт на полуострове Уиррал».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"f59f3e4004acc02f9e75bfdfe5e53baa7875e96a85d863c1e80e2599e595b6ac\"}}},\"26\":{\"part\":1,\"en\":\"William Lever's worker-welfare belief is quoted directly as his philosophy of 'prosperity sharing'.\",\"uz\":\"William Leverning xodimlar farovonligi haqidagi qarashi matnda to'g'ridan-to'g'ri 'prosperity sharing' deb keltirilgan.\",\"quotes\":[\"philosophy of \\\"prosperity sharing,\\\"\"],\"ru\":\"Убеждение Уильяма Левера в обеспечении благосостояния рабочих цитируется непосредственно как его философия «разделения процветания».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"63de59c9320c6386cd7f66473265106c6a60c837ac8e0d198b9b3b0f92963e78\"}}}}}]]\n"])</script></body></html>
