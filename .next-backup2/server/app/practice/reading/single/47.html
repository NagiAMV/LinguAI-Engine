,\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:null\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"LinguAI Bridge\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Computer-delivered IELTS listening practice\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"10:\"$b:metadata\"\n"])</script><script>self.__next_f.push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"779\",\"static/chunks/app/practice/reading/single/%5Btest%5D/page-c8475733dad30162.js\"],\"default\"]\n13:T184b,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eBird Migration\u003c/h2\u003e\n\u003cp class=\"p-sub-inline\"\u003eHow birds cross the world — and what science still cannot explain\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003eA\u003c/span\u003eBirds have many unique design features that enable them to perform such amazing feats of endurance. They are equipped with lightweight, hollow bones, intricately designed feathers providing both lift and thrust for rapid flight, navigation systems superior to any that man has developed, and an ingenious heat conserving design that, among other things, concentrates all blood circulation beneath layers of warm, waterproof plumage, leaving them fit to face life in the harshest of climates. Their respiratory systems have to perform efficiently during sustained flights at altitude, so they have a system of extracting oxygen from their lungs that far exceeds that of any other animal. During the later stages of the summer breeding season, when food is plentiful, their bodies are able to accumulate considerable layers of fat, in order to provide sufficient energy for their long migratory flights.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003eB\u003c/span\u003eThe fundamental reason that birds migrate is to find adequate food during the winter months when it is in short supply. This particularly applies to birds that breed in the temperate and Arctic regions of the Northern Hemisphere, where food is abundant during the short growing season. Many species can tolerate cold temperatures if food is plentiful, but when food is not available they must migrate. However, intriguing questions remain.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003eC\u003c/span\u003eOne puzzling fact is that many birds journey much further than would be necessary just to find food and good weather. Nobody knows, for instance, why British swallows, which could presumably survive equally well if they spent the winter in equatorial Africa, instead fly several thousand miles further to their preferred winter home in South Africa's Cape Province. Another mystery involves the huge migrations performed by arctic terns and mudflat-feeding shorebirds that breed close to Polar Regions. In general, the further north a migrant species breeds, the further south it spends the winter. For arctic terns this necessitates an annual round trip of 25,000 miles. Yet, en route to their final destination in far-flung southern latitudes, all these individuals overfly other areas of seemingly suitable habitat spanning two hemispheres. While we may not fully understand birds' reasons for going to particular places, we can marvel at their feats.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003eD\u003c/span\u003eOne of the greatest mysteries is how young birds know how to find the traditional wintering areas without parental guidance. Very few adults migrate with juveniles in tow, and youngsters may even have little or no inkling of their parents' appearance. A familiar example is that of the cuckoo, which lays its eggs in another species' nest and never encounters its young again. It is mind boggling to consider that, once raised by its host species, the young cuckoo makes its own way to ancestral wintering grounds in the tropics before returning single-handedly to northern Europe the next season to seek out a mate among its own kind. The obvious implication is that it inherits from its parents an inbuilt route map and direction-finding capability, as well as a mental image of what another cuckoo looks like. Yet nobody has the slightest idea as to how this is possible.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003eE\u003c/span\u003eMounting evidence has confirmed that birds use the positions of the sun and stars to obtain compass directions. They seem also to be able to detect the earth's magnetic field, probably due to having minute crystals of magnetite in the region of their brains. However, true navigation also requires an awareness of position and time, especially when lost. Experiments have shown that after being taken thousands of miles over an unfamiliar landmass, birds are still capable of returning rapidly to nest sites. Such phenomenal powers are the product of computing a number of sophisticated cues, including an inborn map of the night sky and the pull of the earth's magnetic field. How the birds use their 'instruments' remains unknown, but one thing is clear: they see the world with a superior sensory perception to ours. Most small birds migrate at night and take their direction from the position of the setting sun. However, as well as seeing the sun go down, they also seem to see the plane of polarized light caused by it, which calibrates their compass. Traveling at night provides other benefits. Daytime predators are avoided and the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced. Furthermore, at night the air is generally cool and less turbulent and so conducive to sustained, stable flight.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003eF\u003c/span\u003eNevertheless, all journeys involve considerable risk, and part of the skill in arriving safely is setting off at the right time. This means accurate weather forecasting, and utilizing favorable winds. Birds are adept at both, and, in laboratory tests, some have been shown to detect the minute difference in barometric pressure between the floor and ceiling of a room. Often birds react to weather change before there is any visible sign of them. Lapwings, which feed on grassland, flee west from the Netherlands to the British Isles, France and Spain at the onset of a cold snap. When the ground surface freezes the birds could starve. Yet they return to Holland ahead of a thaw, their arrival linked to a pressure change presaging an improvement in the weather.\u003c/p\u003e\n\n\u003cp\u003e\u003cspan class=\"para-label\"\u003eG\u003c/span\u003eIn one instance a Welsh Manx shearwater carried to America and released was back in its burrow on Skokholm Island, off the Pembrokeshire coast, one day before a letter announcing its release! Conversely, each autumn a small number of North American birds are blown across the Atlantic by fast-moving westerly tail winds. Not only do they arrive safely in Europe, but, based on ringing evidence, some make it back to North America the following spring, after probably spending the winter among European migrants in sunny African climes.\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"14:T2daa,"])</script><script>self.__next_f.push([1,"\n  \u003cdiv class=\"q-head\"\u003eQuestions 14–26\u003c/div\u003e\n\n  \u003cdiv class=\"q-sub\"\u003eQuestions 14–20\u003c/div\u003e\n  \u003cdiv class=\"q-instr\"\u003e\u003cp\u003eReading Passage 2 has seven paragraphs, \u003cb\u003eA–G\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eChoose the correct heading for each paragraph from the list of headings below.\u003c/p\u003e\u003cp\u003eWrite the correct number, \u003cb\u003ei–x\u003c/b\u003e, in boxes 14–20 on your answer sheet. siyaga imkon beruvchi jismoniy xususiyatlar.\",\"quotes\":[\"Birds have many unique design features that enable them to perform such amazing feats of endurance\"],\"ru\":\"iv — Параграф А полностью посвящен телам птиц: полые кости, перья, конструкция, сохраняющая тепло, и эффективные легкие. Это физические характеристики, которые делают миграцию возможной.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"f15f1c439762b5e5cf12f52544ac624385f00d27ce61176f02113bb81c4084a3\"}}},\"15\":{\"part\":1,\"en\":\"v — Paragraph B opens with “The fundamental reason that birds migrate is to find adequate food during the winter months”, which is exactly the main reason for migration.\",\"uz\":\"v — B paragrafi “Qushlar migratsiya qilishining asosiy sababi qish oylarida yetarli oziq-ovqat topish” degan jumla bilan boshlanadi — bu aynan asosiy sabab.\",\"quotes\":[\"The fundamental reason that birds migrate is to find adequate food during the winter months\"],\"ru\":\"v — Параграф Б начинается со слов «Основная причина миграции птиц — поиск достаточного питания в зимние месяцы», что и является основной причиной миграции.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"b5f6cb24f014a55cafe370fd6cc675a6165b618b3cfebae5e2e8246ee646e453\"}}},\"16\":{\"part\":1,\"en\":\"ii — Paragraph C asks why swallows fly past perfectly good habitat in equatorial Africa and go thousands of miles further south. They reject the closer feeding ground and nobody knows why.\",\"uz\":\"ii — C paragrafida qaldirg‘ochlar nega ekvatorial Afrikadagi yaroqli hududni tashlab, ancha janubga uchishi so‘raladi. Ular yaqinroq oziqlanish joyini rad etadi, sababi noma’lum.\",\"quotes\":[\"many birds journey much further than would be necessary just to find food and good weather\"],\"ru\":\"ii — В пункте C задается вопрос, почему ласточки пролетают мимо вполне хорошей среды обитания в экваториальной Африке и улетают на тысячи миль дальше на юг. Они отвергают более близкую кормовую площадку, и никто не знает, почему.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"1ae8f60f2644ccc39e69f85aa8a3b2505f066c1f1fbd3c81c44ee42dfbf5cac3\"}}},\"17\":{\"part\":1,\"en\":\"x — Paragraph D is about young birds, especially the cuckoo, finding the wintering grounds although no adult ever teaches them the route.\",\"uz\":\"x — D paragrafi yosh qushlar, ayniqsa kakku haqida: hech kim yo‘lni o‘rgatmasa ham, ular qishlash joyini topadi.\",\"quotes\":[\"the young cuckoo makes its own way to ancestral wintering grounds in the tropics\"],\"ru\":\"x — В пункте D речь идет о молодых птицах, особенно кукушке, которые находят места зимовки, хотя ни один взрослый человек никогда не учит их этому маршруту.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"e5342ffc22c94eb16f091b64d1a875e68486fc82da53483f3889446ee395e72a\"}}},\"18\":{\"part\":1,\"en\":\"vii — Paragraph E reports what research has found: sun and star compasses, magnetite crystals in the brain, experiments with displaced birds, and polarized light.\",\"uz\":\"vii — E paragrafida tadqiqot natijalari keltirilgan: quyosh va yulduzlar kompasi, miyadagi magnetit kristallari, ko‘chirilgan qushlar bilan tajribalar va qutblangan yorug‘lik.\",\"quotes\":[\"Such phenomenal powers are the product of computing a number of sophisticated cues\"],\"ru\":\"vii — В параграфе E сообщается о том, что обнаружили исследования: солнечные и звездные компасы, кристаллы магнетита в мозгу, эксперименты с перемещенными птицами и поляризованный свет.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"133b6a9eb4baec914cfd2b4c9351d17cbfc3eeb9b296ba894945313520df843a\"}}},\"19\":{\"part\":1,\"en\":\"i — Paragraph F is about timing: “part of the skill in arriving safely is setting off at the right time”, using weather forecasting and favourable winds.\",\"uz\":\"i — F paragrafi vaqt haqida: “xavfsiz yetib borish mahoratining bir qismi — to‘g‘ri vaqtda yo‘lga chiqish”, ob-havo va qulay shamollardan foydalanish.\",\"quotes\":[\"part of the skill in arriving safely is setting off at the right time\"],\"ru\":\"i — В пункте F речь идет о сроках: «часть умения безопасного прибытия заключается в том, чтобы отправиться в нужное время», используя прогноз погоды и попутный ветер.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"0c699ee8293642aac50a24f669f21f4bc858ec0f52c86c706b3e6f2a56f45f1e\"}}},\"20\":{\"part\":1,\"en\":\"viii — Paragraph G gives examples of birds carried off course by winds that still complete their journeys successfully — the Manx shearwater and the birds blown across the Atlantic.\",\"uz\":\"viii — G paragrafida shamol tufayli yo‘ldan chiqqan, ammo baribir muvaffaqiyatli yetib borgan qushlar misollari berilgan.\",\"quotes\":[\"a small number of North American birds are blown across the Atlantic by fast-moving westerly tail winds\"],\"ru\":\"viii — В параграфе G приводятся примеры птиц, сбитых с курса ветром, которые все же успешно завершают свое путешествие — буревестники острова Мэн и птицы, перенесенные через Атлантику.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"cce7c7c3a4bb7c27d2cffb83714b2a2107b8e64e81a40ecf78bdd3eb25e1146a\"}}},\"21\":{\"part\":1,\"en\":\"A — Paragraph C states that many birds “journey much further than would be necessary” and “overfly other areas of seemingly suitable habitat”, so they do fly further than they need to.\",\"uz\":\"A — C paragrafida ko‘plab qushlar “kerak bo‘lganidan ancha uzoqroq” uchishi va yaroqli hududlar ustidan o‘tib ketishi aytilgan.\",\"quotes\":[\"all these individuals overfly other areas of seemingly suitable habitat\"],\"ru\":\"A — В пункте C говорится, что многие птицы «путешествуют гораздо дальше, чем это было бы необходимо» и «облетают другие районы, казалось бы, подходящей среды обитания», поэтому они действительно летают дальше, чем им нужно.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"2fc506bb03dacc06357c36df5d7adc70bdfc5a896da7315ac604c2a37bb3d20b\"}}},\"22\":{\"part\":1,\"en\":\"C — Paragraph E says that at night “the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced”, i.e. night flyers need less water.\",\"uz\":\"C — E paragrafida tunda “issiq, quyoshli osmonda uzoq uchishdan kelib chiqadigan suvsizlanish xavfi kamayadi” deyilgan, ya’ni tunda uchuvchilarga kamroq suv kerak.\",\"quotes\":[\"the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced\"],\"ru\":\"C — В пункте E говорится, что ночью «опасность обезвоживания из-за длительных полетов в теплом, освещенном солнцем небе снижается», т. е. ночным летчикам требуется меньше воды.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"b6a0b7c124395790b8bd6aef4298566f11df893cfa11fc2bec5934eecd86ce53\"}}},\"23\":{\"part\":1,\"en\":\"parental guidance — Paragraph D: “One of the greatest mysteries is how young birds know how to find the traditional wintering areas without parental guidance.”\",\"uz\":\"parental guidance — D paragrafi: eng katta sirlardan biri — yosh qushlar ota-onaning yo‘l-yo‘rig‘isiz (parental guidance) an’anaviy qishlash hududlarini qanday topishi.\",\"quotes\":[\"how young birds know how to find the traditional wintering areas without parental guidance\"],\"ru\":\"родительское руководство. Параграф D: «Одна из величайших загадок заключается в том, как молодые птицы умеют находить традиционные места зимовки без родительского руководства».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"8ab25e22a9f185f84af774f889fe7d3782d5d2f0fbe9049ee0d20a6584bb6fd3\"}}},\"24\":{\"part\":1,\"en\":\"compass — Paragraph E: birds “use the positions of the sun and stars to obtain compass directions”.\",\"uz\":\"compass — E paragrafi: qushlar quyosh va yulduzlar holatidan kompas yo‘nalishini olish uchun foydalanadi.\",\"quotes\":[\"birds use the positions of the sun and stars to obtain compass directions\"],\"ru\":\"компас — Параграф E: птицы «используют положение солнца и звезд, чтобы определять направления по компасу».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"bf4a6488fc097d499ef9ac81627eb226491b1c002b27ffc32f17b8b81244365c\"}}},\"25\":{\"part\":1,\"en\":\"predators — Paragraph E lists the benefits of night travel, the first being “Daytime predators are avoided”.\",\"uz\":\"predators — E paragrafida tunda uchishning afzalliklari sanalgan, birinchisi — kunduzgi yirtqichlardan (predators) qochish.\",\"quotes\":[\"Daytime predators are avoided\"],\"ru\":\"хищники. В параграфе E перечислены преимущества ночных путешествий, первое из которых гласит: «Дневных хищников можно избежать».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"4d45407e81d03701b569a80a8efeab93c9ffb3193a01d5e7f4fdc5f3de93a18e\"}}},\"26\":{\"part\":1,\"en\":\"visible — Paragraph F: “Often birds react to weather change before there is any visible sign of them”, so they detect weather without visible signs.\",\"uz\":\"visible — F paragrafi: ko‘pincha qushlar ob-havo o‘zgarishiga hech qanday ko‘rinadigan (visible) belgi paydo bo‘lishidan oldin javob beradi.\",\"quotes\":[\"Often birds react to weather change before there is any visible sign of them\"],\"ru\":\"видимый — Параграф F: «Часто птицы реагируют на изменение погоды до того, как появляются какие-либо видимые признаки», поэтому они определяют погоду без видимых признаков.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"770abf0dc89962501573bba3a33698a96f47822378b8c15e8d5a8c7dd619babe\"}}},\"21–22\":{\"part\":1,\"en\":\"A — Paragraph C states that many birds “journey much further than would be necessary” and “overfly other areas of seemingly suitable habitat”, so they do fly further than they need to.\\n\\nC — Paragraph E says that at night “the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced”, i.e. night flyers need less water.\",\"uz\":\"A — C paragrafida ko‘plab qushlar “kerak bo‘lganidan ancha uzoqroq” uchishi va yaroqli hududlar ustidan o‘tib ketishi aytilgan.\\n\\nC — E paragrafida tunda “issiq, quyoshli osmonda uzoq uchishdan kelib chiqadigan suvsizlanish xavfi kamayadi” deyilgan, ya’ni tunda uchuvchilarga kamroq suv kerak.\",\"quotes\":[\"all these individuals overfly other areas of seemingly suitable habitat\",\"the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced\"],\"ru\":\"A — В пункте C говорится, что многие птицы «путешествуют гораздо дальше, чем это было бы необходимо» и «облетают другие районы, казалось бы, подходящей среды обитания», поэтому они действительно летают дальше, чем им нужно.\\n\\nC — В пункте E говорится, что ночью «опасность обезвоживания из-за длительных полетов в теплом, освещенном солнцем небе снижается», т. е. ночным летчикам требуется меньше воды.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"119efc0881204182e5346c1e1a88342cd5ae65ce2649c9665d5598fc9c7c3640\"}}}}}]]\n"])</script></body></html>
