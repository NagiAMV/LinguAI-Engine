,\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:null\n"])</script><script>self.__next_f.push([1,"b:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"LinguAI Bridge\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Computer-delivered IELTS listening practice\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"10:\"$b:metadata\"\n"])</script><script>self.__next_f.push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"779\",\"static/chunks/app/practice/reading/single/%5Btest%5D/page-c8475733dad30162.js\"],\"default\"]\n13:T1397,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eWhat Lucy Taught Us\u003c/h2\u003e\u003cdiv\u003e\u003cp\u003e\u003cem\u003eA scientific finding in East Africa has changed our understanding of how humans have developed\u003c/em\u003e\u003c/p\u003e\u003cp\u003eA scientific finding in East Africa has changed our understanding of how humans have developed. On a Sunday morning in late November 1974, a team of scientists was digging in an isolated spot in the Afar region of Ethiopia. Surveying the area, palaeoanthropologist Donald Johanson spotted a small piece of bone. Straight away, he recognised it as coming from the elbow of a human ancestor. And there were plenty more. ‘As I looked up the slopes to my left, I saw bits of the skull, a chunk of jaw, a couple of vertebrae,’ says Johanson.\u003c/p\u003e\u003cp\u003eIt was immediately obvious that the skeleton was a significant find because the sediments at the site were known to be 3.5 million years old. ‘I realised this was part of a skeleton that was older than three million years,’ says Johanson. It was the most ancient early human ever found. Later it became apparent that it was also the most complete – 40% of the skeleton had been preserved.\u003c/p\u003e\u003cp\u003eAt the group’s campsite that night, Johanson played a Beatles song called ‘Lucy in the Sky with Diamonds’, and, as the feeling was that the skeleton was female due to its size, someone suggested calling it Lucy. The name stuck and Johanson says, ‘All of a sudden, she became a person.’ But the morning after the discovery, the discussion was dominated by questions. How old was Lucy when she died? Did she have children? And might she be our direct ancestor? Nowadays, we’re starting to get the answers to some of these questions.\u003c/p\u003e\u003cp\u003eAccording to Johanson, Lucy had an incredible combination of primitive and derived features, which had not been seen before. Her skull and jaws were more ape-like than those of other groups of early humans. Her braincase was also very small, no bigger than that of a chimp. She had a hefty jaw, a low forehead and long dangly arms.\u003c/p\u003e\u003cp\u003eFor Johanson, it was immediately apparent that Lucy walked upright. That’s because the shape and positioning of her pelvis reflected a fully upright gait. Lucy’s knee and ankle were also preserved and seemed to reflect bipedal walking. Later studies of feet offer even more evidence. As an upright walker, Lucy strengthened the idea that walking was one of the selective pressures driving human evolution forward. Early humans did not need bigger brains to take defining steps away from apes. Extra brainpower only came over a million years later with the arrival of the species \u003ci\u003eHomo erectus\u003c/i\u003e, meaning upright man. Though big brains would clearly be important later, walking remains one of the traits that makes us uniquely human.\u003c/p\u003e\u003cp\u003eShe may have walked like a human, but Lucy spent at least some of her time up in the trees, as chimpanzees and orangutans still do today. It may be that upright walking evolved in the trees, as a way to walk along branches that would otherwise be too flexible. It’s not clear why Lucy left the safety of the trees. It is thought that savannahs were gradually opening up, so trees were spaced further apart. But hunting for food may have been the real reason for heading to the ground, says Chris Stringer of the Natural History Museum in London. In line with this idea, recent evidence suggests that the diet of early humans was changing at that time.\u003c/p\u003e\u003cp\u003eStudies of the remains of food trapped on preserved human teeth indicate that several species, including Lucy’s, were expanding their diet around 3.5 million years ago. Instead of mostly eating fruit from trees, they began to include grasses and possibly meat. This change in diet may have allowed them to range more widely and to travel around more efficiently in a changing environment. Fossilised crocodile and turtle eggs were found near her skeleton, suggesting that Lucy died while foraging for them in a nearby lake.\u003c/p\u003e\u003cp\u003eHow did early humans process all these new foods? Later species, like \u003ci\u003eHomo erectus\u003c/i\u003e, are known to have used simple stone tools, but no tools have ever been found from this far back. However, in 2010 archaeologists uncovered animal bones with scratches that seem to have been made by stone tools. This suggests that Lucy and her relatives used stone tools to eat meat. There have since been heated debates over whether or not the marks were really made by tools. But if they were, it is not surprising, says Fred Spoor of the Max Planck Institute for Evolutionary Anthropology in Leipzig, Germany.\u003c/p\u003e\u003cp\u003eIt also seems that Lucy’s childhood was much briefer than ours and that she had to fend for herself from a young age. We know that Lucy was a full-grown adult because she had wisdom teeth and her bones had fused. But unlike modern humans, she seems to have grown to full size very quickly, and her time of death was when she was around 12 years old. In line with that, a recent study of a 3-year-old early human suggested that their brains matured much earlier than ours do.\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"14:T166a,"])</script><script>self.__next_f.push([1,"\u003csection\u003e\u003ch3\u003eQuestions 1–5\u003c/h3\u003e\u003cp\u003eDo the following statements agree with the information given in Reading Passage 1? In boxes 1–5 on your answer sheet, write\u003c/p\u003e\u003cp\u003eTRUE / FALSE / NOT GIVEN\u003c/p\u003e\u003cdiv class=\"q-card\"\u003eDonald Johanson was uncertain about the nature of the elbow bone he found in Afar. \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e1\u003c/strong\u003e\u003cselect name=\"practice_single_reading_14_1\" id=\"practice_single_reading_14_1_\" autocomplete=\"off\" aria-label=\"Question 1\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/div\u003e\u003cdiv class=\"q-card\"\u003eSeveral bones were found by Donald Johanson at the same site in Afar. \u003cspan class=\"ielts-listening-question-item\"\u003e\u003cstrong class=\"ielts-listening-question-number\"\u003e2\u003c/strong\u003e\u003cselect name=\"practice_single_reading_14_2\" id=\"practice_single_reading_14_2_\" autocomplete=\"off\" aria-label=\"Question 2\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/div\u003e\u003cdiv class=\"q-card\"\u003eThe experts realised the importance of the discovery at Afar. \u003cspan class=\"ielts-listening-question-item\ hes  that would otherwise be too flexible.”\",\"uz\":\"branches — «Tik yurish daraxtlarda, aks holda juda egiluvchan bo‘lgan shoxlar bo‘ylab yurish usuli sifatida paydo bo‘lgan bo‘lishi mumkin».\",\"quotes\":[\"as a way to walk along branches that would otherwise be too flexible\"],\"ru\":\"ветки.  «Возможно, прямохождение развилось на деревьях как способ ходить по ветвям, которые в противном случае были бы слишком гибкими».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"3bd4923a8cd99e2d3d775d89832bf7763d9d99f6995b99a6b02835658dcc5ab7\"}}},\"7\":{\"part\":1,\"en\":\"ground.  “But hunting for food may have been the real reason for   heading to the ground , says Chris Stringer.”\",\"uz\":\"ground — «Lekin yerga tushishning asl sababi ovqat izlash bo‘lgan bo‘lishi mumkin, – deydi Kris Stringer».\",\"quotes\":[\"may have been the real reason for heading to the ground\"],\"ru\":\"земля.  «Но охота за едой могла быть настоящей причиной ухода на землю», — говорит Крис Стрингер.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"64abd2af03ba3215c286f505d2b8c7e32720b98eb137ac9dfc34db7ed30c3e2d\"}}},\"8\":{\"part\":1,\"en\":\"teeth.  “Studies of the remains of food trapped on preserved human   teeth  indicate that several species… were expanding their diet.”\",\"uz\":\"teeth — «Saqlanib qolgan inson tishlarida qolgan ovqat qoldiqlarini o‘rganish bir necha turning ratsioni kengayganini ko‘rsatadi».\",\"quotes\":[\"the remains of food trapped on preserved human teeth\"],\"ru\":\"зубы.  «Исследования остатков пищи, застрявших на сохранившихся человеческих зубах, показывают, что некоторые виды… расширяли свой рацион».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"cf795d73d4392898859260974d7aab4699eb33117dbdcd77265e553396a8bb8c\"}}},\"9\":{\"part\":1,\"en\":\"fruit.  “Instead of mostly eating   fruit  from trees, they began to include grasses and possibly meat.”\",\"uz\":\"fruit — «Asosan daraxt mevasini yeyish o‘rniga ular o‘t va, ehtimol, go‘shtni ham iste’mol qila boshladi».\",\"quotes\":[\"Instead of mostly eating fruit from trees\"],\"ru\":\"фрукты.  «Вместо того, чтобы есть фрукты с деревьев, они стали есть травы и, возможно, мясо».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"7acf6466855cfc3503279929e5162edb35706cbb5fe455d8b81388ef33c053b3\"}}},\"10\":{\"part\":1,\"en\":\"eggs.  “Fossilised crocodile and turtle   eggs  were found near her skeleton, suggesting that Lucy died while foraging for them in a nearby lake.”\",\"uz\":\"eggs — «Uning skeleti yonidan toshga aylangan timsoh va toshbaqa tuxumlari topilgan, bu Lucy ularni qidirayotganda halok bo‘lganini ko‘rsatadi».\",\"quotes\":[\"Fossilised crocodile and turtle eggs were found near her skeleton\"],\"ru\":\"яйца.  «Рядом с ее скелетом были найдены окаменелые яйца крокодила и черепахи, что позволяет предположить, что Люси умерла, когда искала их в близлежащем озере».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"4d4445f0b44c5e1a2f5c2ab32f90942e2a84da80fdd1125b092f473c1aba057e\"}}},\"11\":{\"part\":1,\"en\":\"bones.  “In 2010 archaeologists uncovered animal   bones  with scratches that seem to have been made by stone tools.”\",\"uz\":\"bones — «2010-yilda arxeologlar tosh qurollar bilan qoldirilganga o‘xshash tirnalgan hayvon suyaklarini topdi».\",\"quotes\":[\"archaeologists uncovered animal bones with scratches\"],\"ru\":\"кости.  «В 2010 году археологи обнаружили кости животных с царапинами, которые, похоже, были оставлены каменными орудиями».\",\"translationProvenance\":{\"ru\":
