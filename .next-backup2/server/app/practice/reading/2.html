push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"398\",\"static/chunks/app/practice/reading/%5Btest%5D/page-614589d7c43418f8.js\"],\"default\"]\n13:T1cb0,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eAnimal minds: Parrot Alex\u003c/h2\u003e\u003cdiv\u003e\u003cp\u003e\u003cem\u003eThirty years of talking to a grey parrot changed what science was willing to say about the animal mind\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eA\u003c/strong\u003e In 1977 Irene Pepperberg, a recent graduate of Harvard University, did something very bold. At a time when animals still were considered automatons, she set out to find what was on another creature’s mind by talking to it. She brought a one-year-old African grey parrot she named Alex into her lab to teach him to reproduce the sounds of the English language. “I thought if he learned to communicate, I could ask him questions about how he sees the world.”\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eB\u003c/strong\u003e When Pepperberg began her dialogue with Alex, who died last September at the age of 31, many scientists believed animals were incapable of any thought. They were simply machines, robots programmed to react to stimuli but lacking the ability to think or feel. Any pet owner would disagree. We see the love in our dogs’ eyes and know that, of course, they have thoughts and emotions. But such claims remain highly controversial. Gut instinct is not science, and it is all too easy to project human thoughts and feelings onto another creature. How, then, does a scientist prove that an animal is capable of thinking – that it is able to acquire information about the world and act on it? “That’s why I started my studies with Alex,” Pepperberg said. They were seated – she at her desk, he on top of his cage – in her lab, a windowless room about the size of a boxcar, at Brandeis University. Newspapers lined the floor; baskets of bright toys were stacked on the shelves. They were clearly a team – and because of their work, the notion that animals can think is no longer so fanciful.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eC\u003c/strong\u003e Certain skills are considered key signs of higher mental abilities: good memory, a grasp of grammar and symbols, self-awareness, understanding others’ motives, imitating others, and being creative. Bit by bit, in ingenious experiments, researchers have documented these talents in other species, gradually chipping away at what we thought made human beings distinctive while offering a glimpse of where our own abilities came from. Scrub jays know that other jays are thieves and that stashed food can spoil; sheep can recognise faces; chimpanzees use a variety of tools to probe termite mounds and even use weapons to hunt small mammals; dolphins can imitate human postures; the archerfish, which stuns insects with a sudden blast of water, can learn how to aim its squirt simply by watching an experienced fish perform the task. And Alex the parrot turned out to be a surprisingly good talker.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eD\u003c/strong\u003e Thirty years after the Alex studies began, Pepperberg and a changing collection of assistants were still giving him English lessons. The humans, along with two younger parrots, also served as Alex’s flock, providing the social input all parrots crave. Like any flock, this one – as small as it was – had its share of drama. Alex dominated his fellow parrots, acted huffy at times around Pepperberg, tolerated the other female humans, and fell to pieces over a male assistant who dropped by for a visit. Pepperberg bought Alex in a Chicago pet store where she let the store’s assistant pick him out because she didn’t want other scientists saying later that she’d particularly chosen an especially smart bird for her work. Given that Alex’s brain was the size of a shelled walnut, most researchers thought Pepperberg’s interspecies communication study would be futile.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eE\u003c/strong\u003e “Some people actually called me crazy for trying this,” she said. “Scientists thought that chimpanzees were better subjects, although, of course, chimps can’t speak.” Chimpanzees, bonobos and gorillas have been taught to use sign language and symbols to communicate with us, often with impressive results. The bonobo Kanzi, for instance, carries his symbol-communication board with him so he can “talk” to his human researchers, and he has invented combinations of symbols to express his thoughts. Nevertheless, this is not the same thing as having an animal look up at you, open his mouth, and speak. Under Pepperberg’s patient tutelage, Alex learned how to use his vocal tract to imitate almost one hundred English words, including the sounds for various foods, although he calls an apple a “banerry”. “Apples taste a little bit like bananas to him, and they look a little bit like cherries, so Alex made up that word for them,” Pepperberg said.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eF\u003c/strong\u003e It sounded a bit mad, the idea of a bird having lessons to practise, and willingly doing it. But after listening to and observing Alex, it was difficult to argue with Pepperberg’s explanation for his behaviours. She wasn’t handing him treats for the repetitious work or rapping him on the claws to make him say the sounds. “He has to hear the words over and over before he can correctly imitate them,” Pepperberg said, after pronouncing “seven” for Alex a good dozen times in a row. “I’m not trying to see if Alex can learn a human language,” she added. “That’s never been the point. My plan always was to use his imitative skills to get a better understanding of avian cognition.”\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eG\u003c/strong\u003e In other words, because Alex was able to produce a close approximation of the sounds of some English words, Pepperberg could ask him questions about a bird’s basic understanding of the world. She couldn’t ask him what he was thinking about, but she could ask him about his knowledge of numbers, shapes and colours. To demonstrate, Pepperberg carried Alex on her arm to a tall wooden perch in the middle of the room. She then retrieved a green key and a small green cup from a basket on a shelf. She held up the two items to Alex’s eye. “What’s same?” she asked. Without hesitation, Alex’s beak opened: “Co-lor.” “What’s different?” Pepperberg asked. “Shape,” Alex said. His voice had the digitised sound of a cartoon character. Since parrots lack lips (another reason it was difficult for Alex to pronounce some sounds, such as \u003ci\u003eba\u003c/i\u003e), the words seemed to come from the air around him, as if a ventriloquist were speaking. But the words – and what can only be called the thoughts – were entirely his.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eH\u003c/strong\u003e For the next 20 minutes, Alex ran through his tests, distinguishing colours, shapes, sizes and materials (wool versus wood versus metal). He did some simple arithmetic, such as counting the yellow toy blocks among a pile of mixed hues. And then, as if to offer final proof of the mind inside his bird’s brain, Alex spoke up. “Talk clearly!” he commanded, when one of the younger birds Pepperberg was also teaching talked with wrong pronunciation. “Talk clearly!” “Don’t be a smart aleck,” Pepperberg said, shaking her head at him. “He knows all this, and he gets bored, so he interrupts the others, or he gives the wrong answer just to be obstinate. At this stage, he’s like a teenager; he’s moody, and I’m never sure what he’ll do.”\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"14:T153a,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eQuestions 1–6\u003c/h2\u003e\u003cp\u003eDo the following statements agree with the information given in Reading Passage 1? In boxes 1–6 on your answer sheet, write\u003c/p\u003e\u003cp\u003eTRUE / FALSE / NOT GIVEN\u003c/p\u003e\u003cp\u003eFirstly, Alex has grasped quite a lot of vocabulary. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e1\u003c/strong\u003e\u003cselect name=\"practice_reading_2_1\" aria-label=\"Question 1\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eAt the beginning of the study, Alex felt frightened in the presence of humans. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e2\u003c/strong\u003e\u003cselect name=\"practice_reading_2_2\" aria-label=\"Question 2\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003ePreviously, many scientists realised that animals possess the ability of thinking. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e3\u003c/strong\u003e\u003cselect name=\"practice_reading_2_3\" aria-label=\"Question 3\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eIt has taken a long time before people got to know that cognition exists in animals. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e4\u003c/strong\u003e\u003cselect name=\"practice_reading_2_4\" aria-label=\"Question 4\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eAs Alex could approximately imitate the sounds of English words, he was capable of roughly answering Irene’s questions regarding the world. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e5\u003c/strong\u003e\u003cselect name=\"practice_reading_2_5\" aria-label=\"Question 5\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eBy interrupting other parrots as well as producing incorrect answers, he tried to be focused. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e6\u003c/strong\u003e\u003cselect name=\"practice_reading_2_6\" aria-label=\"Question 6\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003ch2\u003eQuestions 7–10\u003c/h2\u003e\u003cp\u003eComplete the following summary of the paragraphs of Reading Passage 1. Choose \u003cb\u003eNO MORE THAN THREE WORDS\u003c/b\u003e from the passage for each answer. Write your answers in boxes 7–10 on your answer sheet.\u003c/p\u003e\u003cp\u003eAfter the training of Irene, Parrot Alex can use his vocal tract to pronounce more than \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e7\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_2_7\" aria-label=\"Question 7\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e , while other scientists believed that animals had no such advanced ability of thinking and would rather teach\u003c/p\u003e\u003cp\u003e \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e8\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_2_8\" aria-label=\"Question 8\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e . Pepperberg clarified that she wanted to conduct a study concerning\u003c/p\u003e\u003cp\u003e \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e9\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_2_9\" aria-label=\"Question 9\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e but not to teach him to talk. The store’s assistant picked out a bird at random for her for the sake of avoiding other scientists saying afterwards that the bird had been\u003c/p\u003e\u003cp\u003e \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e10\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_2_10\" aria-label=\"Question 10\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e .\u003c/p\u003e\u003ch2\u003eQuestions 11–13\u003c/h2\u003e\u003cp\u003eAnswer the questions below. Choose \u003cb\u003eNO MORE THAN THREE WORDS AND/OR A NUMBER\u003c/b\u003e from the passage for each answer. Write your answers in boxes 11–13 on your answer sheet.\u003c/p\u003e\u003cp\u003eWhat did Alex reply regarding the similarity of the objects shown to him? 11 _____ \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e11\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_2_11\" aria-label=\"Question 11\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eWhat is the problem of the young parrots other than Alex? 12 _____ \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e12\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_2_12\" aria-label=\"Question 12\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eTo some extent, from the way he behaved, what can we call him? 13 _____ \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e13\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_2_13\" aria-label=\"Question 13\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e \u003c/p\u003e"])</script><script>self.__next_f.push([1,"15:T1aa4,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eFather of Modern Management\u003c/h2\u003e\u003cdiv\u003e\u003cp\u003e\u003cem\u003eHow one writer persuaded the world that management is a subject worth thinking about\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"pass-fig\"\u003e\u003cimg alt=\"Peter Drucker in his study\" class=\"pass-img\"\u003e\u003cspan class=\"pass-cap\"\u003ePeter Drucker (1909–2005), whose writing turned management into a subject in its own right.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eA\u003c/strong\u003e Peter Drucker was one of the most important management thinkers of the past hundred years. He wrote about 40 books and thousands of articles, and he never rested in his mission to persuade the world that management matters. “Management is an organ of institutions … the organ that converts a mob into an organisation, and human efforts into performance.” Did he succeed? The range of his influence was extraordinary. Wherever people grapple with tricky management problems, from big organisations to small ones, from the public sector to the private, and increasingly in the voluntary sector, you can find Drucker’s fingerprints.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eB\u003c/strong\u003e His first two books – \u003ci\u003eThe End of Economic Man\u003c/i\u003e (1939) and \u003ci\u003eThe Future of Industrial Man\u003c/i\u003e (1942) – had their admirers, including Winston Churchill, but they annoyed academic critics by ranging so widely over so many different subjects. Still, the second of these books attracted attention with its passionate insistence that companies had a social dimension as well as an economic purpose. His third book, \u003ci\u003eThe Concept of the Corporation\u003c/i\u003e, became an instant bestseller and has remained in print ever since.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eC\u003c/strong\u003e The two most interesting arguments in \u003ci\u003eThe Concept of the Corporation\u003c/i\u003e actually had little to do with the decentralisation fad. They were to dominate his work. The first had to do with “empowering” workers. Drucker believed in treating workers as resources rather than just as costs. He was a harsh critic of the assembly-line system of production that then dominated the manufacturing sector – partly because assembly lines moved at the speed of the slowest and partly because they failed to engage the creativity of individual workers. The second argument had to do with the rise of knowledge workers. Drucker argued that the world is moving from an “economy of goods” to an economy of “knowledge” – and from a society dominated by an industrial proletariat to one dominated by brain workers. He insisted that this had profound implications for both managers and politicians. Managers had to stop treating workers like cogs in a huge inhuman machine and start treating them as brain workers. In turn, politicians had to realise that knowledge, and hence education, was the single most important resource for any advanced society. Yet Drucker also thought that this economy had implications for knowledge workers themselves. They had to come to terms with the fact that they were neither “bosses” nor “workers”, but something in between: entrepreneurs who had responsibility for developing their most important resource, brainpower, and who also needed to take more control of their own careers, including their pension plans.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eD\u003c/strong\u003e However, there was also a hard side to his work. Drucker was responsible for inventing one of the rational school of management’s most successful products – “management by objectives”. In one of his most substantial works, \u003ci\u003eThe Practice of Management\u003c/i\u003e (1954), he emphasised the importance of managers and corporations setting clear long-term objectives and then translating those long-term objectives into more immediate goals. He argued that firms should have an elite corps of general managers, who set these long-term objectives, and then a group of more specialised managers. For his critics, this was a retreat from his earlier emphasis on the soft side of management. For Drucker it was all perfectly consistent: if you rely too much on empowerment you risk anarchy, whereas if you rely too much on command-and-control you sacrifice creativity. The trick is for managers to set long-term goals, but then allow their employees to work out ways of achieving those goals. If Drucker helped make management a global industry, he also helped push it beyond its business base. He was emphatically a management thinker, not just a business one. He believed that management is “the defining organ of all modern institutions”, not just corporations.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eE\u003c/strong\u003e There are three persistent criticisms of Drucker’s work. The first is that he focused on big organisations rather than small ones. \u003ci\u003eThe Concept of the Corporation\u003c/i\u003e was in many ways a fanfare to big organisations. As Drucker said, “We know today that in modern industrial production, particularly in modern mass production, the small unit is not only inefficient, it cannot produce at all.” The book helped to launch the “big organisation boom” that dominated business thinking for the next 20 years. The second criticism is that Drucker’s enthusiasm for management by objectives helped to lead business down a dead end. His critics prefer to allow ideas, including ideas for long-term strategies, to bubble up from the bottom and middle of organisations rather than being imposed from on high. Thirdly, Drucker is criticised for being a maverick who has increasingly been left behind by the increasing rigour of his chosen field. There is no single area of academic management theory that he made his own.\u003c/p\u003e\u003cp\u003e\u003cstrong class=\"para-letter\"\u003eF\u003c/strong\u003e There is some truth in the first two arguments. Drucker never wrote anything as good as \u003ci\u003eThe Concept of the Corporation\u003c/i\u003e on entrepreneurial start-ups. Drucker’s work on management by objectives sits uneasily with his earlier and later writings on the importance of knowledge workers and self-directed teams. But the third argument is short-sighted and unfair because it ignores Drucker’s pioneering role in creating the modern profession of management. He produced one of the first systematic studies of a big company. He pioneered the idea that ideas can help galvanise companies. The biggest problem with evaluating Drucker’s influence is that so many of his ideas have passed into conventional wisdom. In other words, he is the victim of his own success. His writings on the importance of knowledge workers and empowerment may sound a little banal today. But they certainly weren’t banal when he first dreamed them up in the 1940s, or when they were first put into practice in the Anglo-Saxon world in the 1980s. Moreover, Drucker continued to produce new ideas up until his 90s. His work on the management of voluntary organisations remained at the cutting edge.\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"16:T1fee,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eQuestions 14–19\u003c/h2\u003e\u003cp\u003eReading Passage 2 has six paragraphs, \u003cb\u003eA–F\u003c/b\u003e. Choose the correct heading for each paragraph from the list of headings below. Write the correct number, \u003cb\u003ei–ix\u003c/b\u003e, in boxes 14–19 on your answer sheet.\u003c/p\u003e\u003ch3\u003eList of Headings\u003c/h3\u003e\u003cul\u003e\u003cli\u003ei. The popularity and impact of Drucker’s work\u003c/li\u003e\u003cli\u003eii. Finding fault with Drucker\u003c/li\u003e\u003cli\u003eiii. The impact of economic globalisation\u003c/li\u003e\u003cli\u003eiv. Government regulation of business\u003c/li\u003e\u003cli\u003ev. Early publications of Drucker’s\u003c/li\u003e\u003cli\u003evi. Drucker’s view of balanced management\u003c/li\u003e\u003cli\u003evii. Drucker’s rejection of big business\u003c/li\u003e\u003cli\u003eviii. An appreciation of the pros and cons of Drucker’s work\u003c/li\u003e\u003cli\u003eix. The changing role of the employee\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eParagraph A \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e14\u003c/strong\u003e\u003cselect name=\"practice_reading_2_14\" aria-label=\"Question 14\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"i\"\u003ei\u003c/option\u003e\u003coption value=\"ii\"\u003eii\u003c/option\u003e\u003coption value=\"iii\"\u003eiii\u003c/option\u003e\u003coption value=\"iv\"\u003eiv\u003c/option\u003e\u003coption value=\"v\"\u003ev\u003c/option\u003e\u003coption value=\"vi\"\u003evi\u003c/option\u003e\u003coption value=\"vii\"\u003evii\u003c/option\u003e\u003coption value=\"viii\"\u003eviii\u003c/option\u003e\u003coption value=\"ix\"\u003eix\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eParagraph B \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e15\u003c/strong\u003e\u003cselect name=\"practice_reading_2_15\" aria-label=\"Question 15\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"i\"\u003ei\u003c/option\u003e\u003coption value=\"ii\"\u003eii\u003c/option\u003e\u003coption value=\"iii\"\u003eiii\u003c/option\u003e\u003coption value=\"iv\"\u003eiv\u003c/option\u003e\u003coption value=\"v\"\u003ev\u003c/option\u003e\u003coption value=\"vi\"\u003evi\u003c/option\u003e\u003coption value=\"vii\"\u003evii\u003c/option\u003e\u003coption value=\"viii\"\u003eviii\u003c/option\u003e\u003coption value=\"ix\"\u003eix\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eParagraph C \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e16\u003c/strong\u003e\u003cselect name=\"practice_reading_2_16\" aria-label=\"Question 16\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"i\"\u003ei\u003c/option\u003e\u003coption value=\"ii\"\u003eii\u003c/option\u003e\u003coption value=\"iii\"\u003eiii\u003c/option\u003e\u003coption value=\"iv\"\u003eiv\u003c/option\u003e\u elts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e19\u003c/strong\u003e\u003cselect name=\"practice_reading_2_19\" aria-label=\"Question 19\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"i\"\u003ei\u003c/option\u003e\u003coption value=\"ii\"\u003eii\u003c/option\u003e\u003coption value=\"iii\"\u003eiii\u003c/option\u003e\u003coption value=\"iv\"\u003eiv\u003c/option\u003e\u003coption value=\"v\"\u003ev\u003c/option\u003e\u003coption value=\"vi\"\u003evi\u003c/option\u003e\u003coption value=\"vii\"\u003evii\u003c/option\u003e\u003coption value=\"viii\"\u003eviii\u003c/option\u003e\u003coption value=\"ix\"\u003eix\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003ch2\u003eQuestions 20–22\u003c/h2\u003e\u003cp\u003eDo the following statements agree with the claims of the writer in Reading Passage 2? In boxes 20–22 on your answer sheet, write\u003c/p\u003e\u003cp\u003eYES / NO / NOT GIVEN\u003c/p\u003e\u003cp\u003eDrucker believed that employees should enjoy the same status as employers in a company. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e20\u003c/strong\u003e\u003cselect name=\"practice_reading_2_20\" aria-label=\"Question 20\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"YES\"\u003eYES\u003c/option\u003e\u003coption value=\"NO\"\u003eNO\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eDrucker held that workers should not see themselves purely in an employment relationship and should develop their own intellectual resources. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e21\u003c/strong\u003e\u003cselect name=\"practice_reading_2_21\" aria-label=\"Question 21\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"YES\"\u003eYES\u003c/option\u003e\u003coption value=\"NO\"\u003eNO\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eDrucker’s work on management is out of date nowadays. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e22\u003c/strong\u003e\u003cselect name=\"practice_reading_2_22\" aria-label=\"Question 22\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"YES\"\u003eYES\u003c/option\u003e\u003coption value=\"NO\"\u003eNO\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003ch2\u003eQuestions 23–24\u003c/h2\u003e\u003cp\u003eChoose \u003cb\u003eTWO\u003c/b\u003e letters, \u003cb\u003eA–E\u003c/b\u003e. Write your answers in boxes 23 and 24 on your answer sheet.\u003c/p\u003e\u003cp\u003eWhich \u003cb\u003eTWO\u003c/b\u003e of the following are true of Drucker’s views?\u003c/p\u003e\u003cul\u003e\u003cli\u003eA. High-rank executives and workers should be put in balanced positions in management practice.\u003c/li\u003e\u003cli\u003eB. Young executives should be given chances to start from low-level jobs.\u003c/li\u003e\u003cli\u003eC. More emphasis should be laid on fostering the development of the union.\u003c/li\u003e\u003cli\u003eD. Management should facilitate workers with tools of self-appraisal instead of controlling them from the outside.\u003c/li\u003e\u003cli\u003eE. Leaders should go beyond the scope of management details and strategically establish goals.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e23\u003c/strong\u003e\u003cselect name=\"practice_reading_2_23\" aria-label=\"Question 23\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003e \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e24\u003c/strong\u003e\u003cselect name=\"practice_reading_2_24\" aria-label=\"Question 24\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003ch2\u003eQuestions 25–26\u003c/h2\u003e\u003cp\u003eChoose \u003cb\u003eTWO\u003c/b\u003e letters, \u003cb\u003eA–E\u003c/b\u003e. Write your answers in boxes 25 and 26 on your answer sheet.\u003c/p\u003e\u003cp\u003eWhich \u003cb\u003eTWO\u003c/b\u003e of the following are mentioned in the passage as criticisms of Drucker and his views?\u003c/p\u003e\u003cul\u003e\u003cli\u003eA. His work focuses too much on big organisations and ignores the small ones.\u003c/li\u003e\u003cli\u003eB. His writing is too broad and lacks precision and accuracy about the facts.\u003c/li\u003e\u003cli\u003eC. He put the source of objectives more on corporate executives than on average workers.\u003c/li\u003e\u003cli\u003eD. He acted much like a maverick and did not set up his own management groups.\u003c/li\u003e\u003cli\u003eE. He was overstating the case for knowledge workers when warning business to get prepared.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e25\u003c/strong\u003e\u003cselect name=\"practice_reading_2_25\" aria-label=\"Question 25\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003e \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e26\u003c/strong\u003e\u003cselect name=\"practice_reading_2_26\" aria-label=\"Question 26\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e"])</script><script>self.__next_f.push([1,"17:T1545,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eThe Art of Deception\u003c/h2\u003e\u003cdiv\u003e\u003cp\u003e\u003cem\u003eDo tiny changes of facial expression show whether someone is telling lies?\u003c/em\u003e\u003c/p\u003e\u003cp\u003eForty years ago, the research psychologist Dr Paul Ekman was addressing a group of young psychiatrists in training when he was asked a question, the answer to which has kept him busy ever since. Suppose, the group wanted to know, a particular patient swears they are telling the truth. They look and sound sincere. So here is the question: is there any way you can be sure they are telling the truth? Ekman did not know the answer then, but wanted to find out.\u003c/p\u003e\u003cp\u003eAs part of his research, he had already filmed a series of 12-minute interviews with psychiatric patients. In a subsequent conversation, one of the patients told him that she had lied to him. So, Ekman sat and looked at the film but saw nothing noteworthy. Then he slowed it down and looked again. Then he slowed it even further. And suddenly, there, across just two frames of the film, he saw it: an intense expression of extreme anguish. It lasted less than a 15th of a second, but once he had spotted the first expression, he soon found three more examples in that same interview. He termed his discovery ‘micro-expression’: very rapid intense demonstrations of emotion that the subject intended to be concealed.\u003c/p\u003e\u003cp\u003eOver the course of the next four decades, Ekman successfully demonstrated a proposition first suggested by Charles Darwin: that the ways in which we express rage, disgust, contempt, fear, surprise, happiness and sadness are universal. The facial muscles triggered by those seven basic emotions are, he has shown, essentially standard, regardless of language and culture, from the US to Japan and Brazil to Papua New Guinea. What is more, expressions of emotion are impossible to suppress and, particularly when we are lying, micro-expressions of powerfully felt emotions will inevitably flit across our face before we get the chance to stop them.\u003c/p\u003e\u003cp\u003eFortunately for liars, most people will fail to spot these fleeting signals of inner torment. Of the 15,000 Ekman has tested, only 50 people, whom he calls ‘naturals’, have been able to do it. But given a little more training, Ekman says, almost anyone can develop the skill. He should know; since these tests were completed in the mid-1980s and the first publication of his research, he has been called in by the FBI and CIA (among countless more law-enforcement and other agencies around the world), not just to solve cases, but to teach them how to use his technique for themselves. He has held workshops for defence and prosecution lawyers, health professionals, even jealous spouses, all of them wanting to know exactly when someone is not being 100 per cent candid.\u003c/p\u003e\u003cp\u003eMost recently, Ekman’s research has resulted in a new television series about the exploits of the fictional Dr Cal Lightman, a scientist who studies involuntary body language to discover not only if you are lying, but why you might have been motivated to do so. According to the publicity blurb, Lightman is a human lie detector, even more accurate than a polygraph test. Ekman concedes he was sceptical when the producer first approached him with the idea of turning his life’s work into a TV series, and initially would have stopped the project if he could. In particular, he was fearful that the show would exaggerate the effectiveness of his techniques and create the quite inaccurate impression among audiences that criminals could no longer hope to get away with lying. In the worst-case scenario, he was concerned about unfair convictions, that one day someone not properly trained in his techniques might be sitting on a jury and wrongly find someone guilty of a crime simply on the basis of a television programme.\u003c/p\u003e\u003cp\u003eIn the end though, he was won over because the series is unusual in several respects. It is the first time, as far as Ekman is aware, that a commercial TV drama has been based on the work of just one scientist. That scientist is also deeply involved in the project, talking through plot ideas and checking five successive drafts of each script to ensure details are correct. He was also impressed with the producer’s manifestly serious and well-intentioned reasons for making the programme. Now that the first series has been completed, he believes probably 80–90 per cent of the show is based on fact and that’s good enough for what it is, after all, a drama, not a documentary.\u003c/p\u003e\u003cp\u003eEkman, incidentally, professes to have been a terrible liar ever since he was a small boy and observes that the ability to detect a lie and the ability to lie successfully are completely unrelated. He has been asked by people running for high office if he could teach them to become more credible with the public but has always refused to use his skills in that way on ethical grounds. He also insists that there are various kinds of lies. A ‘true’ lie can be identified by having two essential characteristics: there must be a deliberate intent to mislead and there must be no notification that this is what is occurring. This means that an actor or a poker player isn’t a true liar. They are supposed to deceive you, it’s part of the game, and the same is true of flattery. He prefers to focus on the kinds of lies where the liar would be in grave trouble if they were found out, and where the target would feel properly aggrieved if they knew.\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"18:T2416,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eQuestions 27–31\u003c/h2\u003e\u003cp\u003eChoose the correct letter, \u003cb\u003eA\u003c/b\u003e, \u003cb\u003eB\u003c/b\u003e, \u003cb\u003eC\u003c/b\u003e or \u003cb\u003eD\u003c/b\u003e. Write your answers in boxes 27–31 on your answer sheet.\u003c/p\u003e\u003cdiv class=\"ielts-reading-question-item\"\u003e\u003cp\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e27\u003c/strong\u003e According to the writer, Ekman became interested in lying after a question from his\u003c/p\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_27\" aria-label=\"Question 27: A\" value=\"A\"\u003e A. peers.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_27\" aria-label=\"Question 27: B\" value=\"B\"\u003e B. patients.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_27\" aria-label=\"Question 27: C\" value=\"C\"\u003e C. students.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_27\" aria-label=\"Question 27: D\" value=\"D\"\u003e D. teachers.\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"ielts-reading-question-item\"\u003e\u003cp\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e28\u003c/strong\u003e The writer refers to the 12-minute interviews in order to\u003c/p\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_28\" aria-label=\"Question 28: A\" value=\"A\"\u003e A. illustrate how frequently patients lie.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_28\" aria-label=\"Question 28: B\" value=\"B\"\u003e B. describe the origins of Ekman’s theories.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_28\" aria-label=\"Question 28: C\" value=\"C\"\u003e C. compare Ekman’s research to previous studies.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_28\" aria-label=\"Question 28: D\" value=\"D\"\u003e D. show how patients’ behaviour is affected by filming.\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"ielts-reading-question-item\"\u003e\u003cp\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e29\u003c/strong\u003e What is the writer’s point in the third paragraph?\u003c/p\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_29\" aria-label=\"Question 29: A\" value=\"A\"\u003e A. Micro-expressions are common to all people.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_29\" aria-label=\"Question 29: B\" value=\"B\"\u003e B. Recent research has refuted an old idea.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_29\" aria-label=\"Question 29: C\" value=\"C\"\u003e C. With practice we can learn to control our micro-expressions.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_29\" aria-label=\"Question 29: D\" value=\"D\"\u003e D. Human society is too complex to allow for generalisations.\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"ielts-reading-question-item\"\u003e\u003cp\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e30\u003c/strong\u003e What are we told about Ekman’s conclusions from his tests?\u003c/p\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_30\" aria-label=\"Question 30: A\" value=\"A\"\u003e A. It’s natural for people to lie.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_30\" aria-label=\"Question 30: B\" value=\"B\"\u003e B. Few untrained people can detect lying.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_30\" aria-label=\"Question 30: C\" value=\"C\"\u003e C. Most liars suffer from periods of depression.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_30\" aria-label=\"Question 30: D\" value=\"D\"\u003e D. All of his subjects were trained to identify micro-expressions.\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"ielts-reading-question-item\"\u003e\u003cp\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e31\u003c/strong\u003e What point does the writer make about Ekman’s techniques in the fourth paragraph?\u003c/p\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_31\" aria-label=\"Question 31: A\" value=\"A\"\u003e A. They take a decade to teach.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_31\" aria-label=\"Question 31: B\" value=\"B\"\u003e B. They have been in great demand.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_31\" aria-label=\"Question 31: C\" value=\"C\"\u003e C. They have aroused the suspicions of some agencies.\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"radio\" name=\"practice_reading_2_31\" aria-label=\"Question 31: D\" value=\"D\"\u003e D. They can be used by a limited range of occupations.\u003c/label\u003e\u003c/div\u003e\u003ch2\u003eQuestions 32–36\u003c/h2\u003e\u003cp\u003eComplete the summary using the list of words, \u003cb\u003eA–I\u003c/b\u003e, below. Write the correct letter, \u003cb\u003eA–I\u003c/b\u003e, in boxes 32–36 on your answer sheet.\u003c/p\u003e\u003ch3\u003eThe television series based on Ekman’s work\u003c/h3\u003e\u003cdiv class=\"reading-word-bank\"\u003e\u003cp\u003e\u003cstrong\u003eA\u003c/strong\u003e consequences\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eB\u003c/strong\u003e crimes\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eC\u003c/strong\u003e false beliefs\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eD\u003c/strong\u003e motives\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eE\u003c/strong\u003e justice\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eF\u003c/strong\u003e accuracy\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eG\u003c/strong\u003e acting\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eH\u003c/strong\u003e research\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eI\u003c/strong\u003e ratings\u003c/p\u003e\u003c/div\u003e\u003cp\u003eA new TV series based on Ekman’s work features a hero named Lightman, who detects lies. Initially, Ekman was unenthusiastic about the TV project because he feared the possibility of encouraging viewers’ \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e32\u003c/strong\u003e\u003cselect name=\"practice_reading_2_32\" aria-label=\"Question 32\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003coption value=\"G\"\u003eG\u003c/option\u003e\u003coption value=\"H\"\u003eH\u003c/option\u003e\u003coption value=\"I\"\u003eI\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e. For example, he was worried that one day the programme could result in \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e33\u003c/strong\u003e\u003cselect name=\"practice_reading_2_33\" aria-label=\"Question 33\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003coption value=\"G\"\u003eG\u003c/option\u003e\u003coption value=\"H\"\u003eH\u003c/option\u003e\u003coption value=\"I\"\u003eI\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e not being carried out. Ultimately though, he has given the show his blessing because he is not aware of any other comparable programme based on a single person’s \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e34\u003c/strong\u003e\u003cselect name=\"practice_reading_2_34\" aria-label=\"Question 34\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003coption value=\"G\"\u003eG\u003c/option\u003e\u003coption value=\"H\"\u003eH\u003c/option\u003e\u003coption value=\"I\"\u003eI\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e. The \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e35\u003c/strong\u003e\u003cselect name=\"practice_reading_2_35\" aria-label=\"Question 35\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003coption value=\"G\"\u003eG\u003c/option\u003e\u003coption value=\"H\"\u003eH\u003c/option\u003e\u003coption value=\"I\"\u003eI\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e of the show’s producer have been another pleasant surprise considering the genre of the programme. Ekman is happy with the show’s overall \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e36\u003c/strong\u003e\u003cselect name=\"practice_reading_2_36\" aria-label=\"Question 36\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003coption value=\"G\"\u003eG\u003c/option\u003e\u003coption value=\"H\"\u003eH\u003c/option\u003e\u003coption value=\"I\"\u003eI\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e.\u003c/p\u003e\u003ch2\u003eQuestions 37–40\u003c/h2\u003e\u003cp\u003eDo the following statements agree with the claims of the writer in Reading Passage 3? In boxes 37–40 on your answer sheet, write\u003c/p\u003e\u003cp\u003eYES / NO / NOT GIVEN\u003c/p\u003e\u003cp\u003eEkman regrets the lies he told as a child. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e37\u003c/strong\u003e\u003cselect name=\"practice_reading_2_37\" aria-label=\"Question 37\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"YES\"\u003eYES\u003c/option\u003e\u003coption value=\"NO\"\u003eNO\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003ePeople who are good at lying tend to be good at detecting lies. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e38\u003c/strong\u003e\u003cselect name=\"practice_reading_2_38\" aria-label=\"Question 38\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"YES\"\u003eYES\u003c/option\u003e\u003coption value=\"NO\"\u003eNO\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eEkman has worked with poker players to help them lie more convincingly. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e39\u003c/strong\u003e\u003cselect name=\"practice_reading_2_39\" aria-label=\"Question 39\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"YES\"\u003eYES\u003c/option\u003e\u003coption value=\"NO\"\u003eNO\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eEkman is more interested in the types of lies with serious consequences. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e40\u003c/strong\u003e\u003cselect name=\"practice_reading_2_40\" aria-label=\"Question 40\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"YES\"\u003eYES\u003c/option\u003e\u003coption value=\"NO\"\u003eNO\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[[\"$\",\"$L12\",\"practice-reading-2\",{\"test\":{\"id\":\"practice-reading-2\",\"resource\":\"reading\",\"test\":2,\"title\":\"Reading · Test 2\",\"backUrl\":\"/?view=reading\",\"durationMinutes\":60,\"reviewLanguages\":[\"ru\",\"en\",\"uz\"],\"parts\":[{\"id\":1,\"passage\":\"$13\",\"questions\":\"$14\",\"fieldNames\":[\"practice_reading_2_1\",\"practice_reading_2_2\",\"practice_reading_2_3\",\"practice_reading_2_4\",\"practice_reading_2_5\",\"practice_reading_2_6\",\"practice_reading_2_7\",\"practice_reading_2_8\",\"practice_reading_2_9\",\"practice_reading_2_10\",\"practice_reading_2_11\",\"practice_reading_2_12\",\"practice_reading_2_13\"],\"fieldLabels\":{\"practice_reading_2_1\":\"Question 1\",\"practice_reading_2_2\":\"Question 2\",\"practice_reading_2_3\":\"Question 3\",\"practice_reading_2_4\":\"Question 4\",\"practice_reading_2_5\":\"Question 5\",\"practice_reading_2_6\":\"Question 6\",\"practice_reading_2_7\":\"Question 7\",\"practice_reading_2_8\":\"Question 8\",\"practice_reading_2_9\":\"Question 9\",\"practice_reading_2_10\":\"Question 10\",\"practice_reading_2_11\":\"Question 11\",\"practice_reading_2_12\":\"Question 12\",\"practice_reading_2_13\":\"Question 13\"}},{\"id\":2,\"passage\":\"$15\",\"questions\":\"$16\",\"fieldNames\":[\"practice_reading_2_14\",\"practice_reading_2_15\",\"practice_reading_2_16\",\"practice_reading_2_17\",\"practice_reading_2_18\",\"practice_reading_2_19\",\"practice_reading_2_20\",\"practice_reading_2_21\",\"practice_reading_2_22\",\"practice_reading_2_23\",\"practice_reading_2_24\",\"practice_reading_2_25\",\"practice_reading_2_26\"],\"fieldLabels\":{\"practice_reading_2_14\":\"Question 14\",\"practice_reading_2_15\":\"Question 15\",\"practice_reading_2_16\":\"Question 16\",\"practice_reading_2_17\":\"Question 17\",\"practice_reading_2_18\":\"Question 18\",\"practice_reading_2_19\":\"Question 19\",\"practice_reading_2_20\":\"Question 20\",\"practice_reading_2_21\":\"Questio
