push([1,"12:I[6791,[\"730\",\"static/chunks/44530001-70b0ed9ee979e3ff.js\",\"650\",\"static/chunks/650-4b07cc4a11134a91.js\",\"494\",\"static/chunks/494-4fdd69dd5bdf749e.js\",\"338\",\"static/chunks/338-c66e4775ae9d1d3b.js\",\"398\",\"static/chunks/app/practice/reading/%5Btest%5D/page-614589d7c43418f8.js\"],\"default\"]\n13:T17c3,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eThe development of plastics\u003c/h2\u003e\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eA\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eThe first plastics were developed as a \u003cspan class=\"vocab-word\"\u003esubstitute\u003c/span\u003e for natural rubber. Chemically, rubber is a polymer — a \u003cspan class=\"vocab-word\"\u003ecompound\u003c/span\u003e containing large molecules that are formed by the \u003cspan class=\"vocab-word\"\u003ebonding\u003c/span\u003e of many smaller, simpler units, repeated over and over again. The same bonding principle — polymerization — is the basis of the creation of a huge range of plastics by the chemical industry. The first plastic was developed as a result of a competition in the USA. In the 1860s, $10,000 was offered to anybody who could replace ivory — supplies of which were \u003cspan class=\"vocab-word\"\u003edeclining\u003c/span\u003e — with something equally good as a material for making billiard balls. The prize was won by John Wesley Hyatt, with a material called celluloid. Celluloid was made by \u003cspan class=\"vocab-word\"\u003edissolving\u003c/span\u003e \u003cspan class=\"vocab-word\"\u003ecellulose\u003c/span\u003e, a \u003cspan class=\"vocab-word\"\u003ecarbohydrate\u003c/span\u003e obtained from plants, in a solution of camphor dissolved in ethanol. This new material rapidly found other applications in the manufacture of everyday products such as knife handles and \u003cspan class=\"vocab-word\"\u003edetachable\u003c/span\u003e collars and cuffs. But perhaps the best-known celluloid product was photographic film, without which the film industry could never have taken off at the end of the 19th century. Celluloid can be repeatedly softened and reshaped by heat, and is known as a \u003cspan class=\"vocab-word\"\u003ethermoplastic\u003c/span\u003e.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eB\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eIn 1907, Leo Baekeland (1863–1944), a Belgian chemist working in the USA, invented a different kind of plastic, by causing phenol and formaldehyde to react together. Baekeland called it Bakelite, and it was the first of the thermosets — plastic that can be cast and moulded while hot, but cannot be softened by heat and reshaped once they have set. Bakelite was a good \u003cspan class=\"vocab-word\"\u003einsulator\u003c/span\u003e, and was \u003cspan class=\"vocab-word\"\u003eresistant\u003c/span\u003e to water and acid. With these properties it was soon being used in the manufacture of electrical switches as well as a variety of domestic items.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eC\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eAs the century went on, the range of newly developed plastic increased. Chemists began looking for other small molecules that could be strung together to make polymers. In the 1930s, chemists in Britain discovered that the gas ethylene would \u003cspan class=\"vocab-word\"\u003epolymerize\u003c/span\u003e under heat and pressure to form a thermoplastic they called polythene. Polypropylene followed in the 1950s. Both are used to make bottles, pipes and plastic bags. A small change in the starting material — replacing a hydrogen atom in ethylene with a chlorine atom — produced \u003cspan class=\"vocab-word\"\u003erigid\u003c/span\u003e PVC (polyvinyl chloride), a \u003cspan class=\"vocab-word\"\u003efireproof\u003c/span\u003e plastic suitable for drains and gutters. By adding certain chemicals, a soft form of PVC can be produced, suitable as a substitute for rubber in items such as waterproof clothing. A closely related plastic is Teflon or PTFE (polytetrafluoroethylene). It produces very little \u003cspan class=\"vocab-word\"\u003efriction\u003c/span\u003e, making it ideal for products such as non-stick frying pans.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eD\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003ePolystyrene, a hard, clear material like glass, was developed during the 1930s in Germany, and its applications included food containers and toys. Expanded polystyrene is rigid and is widely used in packaging and insulation. Polyurethane, developed in the same country, was commonly produced as a foam which was very useful in the production of insulating materials.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eE\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eIn the 1930s, the first of the man-made fibres was created — nylon. Its inventor was a chemist called Wallace Carothers (1896–1937), who worked for the Du Pont company in the USA. He found that under the right conditions two particular chemicals would form a polymer that could be pumped out through holes and then stretched to form long glossy threads that could be woven like silk. Its first use was to make parachutes for the US armed forces in World War II. In the postwar years, it completely replaced silk in the manufacture of stockings. Many other synthetic fibres joined nylon, including Orlon, Acrilan, and Terylene. Today most garments are made of a blend of natural fibres, such as cotton and wool, and man-made fibres that make fabrics easier to look after.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eF\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eDespite its enormous usefulness, plastic has its \u003cspan class=\"vocab-word\"\u003edrawbacks\u003c/span\u003e. In fact one of its great strengths — its \u003cspan class=\"vocab-word\"\u003eindestructibility\u003c/span\u003e — is its greatest disadvantage. Beaches all over the world, even on the remotest island, are \u003cspan class=\"vocab-word\"\u003elittered\u003c/span\u003e with plastic bottles that nothing can destroy. Nor is it very easy to recycle plastics, as different types of plastic are often found in the same items and call for different treatments.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eG\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003ePlastics can be made \u003cspan class=\"vocab-word\"\u003ebiodegradable\u003c/span\u003e by \u003cspan class=\"vocab-word\"\u003eincorporating\u003c/span\u003e into their structure a material such as starch, which is attacked by bacteria and causes the plastic to fall apart. Other materials can be incorporated that gradually decay in sunlight — although bottles made of such materials have to be stored in the dark, to ensure they do not \u003cspan class=\"vocab-word\"\u003edisintegrate\u003c/span\u003e before they have been used.\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"14:T151b,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eQuestions 1–7\u003c/h2\u003e\u003cp\u003eComplete the table below. Write NO MORE THAN TWO WORDS from the passage for each answer.\u003c/p\u003e\u003ch3\u003e\u003c/h3\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth scope=\"col\"\u003eName\u003c/th\u003e\u003cth scope=\"col\"\u003eDate\u003c/th\u003e\u003cth scope=\"col\"\u003eCountry of orig \u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003ch2\u003eQuestions 8–13\u003c/h2\u003e\u003cp\u003eChoose TRUE if the statement agrees with the information given in the text, FALSE if it contradicts it, or NOT GIVEN if there is no information on this.\u003c/p\u003e\u003cp\u003eTRUE / FALSE / NOT GIVEN\u003c/p\u003e\u003cp\u003eThe chemical structure of rubber is very different to that of plastics. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e8\u003c/strong\u003e\u003cselect name=\"practice_reading_8_8\" aria-label=\"Question 8\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eJohn Wesley Hyatt was an industrial chemist. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e9\u003c/strong\u003e\u003cselect name=\"practice_reading_8_9\" aria-label=\"Question 9\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eCelluloid and Bakelite react in the same way to heat. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e10\u003c/strong\u003e\u003cselect name=\"practice_reading_8_10\" aria-label=\"Question 10\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eIf an object is made of several plastics, these prove hard to break down and reuse. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e11\u003c/strong\u003e\u003cselect name=\"practice_reading_8_11\" aria-label=\"Question 11\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eAdding starch to plastic makes it more durable. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e12\u003c/strong\u003e\u003cselect name=\"practice_reading_8_12\" aria-label=\"Question 12\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eContainers which are designed to decompose need particular storage conditions. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e13\u003c/strong\u003e\u003cselect name=\"practice_reading_8_13\" aria-label=\"Question 13\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"TRUE\"\u003eTRUE\u003c/option\u003e\u003coption value=\"FALSE\"\u003eFALSE\u003c/option\u003e\u003coption value=\"NOT GIVEN\"\u003eNOT GIVEN\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e"])</script><script>self.__next_f.push([1,"15:T19f2,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eThe Constant Evolution of the Humble Tomato\u003c/h2\u003e\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eA\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eFamous for their taste, color and organic appearance, \u003cspan class=\"vocab-word\"\u003eheirloom\u003c/span\u003e tomatoes are favorites of gardeners and \u003cspan class=\"vocab-word\"\u003eadvocates\u003c/span\u003e of locally grown foods. The tomato \u003cspan class=\"vocab-word\"\u003eenthusiast\u003c/span\u003e might conclude that, given the immense varieties, heirlooms must have a more diverse and superior set of genes than the tomatoes available in grocery stores, those ordinary hybrid varieties such as cherry and plum. However, their seeming \u003cspan class=\"vocab-word\"\u003ediversity\u003c/span\u003e is only skin-deep — heirlooms are actually \u003cspan class=\"vocab-word\"\u003efeeble\u003c/span\u003e and \u003cspan class=\"vocab-word\"\u003einbred\u003c/span\u003e, the \u003cspan class=\"vocab-word\"\u003edefective\u003c/span\u003e product of breeding experiments that began hundreds of years ago, and exploded thanks to enthusiastic backyard gardeners. \"The irony of all this,\" says Steven Tanksley, a geneticist at Cornell University, \"is all that diversity of heirlooms can be accounted for by a handful of genes. There're probably no more than 10 mutant genes that create the diversity of heirlooms you see.\" But rather than simply proving that the myth about the heirloom's diversity is wrong, Tanksley's \u003cspan class=\"vocab-word\"\u003edeconstruction\u003c/span\u003e of the tomato genome, along with work by others, is showing how a small berry-like fruit from the Andes became one of the world's top crops.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eB\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eThe cultivated tomato is a member of the nightshade family that includes New World crops such as the potato, which spread around the globe after Christopher Columbus brought them back to Spain in the 15th century. But whereas scientists have uncovered a wealth of \u003cspan class=\"vocab-word\"\u003earchaeological\u003c/span\u003e evidence on early farming practices in the New World, the record is blank when it comes to the tomato. The modern tomato seems to have its origins in the Andes in South America, and may have been \u003cspan class=\"vocab-word\"\u003edomesticated\u003c/span\u003e in Vera Cruz, Mexico. \u003cspan class=\"vocab-word\"\u003ePrimitive\u003c/span\u003e varieties still grow throughout the Americas. Botanists call as many as 13 species 'tomatoes', and consider an additional four to be closely related.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eC\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eOne might assume that one of these known wild species became today's cultivated crop, but that's not the case: the Mother Tomato has never been found. The closest relative is the currant tomato which, based on genetic comparisons, split from today's tomato some 1.4 million years ago. So researchers like Tanksley have to work backward, crossing tomato varieties and species in order to understand how various genes influence shape and size. Once isolated, Tanksley later inserts those genes into other tomato varieties to make his case with a dramatic transformation.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eD\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eTanksley concludes from his analyses that in their effort to make bigger, tastier and faster-growing fruit, our ancestors ultimately exploited just 30 \u003cspan class=\"vocab-word\"\u003emutations\u003c/span\u003e out of the tomato's 35,000 genes. Most of these genes have only small effects on tomato size and shape, but recently Tanksley and his colleagues reported that they found a gene that increases fruit size by 50 percent. It was probably the most important event in domestication. The first written record of tomatoes — from Spain in the 1500s — confirms that this mutation, which enlarges tomatoes by producing compartments known as locules, existed back in the same yellow tomatoes that gave Italians the word pomodoro, or golden apple. Besides size, tomato farmers also selected for shape. To discover those genes, Esther van der Knaap, a Tanksley alumnus now at The Ohio State University, took a gene from one heirloom tomato and inserted it into a wild relative. She observed that, as a result, the tiny fruits became shaped like pears.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eE\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eThe selection of these traits has, however, affected the heirloom's \u003cspan class=\"vocab-word\"\u003ehardiness\u003c/span\u003e. They often suffer from \u003cspan class=\"vocab-word\"\u003einfections\u003c/span\u003e that cause the fruit to crack, split and otherwise rot quickly. Wild plants must continuously evolve to fend off such infections, points out Roger Chetelat of the Tomato Genetics Resource Center at the University of California. But in their quest for size, shape and flavor, humans have \u003cspan class=\"vocab-word\"\u003einadvertently\u003c/span\u003e eliminated defensive genes. As a result, most possess only a single disease-resistant gene. Chetelat elaborates that heirlooms' taste may have less to do with their genes than with the productivity of the plant and the growing environment. Any plant that produces only two fruits, as heirlooms sometimes do, is highly likely to produce juicier, sweeter and more flavorful fruit than varieties that produce 100, as commercial types do. In addition, heirlooms are sold ripened on the vine, a certain way to get tastier results than allowing them to mature on the shelf. This means breeders feel confident that getting germ-beating genes back into heirlooms won't harm the desirable aspects of the fruit. Modern breeding has \u003cspan class=\"vocab-word\"\u003eresuscitated\u003c/span\u003e grocery store tomatoes with an influx of wild genes: in the past 50 years, as many as 40 disease-resistant genes have been bred back into commercial crops.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eF\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eIn 1996 a tomato breeder and former Tanksley student named Doug Heath began a favorite project. After 12 years of traditional breeding with the help of molecular markers, he created a new multi-colored tomato less \u003cspan class=\"vocab-word\"\u003eprone\u003c/span\u003e to cracking and also \u003cspan class=\"vocab-word\"\u003eendowed\u003c/span\u003e with 12 disease-resistant genes. The original heirloom plant, Heath explains, had defective flowers, which is one reason why it produced only two fruits compared with the 30 he gets from his new variety. He claims he is also able to maintain a comparable flavor and sugar profile even on productive plants. The heirloom's defects are, after all, just an accident of a narrow breeding strategy left over from the very beginning of genetic modification.\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"16:T1735,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eQuestions 14–17\u003c/h2\u003e\u003cp\u003eReading Passage 2 has six paragraphs, A–F. Which paragraph contains the following information? Choose the correct letter in each answer box.\u003c/p\u003e\u003ch3\u003eList of options\u003c/h3\u003e\u003cul\u003e\u003cli\u003eA. A\u003c/li\u003e\u003cli\u003eB. B\u003c/li\u003e\u003cli\u003eC. C\u003c/li\u003e\u003cli\u003eD. D\u003c/li\u003e\u003cli\u003eE. E\u003c/li\u003e\u003cli\u003eF. F\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ean explanation of research aimed at restoring the health of the heirloom tomato \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e14\u003c/strong\u003e\u003cselect name=\"practice_reading_8_14\" aria-label=\"Question 14\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003ea reference to a false belief about the heirloom tomato \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e15\u003c/strong\u003e\u003cselect name=\"practice_reading_8_15\" aria-label=\"Question 15\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003ea description of the flavour of the heirloom tomato \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e16\u003c/strong\u003e\u003cselect name=\"practice_reading_8_16\" aria-label=\"Question 16\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003ea reference to a single gene that significantly improves the cultivation of tomatoes \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e17\u003c/strong\u003e\u003cselect name=\"practice_reading_8_17\" aria-label=\"Question 17\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003coption value=\"E\"\u003eE\u003c/option\u003e\u003coption value=\"F\"\u003eF\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003ch2\u003eQuestions 18–21\u003c/h2\u003e\u003cp\u003eMatch each statement with the correct researcher. Choose the correct letter in each answer box.\u003cbr\u003e\u003cb\u003eA\u003c/b\u003e Steven Tanksley   \u003cb\u003eB\u003c/b\u003e Esther van der Knaap   \u003cb\u003eC\u003c/b\u003e Roger Chetelat   \u003cb\u003eD\u003c/b\u003e Doug Heath\u003c/p\u003e\u003ch3\u003eList of options\u003c/h3\u003e\u003cul\u003e\u003cli\u003eA. A – Tanksley\u003c/li\u003e\u003cli\u003eB. B – van der Knaap\u003c/li\u003e\u003cli\u003eC. C – Chetelat\u003c/li\u003e\u003cli\u003eD. D – Heath\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThe transplanting of certain genes into tomatoes can change their shape. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e18\u003c/strong\u003e\u003cselect name=\"practice_reading_8_18\" aria-label=\"Question 18\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eThe flavour of the heirloom tomato is largely dependent on actual yield and cultivation. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e19\u003c/strong\u003e\u003cselect name=\"practice_reading_8_19\" aria-label=\"Question 19\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eA new type of tomato can be produced that is stronger than the original heirloom tomato, yet equally sweet and flavoursome. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e20\u003c/strong\u003e\u003cselect name=\"practice_reading_8_20\" aria-label=\"Question 20\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003cp\u003eThe wide variety of heirloom tomatoes is due to only a small number of genes. \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e21\u003c/strong\u003e\u003cselect name=\"practice_reading_8_21\" aria-label=\"Question 21\"\u003e\u003coption value=\"\"\u003eChoose an answer\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003c/span\u003e \u003c/p\u003e\u003ch2\u003eQuestions 22–26\u003c/h2\u003e\u003cp\u003eComplete the sentences below. Choose ONE WORD ONLY from the passage for each answer.\u003c/p\u003e\u003cp\u003eThere is little information on the origin of the tomato despite the existence of \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e22\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_8_22\" aria-label=\"Question 22\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e data on the growing of other New World crops.\u003c/p\u003e\u003cp\u003eAlthough it is uncertain, the tomato is thought to have first grown in the \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e23\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_8_23\" aria-label=\"Question 23\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e .\u003c/p\u003e\u003cp\u003eIn regard to genetic similarities, the \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e24\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_8_24\" aria-label=\"Question 24\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e tomato is the nearest to the earliest type of tomato.\u003c/p\u003e\u003cp\u003eA genetic \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e25\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_8_25\" aria-label=\"Question 25\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e which is evident in pomodoro produced larger tomatoes.\u003c/p\u003e\u003cp\u003e \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ielts-reading-question-number\"\u003e26\u003c/strong\u003e\u003cinput type=\"text\" name=\"practice_reading_8_26\" aria-label=\"Question 26\" autocomplete=\"off\" placeholder=\"Answer\"\u003e\u003c/span\u003e are a problem for heirloom tomatoes because they frequently lead to damage and deterioration.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"17:T1d74,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eResearch into the effects of different teaching styles\u003c/h2\u003e\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eA\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003ePrior to 1960, most \u003cspan class=\"vocab-word\"\u003einquiries\u003c/span\u003e into pupils' learning skills explored the relationship between factors such as children's social background, personality or measured intelligence and their achievement in various school subjects. Studies of teachers were largely a quest for \u003cspan class=\"vocab-word\"\u003ecriteria\u003c/span\u003e of effectiveness, and numerous investigations sought links between personality or attitude and 'success' at teaching. By 1950, Domas and Tiedeman were able to survey 672 such studies of teacher effectiveness. Yet there was widespread disappointment with such research, partly because so little of value seemed to emerge. First of all, there was little agreement about what \u003cspan class=\"vocab-word\"\u003econstituted\u003c/span\u003e 'good' teaching or who the good teachers were. Secondly, there were numerous conflicting and \u003cspan class=\"vocab-word\"\u003econtradictory\u003c/span\u003e findings. No sooner had one investigator found a relationship which appeared to be significant, than another discovered the opposite effect.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eB\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eFor example, in 1945, two American researchers, Rostker and Rolfe, both using standardized testing techniques and broad samples of teachers, reached exactly opposite conclusions. Rostker concluded that the intelligence of the teacher is the most important single factor \u003cspan class=\"vocab-word\"\u003econditioning\u003c/span\u003e teaching ability, and that there is no significant relationship between personality and teaching ability. Rolfe, however, found no \u003cspan class=\"vocab-word\"\u003ecorrelation\u003c/span\u003e between intelligence and teaching efficiency: he claimed that the teacher's personality was what produced good teaching. Another American writer, Barr (1961), summarized a massive amount of American research and underlined the chaos in the research literature on effectiveness: \"Some teachers were preferred by administrators, some were liked by the pupils, and some taught in classes where there were substantial pupil gains, and generally speaking these were not the same teachers.\"\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eC\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eOne of the earliest pieces of research dates from 1912, when Stevens made 100 random observations of lessons in a variety of subject areas, in order to analyze the number and nature of questions being asked by teachers. Stevens's overall total was 64% teacher talk and 36% pupil talk, figures which are remarkably similar to a number of findings half a century later.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eD\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eFor many years in the first half of the 20th century, so-called 'formal' teaching was the norm. Teachers taught their classes as a whole group, gave out information, asked questions which \u003cspan class=\"vocab-word\"\u003epredominantly\u003c/span\u003e required factual recall, and frequently set a common written task for the children to complete in a \u003cspan class=\"vocab-word\"\u003eprescribed\u003c/span\u003e period of time. It was hardly surprising, therefore, that one focus of classroom interaction research in the decades following Stevens's inquiry was on the phenomenon of '\u003cspan class=\"vocab-word\"\u003eattentiveness\u003c/span\u003e'. A number of studies in the 1920s and 1930s, by Morrison and others, sought relationships between the degree of attention being paid by children and the amount they subsequently appeared to have learnt. Such research was usually based on observing teachers at work, a technique which was also employed extensively by United States administrators in the 1920s and 1930s, in order to assess teachers' competence and allocate merit payments to so-called 'superior' teachers.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eE\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eAs the 1930s came to an end, it was partly the emergence of \u003cspan class=\"vocab-word\"\u003etotalitarian\u003c/span\u003e regimes in Europe which led to a shift in interest in the United States away from attentiveness, with its emphasis on the authority of the teacher, and towards a \u003cspan class=\"vocab-word\"\u003escrutiny\u003c/span\u003e of \u003cspan class=\"vocab-word\"\u003eauthoritarianism\u003c/span\u003e itself. A number of people began to feel that if dictatorship were to be avoided, children must learn in school how to handle democracy. Several investigators examined the processes taking place within small discussion groups, and tried to establish superiority for discussion groups over lecture classes, but with conflicting results. The movement towards what was becoming known as child-centred education was gathering \u003cspan class=\"vocab-word\"\u003emomentum\u003c/span\u003e, and as interest in child development increased, investigators began to discover the usefulness of direct observation and the \u003cspan class=\"vocab-word\"\u003ecategorization\u003c/span\u003e of child behavior.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eF\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eThis was when systematic observation of teacher-pupil interaction began in earnest. Anderson (1939) studied what he called '\u003cspan class=\"vocab-word\"\u003edomination\u003c/span\u003e' and '\u003cspan class=\"vocab-word\"\u003eintegration\u003c/span\u003e' amongst kindergarten children. Dominative acts by children included blaming and snatching toys, and such acts by teachers included restricting children's activities; while children's integrative acts included sharing facilities and playing harmoniously, and those of teachers included expanding opportunities for self-direction and co-operation. Anderson then attempted to measure what is now commonly called 'classroom climate'.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eG\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eLewin, Lippitt and White (1939 and 1943) studied the effects of different teaching styles. They arranged for three groups of five boys each to be taught in very different ways: these were labelled 'authoritarian', 'democratic' and '\u003cspan class=\"vocab-word\"\u003elaissez-faire\u003c/span\u003e'. The first two of these were similar to Anderson's concept of dominative and integrative teachers.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eH\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003eBeginning with Withall's work in 1949, there was much greater interest in interaction within the classroom. Withall used the term 'social-emotional climate' to describe the emotional tone created as a result of face-to-face interaction in groups, and, like many who followed him, concentrated his analysis of this climate on the study of teachers' verbal behavior. Withall also made efforts towards increasing the \u003cspan class=\"vocab-word\"\u003ereliability\u003c/span\u003e of analyses, and this important \u003cspan class=\"vocab-word\"\u003epioneering\u003c/span\u003e work in the development of classroom observation \u003cspan class=\"vocab-word\"\u003emethodology\u003c/span\u003e was followed by many others during the 1950s.\u003c/p\u003e\u003c/div\u003e\n\n\u003cdiv class=\"passage-section\"\u003e\u003ch3\u003e\u003cspan class=\"section-tag\"\u003eI\u003c/span\u003e\u003c/h3\u003e\n\u003cp class=\"passage-text\"\u003ePartly because of the disappointing results of the teacher-effectiveness research, and partly because of the general \u003cspan class=\"vocab-word\"\u003eneglect\u003c/span\u003e in earlier work of the variables of actual classroom behavior, the decade 1960–70 produced a large number of studies of classroom processes, based on observation of teachers at work.\u003c/p\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"18:T2088,"])</script><script>self.__next_f.push([1,"\u003ch2\u003eQuestions 27–33\u003c/h2\u003e\u003cp\u003eRead the list of words (A–J) below and complete the gaps using the correct word. Tap a word, then tap the blank.\u003c/p\u003e\u003ch3\u003eList of options\u003c/h3\u003e\u003cul\u003e\u003cli\u003eA. A – authoritarianism\u003c/li\u003e\u003cli\u003eB. B – competence\u003c/li\u003e\u003cli\u003eC. C – emergence\u003c/li\u003e\u003cli\u003eD. D – learning\u003c/li\u003e\u003cli\u003eE. E – observation\u003c/li\u003e\u003cli\u003eF. F – personality\u003c/li\u003e\u003cli\u003eG. G – processes\u003c/li\u003e\u003cli\u003eH. H – reliability\u003c/li\u003e\u003cli\u003eI. I – training\u003c/li\u003e\u003cli\u003eJ. J – verbal behavior\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e \u003cspan class=\"ielts-reading-question-item\"\u003e\u003cstrong class=\"ie  известным продуктом из целлулоида была «фотопленка» — это непосредственно завершает колонку «Общее использование» таблицы.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"0bd2731285a446c50e9cdfb51419947af6357f45774c3be1342c8f9b1ff7592a\"}}},\"2\":{\"part\":1,\"en\":\"Paragraph B states 'Baekeland called it Bakelite' — this is the name of the plastic invented in 1907.\",\"uz\":\"B bandida 'Baekeland uni Bakelite deb atadi' deyilgan — bu 1907-yilda ixtiro qilingan plastik moddaning nomi.\",\"quotes\":[],\"ru\":\"В пункте Б говорится: «Бекеланд назвал его бакелитом» — так называется пластик, изобретенный в 1907 году.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"a2903aabf35996377cc0dfd422769b51398b01104db44116aa68852deb2eab41\"}}},\"3\":{\"part\":1,\"en\":\"Paragraph B says Bakelite 'was soon being used in the manufacture of electrical switches' due to its insulating properties.\",\"uz\":\"B bandida Bakelite o'zining izolyatsiya xususiyati tufayli 'elektr o'tkazgichlarni (switches) ishlab chiqarishda' ishlatilgani aytilgan.\",\"quotes\":[],\"ru\":\"В пункте B говорится, что бакелит «вскоре стал использоваться в производстве электрических выключателей» из-за его изолирующих свойств.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"090bfed93cfda49498dbe1c5e587c3ff567cd787c810e832dc97bc6ade1044c4\"}}},\"4\":{\"part\":1,\"en\":\"Paragraph C states 'in the 1930s, chemists in Britain discovered' how to make polythene — so the country of origin is Britain.\",\"uz\":\"C bandida '1930-yillarda Britaniyalik kimyogarlar' polietilenni qanday yasashni kashf etganlari aytilgan — demak, kelib chiqish davlati Britaniya.\",\"quotes\":[],\"ru\":\"В пункте C говорится, что «в 1930-х годах химики в Британии открыли», как производить полиэтилен, поэтому страной-производителем является Великобритания.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"fa0db638ed4a06a22aa0f1254dfe008f381b5af0a11e805a58224cf5aa563462\"}}},\"5\":{\"part\":1,\"en\":\"The passage describes PVC as 'a fireproof plastic suitable for drains and gutters' — fireproof is the missing property.\",\"uz\":\"Matnda PVC haqida 'yong'inga chidamli (fireproof), drenaj quvurlari uchun mos plastik' deyilgan — fireproof yetishmayotgan xususiyat.\",\"quotes\":[],\"ru\":\"В этом отрывке ПВХ описывается как «огнестойкий пластик, подходящий для водостоков и желобов» — огнестойкость — это недостающее свойство.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"896b7c406be5b13fd990db85f6b8ee7aa7bd055c9f6e69b3869331dad50e9631\"}}},\"6\":{\"part\":1,\"en\":\"Paragraph D opens with 'Polystyrene, a hard, clear material like glass' — so polystyrene resembles glass.\",\"uz\":\"D bandi 'Polistirol, shisha kabi qattiq va tiniq material' so'zlari bilan boshlanadi — demak, polistirol shishaga o'xshaydi (resembles glass).\",\"quotes\":[],\"ru\":\"Параграф D начинается со слов «Полистирол, твердый, прозрачный материал, похожий на стекло» — поэтому полистирол напоминает стекло.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"f9652ffebde54b9fa223e31d88726818fb4a7ec8a0269cf66f730b1e8706cc11\"}}},\"7\":{\"part\":1,\"en\":\"Paragraph D says polyurethane 'was commonly produced as a foam' — foam is the correct answer.\",\"uz\":\"D bandida poliuretan 'odatda ko'pik (foam) shaklida ishlab chiqarilgan' deyilgan — to'g'ri javob foam.\",\"quotes\":[],\"ru\":\"В пункте D говорится, что полиуретан «обычно производился в виде пены» — правильный ответ — пена.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"4aaffa01b480648ea0097ebfe02d0208720eb8cbf9a1b4a7385d3cafae4000c7\"}}},\"8\":{\"part\":1,\"en\":\"FALSE. Paragraph A explains rubber IS a polymer made of repeating bonded units — the same principle (polymerization) underlies plastics too, so the structures are related, not 'very different'.\",\"uz\":\"FALSE (Noto'g'ri). A bandida tushuntirilishicha, kauchuk AYNAN polimer bo'lib, takrorlanuvchi birikkan birliklardan iborat — xuddi shu tamoyil (polimerizatsiya) plastmassalar uchun ham asos bo'ladi. Demak, tuzilishlar bir-biriga juda farqli emas, aksincha o'xshash.\",\"quotes\":[],\"ru\":\"FALSE. В параграфе А объясняется, что резина — это полимер, состоящий из повторяющихся связанных звеньев — тот же принцип (полимеризация) лежит в основе пластиков, поэтому структуры родственные, а не «очень разные».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"096a7c58c6c12aafedb222caee4ead96c2f6f7954c447cfd21219e6fd4d751d9\"}}},\"9\":{\"part\":1,\"en\":\"NOT GIVEN. The passage only says Hyatt won the prize with celluloid — it never states his profession or whether he was an industrial chemist.\",\"uz\":\"NOT GIVEN (Berilmagan). Matnda faqat Hyatt sellyuloid bilan mukofotni yutgani aytilgan — uning kasbi yoki sanoat kimyogari bo'lgan-bo'lmaganligi haqida hech narsa aytilmagan.\",\"quotes\":[],\"ru\":\"NOT GIVEN. В отрывке говорится только о том, что Хаятт выиграл приз с целлулоидом, но нигде не говорится о его профессии и о том, был ли он промышленным химиком.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"f50b6f2e1b9aa0905898c8e732d900a3ad53e311c970393f5045a3fced77903f\"}}},\"10\":{\"part\":1,\"en\":\"FALSE. Celluloid is a thermoplastic (can be softened and reshaped by heat repeatedly), while Bakelite is a thermoset (cannot be softened once set) — they react oppositely to heat.\",\"uz\":\"FALSE (Noto'g'ri). Sellyuloid termoplastik (issiqlik bilan qayta-qayta yumshatilishi mumkin), Bakelite esa termoset (qattiqlashgandan keyin yumshamaydi) — ular issiqlikka qarama-qarshi ta'sir ko'rsatadi.\",\"quotes\":[],\"ru\":\"FALSE. Целлулоид — это термопластик (может неоднократно размягчаться и изменять форму под воздействием тепла), а бакелит — это термореактивный материал (не может быть размягчен после отверждения) — они противоположно реагируют на тепло.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"828392c5668a982cfabec00c50a9bde9014f5ebbb644f05cf2c91ff35c758a40\"}}},\"11\":{\"part\":1,\"en\":\"TRUE. Paragraph F states recycling is difficult 'as different types of plastic are often found in the same items and call for different treatments' — exactly matching the statement.\",\"uz\":\"TRUE (To'g'ri). F bandida aytilishicha, qayta ishlash qiyin, chunki 'bir xil buyumda turli xil plastik turlari uchraydi va ularning har biri boshqacha ishlov talab qiladi' — bu bayonotga to'liq mos keladi.\",\"quotes\":[],\"ru\":\"TRUE. В пункте F говорится, что переработка сложна, «поскольку разные типы пластика часто встречаются в одних и тех же предметах и ​​требуют разной обработки», что в точности соответствует этому утверждению.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"95dc0cc92950fbadb68809a9b54013eeaec8a0488a8dc0ee2f7128f3dfe900d0\"}}},\"12\":{\"part\":1,\"en\":\"FALSE. Paragraph G says starch makes plastic biodegradable because bacteria attack it and cause it to 'fall apart' — this is the opposite of making it 'more durable'.\",\"uz\":\"FALSE (Noto'g'ri). G bandida kraxmal plastikni biologik chiriydigan qiladi, chunki bakteriyalar unga ta'sir qilib, uni 'parchalab yuboradi' deyilgan — bu 'chidamliroq qilish'ga teskari holat.\",\"quotes\":[],\"ru\":\"FALSE. В пункте G говорится, что крахмал делает пластик биоразлагаемым, потому что бактерии атакуют его и заставляют его «разваливаться» — это противоположность тому, чтобы сделать его «более прочным».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"a7cc4dd3cf0a8a54065c924506e3677f9bbc92377e067c04862c14081730c296\"}}},\"13\":{\"part\":1,\"en\":\"TRUE. The passage explicitly says light-decaying plastic bottles 'have to be stored in the dark' to prevent early disintegration — this matches 'particular storage conditions'.\",\"uz\":\"TRUE (To'g'ri). Matnda aniq aytilgan: yorug'lik ta'sirida chiriydigan plastik shishalar erta parchalanib ketmasligi uchun 'qorong'ida saqlanishi kerak' — bu 'maxsus saqlash sharoitlari'ga mos keladi.\",\"quotes\":[],\"ru\":\"TRUE. В отрывке прямо говорится, что разлагающиеся под действием света пластиковые бутылки «должны храниться в темноте», чтобы предотвратить преждевременное разложение — это соответствует «особым условиям хранения».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"94a0272b2a103f245c28f013ee377357f188b8db81746547f70b305126655a84\"}}},\"14\":{\"part\":2,\"en\":\"Paragraph F describes Doug Heath's 12-year breeding project that produced disease-resistant tomatoes — this is the 'research aimed at restoring health'.\",\"uz\":\"F bandida Doug Heath ning 12 yillik seleksiya loyihasi tasvirlangan, u kasalliklarga chidamli pomidorlar yaratdi — bu 'sog'ligini tiklashga qaratilgan tadqiqot'.\",\"quotes\":[],\"ru\":\"В параграфе F описан 12-летний селекционный проект Дуга Хита, в результате которого были выведены устойчивые к болезням помидоры — это «исследование, направленное на восстановление здоровья».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"be51b52e091de445560e693094452bb18c98c880c1597d0f539e006121dcc7ef\"}}},\"15\":{\"part\":2,\"en\":\"Paragraph A introduces and then debunks the 'myth' that heirlooms have superior diversity/genes — this is the 'false belief' referred to.\",\"uz\":\"A bandi meros pomidorlarning gen xilma-xilligi ustunroq degan 'afsona'ni keltiradi va keyin uni rad etadi — bu 'noto'g'ri ishonch'ga ishora.\",\"quotes\":[],\"ru\":\"Параграф А представляет, а затем развенчивает «миф» о том, что семейные реликвии обладают превосходным разнообразием/генами – это и есть «ложное убеждение», о котором идет речь.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"4169146081157ef04a0def5198ebf12c52f0a62874c9c5ea33ab0ef1ec733541\"}}},\"16\":{\"part\":2,\"en\":\"Paragraph E discusses how heirloom flavour depends on plant productivity (fewer fruits = more flavour) rather than genes — this describes the flavour.\",\"uz\":\"E bandida meros pomidor mazasi genlarga emas, balki o'simlik unumdorligiga bog'liqligi tushuntirilgan (kamroq meva = ko'proq mazali) — bu mazani tasvirlaydi.\",\"quotes\":[],\"ru\":\"В параграфе E обсуждается, как вкус семейной реликвии зависит от продуктивности растений (меньше плодов = больше вкуса), а не от генов — это описывает вкус.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"03c67c6094567df70dbebef7b76a909d75467f385bc4e2d787bb5fb00cf56838\"}}},\"17\":{\"part\":2,\"en\":\"Paragraph D mentions the gene that 'increases fruit size by 50 percent' — 'probably the most important event in domestication', matching 'a single gene that significantly improves cultivation'.\",\"uz\":\"D bandida 'mevani 50 foizga kattalashtiradigan' gen tilga olinadi — bu 'domestikatsiyadagi eng muhim voqea', ya'ni 'yetishtirishni sezilarli darajada yaxshilaydigan bitta gen'ga mos.\",\"quotes\":[],\"ru\":\"В параграфе D упоминается ген, который «увеличивает размер плодов на 50 процентов» — «вероятно, самое важное событие в процессе одомашнивания», соответствующий «единственному гену, который значительно улучшает выращивание».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"90f7e06d109b4c4110d9717f7aedefdced492026a634fb36cd87a80eea792fcc\"}}},\"18\":{\"part\":2,\"en\":\"Paragraph D: Esther van der Knaap (B) 'took a gene from one heirloom tomato and inserted it into a wild relative' and the fruit 'became shaped like pears' — a clear shape change from gene transplant.\",\"uz\":\"D bandida: Esther van der Knaap (B) 'bir meros pomidordan gen olib, uni yovvoyi qarindosh pomidorga ko'chirdi' va meva 'noksimon shaklga aylandi' — gen ko'chirish orqali shaklning aniq o'zgarishi.\",\"quotes\":[],\"ru\":\"Параграф D: Эстер ван дер Кнаап (Б) «взяла ген из одного семейного помидора и вставила его в дикого родственника», и плод «принял форму груши» — явное изменение формы в результате трансплантации гена.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"97ddd67390da51cebd6efaf23a481c2df98b5197b3c2489945383091971064f6\"}}},\"19\":{\"part\":2,\"en\":\"Paragraph E: Roger Chetelat (C) explains heirlooms' taste 'may have less to do with genes than with the productivity of the plant and the growing environment' — directly matches the statement about yield/cultivation.\",\"uz\":\"E bandida: Roger Chetelat (C) meros pomidorlarning mazasi 'genlarga emas, balki o'simlik unumdorligi va o'stirish muhitiga' bog'liq ekanligini tushuntiradi — bu hosildorlik/yetishtirish haqidagi bayonotga to'g'ridan-to'g'ri mos keladi.\",\"quotes\":[],\"ru\":\"Параграф E: Роджер Четелат (C) объясняет, что вкус семейных реликвий «может иметь меньшее отношение к генам, чем к продуктивности растения и среде выращивания» — что напрямую соответствует утверждению об урожайности/выращивании.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"69278777be7e48f7c681912c62c00918138e86fd40451727f5ac042953bb3117\"}}},\"20\":{\"part\":2,\"en\":\"Paragraph F: Doug Heath (D) created a tomato 'less prone to cracking' with 12 disease-resistant genes, while claiming to 'maintain a comparable flavor and sugar profile' — stronger AND equally tasty.\",\"uz\":\"F bandida: Doug Heath (D) yorilishga kamroq moyil, 12 ta kasallikka chidamli genga ega pomidor yaratdi, shu bilan birga 'mos keladigan ta'm va shakar darajasini saqlab qolish'ni da'vo qildi — kuchliroq HAM xuddi shunday mazali.\",\"quotes\":[],\"ru\":\"Параграф F: Дуг Хит (демократ) создал помидор, «менее склонный к растрескиванию», с 12 генами устойчивости к болезням, утверждая при этом, что он «сохраняет сопоставимый вкус и профиль сахара» — более сильный И одинаково вкусный.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"f6fb74c763c60a2ea7996e87cab6b0b1ac22e42192e310a128afcab7e3c555b7\"}}},\"21\":{\"part\":2,\"en\":\"Paragraph A: Steven Tanksley (A) states 'There're probably no more than 10 mutant genes that create the diversity of heirlooms you see' — directly matches the statement.\",\"uz\":\"A bandida: Steven Tanksley (A) 'ko'rinadigan xilma-xillikni yaratadigan 10 tadan ko'p bo'lmagan mutant gen bor, ehtimol' deydi — bu bayonotga to'g'ridan-to'g'ri mos keladi.\",\"quotes\":[],\"ru\":\"Параграф А: Стивен Танксли (А) утверждает: «Вероятно, существует не более 10 мутантных генов, которые создают разнообразие семейных реликвий, которые вы видите» — это прямо соответствует этому утверждению.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"4e037860ea8a4178872086f6351efb7bf3d921b145070afbba6311583dd932d1\"}}},\"22\":{\"part\":2,\"en\":\"The text says 'whereas scientists have uncovered a wealth of archaeological evidence on early farming practices... the record is blank when it comes to the tomato' — ARCHAEOLOGICAL is the missing word.\",\"uz\":\"Matnda 'olimlar boshqa ekinlar bo'yicha ko'p arxeologik dalillarni topgan bo'lsalar-da... pomidor bo'yicha bunday yozuvlar yo'q' deyilgan — yetishmayotgan so'z ARCHAEOLOGICAL (arxeologik).\",\"quotes\":[],\"ru\":\"В тексте говорится: «Хотя ученые обнаружили множество археологических свидетельств о ранних методах ведения сельского хозяйства… когда дело касается помидоров, данные пусты» — АРХЕОЛОГИЧЕСКИЙ – недостающее слово.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"4a7404ccdbf7972d6e780167a8c442f52381721579ebdd65cd0e5ebcb6e33a22\"}}},\"23\":{\"part\":2,\"en\":\"The text states 'the modern tomato seems to have its origins in the Andes in South America' — ANDES is the missing word.\",\"uz\":\"Matnda 'zamonaviy pomidor Janubiy Amerikadagi Andlardan kelib chiqgan ko'rinadi' deyilgan — yetishmayotgan so'z ANDES.\",\"quotes\":[],\"ru\":\"В тексте говорится: «Современные помидоры, по-видимому, происходят из Анд в Южной Америке» — пропущенное слово «АНДЫ».\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"7aaebd070bfc6bb2e5b50b272d7ce61f2f18043a6dc8c75a61c766f501a9c8cb\"}}},\"24\":{\"part\":2,\"en\":\"The text says 'the closest relative is the currant tomato which... split from today's tomato some 1.4 million years ago' — CURRANT is the missing word.\",\"uz\":\"Matnda 'eng yaqin qarindosh — currant pomidori, u zamonaviy pomidordan 1.4 million yil oldin ajralgan' deyilgan — yetishmayotgan so'z CURRANT.\",\"quotes\":[],\"ru\":\"В тексте говорится: «Ближайшим родственником является томат смородины, который... отделился от сегодняшнего помидора около 1,4 миллиона лет назад» — СМОРОДИНА — пропущенное слово.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"22d574c6e05c2cfec39eda7d417c52ca4915ac8444e9899c8c9b64116989d28b\"}}},\"25\":{\"part\":2,\"en\":\"The text says 'this mutation, which enlarges tomatoes by producing compartments known as locules' — MUTATION is the missing word.\",\"uz\":\"Matnda 'locules deb ataladigan bo'shliqlar hosil qilib pomidorlarni kattalashtiradigan mutatsiya' deyilgan — yetishmayotgan so'z MUTATION.\",\"quotes\":[],\"ru\":\"В тексте говорится: «эта мутация, которая увеличивает помидоры за счет образования отсеков, известных как гнезда» — МУТАЦИЯ — пропущенное слово.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"182b29953620d6dc91ca409e99acd723ec8e37ee5d209707e9e6bc168a018844\"}}},\"26\":{\"part\":2,\"en\":\"The text says heirlooms 'often suffer from infections that cause the fruit to crack, split and otherwise rot quickly' — INFECTIONS is the missing word.\",\"uz\":\"Matnda meros pomidorlar 'ko'pincha mevani yorilishi, bo'linishi va tezda chirishiga olib keladigan infeksiyalardan aziyat chekadi' deyilgan — yetishmayotgan so'z INFECTIONS.\",\"quotes\":[],\"ru\":\"В тексте говорится, что семейные реликвии «часто страдают от инфекций, из-за которых плоды трескаются, раскалываются и быстро гниют» — ИНФЕКЦИИ — пропущенное слово.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"ce0e58d2bed618649cae07561a9f0dad8e09f4ba9e835dc7c8cd6670e914431b\"}}},\"27\":{\"part\":3,\"en\":\"Paragraph D: studies 'sought relationships between the degree of attention... and the amount they subsequently appeared to have LEARNT' — option D.\",\"uz\":\"D bandida: tadqiqotlar 'bolalarning diqqat darajasi va keyinchalik ular o'rgangan miqdor o'rtasidagi bog'liqlikni' qidirdi — bu D (learning/o'rganish) variantiga mos.\",\"quotes\":[],\"ru\":\"Параграф D: исследования «исследовали взаимосвязь между степенью внимания... и количеством, которое они впоследствии ИЗУЧИЛИ» — вариант D.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"c64fe056a7409c2d8ec2f05d14e710ed18a29e70281e7a0def8e7516dfe0b57d\"}}},\"28\":{\"part\":3,\"en\":\"Paragraph D: observation was used 'to assess teachers' COMPETENCE and allocate merit payments' — option B.\",\"uz\":\"D bandida: kuzatish 'o'qituvchilarning kompetensiyasini baholash va mukofot to'lovlarini ajratish' uchun ishlatilgan — bu B (competence/kompetensiya) variantiga mos.\",\"quotes\":[],\"ru\":\"Параграф D: наблюдение использовалось «для оценки КОМПЕТЕНТНОСТИ учителей и распределения вознаграждений за заслуги» — вариант Б.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"5201aa90df6ea6719f6e50f091f113d59c2b0452cd81acbd67f4da9bb9b9c9e0\"}}},\"29\":{\"part\":3,\"en\":\"Paragraph E: the shift was 'partly the emergence of totalitarian regimes... led to a shift... towards a scrutiny of AUTHORITARIANISM itself' — option A.\",\"uz\":\"E bandida: o'zgarish 'totalitar rejimlarning paydo bo'lishi... avtoritarizmning o'ziga sinchkov nazar tashlashga olib keldi' — bu A (authoritarianism/avtoritarizm) variantiga mos.\",\"quotes\":[],\"ru\":\"Параграф Е: сдвиг заключался в том, что «частично появление тоталитарных режимов... привело к сдвигу... в сторону изучения самого АВТОРИТАРИЗМА» — вариант А.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"2857958dc53e80ffe687f36e59c8b55bea52b70fa8910593792cada85f50b20a\"}}},\"30\":{\"part\":3,\"en\":\"Paragraph E: investigators examined the 'PROCESSES taking place within small discussion groups' — option G.\",\"uz\":\"E bandida: tadqiqotchilar 'kichik munozara guruhlarida sodir bo'layotgan jarayonlarni' o'rgandilar — bu G (processes/jarayonlar) variantiga mos.\",\"quotes\":[],\"ru\":\"Параграф Е: следователи исследовали «ПРОЦЕССЫ, происходящие в небольших дискуссионных группах» — вариант G.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"b45ac62c2aaeb6efd7b04e0f95020bb763916d0ad258e853bc555e157005c8e4\"}}},\"31\":{\"part\":3,\"en\":\"Paragraph H: Withall's analysis 'concentrated... on the study of teachers' VERBAL BEHAVIOR' — option J.\",\"uz\":\"H bandida: Withallning tahlili 'o'qituvchilarning og'zaki xulq-atvorini o'rganishga' qaratilgan edi — bu J (verbal behavior/og'zaki xulq-atvor) variantiga mos.\",\"quotes\":[],\"ru\":\"Параграф H: Анализ Уиталла «концентрирован... на изучении ВЕРБАЛЬНОГО ПОВЕДЕНИЯ учителей» — вариант J.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"0ccf35802d9dfa89fac80c1aeba685a1d73758c5183ebcf01721c935b7d07b27\"}}},\"32\":{\"part\":3,\"en\":\"Paragraph H: Withall 'made efforts towards increasing the RELIABILITY of analyses' — option H.\",\"uz\":\"H bandida: Withall 'tahlillarning ishonchliligini oshirishga harakat qildi' — bu H (reliability/ishonchlilik) variantiga mos.\",\"quotes\":[],\"ru\":\"Параграф H: При этом «предпринимались усилия по повышению НАДЕЖНОСТИ анализов» — вариант H.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"48e045e046b44d0155d42930739ef5055476ad7e35a0de7096ccc29cd9c7e23c\"}}},\"33\":{\"part\":3,\"en\":\"Paragraph I: the 1960-70 decade 'produced a large number of studies of classroom processes, based on OBSERVATION of teachers at work' — option E.\",\"uz\":\"I bandida: 1960-70 yillarda 'o'qituvchilarni ish vaqtida kuzatishga asoslangan' ko'plab tadqiqotlar o'tkazildi — bu E (observation/kuzatish) variantiga mos.\",\"quotes\":[],\"ru\":\"Параграф I: десятилетие 1960-70 годов «произвело большое количество исследований классных процессов, основанных на НАБЛЮДЕНИЯХ за работой учителей» — вариант Е.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"05cc77c4eddc2dbc7434393b7af5b788b2f2b83c8daf36c12bb4915ac717d1f1\"}}},\"34\":{\"part\":3,\"en\":\"Paragraph B: 'Rostker concluded that the intelligence of the teacher is the most important single factor conditioning teaching ability' — this is Rostker (B), not Rolfe.\",\"uz\":\"B bandida: 'Rostker o'qituvchining aqlliligi o'qitish qobiliyatining eng muhim yagona omili ekanligini xulosa qildi' — bu Rostker (B), Rolfe emas.\",\"quotes\":[],\"ru\":\"Параграф Б: «Росткер пришел к выводу, что интеллект учителя является важнейшим фактором, обуславливающим педагогические способности» — это Росткер (Б), а не Рольфе.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"7c1cf73bfbb9896f34ce95bcb47cee0094226aaca3e4bca899b164accfbcb700\"}}},\"35\":{\"part\":3,\"en\":\"Paragraph G: 'Lewin, Lippitt and White... studied the effects of different teaching styles. They arranged for three groups of five boys each to be taught in very different ways' — this is the experiment described.\",\"uz\":\"G bandida: 'Lewin, Lippitt va White... turli o'qitish uslublarining ta'sirini o'rgandilar. Ular har biri besh boladan iborat uch guruhni har xil usulda o'qitishni tashkil qildilar' — bu tasvirlangan tajriba.\",\"quotes\":[],\"ru\":\"Параграф G: «Левин, Липпитт и Уайт... изучали влияние различных стилей преподавания. Они организовали три группы по пять мальчиков в каждой, чтобы обучать их совершенно разными способами» — так описан эксперимент.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"504667a68f3dbe294da089b98796a7c694708f7ff1e319112926b44e2558bdba\"}}},\"36\":{\"part\":3,\"en\":\"Paragraph C: 'Stevens made 100 random observations of lessons... in order to analyze the number and nature of QUESTIONS being asked by teachers' — this matches Stevens (E).\",\"uz\":\"C bandida: 'Stevens darslarning 100 tasodifiy kuzatishini o'tkazdi... o'qituvchilar so'raydigan savollarning soni va tabiatini tahlil qilish uchun' — bu Stevens (E)ga mos.\",\"quotes\":[],\"ru\":\"Параграф C: «Стивенс провел 100 случайных наблюдений за уроками... чтобы проанализировать количество и характер ВОПРОСОВ, задаваемых учителями» — это соответствует Стивенсу (Е).\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"2fae210e921e4adb14fa43e02378507225d63b79d8feb0ed0ce41b050a382403\"}}},\"37\":{\"part\":3,\"en\":\"Paragraph B: 'Rolfe... found no correlation between intelligence and teaching efficiency: he claimed that the teacher's PERSONALITY was what produced good teaching' — this is Rolfe (C).\",\"uz\":\"B bandida: 'Rolfe... aql va o'qitish samaradorligi orasida bog'liqlik topmadi: u o'qituvchining shaxsiyati yaxshi o'qitishni ta'minlaydi deb da'vo qildi' — bu Rolfe (C).\",\"quotes\":[],\"ru\":\"Параграф Б: «Рольф... не нашел корреляции между интеллектом и эффективностью преподавания: он утверждал, что ЛИЧНОСТЬ учителя является тем, что обеспечивает хорошее преподавание» — это Рольфе (С).\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"3e29b757806675bd328747beb8e801adc5bf361ea7f94e60865347587bf5fb65\"}}},\"38\":{\"part\":3,\"en\":\"Paragraph E discusses how 'the emergence of totalitarian regimes in Europe' (a political event) shifted research interest — this is the paragraph about political influence.\",\"uz\":\"E bandida 'Yevropada totalitar rejimlarning paydo bo'lishi' (siyosiy voqea) tadqiqot qiziqishini qanday o'zgartirgani muhokama qilinadi — bu siyosiy ta'sir haqidagi band.\",\"quotes\":[],\"ru\":\"В параграфе E обсуждается, как «возникновение тоталитарных режимов в Европе» (политическое событие) изменило исследовательский интерес — это параграф о политическом влиянии.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"f115ca8a9c0b31dc386b48cea4e69898fdcf496976293cef3b3a95ee65a75b10\"}}},\"39\":{\"part\":3,\"en\":\"Paragraph F describes Anderson's specific categories: 'Dominative acts by children included blaming and snatching toys... integrative acts included sharing facilities' — a clear example of behavior categorization.\",\"uz\":\"F bandida Andersonning aniq toifalari tasvirlangan: 'Bolalarning hukmronlik xatti-harakatlariga ayblash va o'yinchoqlarni tortib olish kirgan... integratsion xatti-harakatlarga imkoniyatlarni baham ko'rish kirgan' — xulq-atvorni tasniflashning aniq namunasi.\",\"quotes\":[],\"ru\":\"В параграфе F описаны конкретные категории Андерсона: «Доминантные действия детей включали в себя обвинение и выхватывание игрушек... интегративные действия включали совместное использование объектов» — яркий пример категоризации поведения.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"ef5be4ff41f5499b08132b6571eb063a930181c3dbaa63ad4a080d76007734b4\"}}},\"40\":{\"part\":3,\"en\":\"Paragraph D explains that because 'formal' teaching with factual recall was the norm, researchers naturally focused on 'attentiveness' — this is the stated reason for studying children's attention.\",\"uz\":\"D bandida tushuntirilishicha, faktlarni yodlashga asoslangan 'rasmiy' o'qitish me'yor bo'lgani uchun, tadqiqotchilar tabiiy ravishda 'diqqatlilik'ga e'tibor qaratdilar — bu bolalar diqqatini o'rganishning aytilgan sababi.\",\"quotes\":[],\"ru\":\"В параграфе D объясняется, что, поскольку «формальное» обучение с запоминанием фактов было нормой, исследователи, естественно, сосредоточились на «внимательности» — это заявленная причина изучения детского внимания.\",\"translationProvenance\":{\"ru\":{\"type\":\"machine-translation\",\"sourceLanguage\":\"en\",\"provider\":\"Google Translate\",\"sourceSha256\":\"799e72c5a95ed3dfdf951681122d0e9239d6d71ad590b38fb54922e36efd3816\"}}}}}]]\n"])</script></body></html>
