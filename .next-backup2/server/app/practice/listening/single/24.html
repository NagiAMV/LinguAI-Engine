[[\"B\",\"E\"]]},{\"questions\":[13,14],\"acceptedSets\":[[\"B\",\"C\"]]}]}},\"sources\":[{\"part\":2,\"type\":\"user-provided-pdf\",\"label\":\"80 IELTS Listening Tests (2).pdf\",\"reference\":\"Test 24\"}]},\"explanations\":{\"11\":{\"part\":2,\"en\":\"B — planting trees. Group A removes non-native species and plants native plants and trees.\",\"ru\":\"B — посадка деревьев. Группа A удаляет чужеродные виды и высаживает местные растения и деревья.\",\"quotes\":[\"putting back some native plants and trees\"],\"location\":{\"en\":\"[02:30]\",\"ru\":\"[02:30]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"12\":{\"part\":2,\"en\":\"E — building fences. Repairing and constructing the wooden fence is named as a priority for Group A.\",\"ru\":\"E — строительство ограждений. Ремонт и установка деревянного забора названы приоритетной задачей группы A.\",\"quotes\":[\"The priority for you will be to give us a hand with the new wooden fencing\"],\"location\":{\"en\":\"[01:32]\",\"ru\":\"[01:32]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"13\":{\"part\":2,\"en\":\"B — boots. Volunteers should wear strong, preferably waterproof boots because the ground is muddy.\",\"ru\":\"B — ботинки. Волонтёрам нужна прочная, желательно водонепроницаемая обувь, потому что сейчас грязно.\",\"quotes\":[\"I’d definitely recommend a strong pair of boots\"],\"location\":{\"en\":\"[03:00]\",\"ru\":\"[03:00]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"14\":{\"part\":2,\"en\":\"C — gloves. The manager recommends bringing personal gloves; tools and refreshments will be supplied.\",\"ru\":\"C — перчатки. Руководитель советует взять собственные перчатки; инструменты и еду с напитками предоставят.\",\"quotes\":[\"your own gloves would also be advisable\"],\"location\":{\"en\":\"[03:00–03:29]\",\"ru\":\"[03:00–03:29]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"15\":{\"part\":2,\"en\":\"G — vegetable beds. From the car park, follow the footpath to the central circle, then take the short track on its left to the beds.\",\"ru\":\"G — грядки. От парковки нужно идти по дорожке к центральному кругу, затем свернуть на короткую тропу слева к грядкам.\",\"quotes\":[\"on the left-hand side of that circular footpath, there’s a short track which takes you directly to the vegetable beds\"],\"location\":{\"en\":\"[04:58]\",\"ru\":\"[04:58]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"I — bee hives. Follow the eastern path from the central circle, take the lower branch and choose the smaller area on the right of the bamboo fence.\",\"ru\":\"I — ульи. От центрального круга идите по восточной дорожке, выберите нижнюю ветку и меньшую площадку справа от бамбукового забора.\",\"quotes\":[\"the path that heads down … the beehives are on the right of the fence. The smaller section\"],\"location\":{\"en\":\"[05:28–05:56]\",\"ru\":\"[05:28–05:56]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"B — seating. The seating area is reached by the path at the top of the central circular footpath, beside the bicycle track.\",\"ru\":\"B — места для отдыха. К зоне отдыха ведёт тропа в верхней части круглой дорожки, рядом с велосипедной трассой.\",\"quotes\":[\"At the top of it, there’s a path … takes you up to the seating area\"],\"location\":{\"en\":\"[06:24]\",\"ru\":\"[06:24]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"E — adventure playground. From the car park, take the first left and then the short path to the right; the playground is above the bamboo fence.\",\"ru\":\"E — площадка для приключений. От парковки сверните на первой дороге налево, затем на короткую тропу направо; площадка находится над бамбуковым забором.\",\"quotes\":[\"you want the first left turn … short path that goes off to the right … adventure playground area\"],\"location\":{\"en\":\"[06:51]\",\"ru\":\"[06:51]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"C — sand area. At the eastern fork, take the upper path towards the bicycle track; the sand area is just above the bamboo fence.\",\"ru\":\"C — песчаная площадка. На восточной развилке выберите верхнюю тропу к велосипедной трассе; песчаная площадка находится прямо над бамбуковым забором.\",\"quotes\":[\"the little path that goes up towards the bicycle track. The sand area is just above the bamboo fence\"],\"location\":{\"en\":\"[07:19]\",\"ru\":\"[07:19]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"A — pond. The pond is on the left of the plan, near the top, above the fruit bushes and left of the small path.\",\"ru\":\"A — пруд. Пруд находится слева на плане, ближе к верху: над кустами с фруктами и слева от маленькой тропы.\",\"quotes\":[\"on the left hand side of your plan, towards the top, just above the fruit bushes\"],\"location\":{\"en\":\"[07:48]\",\"ru\":\"[07:48]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
