y negotiate which day, provided it stays the same each week.\",\"ru\":\"Выходной. Сотрудникам дают один выходной; можно договориться о дне, но он должен быть одинаковым каждую неделю.\",\"quotes\":[\"You get one day off … it has to be the same one every week\"],\"location\":{\"en\":\"[02:34–03:02]\",\"ru\":\"[02:34–03:02]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"3\":{\"part\":1,\"en\":\"Break. The £5.50 hourly rate includes a break.\",\"ru\":\"Перерыв. В почасовую ставку £5,50 включён перерыв.\",\"quotes\":[\"£5.50 an hour, and that includes a break\"],\"location\":{\"en\":\"[03:02]\",\"ru\":\"[03:02]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"4\":{\"part\":1,\"en\":\"Meal. The hotel provides a meal free of charge.\",\"ru\":\"Еда. Отель предоставляет питание бесплатно.\",\"quotes\":[\"you can get a meal in the hotel … there’s no charge for it\"],\"location\":{\"en\":\"[03:02]\",\"ru\":\"[03:02]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"5\":{\"part\":1,\"en\":\"Dark. Staff must wear dark trousers; the hotel does not supply them.\",\"ru\":\"Тёмные. Сотрудникам нужны тёмные брюки; отель их не предоставляет.\",\"quotes\":[\"a white shirt … and dark trousers\"],\"location\":{\"en\":\"[03:31]\",\"ru\":\"[03:31]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"6\":{\"part\":1,\"en\":\"Jacket. The employee must wear a jacket, and the hotel lends one.\",\"ru\":\"Пиджак. Сотрудник должен носить пиджак, и отель выдаёт его во временное пользование.\",\"quotes\":[\"You have to wear a jacket, but the hotel lends you that\"],\"location\":{\"en\":\"[04:27]\",\"ru\":\"[04:27]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"7\":{\"part\":1,\"en\":\"28 June. The confirmed starting date is the 28th, near the end of June.\",\"ru\":\"28 июня. Подтверждённая дата начала работы — 28-е число, ближе к концу июня.\",\"quotes\":[\"Yes, the 28th in time for the summer\"],\"location\":{\"en\":\"[04:27]\",\"ru\":\"[04:27]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"8\":{\"part\":1,\"en\":\"Urwin. The manager’s surname is spelled U-R-W-I-N in the call; follow the dictated spelling used in the answer key.\",\"ru\":\"Urwin. В разговоре фамилию менеджера диктуют как U-R-W-I-N; используйте продиктованное написание из ключа.\",\"quotes\":[\"That’s U-R-W-I-N\"],\"location\":{\"en\":\"[04:54]\",\"ru\":\"[04:54]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"9\":{\"part\":1,\"en\":\"Noon. Jane starts checking rooms at midday, so the caller should phone before then.\",\"ru\":\"Полдень. Джейн начинает осматривать номера в полдень, поэтому позвонить нужно до этого времени.\",\"quotes\":[\"She usually starts checking the rooms at midday, so before then\"],\"location\":{\"en\":\"[04:54]\",\"ru\":\"[04:54]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"10\":{\"part\":1,\"en\":\"Reference. The manager will ask for a reference: someone who knows the applicant and can vouch for them. The request appears in the restored ending of the recording.\",\"ru\":\"Рекомендация. Руководитель попросит рекомендацию от человека, который знает соискателя и может за него поручиться. Эта просьба звучит в восстановленном окончании записи.\",\"quotes\":[\"she will ask you for a reference\"],\"location\":{\"en\":\"[05:33] Application requirement\",\"ru\":\"[05:33] Требование для трудоустройства\"},\"basis\":\"question-and-restored-source-audio-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
