\":\"[04:22]\",\"ru\":\"[04:22]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"7\":{\"part\":1,\"en\":\"Shadforth. The hostel is on Shadforth Lane; Nick spells the street name to confirm it.\",\"ru\":\"Shadforth. Хостел находится на Shadforth Lane; Ник подтверждает название улицы по буквам.\",\"quotes\":[\"It’s on Shadforth Lane. … S-H-A-D-F-O-R-T-H\"],\"location\":{\"en\":\"[05:15]\",\"ru\":\"[05:15]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"8\":{\"part\":1,\"en\":\"Towel. Hostel guests may bring their own towel or hire one.\",\"ru\":\"Полотенце. В хостеле можно привезти своё полотенце или взять его напрокат.\",\"quotes\":[\"you can usually either bring your own towel … or hire one\"],\"location\":{\"en\":\"[05:15–05:50]\",\"ru\":\"[05:15–05:50]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"9\":{\"part\":1,\"en\":\"Breakfast. The general accommodation information says breakfast is included at no extra cost.\",\"ru\":\"Завтрак. В общей информации о хостелах сказано, что завтрак включён в стоимость.\",\"quotes\":[\"you don’t have to pay extra for breakfast\"],\"location\":{\"en\":\"[05:50]\",\"ru\":\"[05:50]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"10\":{\"part\":1,\"en\":\"Kitchen. A shared kitchen lets guests prepare inexpensive snacks and save money.\",\"ru\":\"Кухня. Общая кухня позволяет готовить недорогие перекусы и экономить.\",\"quotes\":[\"there’s a kitchen where you can knock up a snack\"],\"location\":{\"en\":\"[06:17]\",\"ru\":\"[06:17]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
