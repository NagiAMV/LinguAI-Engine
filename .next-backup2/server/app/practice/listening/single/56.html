y agree to support him financially after initially expecting him to fund the course himself.\",\"ru\":\"B — помощь семьи. Родители Дэна в итоге соглашаются помочь с оплатой курса, хотя сначала ожидали, что он справится сам.\",\"quotes\":[\"in the end, they took pity on me\"],\"location\":{\"en\":\"[01:36]\",\"ru\":\"[01:36]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"22\":{\"part\":3,\"en\":\"E — former employer. Dan’s old employer agrees to make a contribution toward his course.\",\"ru\":\"E — прежний работодатель. Бывший начальник Дэна соглашается внести часть денег за обучение.\",\"quotes\":[\"the boss of the company I used to work for … said they’d make a contribution\"],\"location\":{\"en\":\"[01:08]\",\"ru\":\"[01:08]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"23\":{\"part\":3,\"en\":\"A — she is not sufficiently challenged. Jeannie leaves the singing group because its conductor does not stretch the members enough.\",\"ru\":\"A — ей не хватает сложности. Джинни уходит из певческой группы, потому что руководитель недостаточно развивает участников.\",\"quotes\":[\"I don’t think the conductor stretches us enough\"],\"location\":{\"en\":\"[02:33]\",\"ru\":\"[02:33]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"24\":{\"part\":3,\"en\":\"B — the activity interferes with her studies. Rehearsals have made Jeannie fall behind, so she decides to leave debating.\",\"ru\":\"B — занятие мешает учёбе. Из-за репетиций Джинни отстала по учёбе, поэтому решила оставить дебатный клуб.\",\"quotes\":[\"with all the rehearsing I’m doing, something has to go\"],\"location\":{\"en\":\"[02:33]\",\"ru\":\"[02:33]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"25\":{\"part\":3,\"en\":\"B — seminars make Dan feel inferior. He compares other students’ clever comments with his own ability and doubts whether he is good enough.\",\"ru\":\"B — на семинарах Дэн чувствует
