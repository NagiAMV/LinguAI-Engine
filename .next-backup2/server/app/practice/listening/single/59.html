ждения в группе полезны, потому что выступление перед другими укрепляет уверенность.\",\"quotes\":[\"It really helps build confidence\"],\"location\":{\"en\":\"[02:21–03:12]\",\"ru\":\"[02:21–03:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"25\":{\"part\":3,\"en\":\"Ideas. The drawback is that group members repeat the same ideas across their dissertations.\",\"ru\":\"Идеи. Минус групповой работы в том, что участники повторяют одни и те же идеи в своих диссертациях.\",\"quotes\":[\"everyone in the group seems to share the same ideas\"],\"location\":{\"en\":\"[03:12]\",\"ru\":\"[03:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"26\":{\"part\":3,\"en\":\"Student Support. This service offers a structured programme for developing study skills.\",\"ru\":\"Student Support. Эта служба предлагает структурированную программу развития учебных навыков.\",\"quotes\":[\"a service called Student Support … a structured program\"],\"location\":{\"en\":\"[03:12]\",\"ru\":\"[03:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"27\":{\"part\":3,\"en\":\"Places. The programme could help, but there are only a few places available.\",\"ru\":\"Мест. Программа может помочь, но доступно лишь небольшое количество мест.\",\"quotes\":[\"there are only a few places\"],\"location\":{\"en\":\"[03:39]\",\"ru\":\"[03:39]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"28\":{\"part\":3,\"en\":\"General. The study-skills books are useful references, but sometimes their advice is too general.\",\"ru\":\"Общими. Книги по учебным навыкам полезны как справочник, но иногда их советы слишком общие.\",\"quotes\":[\"they are sometimes too general\"],\"location\":{\"en\":\"[03:39]\",\"ru\":\"[03:39]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"29\":{\"part\":3,\"en\":\"Three times. Caroline should review all her notes three times to help remember them.\",\"ru\":\"Три раза. Кэролайн советуют перечитать все конспекты трижды, чтобы лучше их запомнить.\",\"quotes\":[\"Read everything three times\"],\"location\":{\"en\":\"[04:09]\",\"ru\":\"[04:09]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"30\":{\"part\":3,\"en\":\"25 January. They agree on the 25th, after checking availability for the proposed dates.\",\"ru\":\"25 января. Они выбирают 25-е число после проверки, в какие дни оба свободны.\",\"quotes\":[\"We’ll go for the 25th then\"],\"location\":{\"en\":\"[05:08]\",\"ru\":\"[05:08]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
