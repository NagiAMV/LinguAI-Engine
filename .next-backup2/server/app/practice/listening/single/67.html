n\":{\"en\":\"[02:40]\",\"ru\":\"[02:40]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"34\":{\"part\":4,\"en\":\"Stars. Robert Boyle thought fireworks could demonstrate how stars were formed.\",\"ru\":\"Звёзды. Роберт Бойль предположил, что фейерверки могут показать, как образуются звёзды.\",\"quotes\":[\"fireworks might provide an effective way of demonstrating how stars were formed\"],\"location\":{\"en\":\"[03:07]\",\"ru\":\"[03:07]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"35\":{\"part\":4,\"en\":\"Practical. London scientists later investigated practical applications, such as helping sailors establish their position.\",\"ru\":\"Практические. Позже лондонские учёные исследовали практическое применение фейерверков, например помощь морякам в определении местоположения.\",\"quotes\":[\"started to look at the practical purposes for which fireworks might be employed\"],\"location\":{\"en\":\"[03:35]\",\"ru\":\"[03:35]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"Education. In St Petersburg, fireworks were seen as a way to educate the public.\",\"ru\":\"Образования. В Санкт-Петербурге фейерверки считали способом просвещения населения.\",\"quotes\":[\"fireworks as being an important element in the education of the masses\"],\"location\":{\"en\":\"[04:01]\",\"ru\":\"[04:01]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"37\":{\"part\":4,\"en\":\"King. Parisian displays aimed to make the public believe in the king’s supreme authority.\",\"ru\":\"Короля. Парижские представления должны были укреплять веру в верховную власть короля.\",\"quotes\":[\"encourage the public to believe in the supreme authority of the king\"],\"location\":{\"en\":\"[04:31–04:59]\",\"ru\":\"[04:31–04:59]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"Entertainment. Parisian scientists aimed to entertain fashionable society with scientific demonstrations.\",\"ru\":\"Развлечения. Парижские учёные стремились развлекать светское общество научными демонстрациями.\",\"quotes\":[\"The purpose of scientists was basically to offer entertainment to fashionable society\"],\"location\":{\"en\":\"[05:24]\",\"ru\":\"[05:24]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"Opera. Servandoni structured his display like an opera, even dividing it into acts.\",\"ru\":\"Опера. Сервандини построил представление по образцу оперы и даже разделил его на акты.\",\"quotes\":[\"structured in the same way as an opera and was even divided into separate acts\"],\"location\":{\"en\":\"[05:56]\",\"ru\":\"[05:56]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"Electricity. Eighteenth-century displays showed the public this new scientific discovery.\",\"ru\":\"Электричество. В представлениях XVIII века публике показывали это новое научное открытие.\",\"quotes\":[\"displays now showed a fascinated public the curious phenomenon of electricity\"],\"location\":{\"en\":\"[06:53]\",\"ru\":\"[06:53]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
