graduates in overseas departments to organise the research locally.\",\"ru\":\"B — помощь студентов из других стран. Шона связалась с аспирантами зарубежных кафедр, чтобы организовать исследование на местах.\",\"quotes\":[\"I approached postgraduates in my field in overseas departments\"],\"location\":{\"en\":\"[01:26]\",\"ru\":\"[01:26]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"32\":{\"part\":4,\"en\":\"B — employed men. Shona deliberately limited this first stage to men who were in employment.\",\"ru\":\"B — работающие мужчины. На первом этапе Шона специально ограничила выборку мужчинами с работой.\",\"quotes\":[\"just to focus on men who were in employment\"],\"location\":{\"en\":\"[01:55]\",\"ru\":\"[01:55]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"33\":{\"part\":4,\"en\":\"A — collect a wide range of data. She wanted the questionnaire to cover as much variety as possible.\",\"ru\":\"A — собрать широкий спектр данных. Шона хотела включить в анкету как можно больше разных тем.\",\"quotes\":[\"rather than limiting it to one specific point, I wanted to include as much variety as possible\"],\"location\":{\"en\":\"[02:24]\",\"ru\":\"[02:24]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"34\":{\"part\":4,\"en\":\"A — the press misrepresents current concerns. Initial results suggest people worry less about long-term hospital care than newspapers imply.\",\"ru\":\"A — пресса искажает реальные опасения. Первые результаты показывают, что длительное лечение в больницах беспокоит людей меньше, чем можно понять из газет.\",\"quotes\":[\"long-term hospital care is in fact probably less of an issue than the media would have us believe\"],\"location\":{\"en\":\"[03:20]\",\"ru\":\"[03:20]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"35\":{\"part\":4,\"en\":\"C — identify public preferences. More research is needed to find out which kind of medical service people want.\",\"ru\":\"C — определить предпочтения населения. Нужно дополнительное исследование, чтобы выяснить, какую медицинскую модель предпочитают люди.\",\"quotes\":[\"establish if people want extra medical staff … or … fewer but larger key medical units\"],\"location\":{\"en\":\"[03:47]\",\"ru\":\"[03:47]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"C — colleagues may not agree. Shona was surprised that people in her own department did not all approve of her project design.\",\"ru\":\"C — коллеги могут не соглашаться. Шону удивило, что в её отделе не все сочли план исследования удачным.\",\"quotes\":[\"something I thought I’d set up very well didn’t necessarily seem that way to everyone in my own department\"],\"location\":{\"en\":\"[04:14]\",\"ru\":\"[04:14]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"37\":{\"part\":4,\"en\":\"B — stopped participating. The person interviewed in the street withdrew before the second round.\",\"ru\":\"B — отказался продолжать. Человек, которого опросили на улице, вышел из исследования перед вторым этапом.\",\"quotes\":[\"decided to pull out when it came to the second round\"],\"location\":{\"en\":\"[04:44]\",\"ru\":\"[04:44]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"F — worried about confidentiality. The undergraduate wanted assurance that their identity could not be traced from their answers.\",\"ru\":\"F — беспокоился о конфиденциальности. Студент хотел убедиться, что по ответам нельзя будет установить его личность.\",\"quotes\":[\"wanted reassurance that no names would be traceable from the answers\"],\"location\":{\"en\":\"[05:12]\",\"ru\":\"[05:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"D — kept changing their mind. The colleague alternated between agreeing and refusing before eventually participating.\",\"ru\":\"D — постоянно менял решение. Коллега то соглашался, то отказывался, прежде чем в итоге принять участие.\",\"quotes\":[\"one minute he said he’d do it, then the next day he wouldn’t\"],\"location\":{\"en\":\"[05:12]\",\"ru\":\"[05:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"C — refused to explain his job. The French university tutor answered the other questions but would not specify his work.\",\"ru\":\"C — отказался рассказать о своей работе. Преподаватель из французского университета ответил на другие вопросы, но не объяснил, чем именно занимается.\",\"quotes\":[\"he wouldn’t tell me exactly what his work involved\"],\"location\":{\"en\":\"[05:40]\",\"ru\":\"[05:40]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
