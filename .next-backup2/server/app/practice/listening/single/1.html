i qatnashchilar 8:45 atrofida kelishidan ajratib aytadi.\",\"quotes\":[\"the actual run begins at 9am\",\"runners start arriving at about 8.45\"],\"location\":{\"en\":\"[01:39]\",\"ru\":\"[01:39]\",\"uz\":\"[01:39]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"3\":{\"part\":1,\"en\":\"5 km. It used to be 3 km, but was extended by 2 km after the route began going twice around the lake.\",\"ru\":\"5 км. Раньше дистанция была 3 км, но её увеличили на 2 км, когда стали дважды обходить озеро.\",\"uz\":\"5 km. Avval masofa 3 km edi, ko‘lni ikki marta aylanadigan yo‘nalish qo‘shilgach, yana 2 km uzaytirildi.\",\"quotes\":[\"it used to be three kilometres\",\"we lengthened it to five kilometres\"],\"location\":{\"en\":\"[02:06]\",\"ru\":\"[02:06]\",\"uz\":\"[02:06]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"4\":{\"part\":1,\"en\":\"barcode. At the finish, a volunteer scans the barcode so the runner can later see the time online.\",\"ru\":\"штрихкод. На финише волонтёр сканирует его, чтобы участник позже увидел результат в интернете.\",\"uz\":\"shtrix-kod. Marrada ko‘ngilli uni skanerlaydi, shunda qatnashchi natijasini keyin internetda ko‘radi.\",\"quotes\":[\"you’ll be given a barcode\",\"one of the run volunteers who will scan it\"],\"location\":{\"en\":\"[02:36]\",\"ru\":\"[02:36]\",\"uz\":\"[02:36]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"5\":{\"part\":1,\"en\":\"website. Registration by phone is possible, but the organiser says using the website is much easier.\",\"ru\":\"сайт. Зарегистрироваться можно по телефону, но организатор говорит, что через сайт гораздо проще.\",\"uz\":\"veb-sayt. Telefon orqali yozilish mumkin, lekin tashkilotchi veb-saytdan foydalanish ancha osonligini aytadi.\",\"quotes\":[\"it’s much easier if you do it using the website\"],\"location\":{\"en\":\"[03:07]\",\"ru\":\"[03:07]\",\"uz\":\"[03:07]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"6\":{\"part\":1,\"en\":\"£1.50. The weekly run now costs £1.50; the earlier £1 fee is mentioned as the old price.\",\"ru\":\"£1,50. Сейчас участие стоит £1,50; £1 упоминается как прежняя цена.\",\"uz\":\"£1.50. Hozir qatnashish £1.50 turadi; £1 esa avvalgi narx bo‘lgan.\",\"quotes\":[\"we have just increased the charge to £1.50\",\"It used to be a pound\"],\"location\":{\"en\":\"[03:34]\",\"ru\":\"[03:34]\",\"uz\":\"[03:34]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"7\":{\"part\":1,\"en\":\"Maughan. Pete’s surname is spelled out after the caller mishears it.\",\"ru\":\"Maughan. Фамилию Пита диктуют по буквам после того, как собеседница её не расслышала.\",\"uz\":\"Maughan. Qo‘ng‘iroq qiluvchi familiyani noto‘g‘ri eshitgach, Pit uni harflab aytadi.\",\"quotes\":[\"It’s M-A-U-G-H-A-N\"],\"location\":{\"en\":\"[04:56]\",\"ru\":\"[04:56]\",\"uz\":\"[04:56]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"8\":{\"part\":1,\"en\":\"01444 732900. The organiser rejects the older number beginning 01273 and dictates the current one.\",\"ru\":\"01444 732900. Организатор уточняет, что номер с началом 01273 устарел, и диктует действующий.\",\"uz\":\"01444 732900. Tashkilotchi 01273 bilan boshlanadigan raqam eskirganini aytib, amaldagi raqamni beradi.\",\"quotes\":[\"the one that begins 01273 is an old one\",\"It’s 01444732900\"],\"location\":{\"en\":\"[05:28]\",\"ru\":\"[05:28]\",\"uz\":\"[05:28]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"9\":{\"part\":1,\"en\":\"guiding. Volunteers may guide runners so they do not go the wrong way.\",\"ru\":\"сопровождение по маршруту. Волонтёры помогают бегунам не сбиться с пути.\",\"uz\":\"yo‘nalish ko‘rsatish. Ko‘ngillilar yuguruvchilar adashmasligi uchun ularga yo‘l ko‘rsatadi.\",\"quotes\":[\"she can also help with guiding the runners\"],\"location\":{\"en\":\"[06:02]\",\"ru\":\"[06:02]\",\"uz\":\"[06:02]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"10\":{\"part\":1,\"en\":\"taking photos. The weekly report needs illustrations, and the caller’s friend enjoys photography.\",\"ru\":\"фотографирование. Еженедельный отчёт нужно иллюстрировать, а подруга звонившей любит фотографировать.\",\"uz\":\"suratga olish. Haftalik hisobot rasmlar bilan boyitiladi, qo‘ng‘iroq qiluvchining dugonasi esa suratga olishni yoqtiradi.\",\"quotes\":[\"we always try to illustrate it\",\"really likes taking photographs\"],\"location\":{\"en\":\"[06:32]\",\"ru\":\"[06:32]\",\"uz\":\"[06:32]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
