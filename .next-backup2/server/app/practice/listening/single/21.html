t. Online bookings produce an e-ticket, which passengers must print and bring along.\",\"ru\":\"Электронный билет. При онлайн-бронировании выдаётся электронный билет; его нужно распечатать и взять с собой.\",\"quotes\":[\"print your e-ticket, which you must remember to bring with you\"],\"location\":{\"en\":\"[06:26]\",\"ru\":\"[06:26]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
