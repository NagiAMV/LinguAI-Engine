стоянка. Школьная группа ждёт на парковке: гиды проводят инструктаж там, поскольку вход слишком маленький.\",\"quotes\":[\"remain with your group in the car park … guides will welcome you there\"],\"location\":{\"en\":\"[01:30]\",\"ru\":\"[01:30]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"14\":{\"part\":2,\"en\":\"45. The 90-minute visit includes 45 minutes for the guided tour, plus 15 minutes for the coach and 30 minutes of activities.\",\"ru\":\"45. Визит длится 90 минут: 45 минут занимает экскурсия, 15 минут — посадка и высадка, ещё 30 минут — занятия после неё.\",\"quotes\":[\"45 minutes for the guided tour\"],\"location\":{\"en\":\"[01:57]\",\"ru\":\"[01:57]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"15\":{\"part\":2,\"en\":\"Tables. Students can eat their own lunch at tables behind the museum.\",\"ru\":\"Столы. Ученики могут пообедать принесённой едой за столами позади музея.\",\"quotes\":[\"at the back there are tables and students can bring their own lunch\"],\"location\":{\"en\":\"[02:25]\",\"ru\":\"[02:25]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"C — cameras. Students may take photographs to create a visual record for projects.\",\"ru\":\"C — фотоаппараты. Ученикам разрешено фотографировать, чтобы собрать иллюстрации для проектов.\",\"quotes\":[\"We do allow students to take photographs\"],\"location\":{\"en\":\"[03:51]\",\"ru\":\"[03:51]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"F — pens. Students need something to write with while completing the museum handouts.\",\"ru\":\"F — ручки. Для выполнения музейных заданий ученикам нужно иметь чем писать.\",\"quotes\":[\"they’ll need to bring something to write with\"],\"location\":{\"en\":\"[03:51]\",\"ru\":\"[03:51]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"G — worksheets. The museum provides handouts with questions and quizzes.\",\"ru\":\"G — рабочие листы. Музей выдаёт листы с вопросами и викторинами.\",\"quotes\":[\"we do provide school students with handouts with questions and quizzes\"],\"location\":{\"en\":\"[03:24–03:51]\",\"ru\":\"[03:24–03:51]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"B — watch films. Short dinosaur documentaries are shown continuously and are available after the tour.\",\"ru\":\"B — смотреть фильмы. После экскурсии можно посмотреть короткие документальные фильмы о динозаврах, которые идут постоянно.\",\"quotes\":[\"continuous screenings of short documentaries about dinosaurs\"],\"location\":{\"en\":\"[04:21]\",\"ru\":\"[04:21]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"E — play computer games. The IT centre has dinosaur games on CD-ROMs.\",\"ru\":\"E — играть в компьютерные игры. В IT-центре есть игры о динозаврах на CD-ROM.\",\"quotes\":[\"an IT centre where students have access to CD-ROMs with a range of dinosaur games\"],\"location\":{\"en\":\"[04:45]\",\"ru\":\"[04:45]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
