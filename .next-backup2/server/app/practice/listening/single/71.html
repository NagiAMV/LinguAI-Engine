[01:10]\",\"ru\":\"[01:10]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"32\":{\"part\":4,\"en\":\"B — create a comfortable environment. Research says luxury hotels overlook guests’ basic need to feel at home.\",\"ru\":\"B — создать комфортную обстановку. Исследование показывает, что роскошные отели упускают базовую потребность гостей чувствовать себя как дома.\",\"quotes\":[\"underestimated the most basic needs … to feel at home in surroundings which are both familiar and inviting\"],\"location\":{\"en\":\"[01:36–02:06]\",\"ru\":\"[01:36–02:06]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"33\":{\"part\":4,\"en\":\"A — a wide variety of hotels. The research covered independent hotels, chains, city boutiques, country houses and beach hotels.\",\"ru\":\"A — широкий спектр отелей. Исследование охватило независимые гостиницы, сети, городские бутик-отели, загородные дома и пляжные отели.\",\"quotes\":[\"covered a whole range of different hotel types\"],\"location\":{\"en\":\"[02:06]\",\"ru\":\"[02:06]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"34\":{\"part\":4,\"en\":\"C — it has no effect. The study concluded that the surroundings outside the hotel did not matter.\",\"ru\":\"C — влияния нет. Исследование пришло к выводу, что окружение за пределами отеля не имеет значения.\",\"quotes\":[\"what was outside the hotel building simply didn’t matter\"],\"location\":{\"en\":\"[02:35]\",\"ru\":\"[02:35]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"35\":{\"part\":4,\"en\":\"Business. The serviced-apartment company aims to meet the needs of business travellers.\",\"ru\":\"Деловых. Компания апартаментов с обслуживанием ориентируется на деловых путешественников.\",\"quotes\":[\"business travelers don't want, while maximizing the facilities they do want\"],\"location\":{\"en\":\"[03:39]\",\"ru\":\"[03:39]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"Kitchen. The apartments include a modern kitchen where guests can cook and entertain.\",\"ru\":\"Кухню. В апартаментах есть современная кухня, где гости могут готовить и принимать людей.\",\"quotes\":[\"a sleek modern kitchen that allows guests to cook and entertain\"],\"location\":{\"en\":\"[03:39–04:09]\",\"ru\":\"[03:39–04:09]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"37\":{\"part\":4,\"en\":\"World. The company hopes to establish a lasting trend throughout the world.\",\"ru\":\"Мире. Компания хочет, чтобы долговременная тенденция распространилась по всему миру.\",\"quotes\":[\"establish a trend all over the world and make a lasting impact\"],\"location\":{\"en\":\"[04:09]\",\"ru\":\"[04:09]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"Escape. Holiday hotels appeal to people’s desire to escape ordinary routines.\",\"ru\":\"Сбежать. Отели для отдыха привлекают желанием вырваться из повседневной рутины.\",\"quotes\":[\"people’s need to escape the predictability of their everyday lives\"],\"location\":{\"en\":\"[04:39]\",\"ru\":\"[04:39]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"Baby. Being looked after can make guests feel as safe as when everything was done for them as a baby.\",\"ru\":\"Младенца. Забота об отдыхающих вызывает ощущение безопасности, как в младенчестве, когда всё делали за них.\",\"quotes\":[\"It’s almost as if we returned to being a baby when everything was done for us\"],\"location\":{\"en\":\"[05:08]\",\"ru\":\"[05:08]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"Chocolate. Small treats left in a room include shampoo, soap and chocolate on the pillow.\",\"ru\":\"Шоколад. Среди маленьких подарков в номере лектор приводит шампунь, мыло и шоколад на подушке.\",\"quotes\":[\"the chocolate on your pillow at night\"],\"location\":{\"en\":\"[05:08]\",\"ru\":\"[05:08]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
