, политики и маркетинга.\",\"quotes\":[\"important in the fields of information science and politics, and … marketing also\"],\"location\":{\"en\":\"[02:12]\",\"ru\":\"[02:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"32\":{\"part\":4,\"en\":\"Interests. Friends-of-friends may differ from us but can still share enough interests to form a useful connection.\",\"ru\":\"Интересы. Друзья друзей могут отличаться от нас, но общих интересов достаточно для полезной связи.\",\"quotes\":[\"we share the same sort of interests\"],\"location\":{\"en\":\"[02:41]\",\"ru\":\"[02:41]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"33\":{\"part\":4,\"en\":\"Jobs. Weak ties can pass along information about suitable job opportunities.\",\"ru\":\"Работу. Слабые связи могут сообщать о подходящих вакансиях.\",\"quotes\":[\"pass on details about jobs they think might be suitable for us\"],\"location\":{\"en\":\"[02:41]\",\"ru\":\"[02:41]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"34\":{\"part\":4,\"en\":\"Health. Later research found that weak-tie networks can improve health.\",\"ru\":\"Здоровье. Более поздние исследования показали, что сети слабых связей могут улучшать здоровье.\",\"quotes\":[\"one thing that seems to improve as a result of weak-tie influence is our health\"],\"location\":{\"en\":\"[03:11]\",\"ru\":\"[03:11]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"35\":{\"part\":4,\"en\":\"C — form relationships more quickly. The speaker says online networks let people develop friendships and professional contacts faster.\",\"ru\":\"C — быстрее заводить связи. Докладчик говорит, что онлайн-сети ускоряют создание дружеских и профессиональных контактов.\",\"quotes\":[\"people are developing friendships and professional networks … The process is faster\"],\"location\":{\"en\":\"[05:07]\",\"ru\":\"[05:07]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"E — receive current-affairs updates. The speaker calls sharing local and global news a clear benefit.\",\"ru\":\"E — получать актуальные новости. Докладчик прямо называет передачу местных и мировых новостей преимуществом.\",\"quotes\":[\"allows us to pass on the latest news, to be up to date with local and global events\"],\"location\":{\"en\":\"[03:44–04:12]\",\"ru\":\"[03:44–04:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"37\":{\"part\":4,\"en\":\"A — criminal activity. The lecturer expects online fraud using other people’s personal data to continue.\",\"ru\":\"A — преступная деятельность. Лектор ожидает, что интернет-мошенничество с чужими персональными данными продолжится.\",\"quotes\":[\"people are using the personal data of others … for criminal purposes. This kind of activity seems likely to continue\"],\"location\":{\"en\":\"[06:01]\",\"ru\":\"[06:01]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"D — less work done by employees. Social networks give employees a time-wasting opportunity and reduce productivity.\",\"ru\":\"D — сотрудники будут меньше работать. Социальные сети дают возможность отвлекаться и снижают производительность.\",\"quotes\":[\"a great time-wasting opportunity, reducing productivity\"],\"location\":{\"en\":\"[06:32]\",\"ru\":\"[06:32]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"A — they do not develop some social skills. Dunbar warns that online-only relationships do not teach skills for maintaining relationships in situations requiring diplomacy.\",\"ru\":\"A — они не развивают некоторые социальные навыки. Данбар предупреждает, что одних онлайн-связей недостаточно для освоения навыков поддержания отношений и дипломатии.\",\"quotes\":[\"doesn’t allow them to form the ability or acquire the strategies for maintaining relationships\"],\"location\":{\"en\":\"[07:24]\",\"ru\":\"[07:24]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"C — they are not a good starting point for new relationships. Dunbar says face-to-face contact is essential for initially creating true friendship.\",\"ru\":\"C — они не лучший способ начинать отношения. Данбар считает личное общение необходимым для возникновения настоящей дружбы.\",\"quotes\":[\"face-to-face interaction is essential for the initial creation of true friendship\"],\"location\":{\"en\":\"[07:24]\",\"ru\":\"[07:24]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
