s\":\"question-and-current-transcript\",\"audioVerified\":false},\"32\":{\"part\":4,\"en\":\"Eyes. Human faces in rock art often have prominent, wide-open eyes.\",\"ru\":\"Глаза. На изображениях людей в наскальном искусстве часто подчёркнуты большие широко открытые глаза.\",\"quotes\":[\"the eyes were almost always very prominent, very open and wide\"],\"location\":{\"en\":\"[02:31]\",\"ru\":\"[02:31]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"33\":{\"part\":4,\"en\":\"Lizard. This animal was consistently drawn in profile or from above.\",\"ru\":\"Ящерица. Это животное постоянно изображали сбоку или сверху.\",\"quotes\":[\"the lizard … depicted either in profile or looking down on it from above\"],\"location\":{\"en\":\"[02:59]\",\"ru\":\"[02:59]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"34\":{\"part\":4,\"en\":\"Trade. Archaeologists considered whether trade brought distant groups into contact, but this explanation was rejected.\",\"ru\":\"Торговля. Археологи предполагали, что далёкие группы контактировали через торговлю, но это объяснение не подтвердилось.\",\"quotes\":[\"archaeologists believed that trade must have brought people together … But this didn’t prove to be the case\"],\"location\":{\"en\":\"[03:26]\",\"ru\":\"[03:26]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"35\":{\"part\":4,\"en\":\"Survival. The first images may have been shaped by the need to recognise helpful or harmful things quickly.\",\"ru\":\"Выживание. Первые изображения могли быть связаны с необходимостью быстро распознавать полезные и опасные объекты.\",\"quotes\":[\"this was important, actually essential, because in an environment full of constant danger, it was necessary for survival\"],\"location\":{\"en\":\"[03:54]\",\"ru\":\"[03:54]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"Political. Later art also served spiritual, social and political purposes.\",\"ru\":\"Политических. Позднее искусство использовали также в духовных, социальных и политических целях.\",\"quotes\":[\"for spiritual and social purposes, and no doubt for political ones too\"],\"location\":{\"en\":\"[04:11]\",\"ru\":\"[04:11]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"37\":{\"part\":4,\"en\":\"Ships. Aboriginal paintings of ships are described as evidence of contact with Europeans.\",\"ru\":\"Корабли. Изображения кораблей у аборигенов свидетельствуют о контактах с европейцами.\",\"quotes\":[\"the Aborigines began to draw ships which they would have seen along the coast\"],\"location\":{\"en\":\"[05:03]\",\"ru\":\"[05:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"Horses. The lecturer names horses as another unfamiliar European animal depicted in the art.\",\"ru\":\"Лошади. Лектор называет лошадей ещё одним незнакомым животным европейского происхождения, которое изображали на рисунках.\",\"quotes\":[\"Another image that is evidence of European arrival is that of horses\"],\"location\":{\"en\":\"[05:03–05:33]\",\"ru\":\"[05:03–05:33]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"Industry. The lecturer says industrial activity has destroyed thousands of pieces of rock art.\",\"ru\":\"Промышленность. Лектор говорит, что промышленная деятельность уничтожила тысячи образцов наскального искусства.\",\"quotes\":[\"Since the 1960s, industry alone has destroyed around an estimated 10,000 pieces of art\"],\"location\":{\"en\":\"[05:33–05:59]\",\"ru\":\"[05:33–05:59]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"Tourism. Along with erosion, industry and vandalism, tourism is named as another cause of damage.\",\"ru\":\"Туризм. Наряду с эрозией, промышленностью и вандализмом, туризм назван ещё одной причиной разрушения.\",\"quotes\":[\"tourism is another reason why the art is disappearing\"],\"location\":{\"en\":\"[05:59]\",\"ru\":\"[05:59]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
