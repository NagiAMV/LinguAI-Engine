,\"quotes\":[\"my main idea was to find out more about the way people lived there\"],\"location\":{\"en\":\"[01:21]\",\"ru\":\"[01:21]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"22\":{\"part\":3,\"en\":\"C — tourism. Paul says taking tourists around volcanoes was the option he actually chose before later changing projects. Construction and farm work were other possibilities.\",\"ru\":\"C — туризм. Пол выбрал прогулки с туристами вокруг вулканов, прежде чем позже сменил проект. Строительство и работа на фермах были другими вариантами.\",\"quotes\":[\"there was tourism, taking tourists for walks around the volcanoes, which I actually chose to do\"],\"location\":{\"en\":\"[01:50]\",\"ru\":\"[01:50]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"23\":{\"part\":3,\"en\":\"A — the first job was poorly organised. He often did not know whether he was needed and wanted a more structured project.\",\"ru\":\"A — первая работа была плохо организована. Он часто не знал, нужен ли он, и хотел более структурированный проект.\",\"quotes\":[\"I never really knew whether I’d be needed … I wanted to do something that had more of a proper structure\"],\"location\":{\"en\":\"[01:50–02:20]\",\"ru\":\"[01:50–02:20]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"24\":{\"part\":3,\"en\":\"B — develop trust. The relationship improved when villagers became comfortable with Paul and less suspicious.\",\"ru\":\"B — выстраивать доверие. Отношения улучшились, когда жители привыкли к Полу и стали меньше подозревать его.\",\"quotes\":[\"when people became more comfortable with me and less suspicious, we really connected\"],\"location\":{\"en\":\"[02:45]\",\"ru\":\"[02:45]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"25\":{\"part\":3,\"en\":\"C — he was supportive. The manager gave Paul advice and guidance, even though administration was not his strength.\",\"ru\":\"C — он поддерживал Пола. Руководитель давал советы и помогал, хотя административная работа была не его сильной стороной.\",\"quotes\":[\"he gave me lots of advice and guidance\"],\"location\":{\"en\":\"[02:45]\",\"ru\":\"[02:45]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"26\":{\"part\":3,\"en\":\"A — a computer to use. Paul was surprised that the project supplied him with a laptop.\",\"ru\":\"A — компьютер для работы. Пол удивился, что проект предоставил ему ноутбук.\",\"quotes\":[\"they gave me all the equipment I needed, even a laptop\"],\"location\":{\"en\":\"[03:41]\",\"ru\":\"[03:41]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"27\":{\"part\":3,\"en\":\"C — he will not take Gender Studies. Paul says he would be interested if the module focused on village life, not public figures.\",\"ru\":\"C — не будет изучать гендерные исследования. Полу был бы интересен курс о жизни в деревнях, а не о публичной сфере.\",\"quotes\":[\"If it was to do with people in the villages rather than those in the public sphere, I would\"],\"location\":{\"en\":\"[04:34]\",\"ru\":\"[04:34]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"28\":{\"part\":3,\"en\":\"A — he will take Second Language Acquisition. After discussing the value of his practical experience, Paul calls it a definite choice.\",\"ru\":\"A — будет изучать усвоение второго языка. Обсудив пользу практического опыта, Пол решает выбрать этот модуль.\",\"quotes\":[\"I’ll put that down as a definite then\"],\"location\":{\"en\":\"[05:01]\",\"ru\":\"[05:01]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"29\":{\"part\":3,\"en\":\"B — he might take Indigenous Women’s Lives. They agree to ask other students and discuss it again later.\",\"ru\":\"B — возможно, будет изучать жизнь коренных женщин. Они решают сначала спросить других студентов и вернуться к выбору позже.\",\"quotes\":[\"Maybe talk to some other students first, and we can talk about it again later\"],\"location\":{\"en\":\"[05:01–05:26]\",\"ru\":\"[05:01–05:26]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"30\":{\"part\":3,\"en\":\"C — he will not take Portuguese. Paul would rather choose something else after hearing Spanish may interfere with learning it.\",\"ru\":\"C — не будет изучать португальский. Услышав, что испанский может мешать его изучению, Пол предпочитает выбрать другой курс.\",\"quotes\":[\"I’d much sooner do something else, then\"],\"location\":{\"en\":\"[05:26]\",\"ru\":\"[05:26]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
