умаги используют химикаты.\",\"quotes\":[\"It involves chemicals … this is how they remove ink\"],\"location\":{\"en\":\"[03:33]\",\"ru\":\"[03:33]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"26\":{\"part\":3,\"en\":\"Introduction. Alan says he will start writing the introduction because he already has enough information for it.\",\"ru\":\"Введение. Алан берётся за введение, потому что у него уже достаточно материала для этой части.\",\"quotes\":[\"I can start doing that. I think I have enough to go on already\"],\"location\":{\"en\":\"[04:59]\",\"ru\":\"[04:59]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"27\":{\"part\":3,\"en\":\"Council. Melanie will contact the council for information about paper collection rather than visit the resource centre.\",\"ru\":\"Совет. Мелани обратится в городской совет за сведениями о сборе бумаги вместо похода в ресурсный центр.\",\"quotes\":[\"What about contacting the council? … I’ll do that instead\"],\"location\":{\"en\":\"[04:59–05:28]\",\"ru\":\"[04:59–05:28]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"28\":{\"part\":3,\"en\":\"Data. They decide to include data to make the presentation more interesting, instead of adding pictures.\",\"ru\":\"Данные. Они решают добавить данные, чтобы сделать работу интереснее, а не вставлять изображения.\",\"quotes\":[\"what might really bring it to life would be to include some data\"],\"location\":{\"en\":\"[05:28–05:56]\",\"ru\":\"[05:28–05:56]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"29\":{\"part\":3,\"en\":\"First draft. They agree to finish the first draft by the end of the month, before taking a short break.\",\"ru\":\"Первый черновик. Они договариваются закончить первый черновик к концу месяца, прежде чем сделать короткий перерыв.\",\"quotes\":[\"get the first draft done by then\"],\"location\":{\"en\":\"[06:20]\",\"ru\":\"[06:20]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"30\":{\"part\":3,\"en\":\"Tutor. They choose their tutor to review the work; Henry will be away on holiday and cannot do it in time.\",\"ru\":\"Преподаватель. Они просят проверить работу преподавателя: Генри уедет в отпуск и не успеет помочь.\",\"quotes\":[\"the best person would be our tutor\"],\"location\":{\"en\":\"[06:49]\",\"ru\":\"[06:49]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
