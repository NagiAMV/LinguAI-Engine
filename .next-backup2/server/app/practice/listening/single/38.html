oVerified\":false},\"15\":{\"part\":2,\"en\":\"B — visitors should book in advance. Wednesday’s evening wildlife group is small, so participants must phone the ranger a few days beforehand.\",\"ru\":\"B — посетителям нужно записаться заранее. Группа на вечернее наблюдение за природой в среду небольшая, поэтому нужно позвонить рейнджеру за несколько дней.\",\"quotes\":[\"you’ll need to phone the park ranger a few days ahead\"],\"location\":{\"en\":\"[03:44]\",\"ru\":\"[03:44]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"A — wear suitable clothing. Saturday’s work party involves practical outdoor tasks, and clothes may get dirty or torn.\",\"ru\":\"A — прийти в подходящей одежде. В субботу будут практические работы на улице, во время которых одежда может испачкаться или порваться.\",\"quotes\":[\"make sure you’re wearing something that you don’t mind getting dirty or torn\"],\"location\":{\"en\":\"[04:14]\",\"ru\":\"[04:14]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"A — bird hide. It is west of the lake at the end of a path in the northwest of the park.\",\"ru\":\"A — укрытие для наблюдения за птицами. Оно находится к западу от озера, в конце тропы на северо-западе парка.\",\"quotes\":[\"a bird hide to the west of it at the end of a path\"],\"location\":{\"en\":\"[04:43]\",\"ru\":\"[04:43]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"I — dog-walking area. It is in the southern part of the park, branching off from a path near refreshments.\",\"ru\":\"I — зона для выгула собак. Она находится в южной части парка, уходит от тропы рядом с местом, где продают напитки и еду.\",\"quotes\":[\"a dog walking area in the southern part of the park, leading off from the path\"],\"location\":{\"en\":\"[05:10]\",\"ru\":\"[05:10]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"F — flower garden. The garden is the circular area on the plan, surrounded by paths.\",\"ru\":\"F — цветник. На плане это круглая зона, окружённая дорожками.\",\"quotes\":[\"the flower garden. That’s the circular area on the map\"],\"location\":{\"en\":\"[05:10]\",\"ru\":\"[05:10]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"E — wooded area. The woodland is in the western section, between two paths.\",\"ru\":\"E — лесистая зона. Она находится в западной части парка, между двумя дорожками.\",\"quotes\":[\"a wooded area in the western section … between two paths\"],\"location\":{\"en\":\"[05:10]\",\"ru\":\"[05:10]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
