\"],\"location\":{\"en\":\"[02:04]\",\"ru\":\"[02:04]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"13\":{\"part\":2,\"en\":\"C — the forces of nature. Tremain uses fire marks to show the powerful natural forces that shaped the planet.\",\"ru\":\"C — силы природы. Трейман использует следы огня, чтобы показать мощные природные силы, сформировавшие планету.\",\"quotes\":[\"illustrate the ferocity and intensity of the forces that have shaped our planet\"],\"location\":{\"en\":\"[02:29]\",\"ru\":\"[02:29]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"14\":{\"part\":2,\"en\":\"B — it has recently been repaired. The lower-lake path was renovated after flooding and is now level and easy to walk on.\",\"ru\":\"B — её недавно отремонтировали. Дорожку у Нижнего озера восстановили после затопления; теперь она ровная и удобная.\",\"quotes\":[\"We had to renovate this after the lake overflowed … The path’s very level underfoot\"],\"location\":{\"en\":\"[02:53]\",\"ru\":\"[02:53]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"15\":{\"part\":2,\"en\":\"A — it is currently being enlarged. Builders are adding another floor to the Visitor Centre.\",\"ru\":\"A — его сейчас расширяют. Строители добавляют к Visitor Centre ещё один этаж.\",\"quotes\":[\"builders are working there adding another floor\"],\"location\":{\"en\":\"[03:19]\",\"ru\":\"[03:19]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"A — at the kiosk. The Terrace Room is closed, so snacks and sandwiches are sold at the kiosk.\",\"ru\":\"A — в киоске. Terrace Room закрыта, поэтому закуски и сэндвичи можно купить в киоске.\",\"quotes\":[\"The terrace room is currently closed. But you can go to the kiosk\"],\"location\":{\"en\":\"[03:48]\",\"ru\":\"[03:48]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"E — Joe Tremain’s sculptures. The guide places them on this side of the upper lake, behind the Education Centre and near the bridge.\",\"ru\":\"E — скульптуры Джо Треймана. Гид размещает их на этой стороне Верхнего озера, за Education Centre и рядом с мостом.\",\"quotes\":[\"this side of the upper lake just behind the Education Centre and near the bridge\"],\"location\":{\"en\":\"[04:36–05:06]\",\"ru\":\"[04:36–05:06]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"C — Giorgio Catalucci’s bird sculptures. They are across the bridge on the north side of the Lower Lake.\",\"ru\":\"C — птичьи скульптуры Джорджо Каталуччи. Они находятся за мостом, на северном берегу Нижнего озера.\",\"quotes\":[\"just across the bridge on the north side of the Lower Lake\"],\"location\":{\"en\":\"[05:06]\",\"ru\":\"[05:06]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"F — Garden Gallery. From the Education Centre, continue along the path; the gallery is on the right.\",\"ru\":\"F — Garden Gallery. От Education Centre нужно идти дальше по дорожке; галерея будет справа.\",\"quotes\":[\"keep on along the path and you’ll see it on your right\"],\"location\":{\"en\":\"[05:36]\",\"ru\":\"[05:36]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"A — Long House. Cross the bridge, turn left, and follow the winding path uphill to the northern boundary.\",\"ru\":\"A — Long House. Перейдите мост, поверните налево и идите по извилистой тропе вверх к северной границе.\",\"quotes\":[\"go to the bridge and then turn left … winding pathway going up towards the northern boundary\"],\"location\":{\"en\":\"[05:36–06:05]\",\"ru\":\"[05:36–06:05]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
