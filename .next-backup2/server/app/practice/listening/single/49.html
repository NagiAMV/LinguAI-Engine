t at the beginning, so new recruits learn the rules of the system immediately\"],\"location\":{\"en\":\"[05:21]\",\"ru\":\"[05:21]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"28\":{\"part\":3,\"en\":\"Culture. Managers need to understand employees and recognise the organisation’s culture.\",\"ru\":\"Культуру. Руководителям нужно понимать сотрудников и учитывать культуру организации.\",\"quotes\":[\"recognize the culture of the organization\"],\"location\":{\"en\":\"[05:51]\",\"ru\":\"[05:51]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"29\":{\"part\":3,\"en\":\"Profit. During change, the company may prioritise profit over employees’ individual needs.\",\"ru\":\"Прибыль. Во время изменений компания может поставить прибыль выше индивидуальных потребностей сотрудников.\",\"quotes\":[\"give priority to profit rather than individual staff needs\"],\"location\":{\"en\":\"[06:20]\",\"ru\":\"[06:20]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"30\":{\"part\":3,\"en\":\"Stress. The discussion says managers may have to cope with high levels of personal stress during change.\",\"ru\":\"Стресс. В разговоре говорится, что во время перемен руководителям приходится справляться с сильным личным стрессом.\",\"quotes\":[\"deal with quite high levels of personal stress\"],\"location\":{\"en\":\"[06:20–06:47]\",\"ru\":\"[06:20–06:47]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
