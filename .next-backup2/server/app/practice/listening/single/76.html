t the very first painters based their image on\"],\"location\":{\"en\":\"[04:40]\",\"ru\":\"[04:40]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"Sea levels. At the end of the Ice Age, rising sea levels disrupted the environment.\",\"ru\":\"Уровень моря. В конце ледникового периода повышение уровня моря изменило окружающую среду.\",\"quotes\":[\"sea levels rising and creeping steadily inland\"],\"location\":{\"en\":\"[04:40]\",\"ru\":\"[04:40]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"Hunting. The environmental changes disrupted traditional life, especially hunting.\",\"ru\":\"Охоту. Изменения среды нарушили традиционный уклад жизни, особенно охоту.\",\"quotes\":[\"disruption to traditional patterns of life, hunting in particular\"],\"location\":{\"en\":\"[04:40]\",\"ru\":\"[04:40]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"Creation. Aboriginal people see the Rainbow Serpent as a symbol of creation.\",\"ru\":\"Сотворение. Аборигены считают Радужного змея символом сотворения мира.\",\"quotes\":[\"Aborigines see the Rainbow Serpent as a symbol of creation\"],\"location\":{\"en\":\"[05:39]\",\"ru\":\"[05:39]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
