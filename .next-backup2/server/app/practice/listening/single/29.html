ий.\",\"quotes\":[\"from 10.30 holidaymakers are expected to be quiet\"],\"location\":{\"en\":\"[03:16]\",\"ru\":\"[03:16]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"15\":{\"part\":2,\"en\":\"C — it must be arranged at the time of booking. If customers do not have annual cover, they must take the company policy out when making the reservation.\",\"ru\":\"C — страховку нужно оформить при бронировании. Если у туристов нет годового полиса, страховку компании нужно приобрести в момент оформления отдыха.\",\"quotes\":[\"we require that you arrange this when you make your holiday reservation\"],\"location\":{\"en\":\"[03:47]\",\"ru\":\"[03:47]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"A — a free gift. Customers who recommend the company receive a thank-you present; their friends receive the discount or tent upgrade.\",\"ru\":\"A — бесплатный подарок. Клиенты, рекомендующие компанию, получают благодарственный подарок; скидку или улучшение палатки получают их друзья.\",\"quotes\":[\"we’ll send you a thank you present\"],\"location\":{\"en\":\"[04:17]\",\"ru\":\"[04:17]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"C — available on request. Guests need to ask in advance for a barbecue.\",\"ru\":\"C — по запросу. Гостям нужно заранее попросить выдать барбекю.\",\"quotes\":[\"you can borrow a barbecue if you ask in advance\"],\"location\":{\"en\":\"[05:13]\",\"ru\":\"[05:13]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"A — provided in all tents. A box of games and toys is available inside the tents.\",\"ru\":\"A — есть во всех палатках. Внутри палаток находится коробка с играми и игрушками.\",\"quotes\":[\"Inside, a box of games and toys can be found\"],\"location\":{\"en\":\"[05:13]\",\"ru\":\"[05:13]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"C — available on request. Guests can ask for a cool box to keep food and drinks cold for a day out.\",\"ru\":\"C — по запросу. Для поездки на пляж можно попросить термоконтейнер, чтобы сохранить еду и напитки холодными.\",\"quotes\":[\"which will keep your food and drinks chilled\"],\"location\":{\"en\":\"[05:13–05:44]\",\"ru\":\"[05:13–05:44]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"B — in central areas. Mops and buckets are kept with the laundry facilities in the central areas of each site.\",\"ru\":\"B — в центральных зонах. Швабры и вёдра находятся вместе со стиральными удобствами в центральных зонах кемпинга.\",\"quotes\":[\"in the central areas, along with mops and buckets\"],\"location\":{\"en\":\"[05:44]\",\"ru\":\"[05:44]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
