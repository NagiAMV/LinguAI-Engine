st figurine-making activity is said to have centred there.\",\"ru\":\"Южная Европа. По словам лектора, именно там было сосредоточено изготовление первых фигурок.\",\"quotes\":[\"this activity was centred around Southern Europe\"],\"location\":{\"en\":\"[02:44]\",\"ru\":\"[02:44]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"33\":{\"part\":4,\"en\":\"Water. The porous early pots could carry water but could not store it for a long time.\",\"ru\":\"Воду. Ранние пористые горшки могли переносить воду, но не могли долго её хранить.\",\"quotes\":[\"they could carry water in them, it wasn’t possible to store it over a long period\"],\"location\":{\"en\":\"[03:07]\",\"ru\":\"[03:07]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"34\":{\"part\":4,\"en\":\"Minerals. Adding minerals improved the appearance and strength of Chinese ceramics.\",\"ru\":\"Минералы. Добавление минералов улучшило внешний вид и прочность китайской керамики.\",\"quotes\":[\"by adding minerals to the clay, they could improve both the appearance and the strength\"],\"location\":{\"en\":\"[03:34]\",\"ru\":\"[03:34]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"35\":{\"part\":4,\"en\":\"White gold. Porcelain became so valuable that it acquired this nickname.\",\"ru\":\"Белое золото. Фарфор стал настолько ценным, что получил такое название.\",\"quotes\":[\"it became so valuable that it was known as white gold\"],\"location\":{\"en\":\"[04:03]\",\"ru\":\"[04:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"China stone. Böttger combined quartz and China stone with clay to produce porcelain.\",\"ru\":\"Китайский камень. Бёттгер добавлял кварц и китайский камень к глине, чтобы получить фарфор.\",\"quotes\":[\"adding quartz and a material called China stone to … clay\"],\"location\":{\"en\":\"[04:59]\",\"ru\":\"[04:59]\"},\"basis\":\"question-and-current-transcript\",\"
