 to many countries.\",\"ru\":\"C — их продают за рубеж. Австралия экспортирует местных пчелиных маток во многие страны.\",\"quotes\":[\"Australia exports native queen bees to a large number of countries\"],\"location\":{\"en\":\"[02:28]\",\"ru\":\"[02:28]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"24\":{\"part\":3,\"en\":\"A — the economy would be affected. The value of native-bee pollination is estimated at $1.2 billion a year, so losing it would cost money.\",\"ru\":\"A — пострадает экономика. Опыление местными пчёлами оценивается в 1,2 миллиарда долларов в год, поэтому их исчезновение повлечёт убытки.\",\"quotes\":[\"We could lose a lot of money … pollination … is worth $1.2 billion a year\"],\"location\":{\"en\":\"[02:58]\",\"ru\":\"[02:58]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"25\":{\"part\":3,\"en\":\"Insects. Rainbow bee eaters eat insects; the remains are later coughed up in pellets.\",\"ru\":\"Насекомых. Радужные пчелоеды питаются насекомыми, а их остатки отрыгивают в виде погадок.\",\"quotes\":[\"The bee eater doesn’t care what it eats, as long as they’re insects\"],\"location\":{\"en\":\"[03:27–04:32]\",\"ru\":\"[03:27–04:32]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"26\":{\"part\":3,\"en\":\"Feeding. Researchers collect pellets at the birds’ favourite feeding spots.\",\"ru\":\"Кормления. Исследователи собирают погадки в местах, где птицы обычно кормятся.\",\"quotes\":[\"find their favourite feeding spots … It’s here that we can find the pellets\"],\"location\":{\"en\":\"[05:01]\",\"ru\":\"[05:01]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"27\":{\"part\":3,\"en\":\"Laboratory. The collected pellets are taken there for examination.\",\"ru\":\"Лабораторию. Собранные погадки относят туда для анализа.\",\"quotes\":[\"take them back to the laboratory to examine the contents\"],\"location\":{\"en\":\"[05:01]\",\"ru\":\"[05:01]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"28\":{\"part\":3,\"en\":\"Water. Researchers add it to soften the hard pellets before examining them.\",\"ru\":\"Воду. Её добавляют, чтобы размягчить твёрдые погадки перед исследованием.\",\"quotes\":[\"adding water to moisten them and make them softer\"],\"location\":{\"en\":\"[05:01]\",\"ru\":\"[05:01]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"29\":{\"part\":3,\"en\":\"Wings. The researchers separate and identify wings to detect Asian bees.\",\"ru\":\"Крылья. Исследователи отделяют и определяют крылья, чтобы обнаружить азиатских пчёл.\",\"quotes\":[\"we’re looking for wings … identify them to see if we can find any Asian bee wings\"],\"location\":{\"en\":\"[05:31]\",\"ru\":\"[05:31]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"30\":{\"part\":3,\"en\":\"Reliable. The speaker says this method gives a more reliable result than searching for live bees.\",\"ru\":\"Надёжным. Докладчик говорит, что этот метод даёт более надёжный результат, чем поиск живых пчёл.\",\"quotes\":[\"much more reliable than trying to find live ones\"],\"location\":{\"en\":\"[05:31]\",\"ru\":\"[05:31]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
