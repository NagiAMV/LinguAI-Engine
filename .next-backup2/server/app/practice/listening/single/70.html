]\",\"ru\":\"[03:56]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"Two directions. Hockey sticks must be used in both directions, making mixed laterality advantageous.\",\"ru\":\"В двух направлениях. Клюшкой нужно играть в обе стороны, поэтому смешанное доминирование полезно.\",\"quotes\":[\"a hockey stick must be deployed in two directions\"],\"location\":{\"en\":\"[04:58]\",\"ru\":\"[04:58]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"37\":{\"part\":4,\"en\":\"Confident. Mixed-handed hockey players were found to be more confident than single-handed players.\",\"ru\":\"Уверенными. Игроки в хоккей со смешанным доминированием оказались увереннее игроков с доминированием одной стороны.\",\"quotes\":[\"mixed-handed hockey players were significantly more confident\"],\"location\":{\"en\":\"[05:28]\",\"ru\":\"[05:28]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"Vision. Matching the dominant hand and eye gives a larger field of vision on the side where the action occurs.\",\"ru\":\"Зрения. Совпадение доминирующих руки и глаза расширяет поле зрения со стороны, где происходит игра.\",\"quotes\":[\"there is a bigger area of vision on the side where most of the action occurs\"],\"location\":{\"en\":\"[05:56]\",\"ru\":\"[05:56]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"Corrections. Cross-lateral tennis players see the racket later and can only correct their swing at a later point.\",\"ru\":\"Корректировки. При перекрёстном доминировании теннисисты позже замечают ракетку и позднее могут исправить движение.\",\"quotes\":[\"they can only make corrections much later\"],\"location\":{\"en\":\"[05:56]\",\"ru\":\"[05:56]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"Balance. Cross hand-eye laterality helps gymnasts balance, whic
