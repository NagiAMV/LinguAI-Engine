ти города, хотя агент говорит, что это может быть сложно.\",\"quotes\":[\"It’d be nice to be central\"],\"location\":{\"en\":\"[02:58]\",\"ru\":\"[02:58]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"2\":{\"part\":1,\"en\":\"600. They would prefer about £500 monthly but can pay up to £600 and cannot exceed it.\",\"ru\":\"600. Они предпочли бы платить около £500 в месяц, но могут поднять сумму до £600; больше платить не могут.\",\"quotes\":[\"we could go up to £600 … can’t go beyond that\"],\"location\":{\"en\":\"[02:58]\",\"ru\":\"[02:58]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"3\":{\"part\":1,\"en\":\"2 years. They are at college for two years and hope to avoid moving during that period.\",\"ru\":\"2 года. Они учатся в колледже два года и хотят не переезжать в течение этого срока.\",\"quotes\":[\"We’re at college here for two years\"],\"location\":{\"en\":\"[03:27]\",\"ru\":\"[03:27]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"4\":{\"part\":1,\"en\":\"Garage. The Oakington Avenue house has no garage, which the renters would prefer to have.\",\"ru\":\"Гараж. У дома на Oakington Avenue нет гаража, а арендаторы предпочли бы, чтобы он был.\",\"quotes\":[\"It doesn’t have a garage … We’d prefer to have one\"],\"location\":{\"en\":\"[03:58]\",\"ru\":\"[03:58]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"5\":{\"part\":1,\"en\":\"Garden. The garden at the Mead Street house is large, and the renters worry they will be too busy to maintain it.\",\"ru\":\"Сад. У дома на Mead Street большой сад, и арендаторы опасаются, что будут слишком заняты, чтобы за ним ухаживать.\",\"quotes\":[\"there’s a big garden … We’ll be too busy to look after it\"],\"location\":{\"en\":\"[04:23]\",\"ru\":\"[04:23]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"6\":{\"part\":1,\"en\":\"Study. The Hamilton Road house has a living room, kitchen-diner and a study.\",\"ru\":\"Кабинет. В доме на Hamilton Road есть гостиная, кухня-столовая и кабинет.\",\"quotes\":[\"it has a study\"],\"location\":{\"en\":\"[04:23]\",\"ru\":\"[04:23]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"7\":{\"part\":1,\"en\":\"Noisy. The western end of Hamilton Road is lively, so Steven expects it to be noisy.\",\"ru\":\"Шумный. Западная часть Hamilton Road оживлённая, поэтому Стивен считает, что там будет шумно.\",\"quotes\":[\"That’ll be very noisy\"],\"location\":{\"en\":\"[04:52]\",\"ru\":\"[04:52]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"8\":{\"part\":1,\"en\":\"595. The Devon Close house costs £595 per month; its rent is lower because it has not been redecorated recently.\",\"ru\":\"595. Дом на Devon Close стоит £595 в месяц; аренда ниже, потому что его давно не ремонтировали и не декорировали.\",\"quotes\":[\"it’s 595 a month\"],\"location\":{\"en\":\"[04:52]\",\"ru\":\"[04:52]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"9\":{\"part\":1,\"en\":\"B — concert hall. They say the existing hall will only be replaced next year, so it is still open now.\",\"ru\":\"B — концертный зал. Его заменят только в следующем году, значит сейчас он ещё открыт.\",\"quotes\":[\"replace the existing concert hall with a larger one … due to start next year\"],\"location\":{\"en\":\"[06:03]\",\"ru\":\"[06:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"10\":{\"part\":1,\"en\":\"E — swimming pool. It has already opened ahead of schedule and is attracting visitors.\",\"ru\":\"E — бассейн. Он уже открылся раньше срока и привлекает посетителей.\",\"quotes\":[\"the swimming pools already opened ahead of schedule\"],\"location\":{\"en\":\"[06:03]\",\"ru\":\"[06:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
