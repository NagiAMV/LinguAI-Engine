d-current-transcript\",\"audioVerified\":false},\"15\":{\"part\":2,\"en\":\"Tower Restaurant. This is the attraction at stop B, where visitors can enjoy refreshments.\",\"ru\":\"Tower Restaurant. Это место находится у остановки B; там можно заказать напитки и закуски.\",\"quotes\":[\"Stop B. Why don’t you visit Tower Restaurant?\"],\"location\":{\"en\":\"[02:09]\",\"ru\":\"[02:09]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"Views. The Tower Restaurant offers good views over the city centre.\",\"ru\":\"Виды. Из Tower Restaurant открывается хороший вид на центр города.\",\"quotes\":[\"enjoy the wonderful views over … the city\"],\"location\":{\"en\":\"[02:09]\",\"ru\":\"[02:09]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"History. The museum shop specialises in books about the local area’s history.\",\"ru\":\"История. В музейном магазине продаются книги по истории этого района.\",\"quotes\":[\"a good range of local history books\"],\"location\":{\"en\":\"[02:40]\",\"ru\":\"[02:40]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"Seven-screen. The entertainment complex has a seven-screen cinema, plus bowling and arcade games.\",\"ru\":\"Семь залов. В развлекательном комплексе есть кинотеатр с семью залами, боулинг и игровые автоматы.\",\"quotes\":[\"seven-screen cinema\"],\"location\":{\"en\":\"[02:40]\",\"ru\":\"[02:40]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"Every 20 minutes. Top Bus tours depart on this schedule from 8:30 a.m.\",\"ru\":\"Каждые 20 минут. Автобусы Top Bus отправляются с таким интервалом начиная с 8:30 утра.\",\"quotes\":[\"Tours leave from 8.30 a.m. every 20 minutes\"],\"location\":{\"en\":\"[03:29]\",\"ru\":\"[03:29]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"Centra
