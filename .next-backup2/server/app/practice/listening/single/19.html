0 000. Компания предлагает страховку на случай отмены поездки до £10 000 — больше, чем £8 000 в другом полисе.\",\"quotes\":[\"our maximum is £10,000\"],\"location\":{\"en\":\"[07:14]\",\"ru\":\"[07:14]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"7\":{\"part\":1,\"en\":\"Relative. If the traveller is hospitalised, the policy can pay for a relative to travel to the resort.\",\"ru\":\"Родственник. Если путешественник попадёт в больницу, полис может оплатить поездку родственника на курорт.\",\"quotes\":[\"we also allow a relative to travel to your holiday resort\"],\"location\":{\"en\":\"[07:42]\",\"ru\":\"[07:42]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"8\":{\"part\":1,\"en\":\"Missed departure. This benefit covers missing the flight, with payment up to £1,000 depending on the reason.\",\"ru\":\"Пропуск отправления. Эта выплата покрывает ситуацию, когда пассажир опоздал на рейс; сумма — до £1 000 в зависимости от причины.\",\"quotes\":[\"We pay up to a thousand pounds for that\"],\"location\":{\"en\":\"[08:10]\",\"ru\":\"[08:10]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"9\":{\"part\":1,\"en\":\"Item. Personal belongings are covered up to £3,000, with a £500 limit for any single item.\",\"ru\":\"Вещь. Личные вещи застрахованы на сумму до £3 000, но не более £500 за одну вещь.\",\"quotes\":[\"not more than five hundred pounds for a single item\"],\"location\":{\"en\":\"[08:10]\",\"ru\":\"[08:10]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"10\":{\"part\":1,\"en\":\"Ludlow. The assistant manager gives his surname and spells it L-U-D-L-O-W.\",\"ru\":\"Ludlow. Помощник управляющего называет фамилию и диктует её по буквам: L-U-D-L-O-W.\",\"quotes\":[\"Ben Ludlow. That’s L-U-D-L-O-W\"],\"location\":{\"en\":\"[08:38]\",\"ru\":\"[08:38]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
