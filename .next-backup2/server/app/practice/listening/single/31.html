day holiday … with eight days actual walking\"],\"location\":{\"en\":\"[00:51–01:20]\",\"ru\":\"[00:51–01:20]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"12\":{\"part\":2,\"en\":\"65%. Around 35% covers expenses, leaving 65% guaranteed for charity.\",\"ru\":\"65%. Около 35% покрывает расходы, поэтому 65% гарантированно идут на благотворительность.\",\"quotes\":[\"35% will go on your expenses, and that leaves 65% … to go to the charity\"],\"location\":{\"en\":\"[01:20]\",\"ru\":\"[01:20]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"13\":{\"part\":2,\"en\":\"A — student. Each walker’s sponsorship supports an individual special-needs pupil.\",\"ru\":\"A — ученик. Спонсорские деньги каждого участника поддерживают отдельного ученика с особыми потребностями.\",\"quotes\":[\"will go to help an individual special needs pupil\"],\"location\":{\"en\":\"[01:49]\",\"ru\":\"[01:49]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"14\":{\"part\":2,\"en\":\"C — already very fit. The speaker says participants must be extremely fit before they start.\",\"ru\":\"C — уже очень хорошую. Выступающий говорит, что до начала похода участникам необходимо быть в отличной физической форме.\",\"quotes\":[\"you will need to be extremely fit\"],\"location\":{\"en\":\"[02:50]\",\"ru\":\"[02:50]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"15\":{\"part\":2,\"en\":\"B — some of your belongings. Local assistants carry bedding and other equipment; walkers carry only a small day rucksack.\",\"ru\":\"B — часть вещей. Местные помощники несут постельные принадлежности и другое снаряжение; участники идут только с небольшим дневным рюкзаком.\",\"quotes\":[\"Your bedding and so forth will be carried by them … only walk with a small rucksack\"],\"location\":{\"en\":\"[02:50]\",\"ru\":\"[02:50]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"A — making carpets. The region has been famous for carpet-making for centuries; blanket weaving and wood carving are newer trends.\",\"ru\":\"A — изготовление ковров. Регион известен ковроткачеством уже много веков; производство одеял и резьба по дереву стали популярны позже.\",\"quotes\":[\"famous for centuries for making beautiful carpets\"],\"location\":{\"en\":\"[03:20]\",\"ru\":\"[03:20]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"Forest. Day 3 is spent walking through the Khatiba forest for the whole day.\",\"ru\":\"Лес. На третий день участники весь день идут через лес Хатиба.\",\"quotes\":[\"walking through the enormous Khatiba forest, which will take the whole of the day\"],\"location\":{\"en\":\"[04:43]\",\"ru\":\"[04:43]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"Temple. On day 6 they visit Kumi temple, known for its 12th-century carvings.\",\"ru\":\"Храм. На шестой день участники посещают храм Куми с резьбой XII века.\",\"quotes\":[\"the spectacular Kumi temple with 12th century carvings\"],\"location\":{\"en\":\"[05:11]\",\"ru\":\"[05:11]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"Waterfall. The hardest walking day ends with a swim at Aparte Falls.\",\"ru\":\"Водопад. Самый трудный день похода заканчивается купанием у водопада Апарте.\",\"quotes\":[\"culminating a swim in Aparte Falls\"],\"location\":{\"en\":\"[05:11]\",\"ru\":\"[05:11]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"Village. Day 9 includes a visit to a village where red blankets are made.\",\"ru\":\"Деревня. На девятый день группа посещает деревню, где делают красные одеяла.\",\"quotes\":[\"part of the day spent in a village where they make some of the gorgeous red blankets\"],\"location\":{\"en\":\"[05:11]\",\"ru\":\"[05:11]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
