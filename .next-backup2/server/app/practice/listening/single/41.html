а, но на самом деле она просто очень долго переключает экраны.\",\"quotes\":[\"it just takes ages to go from one screen to the next\"],\"location\":{\"en\":\"[02:01]\",\"ru\":\"[02:01]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"23\":{\"part\":3,\"en\":\"B — the system does not handle course options. The increase in courses is manageable; the difficulty is that the system cannot include their options.\",\"ru\":\"B — система не обрабатывает варианты курсов. Проблема не только в росте числа курсов: программа не умеет учитывать варианты внутри них.\",\"quotes\":[\"many of them have options … the system … doesn’t\"],\"location\":{\"en\":\"[02:01–02:29]\",\"ru\":\"[02:01–02:29]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"24\":{\"part\":3,\"en\":\"A — students should create their own timetables. Randhir proposes an online fixed schedule that students can use to work out their choices.\",\"ru\":\"A — студенты должны составлять расписание сами. Рандхир предлагает онлайн-расписание курсов и вариантов, по которому студенты смогут выбрать их самостоятельно.\",\"quotes\":[\"students can use to do their scheduling … work it out for themselves\"],\"location\":{\"en\":\"[02:59–03:29]\",\"ru\":\"[02:59–03:29]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"25\":{\"part\":3,\"en\":\"C — it may be more economical. A new system takes longer to build but may save money in the long run.\",\"ru\":\"C — она может оказаться экономичнее. Новая система разрабатывается дольше, но в перспективе может сэкономить деньги.\",\"quotes\":[\"it may save you money in the long run\"],\"location\":{\"en\":\"[03:29]\",\"ru\":\"[03:29]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"26\":{\"part\":3,\"en\":\"B — four or five months. The existing system could be improved by April or May, several months after the January conversation.\",\"ru\":\"B — четыре или пять месяцев. Систему можно у
