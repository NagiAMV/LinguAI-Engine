s are only being considered.\",\"ru\":\"C — козы и куры. Эти животные уже есть в секции редких пород; коров и лошадей только планируют завести.\",\"quotes\":[\"We keep goats, sheep and hens … thinking of bringing cows and horses\"],\"location\":{\"en\":\"[04:05]\",\"ru\":\"[04:05]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"B — to keep a variety of breeds. The key aim is maintaining breed diversity and widening the gene pool.\",\"ru\":\"B — сохранять разнообразие пород. Основная цель — поддерживать разнообразие пород и расширять генофонд.\",\"quotes\":[\"main purpose … to maintain the diversity of breeds\"],\"location\":{\"en\":\"[04:36]\",\"ru\":\"[04:36]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"C — a fishing demonstration. John Havers is currently giving fly-fishing displays on the lake.\",\"ru\":\"C — демонстрацию рыбалки. Джон Хейверс сейчас проводит на озере показательные выступления по нахлыстовой рыбалке.\",\"quotes\":[\"currently giving displays on the lake\"],\"location\":{\"en\":\"[05:05]\",\"ru\":\"[05:05]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"A — animals. The shop has books on wildlife, alongside books about farming history.\",\"ru\":\"A — животные. В магазине есть книги о дикой природе, а также книги по истории сельского хозяйства.\",\"quotes\":[\"a wide selection of books on wildlife\"],\"location\":{\"en\":\"[05:33]\",\"ru\":\"[05:33]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
