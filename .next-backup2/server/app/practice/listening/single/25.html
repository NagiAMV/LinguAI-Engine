"ru\":\"[04:53]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"A — possible to get lost. Silver River is densely forested and poorly signposted, so good map-reading skills are needed.\",\"ru\":\"A — можно заблудиться. На Silver River густой лес и плохие указатели, поэтому важно уметь ориентироваться по карте.\",\"quotes\":[\"the signposting isn’t very good … avoid becoming disoriented\"],\"location\":{\"en\":\"[05:23]\",\"ru\":\"[05:23]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"C — requires physical strength. Valley Crossing has large rocks that require a good level of fitness to get over.\",\"ru\":\"C — требует физической силы. На Valley Crossing есть крупные камни, через которые нужно перебираться в хорошей физической форме.\",\"quotes\":[\"level of fitness required to get over some pretty big rocks\"],\"location\":{\"en\":\"[05:51]\",\"ru\":\"[05:51]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"C — requires physical strength. Stonebridge is short but very steep, so walkers need to be in good condition.\",\"ru\":\"C — требует физической силы. Маршрут Stonebridge короткий, но очень крутой; нужна хорошая физическая форма.\",\"quotes\":[\"very steep … you do need to be in good condition\"],\"location\":{\"en\":\"[05:51]\",\"ru\":\"[05:51]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"A — possible to get lost. If cloud descends on Henderson Ridge, it is easy to wander off the track.\",\"ru\":\"A — можно заблудиться. На Henderson Ridge при спускающемся тумане легко сбиться с тропы.\",\"quotes\":[\"if the cloud suddenly descends, it’s all too easy to wander off the track\"],\"location\":{\"en\":\"[06:21]\",\"ru\":\"[06:21]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
