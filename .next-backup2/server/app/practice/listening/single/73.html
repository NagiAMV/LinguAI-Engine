ified\":false},\"38\":{\"part\":4,\"en\":\"Distortion. A flat map cannot perfectly represent a three-dimensional planet.\",\"ru\":\"Искажение. Плоская карта не может безупречно изобразить трёхмерную планету.\",\"quotes\":[\"there’ll always be a certain degree of distortion on a map\"],\"location\":{\"en\":\"[05:28]\",\"ru\":\"[05:28]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"Traffic. Aerial photographs can show how much traffic is on roads.\",\"ru\":\"Движение. Аэрофотоснимки могут показать интенсивность движения на дорогах.\",\"quotes\":[\"how much traffic is on the roads at a given time\"],\"location\":{\"en\":\"[05:53]\",\"ru\":\"[05:53]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"Weather. Landsat images provide information about weather conditions.\",\"ru\":\"Погоду. Снимки Landsat дают информацию о погодных условиях.\",\"quotes\":[\"the information they give us about the weather\"],\"location\":{\"en\":\"[06:23]\",\"ru\":\"[06:23]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
