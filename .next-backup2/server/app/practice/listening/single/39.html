 открытия; 50 000 — число посетителей в год.\",\"quotes\":[\"A million and a half people have been through our door since we opened\"],\"location\":{\"en\":\"[02:24]\",\"ru\":\"[02:24]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"14\":{\"part\":2,\"en\":\"E — engine maintenance. Simon now looks after the mechanical side and keeps the trains running.\",\"ru\":\"E — обслуживание двигателей. Саймон отвечает за механическую часть и поддерживает поезда в рабочем состоянии.\",\"quotes\":[\"looking after the mechanical side of things, keeping the trains going\"],\"location\":{\"en\":\"[03:27]\",\"ru\":\"[03:27]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"15\":{\"part\":2,\"en\":\"H — staffing. Liz recruits and supports the workers who keep the park operating.\",\"ru\":\"H — работа с персоналом. Лиз нанимает и поддерживает сотрудников, благодаря которым парк работает.\",\"quotes\":[\"recruiting and supporting the large squadron of workers\"],\"location\":{\"en\":\"[03:27]\",\"ru\":\"[03:27]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"F — food and drink. Sarah makes sure the visitors are fed and watered.\",\"ru\":\"F — еда и напитки. Сара следит за тем, чтобы посетители могли поесть и попить.\",\"quotes\":[\"makes sure the visitors are kept fed and watered\"],\"location\":{\"en\":\"[03:51]\",\"ru\":\"[03:51]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"C — building. Duncan has taken over the construction area from Simon.\",\"ru\":\"C — строительство. Дункан перенял у Саймона направление строительных работ.\",\"quotes\":[\"taking over from me … the area of construction\"],\"location\":{\"en\":\"[03:51]\",\"ru\":\"[03:51]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"G — sales. Judith is in charge of retail, which is growing as visitors buy souvenirs.\",\"ru\":\"G — продажи. Джудит отвечает за розничную торговлю; это направление растёт благодаря сувенирам.\",\"quotes\":[\"Judith has also joined the team in charge of retail\"],\"location\":{\"en\":\"[03:51–04:19]\",\"ru\":\"[03:51–04:19]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"120. The go-kart arena covers 120 square metres.\",\"ru\":\"120. Площадь арены для картинга составляет 120 квадратных метров.\",\"quotes\":[\"120 square meters in area\"],\"location\":{\"en\":\"[04:49]\",\"ru\":\"[04:49]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"5 to 12. The go-kart track is intended for children aged five through twelve.\",\"ru\":\"От 5 до 12. Трасса для картинга предназначена для детей от пяти до двенадцати лет.\",\"quotes\":[\"enable 5 to 12 year olds to use the Go Karts\"],\"location\":{\"en\":\"[04:49]\",\"ru\":\"[04:49]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
