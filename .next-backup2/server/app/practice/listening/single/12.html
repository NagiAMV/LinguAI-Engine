 Сотрудник читает номер паспорта вслух; важно отличать букву J от следующего за ней нуля.\",\"quotes\":[\"Your passport number is J06337\"],\"location\":{\"en\":\"[03:12]\",\"ru\":\"[03:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"3\":{\"part\":1,\"en\":\"Four months. Keiko plans to stay about four months, though she may stay longer if she likes the arrangement.\",\"ru\":\"Четыре месяца. Кейко планирует прожить около четырёх месяцев, хотя может остаться дольше, если ей понравится.\",\"quotes\":[\"About four months. Longer if I like it\"],\"location\":{\"en\":\"[03:41]\",\"ru\":\"[03:41]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"4\":{\"part\":1,\"en\":\"Advanced English Studies. She names this course and explains that she wants help with her writing.\",\"ru\":\"Advanced English Studies. Она называет этот курс и объясняет, что хочет улучшить письменную речь.\",\"quotes\":[\"I’ve enrolled … in the Advanced English Studies\"],\"location\":{\"en\":\"[03:41]\",\"ru\":\"[03:41]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"5\":{\"part\":1,\"en\":\"Children. She would prefer not to live with young children; she wants a family with adults around her age.\",\"ru\":\"Дети. Она предпочла бы не жить с маленькими детьми и хотела бы поселиться у взрослых примерно её возраста.\",\"quotes\":[\"I like young children, but I’d like to be with older people\"],\"location\":{\"en\":\"[04:11]\",\"ru\":\"[04:11]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"6\":{\"part\":1,\"en\":\"Pets. Keiko has no objection to pets—in fact, as a veterinarian, she welcomes them.\",\"ru\":\"Домашние животные. Кейко не возражает против животных; наоборот, как ветеринар она им рада.\",\"quotes\":[\"I am a veterinarian, so that’s fine. The more the better\"],\"location\":{\"en\":\"[04:11]\",\"ru\":\"[04:11]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"7\":{\"part\":1,\"en\":\"Seafood. Asked what she particularly likes to eat, she says she really likes seafood.\",\"ru\":\"Морепродукты. На вопрос о предпочтениях в еде она отвечает, что очень любит морепродукты.\",\"quotes\":[\"I really like seafood\"],\"location\":{\"en\":\"[05:02]\",\"ru\":\"[05:02]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"8\":{\"part\":1,\"en\":\"Tennis. She tried handball but stopped; the sport she currently plays is tennis.\",\"ru\":\"Теннис. Она пробовала гандбол, но бросила; сейчас она играет в теннис.\",\"quotes\":[\"Now I play tennis on the weekend\"],\"location\":{\"en\":\"[05:34]\",\"ru\":\"[05:34]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"9\":{\"part\":1,\"en\":\"Train. Although she has used the bus, it is often late; she prefers travelling by train because it is faster.\",\"ru\":\"Поезд. Она ездила на автобусе, но он часто опаздывает; поезд ей больше нравится, потому что он быстрее.\",\"quotes\":[\"I like catching the train. They are much faster\"],\"location\":{\"en\":\"[05:34–06:03]\",\"ru\":\"[05:34–06:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"10\":{\"part\":1,\"en\":\"This afternoon. The officer says she will check the records and give Keiko the homestay details this afternoon.\",\"ru\":\"Сегодня днём. Сотрудник проверит записи и сообщит Кейко адрес проживания сегодня днём.\",\"quotes\":[\"I’ll check my records and I’ll give you details this afternoon\"],\"location\":{\"en\":\"[06:03]\",\"ru\":\"[06:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
