. Семья привезёт свою, поэтому меблированное жильё им не требуется.\",\"quotes\":[\"what we don’t need is any furniture … we’ll be shipping all that over\"],\"location\":{\"en\":\"[04:10]\",\"ru\":\"[04:10]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"6\":{\"part\":1,\"en\":\"Fridge. They will sell their current one and would prefer the apartment to include a fridge.\",\"ru\":\"Холодильник. Они продадут свой нынешний и хотели бы, чтобы в квартире был холодильник.\",\"quotes\":[\"we’d like the apartment to have one\"],\"location\":{\"en\":\"[04:43]\",\"ru\":\"[04:43]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"7\":{\"part\":1,\"en\":\"School. The agent suggests being near a school because Jane has a son, and she agrees.\",\"ru\":\"Школа. Агент предлагает жильё рядом со школой, поскольку у Джейн есть сын, и она соглашается.\",\"quotes\":[\"you’d like to be fairly close to a school. Good idea\"],\"location\":{\"en\":\"[05:13]\",\"ru\":\"[05:13]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"8\":{\"part\":1,\"en\":\"950. The agent proposes $950 as the maximum monthly rent, and Jane accepts that figure.\",\"ru\":\"950. Агент предлагает установить максимум аренды в 950 долларов в месяц, и Джейн соглашается.\",\"quotes\":[\"would your limit be, say, $950? I’d say so, yes\"],\"location\":{\"en\":\"[06:11]\",\"ru\":\"[06:11]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"9\":{\"part\":1,\"en\":\"Quiet. As she may work nights, the apartment needs to be quiet during the day so she can sleep.\",\"ru\":\"Тихой. Поскольку иногда Джейн будет работать ночью, днём ей нужна тихая квартира, чтобы отсыпаться.\",\"quotes\":[\"I really need … for it to be quiet, so I can catch up on sleep … during the day\"],\"location\":{\"en\":\"[06:38]\",\"ru\":\"[06:38]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"10\":{\"part\":1,\"en\":\"Friend. They first heard about the agency through a friend who recommended its website.\",\"ru\":\"Друг. О компании они узнали от друга, который направил их на сайт агентства.\",\"quotes\":[\"it was a friend of ours … he pointed us in the direction of your website\"],\"location\":{\"en\":\"[07:06]\",\"ru\":\"[07:06]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
