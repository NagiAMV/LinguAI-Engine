:[{\"part\":3,\"type\":\"user-provided-pdf\",\"label\":\"80 IELTS Listening Tests (2).pdf\",\"reference\":\"Test 51\"}]},\"explanations\":{\"21\":{\"part\":3,\"en\":\"Cigar. The speaker compares the float’s shape to a cigar.\",\"ru\":\"Сигара. Докладчик сравнивает форму буя с сигарой.\",\"quotes\":[\"It looks a bit like a cigar\"],\"location\":{\"en\":\"[01:12]\",\"ru\":\"[01:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"22\":{\"part\":3,\"en\":\"13 countries. Scientists from 13 countries have participated so far; Indonesia will join next year, making 14.\",\"ru\":\"13 стран. Пока в проекте участвуют учёные из 13 стран; в следующем году присоединится Индонезия, и их станет 14.\",\"quotes\":[\"scientists from 13 countries have been taking part\"],\"location\":{\"en\":\"[01:36]\",\"ru\":\"[01:36]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"23\":{\"part\":3,\"en\":\"Activated. A satellite activates the float after it is dropped into the ocean.\",\"ru\":\"Активирован. Спутник запускает буй после того, как его опускают в океан.\",\"quotes\":[\"dropped in the ocean from a boat … and activated from a satellite\"],\"location\":{\"en\":\"[02:03]\",\"ru\":\"[02:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"24\":{\"part\":3,\"en\":\"50 km. The transcript gives 50 kilometres as the average distance the float travels while drifting at depth.\",\"ru\":\"50 км. В транскрипте указано, что на глубине буй в среднем проходит 50 километров.\",\"quotes\":[\"the average is 50 kilometers\"],\"location\":{\"en\":\"[02:03]\",\"ru\":\"[02:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"25\":{\"part\":3,\"en\":\"Temperature. As the float rises, it records changes in temperature as well as salinity.\",\"ru\":\"Температура. При подъёме буй фиксирует изменения температуры и солёности.\",\"quotes\":[\"variations in salinity … and the changes in temperature\"],\"location\":{\"en\":\"[02:33]\",\"ru\":\"[02:33]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"26\":{\"part\":3,\"en\":\"A — at present. Float data is already confirming understanding of El Niño’s causes.\",\"ru\":\"A — в настоящее время. Данные буёв уже подтверждают понимание причин Эль-Ниньо.\",\"quotes\":[\"our understanding of the underlying causes of El Niño events is being confirmed\"],\"location\":{\"en\":\"[03:49]\",\"ru\":\"[03:49]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"27\":{\"part\":3,\"en\":\"C — in the long-term future. The climate-change study is ongoing and results are still a long way off.\",\"ru\":\"C — в отдалённом будущем. Исследование изменения климата продолжается, и результаты появятся нескоро.\",\"quotes\":[\"the results are still a long way off\"],\"location\":{\"en\":\"[03:49–04:22]\",\"ru\":\"[03:49–04:22]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"28\":{\"part\":3,\"en\":\"A — at present. The float project already helps advise the Navy on search-and-rescue missions.\",\"ru\":\"A — в настоящее время. Проект уже помогает ВМС при поисково-спасательных операциях.\",\"quotes\":[\"we can advise the Navy on search and rescue missions. That’s happening right now\"],\"location\":{\"en\":\"[04:22]\",\"ru\":\"[04:22]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"29\":{\"part\":3,\"en\":\"B — in the near future. Sustainable fishing results are expected quite soon.\",\"ru\":\"B — в ближайшем будущем. Результаты для устойчивого рыболовства ожидаются довольно скоро.\",\"quotes\":[\"We’ll be seeing the results of that quite soon\"],\"location\":{\"en\":\"[04:48]\",\"ru\":\"[04:48]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"30\":{\"part\":3,\"en\":\"C — in the long-term future. Using forecasts to choose crops is described as a distant future possibility.\",\"ru\":\"C — в отдалённом будущем. Выбор сельхозкультур по прогнозам погоды описан как перспектива на далёкое будущее.\",\"quotes\":[\"this concept is still a long way in the future\"],\"location\":{\"en\":\"[05:16]\",\"ru\":\"[05:16]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
