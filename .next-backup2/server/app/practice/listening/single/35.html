ая музыка. Ведущий говорит, что центр известен во всём мире как крупная площадка для классической музыки.\",\"quotes\":[\"famous throughout the world as one of the major venues for classical music\"],\"location\":{\"en\":\"[01:05]\",\"ru\":\"[01:05]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"12\":{\"part\":2,\"en\":\"Bookshop. The complex contains the listed arts facilities and also has a bookshop.\",\"ru\":\"Книжный магазин. В комплексе есть перечисленные культурные объекты, а также книжный магазин.\",\"quotes\":[\"three restaurants and a bookshop\"],\"location\":{\"en\":\"[01:35]\",\"ru\":\"[01:35]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"13\":{\"part\":2,\"en\":\"Planned. The centre was planned in the 1960s before construction began in the 1970s.\",\"ru\":\"Запланирован. Центр спланировали в 1960-х годах, а строительство началось в 1970-х.\",\"quotes\":[\"it was planned in the 60s\"],\"location\":{\"en\":\"[02:03]\",\"ru\":\"[02:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"14\":{\"part\":2,\"en\":\"1983. It opened to the public in 1983, after being planned in the 1960s and built in the 1970s.\",\"ru\":\"1983. Центр открылся для публики в 1983 году после планирования в 1960-х и строительства в 1970-х.\",\"quotes\":[\"opened to the public in 1983\"],\"location\":{\"en\":\"[02:03]\",\"ru\":\"[02:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"15\":{\"part\":2,\"en\":\"City Council. The National Arts Centre remains publicly owned and is run by the City Council.\",\"ru\":\"Городской совет. Национальный центр искусств остаётся в государственной собственности и управляется городским советом.\",\"quotes\":[\"It’s run by the City Council\"],\"location\":{\"en\":\"[02:03]\",\"ru\":\"[02:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"363. The centre is open 363 days each year.\",\"ru
