ar left is the main switch that turns the heater on.\",\"ru\":\"B — выключатель. Первая круглая ручка слева — основной переключатель, который включает нагреватель.\",\"quotes\":[\"the round one on the far left … It's the main control switch\"],\"location\":{\"en\":\"[01:06]\",\"ru\":\"[01:06]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"12\":{\"part\":2,\"en\":\"C — reset button. The small round plastic button below the controls resets the heater after it shuts down.\",\"ru\":\"C — кнопка сброса. Маленькая круглая пластиковая кнопка под регуляторами перезапускает отключившийся нагреватель.\",\"quotes\":[\"you’ll need to press this button to reset the heater\"],\"location\":{\"en\":\"[01:59]\",\"ru\":\"[01:59]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"13\":{\"part\":2,\"en\":\"E — warning indicator. The square indicator below the third knob flashes when the heater needs resetting.\",\"ru\":\"E — индикатор предупреждения. Квадратный индикатор под третьей ручкой мигает, когда нагреватель нужно перезапустить.\",\"quotes\":[\"a little square indicator … that’s a kind of alarm light. It’ll flash if you need to reset the heater\"],\"location\":{\"en\":\"[02:25]\",\"ru\":\"[02:25]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"14\":{\"part\":2,\"en\":\"B — in the cupboard on the landing. The extra pillows are on the top shelf of the large upstairs cupboard by the bathroom.\",\"ru\":\"B — в шкафу на лестничной площадке. Запасные подушки лежат на верхней полке большого шкафа наверху, рядом с ванной.\",\"quotes\":[\"the large white one upstairs, to the left of the bathroom door … on the top shelf\"],\"location\":{\"en\":\"[03:27]\",\"ru\":\"[03:27]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"15\":{\"part\":2,\"en\":\"E — on the shelf by the back door. Washing powder is in a blue box on the shelf above the sink there.\",\"ru\":\"E — на полке у задней двери. Порошок находится в синей коробке на расположенной там полке над раковиной.\",\"quotes\":[\"by the back door. There's a kind of shelf there above the sink\"],\"location\":{\"en\":\"[03:59]\",\"ru\":\"[03:59]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"16\":{\"part\":2,\"en\":\"D — next to the living-room window. The spare key hangs on a hook on the wall beside that window.\",\"ru\":\"D — рядом с окном гостиной. Запасной ключ висит на крючке на стене возле этого окна.\",\"quotes\":[\"hanging on a hook on the wall by the sitting room window\"],\"location\":{\"en\":\"[03:59]\",\"ru\":\"[03:59]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"17\":{\"part\":2,\"en\":\"A — in the box on the washing machine. Spare bulbs are inside a large cardboard box placed on top of the washing machine.\",\"ru\":\"A — в коробке на стиральной машине. Запасные лампочки лежат в большой картонной коробке на стиральной машине.\",\"quotes\":[\"a large cardboard box … on top of the washing machine\"],\"location\":{\"en\":\"[04:29]\",\"ru\":\"[04:29]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"18\":{\"part\":2,\"en\":\"C — in the chest of drawers. The local map is in the top drawer of the chest under the bedroom television.\",\"ru\":\"C — в комоде. Карта местности лежит в верхнем ящике комода под телевизором в спальне.\",\"quotes\":[\"in the top drawer of the chest, under the TV in your bedroom\"],\"location\":{\"en\":\"[04:29]\",\"ru\":\"[04:29]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"19\":{\"part\":2,\"en\":\"732281. This is the phone number for the Italian takeaway that delivers pizzas to the flat.\",\"ru\":\"732281. Это номер итальянской службы доставки, где можно заказать пиццу в квартиру.\",\"quotes\":[\"Call 7-3-2-2-8-1 for that one\"],\"location\":{\"en\":\"[05:28]\",\"ru\":\"[05:28]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"20\":{\"part\":2,\"en\":\"Thursday. The Railway Museum is closed on Thursdays, which is also market day and makes parking difficult.\",\"ru\":\"Четверг. Железнодорожный музей закрыт по четвергам; в этот день также рынок и трудно найти парковку.\",\"quotes\":[\"not on Thursdays … the only day of the week when they’re not open\"],\"location\":{\"en\":\"[05:56]\",\"ru\":\"[05:56]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
