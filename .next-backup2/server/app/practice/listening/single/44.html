lse},\"23\":{\"part\":3,\"en\":\"B — the origin of food products. Robert says television programmes focus on where meat, fruit and vegetables come from.\",\"ru\":\"B — происхождение продуктов. Роберт говорит, что телепередачи сосредоточены на том, откуда берутся мясо, фрукты и овощи.\",\"quotes\":[\"focusing on where your meat, fruit and vegetables are sourced from\"],\"location\":{\"en\":\"[03:25]\",\"ru\":\"[03:25]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"24\":{\"part\":3,\"en\":\"C — the economic effect. Anna is most concerned that businesses and governments should reduce costs and avoid financial losses from wasted food.\",\"ru\":\"C — экономические последствия. Анну прежде всего волнует, что бизнесу и правительству следует снижать расходы и не терять деньги из-за выброшенной еды.\",\"quotes\":[\"governments should be encouraging business to find ways to cut costs … lose about 11% of their fruit to waste\"],\"location\":{\"en\":\"[04:22–04:50]\",\"ru\":\"[04:22–04:50]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"25\":{\"part\":3,\"en\":\"A — handing out a questionnaire. They choose to ask classmates what they think they waste every day, rather than start with statistics or landfill pictures.\",\"ru\":\"A — раздать анкету. Они решают спросить однокурсников, сколько еды те, по их мнению, выбрасывают каждый день, вместо статистики или фотографий свалок.\",\"quotes\":[\"give the other students a set of questions to answer\"],\"location\":{\"en\":\"[04:50–05:18]\",\"ru\":\"[04:50–05:18]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"26\":{\"part\":3,\"en\":\"G — it will involve very little cost. The edible bacteria patches are described as cheap to manufacture.\",\"ru\":\"G — будет недорогим. Съедобные индикаторные наклейки, показывающие наличие бактерий, должны быть дешёвыми в производстве.\",\"quotes\":[\"they’ll be cheap to manufacture\"],\"location\":{\"en\":\"[06:40]\",\"ru\":\"[06:40]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"27\":{\"part\":3,\"en\":\"A — it should save time. The ripeness sensor lets supermarkets check fruit boxes quickly without opening each one.\",\"ru\":\"A — сэкономит время. Датчик спелости позволяет супермаркетам быстро проверять ящики с фруктами, не открывая каждый.\",\"quotes\":[\"a quicker way to check for ripeness than taking each box off the shelf and opening it\"],\"location\":{\"en\":\"[07:10]\",\"ru\":\"[07:10]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"28\":{\"part\":3,\"en\":\"D — it will make money. LeanPath’s tracking system helps caterers identify waste and increase their profits.\",\"ru\":\"D — поможет заработать. Система LeanPath позволяет предприятиям питания отслеживать отходы и увеличивать прибыль.\",\"quotes\":[\"caterers can see how much food is being wasted and why. That’ll increase profits\"],\"location\":{\"en\":\"[07:39]\",\"ru\":\"[07:39]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"29\":{\"part\":3,\"en\":\"C — it will benefit local communities. The app alerts charities to surplus food so they can distribute it to people in need nearby.\",\"ru\":\"C — поможет местным сообществам. Приложение уведомляет благотворительные организации об излишках еды, чтобы они передали её нуждающимся рядом.\",\"quotes\":[\"charities can then pick up the unwanted food and distribute it to people in need\"],\"location\":{\"en\":\"[08:06]\",\"ru\":\"[08:06]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"30\":{\"part\":3,\"en\":\"E — it will encourage personal responsibility. Composting asks people to separate their own waste instead of relying on government to solve the problem.\",\"ru\":\"E — побуждает к личной ответственности. Компостирование требует самостоятельно сортировать отходы, а не полагаться на правительство.\",\"quotes\":[\"we’d be doing something positive about the problem … ourselves rather than relying on the government\"],\"location\":{\"en\":\"[08:36–09:03]\",\"ru\":\"[08:36–09:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
