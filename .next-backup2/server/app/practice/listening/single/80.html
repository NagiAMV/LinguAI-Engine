:{\"part\":4,\"en\":\"B — keep a record of animals they saw. Garden owners completed a regular survey and ticked off species from a list.\",\"ru\":\"B — записывать встреченных животных. Владельцы садов регулярно заполняли опросник, отмечая замеченные виды.\",\"quotes\":[\"completed a survey once every two weeks … ticking off species they had seen\"],\"location\":{\"en\":\"[02:08–02:37]\",\"ru\":\"[02:08–02:37]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"34\":{\"part\":4,\"en\":\"B — representative gardens. They deliberately chose smaller gardens because these were the most typical in the city.\",\"ru\":\"B — типичные сады. Они намеренно выбрали небольшие сады, поскольку такие сады были наиболее распространены в городе.\",\"quotes\":[\"We deliberately chose smaller ones because they were by far the most typical\"],\"location\":{\"en\":\"[02:37]\",\"ru\":\"[02:37]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"35\":{\"part\":4,\"en\":\"A — wildlife problems in rural areas. Their background reading covered the decline of wild animals in the countryside.\",\"ru\":\"A — проблемы дикой природы в сельской местности. В предварительном чтении они изучали сокращение численности животных за городом.\",\"quotes\":[\"studying a lot of books about the decline of wild animals in the countryside\"],\"location\":{\"en\":\"[02:37]\",\"ru\":\"[02:37]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"C — the three species indicated general trends. The group chose species that illustrated processes affecting rural and urban settings overall.\",\"ru\":\"C — эти виды показывали общие тенденции. Группа выбрала животных, которые отражали процессы в городской и сельской среде в целом.\",\"quotes\":[\"these gave a good indication of the processes at work in rural and urban settings as a whole\"],\"location\":{\"en\":\"[03:06]\",\"ru\":\"[03:06]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"37\":{\"part\":4,\"en\":\"Frogs. Frogs increase where suitable water is available, and urban garden ponds are becoming more common.\",\"ru\":\"Лягушки. Их численность растёт там, где есть подходящая вода; садовых прудов в городах становится больше.\",\"quotes\":[\"They proliferate where there is suitable water. Garden ponds are on the increase\"],\"location\":{\"en\":\"[03:36]\",\"ru\":\"[03:36]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"Predators. Hedgehogs survive better in cities because their predators are less likely to enter urban areas.\",\"ru\":\"Хищников. Ежи лучше выживают в городах, потому что их хищники реже покидают сельскую местность.\",\"quotes\":[\"their predators are not finding it quite so attractive to leave their rural environment\"],\"location\":{\"en\":\"[03:36]\",\"ru\":\"[03:36]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"Count. The researchers had many hedgehog sightings and could count their numbers accurately.\",\"ru\":\"Считать. Исследователи часто видели ежей, поэтому могли точно подсчитывать их численность.\",\"quotes\":[\"we had no difficulties with our efforts to count their numbers precisely\"],\"location\":{\"en\":\"[04:09]\",\"ru\":\"[04:09]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"Seeds. A variety of plants provides seeds, which song thrushes eat.\",\"ru\":\"Семена. Разнообразие растений даёт семена, которыми питаются певчие дрозды.\",\"quotes\":[\"an extensive range of seeds around, which is what they feed on\"],\"location\":{\"en\":\"[04:09]\",\"ru\":\"[04:09]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
