ru\":\"[04:15]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"27\":{\"part\":3,\"en\":\"A — consulted reference materials. Books and journals helped Hiroko understand the lectures and find ideas for tutorials.\",\"ru\":\"A — обратилась к справочным материалам. Книги и журналы помогли Хироко понимать лекции и находить идеи для семинаров.\",\"quotes\":[\"I had to turn to the books and journals\"],\"location\":{\"en\":\"[04:44]\",\"ru\":\"[04:44]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"28\":{\"part\":3,\"en\":\"B — reading still takes a long time. Spiros says his speed remains slow, although his vocabulary skills have improved.\",\"ru\":\"B — чтение всё ещё занимает много времени. Спирос говорит, что читает медленно, хотя стал лучше справляться с лексикой.\",\"quotes\":[\"My reading speed is still quite slow\"],\"location\":{\"en\":\"[05:13]\",\"ru\":\"[05:13]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"29\":{\"part\":3,\"en\":\"C — engineering. Hiroko says the reading classes did not include texts from her own field, engineering.\",\"ru\":\"C — инженерное дело. Хироко говорит, что на занятиях не было текстов по её специальности — инженерии.\",\"quotes\":[\"we didn’t read anything about engineering\"],\"location\":{\"en\":\"[06:08]\",\"ru\":\"[06:08]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"30\":{\"part\":3,\"en\":\"B — read more in their own subject areas. Hiroko says subject-specific reading would have made her more confident and motivated.\",\"ru\":\"B — читать больше по своей специальности. Хироко считает, что профильные тексты повысили бы её уверенность и мотивацию.\",\"quotes\":[\"I would have felt much better working on reading from my own field\"],\"location\":{\"en\":\"[06:35]\",\"ru\":\"[06:35]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
