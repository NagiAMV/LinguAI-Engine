rt\":3,\"en\":\"D — History. Martina says History was her favourite school subject.\",\"ru\":\"D — история. Мартина говорит, что история была её любимым школьным предметом.\",\"quotes\":[\"My favourite subject was history\"],\"location\":{\"en\":\"[01:12]\",\"ru\":\"[01:12]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"22\":{\"part\":3,\"en\":\"B — English. English was Martina’s second favourite subject, and she chose to study it at university.\",\"ru\":\"B — английский. Английский был вторым любимым предметом Мартины, и его она выбрала для университета.\",\"quotes\":[\"I decided to opt for English, which was my second favourite subject\"],\"location\":{\"en\":\"[01:39]\",\"ru\":\"[01:39]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"23\":{\"part\":3,\"en\":\"Mathematics. George lists several engineering areas that are fine for him, but says maths is what he struggles with.\",\"ru\":\"Математика. Джордж перечисляет несколько подходящих ему областей инженерии, но говорит, что трудности вызывает математика.\",\"quotes\":[\"it’s maths that I’m struggling with\"],\"location\":{\"en\":\"[02:08]\",\"ru\":\"[02:08]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"24\":{\"part\":3,\"en\":\"Theory. George says the course is currently nearly all theory, with more practical work coming later.\",\"ru\":\"Теория. Джордж говорит, что сейчас курс почти полностью теоретический; практики станет больше позже.\",\"quotes\":[\"Currently, it’s nearly all theory\"],\"location\":{\"en\":\"[02:36]\",\"ru\":\"[02:36]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"25\":{\"part\":3,\"en\":\"Jet engines. His upcoming assignment concerns jet engines and includes trips to a nearby airport.\",\"ru\":\"Реактивные двигатели. Его ближайшее задание посвящено реактивным двигателям и включает поездки в ближайший аэропорт.\",\"quotes\":[\"assignment this term, working on jet engines\"],\"location\":{\"en\":\"[03:03]\",\"ru\":\"[03:03]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"26\":{\"part\":3,\"en\":\"Seminars. He finds the many seminars frustrating because so many people express their views, and wants fewer.\",\"ru\":\"Семинары. Многочисленные семинары его утомляют из-за большого количества мнений участников, поэтому он хотел бы сократить их число.\",\"quotes\":[\"we also have a lot of seminars … It would be better if we didn’t have so many\"],\"location\":{\"en\":\"[03:32]\",\"ru\":\"[03:32]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"27\":{\"part\":3,\"en\":\"A — sociable. Martina says students are very friendly and spend time chatting.\",\"ru\":\"A — общительные. Мартина говорит, что студенты дружелюбные и много общаются.\",\"quotes\":[\"they are very friendly … a lot of sitting around and chatting\"],\"location\":{\"en\":\"[03:57–04:39]\",\"ru\":\"[03:57–04:39]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"28\":{\"part\":3,\"en\":\"B — settle into university. George wants his tutor to explain practical matters such as what to do and where to go.\",\"ru\":\"B — освоиться в университете. Джордж хочет, чтобы наставник объяснил практические вещи: что нужно делать и куда идти.\",\"quotes\":[\"finding out what I need to do, where to go\"],\"location\":{\"en\":\"[05:09]\",\"ru\":\"[05:09]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"29\":{\"part\":3,\"en\":\"C — the deadline. Martina knows the first assignment is due at the end of next month, but does not yet know the topic or length.\",\"ru\":\"C — срок сдачи. Мартина знает, что первую работу нужно сдать в конце следующего месяца, но пока не знает тему и объём.\",\"quotes\":[\"we have to hand our first one in at the end of next month\"],\"location\":{\"en\":\"[05:36]\",\"ru\":\"[05:36]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"30\":{\"part\":3
