 residence, which she gives as her address.\",\"ru\":\"International House. Анита живёт в этом общежитии для аспирантов и указывает его как адрес.\",\"quotes\":[\"International House\"],\"location\":{\"en\":\"[04:58]\",\"ru\":\"[04:58]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"7\":{\"part\":1,\"en\":\"B659. She first says B569 but immediately corrects the room number to B659.\",\"ru\":\"B659. Сначала она говорит B569, но тут же исправляет номер комнаты на B659.\",\"quotes\":[\"Room B569. No, sorry. B… 659\"],\"location\":{\"en\":\"[04:58–05:31]\",\"ru\":\"[04:58–05:31]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"8\":{\"part\":1,\"en\":\"Office assistant. The available role at the English Language Centre is an office assistant.\",\"ru\":\"Помощник офиса. Вакансия в English Language Centre — office assistant.\",\"quotes\":[\"a position for an office assistant at the English Language Centre\"],\"location\":{\"en\":\"[05:31]\",\"ru\":\"[05:31]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"9\":{\"part\":1,\"en\":\"Answer the phone. The duties include responding to student enquiries and answering the phone.\",\"ru\":\"Отвечать на телефонные звонки. В обязанности входит отвечать на запросы студентов и принимать звонки.\",\"quotes\":[\"deal with student enquiries and answer the phone\"],\"location\":{\"en\":\"[06:01]\",\"ru\":\"[06:01]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"10\":{\"part\":1,\"en\":\"11.30. Anita cannot attend at 10 a.m.; they agree to move the Friday interview to 11.30.\",\"ru\":\"11:30. Анита не может прийти в 10 утра, и они переносят собеседование в пятницу на 11:30.\",\"quotes\":[\"How about 11.30?\"],\"location\":{\"en\":\"[06:30]\",\"ru\":\"[06:30]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
