, but not fully explain complex systems.\",\"ru\":\"B — полезно в определённых случаях. Эксперт поможет получить общее представление или решить отдельную небольшую проблему, но не объяснит сложную систему целиком.\",\"quotes\":[\"This approach can be used if you want to gain a rough understanding … or understand smaller, isolated problems\"],\"location\":{\"en\":\"[03:19]\",\"ru\":\"[03:19]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"34\":{\"part\":4,\"en\":\"A — some details are difficult to explain. Workers may know details learned on the job but be unable to describe them helpfully.\",\"ru\":\"A — некоторые детали трудно объяснить. Сотрудники могут знать нюансы, полученные на практике, но не уметь понятно их описать.\",\"quotes\":[\"Some may be difficult to describe, learned on the job … but impossible to describe in a way that’s helpful\"],\"location\":{\"en\":\"[04:16]\",\"ru\":\"[04:16]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"35\":{\"part\":4,\"en\":\"Combination. Managers may try to combine the best elements of different systems into an ideal combination.\",\"ru\":\"Комбинацию. Руководители могут попытаться соединить лучшие части разных систем в идеальную комбинацию.\",\"quotes\":[\"use the best parts of various different systems … creating the perfect combination\"],\"location\":{\"en\":\"[04:47]\",\"ru\":\"[04:47]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"Safety. A modification may overlook the effect of the change on safety.\",\"ru\":\"Безопасность. Изменения могут повлиять на безопасность, и этот риск легко упустить.\",\"quotes\":[\"the modifications might compromise safety in some way\"],\"location\":{\"en\":\"[05:17]\",\"ru\":\"[05:17]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"37\":{\"part\":4,\"en\":\"Attitudes. The solution starts by adjusting managers’ attitudes to be more realistic and cautious.\",\"ru\":\"Отношение. Решение начинается с изменения подхода руководителей: им следует быть реалистичнее и осторожнее.\",\"quotes\":[\"adjusting attitudes … Being more realistic and cautious\"],\"location\":{\"en\":\"[06:19]\",\"ru\":\"[06:19]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"Controls. The lecturer recommends imposing strict controls on organisational and operational systems.\",\"ru\":\"Контроль. Лектор советует установить строгий контроль над организационными и рабочими системами.\",\"quotes\":[\"exerting strict controls on the organizational and operational systems\"],\"location\":{\"en\":\"[06:19]\",\"ru\":\"[06:19]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"Factory. Copying closely includes reproducing the original factory’s physical characteristics.\",\"ru\":\"Фабрики. Точное копирование включает воспроизведение физических характеристик исходной фабрики.\",\"quotes\":[\"duplicating the physical characteristics of the factory\"],\"location\":{\"en\":\"[06:50]\",\"ru\":\"[06:50]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"Skills. The new system should also reproduce the skills of the original employees.\",\"ru\":\"Навыки. Новая система должна также воспроизвести навыки исходных сотрудников.\",\"quotes\":[\"duplicating the skills that the original employees had\"],\"location\":{\"en\":\"[06:50]\",\"ru\":\"[06:50]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
