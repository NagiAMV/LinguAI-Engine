",\"audioVerified\":false},\"4\":{\"part\":1,\"en\":\"Gormley. The doctor at Shore Lane Health Centre is Dr Gormley, spelled G-O-R-M-L-E-Y.\",\"ru\":\"Gormley. Врач центра Shore Lane — доктор Гормли; фамилия диктуется как G-O-R-M-L-E-Y.\",\"quotes\":[\"Dr Gormley. That’s G-O-R-M-L-E-Y\"],\"location\":{\"en\":\"[03:08]\",\"ru\":\"[03:08]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"5\":{\"part\":1,\"en\":\"B — employment medicals. The free fitness check is for proving fitness to a new employer; the separate insurance medical is likely chargeable.\",\"ru\":\"B — медосмотры для трудоустройства. Бесплатная проверка нужна, чтобы подтвердить здоровье для нового работодателя; отдельный медосмотр для страховки, вероятно, платный.\",\"quotes\":[\"if you need to prove you’re healthy … before a new employer will accept you, you can get a free fitness check up\"],\"location\":{\"en\":\"[03:36–04:04]\",\"ru\":\"[03:36–04:04]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"6\":{\"part\":1,\"en\":\"E — vaccinations. Vaccinations needed before a trip abroad are free at this centre.\",\"ru\":\"E — вакцинация. Прививки, необходимые перед поездкой за границу, в этом центре бесплатны.\",\"quotes\":[\"if you need to be vaccinated before any trips abroad, you won’t have to pay for this\"],\"location\":{\"en\":\"[03:36–04:04]\",\"ru\":\"[03:36–04:04]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"7\":{\"part\":1,\"en\":\"Heart. The smoking-cessation talk is especially useful for people with asthma or heart problems.\",\"ru\":\"Сердце. Лекция об отказе от курения особенно полезна людям с астмой или проблемами с сердцем.\",\"quotes\":[\"people with asthma or heart disease\"],\"location\":{\"en\":\"[05:33]\",\"ru\":\"[05:33]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"8\":{\"part\":1,\"en\":\"Primary school. The healthy-eating talk is held at the primary school on Shore Lane, not at the health centre.\",\"ru\":\"Начальная школа. Лекция о здоровом питании проходит в начальной школе на Shore Lane, а не в медицинском центре.\",\"quotes\":[\"at the primary school on Shore Lane\"],\"location\":{\"en\":\"[05:33]\",\"ru\":\"[05:33]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"9\":{\"part\":1,\"en\":\"4.30. The exercise-injury talk on 9 March is scheduled for 4:30 in the afternoon.\",\"ru\":\"4:30. Лекция о травмах при занятиях спортом 9 марта назначена на 16:30.\",\"quotes\":[\"a late afternoon talk at 4.30\"],\"location\":{\"en\":\"[06:02]\",\"ru\":\"[06:02]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"10\":{\"part\":1,\"en\":\"Ages. The exercise-injury talk is suitable for all ages.\",\"ru\":\"Возрастов. Лекция о спортивных травмах подходит людям любого возраста.\",\"quotes\":[\"suitable for all ages\"],\"location\":{\"en\":\"[06:02]\",\"ru\":\"[06:02]\"},\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
