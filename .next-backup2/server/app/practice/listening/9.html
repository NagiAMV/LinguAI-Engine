ml\"}]},\"explanations\":{\"1\":{\"part\":1,\"en\":\"C — DVD players. The manager places them beside the video recorders at the front window. The audio gives the placement; the letter C follows the supplied answer key because this test’s plan artwork is missing from the source file.\",\"ru\":\"C — DVD players. Руководительница ставит их рядом с видеомагнитофонами у витрины. Расположение следует из аудио; буква C указана по ключу, так как схема магазина отсутствует в исходном файле.\",\"quotes\":[\"put the DVD players right here, next to the video recorders\",\"against the front window\"]},\"2\":{\"part\":1,\"en\":\"E — DVDs. They are placed beside the videos, against the side wall. The source HTML contains no plan image, so the letter is taken from the answer key while the spoken placement is verifiable.\",\"ru\":\"E — DVDs. Их нужно поставить рядом с видеозаписями у боковой стены. В исходном HTML нет схемы, поэтому буква взята из ключа, а само расположение подтверждается записью.\",\"quotes\":[\"They can go beside the videos\",\"Against the side wall?\"]},\"3\":{\"part\":1,\"en\":\"F — portable CD players. The manager rejects the crowded CD corner and directs Bob to shelves facing the entrance. The plan image is missing from the source, so the letter itself is not visually verifiable here.\",\"ru\":\"F — портативные CD-плееры. Руководительница отказывается от тесного угла с CD и просит поставить их на полки напротив входа. Изображения схемы нет, поэтому проверить букву визуально нельзя.\",\"quotes\":[\"put them on the shelves facing the entrance\"]},\"4\":{\"part\":1,\"en\":\"8. There are eleven cassette players but only three are needed on display, so the other eight go to the stockroom.\",\"ru\":\"8. Сейчас выставлено одиннадцать кассетных плееров, но оставить нужно только три. Остальные восемь отправляют на склад.\",\"quotes\":[\"There are eleven at the moment, and we really only need three, so the other eight can go into the stockroom\"]},\"5\":{\"part\":1,\"en\":\"CLEAN. The manager says the stock looks dusty and asks Bob to clean everything.\",\"ru\":\"CLEAN — чистым. Руководительница замечает пыль на товарах и просит всё очистить.\",\"quotes\":[\"quite a lot of stock looks dusty\",\"We need to get everything clean\"]},\"6\":{\"part\":1,\"en\":\"SIGNS. The manager asks Bob to create signs for the special DVD offers.\",\"ru\":\"SIGNS — таблички. Руководительница просит Боба сделать таблички для специальных предложений на DVD.\",\"quotes\":[\"we're going to run special offers on some DVDs\",\"could you create some signs\"]},\"7\":{\"part\":1,\"en\":\"C — prices stay as they are. General films are selling strongly, so the manager sees no reason to change their price.\",\"ru\":\"C — цены остаются прежними. Фильмы общего жанра хорошо продаются, поэтому снижать на них цену не нужно.\",\"quotes\":[\"General films are selling strongly\",\"I don't think we need to do anything about them\"]},\"8\":{\"part\":1,\"en\":\"B — a multi-buy discount. Foreign-language films are selling slowly, so the manager plans a three-for-the-price-of-two offer.\",\"ru\":\"B — скидка за покупку нескольких товаров. Фильмы на иностранных языках продаются медленно, поэтому предлагают три по цене двух.\",\"quotes\":[\"Sales are creeping up very slowly\",\"three-for-the-price-of-two promotion\"]},\"9\":{\"part\":1,\"en\":\"A — each item’s price is reduced. Classical-music DVD prices will be cut by five pounds to boost falling sales.\",\"ru\":\"A — снизить цену каждого диска. Продажи классической музыки падают, поэтому цену на эту категорию снизят на пять фунтов.\",\"quotes\":[\"Sales certainly aren't too healthy\",\"bring all prices down by five pounds\"]},\"10\":{\"part\":1,\"en\":\"C — prices stay as they are. Comedy sales are weak, but the manager decides to wait for popular new releases rather than offer a discount now.\",\"ru\":\"C — цены пока не меняют. Комедии продаются хуже, но руководительница решает дождаться популярных новинок, а не снижать цену сейчас.\",\"quotes\":[\"Comedy isn't doing very well\",\"I don't think it's worth doing anything until some new, really popular comedy programmes are released\"]},\"11\":{\"part\":2,\"en\":\"A — all members must bring tents. The college tents are unavailable because another club needs them, so each participant must bring their own.\",\"ru\":\"A — все участники должны взять палатку. Палатки колледжа заняты другим клубом, поэтому каждому нужно принести свою.\",\"quotes\":[\"the mountaineering club will be using them at the same time\",\"you'll have to bring your own\"]},\"12\":{\"part\":2,\"en\":\"C — the organiser books the campsites. Members report whether they will share tents so the organiser can make reservations.\",\"ru\":\"C — организатор бронирует кемпинги. Участники сообщают, будут ли делить палатки, чтобы он оформил бронирование.\",\"quotes\":[\"I’ll need to know how many tents there’ll be for when I make the reservation\"]},\"13\":{\"part\":2,\"en\":\"A — all members must take bicycles. There are no bike-hire shops in Westbury, so everyone needs to bring their own.\",\"ru\":\"A — все участники должны взять велосипед. В Вестбери нет проката, поэтому велосипед нужно привезти с собой.\",\"quotes\":[\"there aren't any shops that hire them out\",\"it means taking your own\"]},\"14\":{\"part\":2,\"en\":\"C — the organiser buys the train tickets. They need the final number of participants so he can book together and get a group discount.\",\"ru\":\"C — организатор покупает билеты на поезд. Ему нужно знать число участников, чтобы оформить групповой тариф.\",\"quotes\":[\"I’ll need to know the final number of people going\",\"I’ll book them on the train\"]},\"15\":{\"part\":2,\"en\":\"B — members may choose whether to go. Only people who want to attend the football match need to buy a ticket, and they are urged to do so soon.\",\"ru\":\"B — участие по желанию. Билет на футбольный матч нужно покупать только тем, кто хочет пойти; организатор просит сделать это скорее.\",\"quotes\":[\"anyone who wants to go will need to get tickets\"]},\"16\":{\"part\":2,\"en\":\"C — the organiser prepares the information. He will give everyone a pack with the programme and details about the route and places to visit.\",\"ru\":\"C — организатор собирает информацию. На следующей встрече он раздаст программу и сведения о маршруте и местах посещения.\",\"quotes\":[\"I’ll be able to give you all individual packs\",\"something about the area we’ll be cycling through\"]},\"17\":{\"part\":2,\"en\":\"E — old ruins. Westbury has the archaeological site of its original settlement, nearly a thousand years old.\",\"ru\":\"E — старые руины. В Вестбери можно посетить место первоначального поселения, которому почти тысяча лет.\",\"quotes\":[\"the site where the original town was constructed nearly 1,000 years ago\"]},\"18\":{\"part\":2,\"en\":\"A — farming museum. Cluny’s converted barns house a museum about sheep farming, wool and local agricultural life.\",\"ru\":\"A — сельскохозяйственный музей. В переоборудованных амбарах Клуни рассказывают об овцеводстве, шерсти и жизни сельскохозяйственных работников.\",\"quotes\":[\"old barns ... converted into a museum\",\"importance of sheep in the area\"]},\"19\":{\"part\":2,\"en\":\"C — locally produced food. Pennerley has a daily farmers’ market selling food grown or made nearby.\",\"ru\":\"C — местные продукты. В Пеннерли каждый день работает рынок, где продают продукты, выращенные или изготовленные неподалёку.\",\"quotes\":[\"an open-air farmer's market every day\",\"all grown or processed within a few miles\"]},\"20\":{\"part\":2,\"en\":\"G — transport museum. Farlow’s museum traces the change from horses to steam, diesel and electric trains, buses, cars and bicycles.\",\"ru\":\"G — музей транспорта. В музее Фарлоу показывают, как лошадиный транспорт сменили паровые, дизельные и электрические поезда, автобусы, автомобили и велосипеды.\",\"quotes\":[\"a museum that shows how horses used to be the most common way of travelling\",\"replaced by steam trains\"]},\"21\":{\"part\":3,\"en\":\"REFERENCES. The tutor found small errors in the source details attached to Karen’s quotations and asks her to check the references for accuracy.\",\"ru\":\"REFERENCES — библиографические ссылки. Преподаватель заметил ошибки в сведениях к цитатам и просит проверить точность списка источников.\",\"quotes\":[\"make sure that your references are accurate\"]},\"22\":{\"part\":3,\"en\":\"EXAMPLES. Karen is asked to add a few more examples to support her points, rather than write extra paragraphs.\",\"ru\":\"EXAMPLES — примеры. Карен советуют добавить несколько примеров для убедительности, а не писать дополнительные абзацы.\",\"quotes\":[\"include a few extra examples\",\"Don't start writing more paragraphs\"]},\"23\":{\"part\":3,\"en\":\"AT THE NEXT SEMINAR. Karen agreed to present then after Marco could not do it.\",\"ru\":\"AT THE NEXT SEMINAR — на следующем семинаре. Карен согласилась выступить вместо Марко.\",\"quotes\":[\"you agreed to do it at the next seminar\"]},\"24\":{\"part\":3,\"en\":\"EXPLAIN THE EXPERIMENT. The tutor says this is essential for the short presentation; a summary in the handout alone is not enough.\",\"ru\":\"EXPLAIN THE EXPERIMENT — объяснить эксперимент. Преподаватель считает это главным содержанием короткой презентации; одного конспекта в раздатке недостаточно.\",\"quotes\":[\"it's absolutely essential for you to explain the experiment\"]},\"25\":{\"part\":3,\"en\":\"26 NOVEMBER. The printouts are needed by 3 December, so Karen must send the abstract to the tutor by 26 November.\",\"ru\":\"26 NOVEMBER — 26 ноября. Раздаточный материал нужен к 3 декабря, поэтому преподавателю нужно получить тезисы до 26 ноября.\",\"quotes\":[\"they'll need to be done by the 3rd of December\",\"I'll need to see it by the 26th of November\"]},\"26\":{\"part\":3,\"en\":\"CHEMISTRY LAB. The computer room is unsuitable, so the presentation is moved across the road to the chemistry lab, which has the needed equipment.\",\"ru\":\"CHEMISTRY LAB — химическая лаборатория. Компьютерная комната не подходит, поэтому выступление проведут через дорогу в химической лаборатории с нужным оборудованием.\",\"quotes\":[\"we'll have to go across the road and do it in the chemistry lab\"]},\"27\":{\"part\":3,\"en\":\"PROFESSOR. Karen’s first presentation was graded by her tutor; this one will be assessed by the professor.\",\"ru\":\"PROFESSOR — профессор. Первое выступление оценивал преподаватель Карен, а это будет оценивать профессор.\",\"quotes\":[\"this one will be assessed by the professor\"]},\"31\":{\"part\":4,\"en\":\"FROGS. Urban development is destroying the habitat of several frog species in Australia.\",\"ru\":\"FROGS — лягушки. Из-за расширения городов несколько видов лягушек теряют среду обитания.\",\"quotes\":[\"many species of frog are losing their habitat\"]},\"32\":{\"part\":4,\"en\":\"BIRDS. Pesticides reduce insect numbers; birds depend on insects as a food source, so their populations decline.\",\"ru\":\"BIRDS — птицы. Пестициды сокращают количество насекомых, которыми питаются птицы, поэтому уменьшается и их численность.\",\"quotes\":[\"fewer insects are surviving\",\"Many species depend upon these as a food source, birds in particular\"]},\"33\":{\"part\":4,\"en\":\"CORN. Growing a single staple crop such as corn often requires more chemicals and fertilisers, harming wildlife.\",\"ru\":\"CORN — кукуруза. Выращивание одной основной культуры, например кукурузы, требует больше химикатов и удобрений и вредит дикой природе.\",\"quotes\":[\"one staple crop each year — corn is a perfect example\"]},\"34\":{\"part\":4,\"en\":\"MEDIA. Public concern for pandas has been strengthened by media attention to their plight.\",\"ru\":\"MEDIA — СМИ. Внимание средств массовой информации к положению панд помогает привлекать к ним общественный интерес.\",\"quotes\":[\"Thanks to the attention it has given in the media\",\"people are very aware of its plight\"]},\"35\":{\"part\":4,\"en\":\"INSECTS. People are less likely to sympathise with small species such as insects, even though they are essential to the ecosystem.\",\"ru\":\"INSECTS — насекомые. Людям сложнее сочувствовать маленьким видам вроде насекомых, хотя они важны для экосистемы.\",\"quotes\":[\"essential smaller species, such as insects\"]},\"36\":{\"part\":4,\"en\":\"FEAR. People may ignore animals such as sharks or snakes because they are afraid of them.\",\"ru\":\"FEAR — страх. Люди могут игнорировать акул или змей из-за боязни этих животных.\",\"quotes\":[\"we might do this because of fear\",\"a shark or a snake\"]},\"37\":{\"part\":4,\"en\":\"RIVALS. Some animals are seen as competitors for food, which can reduce public sympathy for them.\",\"ru\":\"RIVALS — соперники. Некоторые животные воспринимаются как конкуренты за пищу, что мешает людям им сочувствовать.\",\"quotes\":[\"we believe that certain animals are rivals when it comes to food\"]},\"38\":{\"part\":4,\"en\":\"COMPLEX. The lecturer says a more complex ecosystem is more stable because predators help control animal populations.\",\"ru\":\"COMPLEX — сложной. Чем сложнее экосистема, тем она устойчивее: хищники помогают контролировать численность животных.\",\"quotes\":[\"the more complex the ecosystem is, the more stable it is\"]},\"39\":{\"part\":4,\"en\":\"PLANTS. Certain plants can signal changes in the environment, such as mineral deposits or toxic water.\",\"ru\":\"PLANTS — растения. Некоторые виды растений указывают на изменения окружающей среды, например месторождения минералов или токсичную воду.\",\"quotes\":[\"the presence or absence of certain plants can alert us to changes in our environment\"]},\"40\":{\"part\":4,\"en\":\"BLOOD. Spider webs can assist with certain blood disorders by helping blood clot.\",\"ru\":\"BLOOD — кровь. Паутина может помогать при некоторых заболеваниях крови, способствуя её свёртыванию.\",\"quotes\":[\"The cobwebs they make can be used to assist with certain blood disorders\",\"It actually helps blood to clot\"]},\"28–30\":{\"part\":3,\"en\":\"A, C and F — Communication Skills, Discourse Analysis and Psycholinguistics. Karen rejects Language and Society, chooses Discourse Analysis instead of the full Research Methodology course, and selects Psycholinguistics rather than Phonology.\",\"ru\":\"A, C и F — Communication Skills, Discourse Analysis и Psycholinguistics. Карен выбирает коммуникацию, анализ дискурса вместо полного курса методологии и психолингвистику вместо фонологии.\",\"quotes\":[\"I went for communication skills\",\"I thought discourse analysis looked really interesting\",\"I thought psycholinguistics would be interesting\"]}}}]]\n"])</script></body></html>
