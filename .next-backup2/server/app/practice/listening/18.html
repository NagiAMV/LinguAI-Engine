 and free breakfast.\",\"ru\":\"В стоимость отеля входят проживание у пляжа и бесплатный завтрак.\",\"quotes\":[\"It covers the beachside hotel and free breakfast\"]},\"3\":{\"part\":1,\"en\":\"The hotel lists a pool, nightclub and gym among its facilities.\",\"ru\":\"Среди удобств отеля перечислены бассейн, ночной клуб и спортзал.\",\"quotes\":[\"a pool, a nightclub and a gym\"]},\"4\":{\"part\":1,\"en\":\"The hotel package was originally €360 before the 12.5% promotion reduced it to €315.\",\"ru\":\"Изначальная цена пакета — €360; после скидки 12,5% она стала €315.\",\"quotes\":[\"originally €360 ... discount of 12.5%, so that’s €315\"]},\"5\":{\"part\":1,\"en\":\"The self-catering option requires guests to stay in a shared room with other guests.\",\"ru\":\"В апартаментах с самообслуживанием придётся жить в общей комнате с другими гостями.\",\"quotes\":[\"stay in a shared room with other guests\"]},\"6\":{\"part\":1,\"en\":\"A week’s surfboard rental costs €75; the daily rate is €15.\",\"ru\":\"Аренда доски на неделю стоит €75; дневная цена — €15.\",\"quotes\":[\"for a week’s rental, it’s just 75 euros\"]},\"7\":{\"part\":1,\"en\":\"The first insurance option is called basic cover and costs €30.\",\"ru\":\"Первый вариант страховки называется Basic и стоит €30.\",\"quotes\":[\"The first one is basic coverage. It costs 30 euros\"]},\"8\":{\"part\":1,\"en\":\"Premier cover is priced at €42.50, following the €30 basic option.\",\"ru\":\"Премиум-страховка стоит €42,50, тогда как базовая — €30.\",\"quotes\":[\"Premier Cover. It is more expensive at €42.50\"]},\"9\":{\"part\":1,\"en\":\"The agent identifies a taxi as the cheapest way to reach the airport.\",\"ru\":\"Агент называет такси самым дешёвым способом добраться до аэропорта.\",\"quotes\":[\"I personally suggest you take a taxi. It's much cheaper than other types of transport\"]},\"10\":{\"part\":1,\"en\":\"Paying by cheque has no additional fee; the card option carries a charge.\",\"ru\":\"При оплате чеком дополнительной комиссии нет; для карты она предусмотрена.\",\"quotes\":[\"pay by check, there's no extra fee\"]},\"11\":{\"part\":2,\"en\":\"A — Participants receive a class list at check-in; a shoe bag is also provided. Towels and water bottles should be brought, and name tags arrive by mail.\",\"ru\":\"A — При регистрации участникам дают список занятий и мешок для обуви. Полотенце и воду нужно принести самим, а бирку пришлют почтой.\",\"quotes\":[\"they will be given a class list ... complimentary shoe bag\"]},\"12\":{\"part\":2,\"en\":\"D — The shoe bag is supplied by the studio; the face towel and bottle are recommendations to bring from home.\",\"ru\":\"D — Мешок для обуви предоставляет студия; полотенце и бутылку воды рекомендуют принести с собой.\",\"quotes\":[\"The dance studio will also give you a complimentary shoe bag\"]},\"13\":{\"part\":2,\"en\":\"D — The first session includes a talk introducing the development of dance over recent decades.\",\"ru\":\"D — В первый день будет рассказ об истории развития танца за последние десятилетия.\",\"quotes\":[\"an introduction to the development of dance\"]},\"14\":{\"part\":2,\"en\":\"C — The talk is followed by an informal dance; the dance test is postponed until the end of the course.\",\"ru\":\"C — После рассказа будет неформальный танец; проверка танца состоится только в конце курса.\",\"quotes\":[\"Then we’ll warm up with an informal dance\"]},\"15\":{\"part\":2,\"en\":\"C — From the entrance, go straight and turn left; the shower room is on the left at C.\",\"ru\":\"C — От входа идите прямо и поверните налево: душевая будет слева, в точке C.\",\"quotes\":[\"go straight ahead, turn left and the shower room is on your left hand side\"]},\"16\":{\"part\":2,\"en\":\"E — The bunkroom is just left of the entrance and comes before the shower room on the route, at E.\",\"ru\":\"E — Комната с кроватями расположена сразу слева от входа и перед душевой на маршруте — E.\",\"quotes\":[\"immediately to the left of where you are standing right before the shower room\"]},\"17\":{\"part\":2,\"en\":\"I — The games room is the second area on the right after taking the first right, marked I.\",\"ru\":\"I — Игровая — вторая зона справа после первого поворота направо; это I.\",\"quotes\":[\"take the first right. It is the second area to your right\"]},\"18\":{\"part\":2,\"en\":\"F — Reception is in the centre, south of the music room; that position is F.\",\"ru\":\"F — Ресепшен находится в центре, южнее музыкальной комнаты; на карте это F.\",\"quotes\":[\"The reception is located in the centre to the south of the music room\"]},\"19\":{\"part\":2,\"en\":\"D — The medical centre is opposite reception and left of the music room, corresponding to D.\",\"ru\":\"D — Медпункт напротив ресепшена и слева от музыкальной комнаты; это D.\",\"quotes\":[\"right opposite the reception to the left of the music room\"]},\"20\":{\"part\":2,\"en\":\"B — Take the third passageway and turn right; the store is the room after the gym, marked B.\",\"ru\":\"B — На третьем проходе поверните направо: склад находится за спортзалом, точка B.\",\"quotes\":[\"turn right, and it’s the one after the gym\"]},\"21\":{\"part\":3,\"en\":\"The tutor asks Karen to verify that the references at the end are recorded accurately.\",\"ru\":\"Преподаватель просит Карен проверить точность списка источников в конце работы.\",\"quotes\":[\"make sure that your references are accurate\"]},\"22\":{\"part\":3,\"en\":\"The tutor asks for more examples to reinforce her points, rather than extra paragraphs.\",\"ru\":\"Преподаватель просит добавить примеры, чтобы подкрепить мысли, а не писать новые абзацы.\",\"quotes\":[\"include a few other examples just to drive your point home\"]},\"23\":{\"part\":3,\"en\":\"Karen will present at the next seminar because Marco cannot do it.\",\"ru\":\"Карен выступит на следующем семинаре, потому что Марко не может.\",\"quotes\":[\"you agreed to do it at the next seminar\"]},\"24\":{\"part\":3,\"en\":\"The tutor says the limited time makes explaining the experiment essential.\",\"ru\":\"Из-за короткого времени преподаватель считает обязательным объяснить эксперимент.\",\"quotes\":[\"it’s absolutely essential for you to explain the experiment\"]},\"25\":{\"part\":3,\"en\":\"The abstract must reach the tutor by November 26 so there is time to polish and print it by December 3.\",\"ru\":\"Абстракт нужно сдать преподавателю до 26 ноября, чтобы успеть отредактировать и распечатать к 3 декабря.\",\"quotes\":[\"I’ll need to see it by the 26th of November\"]},\"26\":{\"part\":3,\"en\":\"The faculty computer room is unsuitable, so the presentation is moved across the road to the chemistry lab.\",\"ru\":\"Компьютерная аудитория факультета не подходит, поэтому выступление перенесли через дорогу в химическую лабораторию.\",\"quotes\":[\"we’ll have to go across the road and do it in the chemistry lab\"]},\"27\":{\"part\":3,\"en\":\"The tutor confirms that the professor, rather than her tutor, will grade this presentation.\",\"ru\":\"Преподаватель уточняет, что эту презентацию будет оценивать профессор, а не её тьютор.\",\"quotes\":[\"this one will be scored by the professor\"]},\"28\":{\"part\":3,\"en\":\"A — Karen chooses Communication Skills because she knows the lecturer.\",\"ru\":\"A — Карен выбирает Communication Skills, потому что знакома с преподавателем.\",\"quotes\":[\"I went for communication skills in the end, because I know the lecturer\"]},\"29\":{\"part\":3,\"en\":\"C — She selects Discourse Analysis because she finds it interesting and it covers some research methodology.\",\"ru\":\"C — Она выбирает Discourse Analysis: курс интересен и частично включает методологию исследования.\",\"quotes\":[\"I thought discourse analysis looked really interesting\"]},\"30\":{\"part\":3,\"en\":\"F — She also chooses Psycholinguistics as a subject that is very different from her other choices.\",\"ru\":\"F — Также она выбирает Psycholinguistics как предмет, заметно отличающийся от остальных.\",\"quotes\":[\"I fancied something drastically different ... psycholinguistics would be interesting\"]},\"31\":{\"part\":4,\"en\":\"Cunningham’s project focused on protected bird species in urban areas.\",\"ru\":\"Исследование Каннингема было посвящено охраняемым видам птиц в городах.\",\"quotes\":[\"especially those protected species in urban regions\"]},\"32\":{\"part\":4,\"en\":\"Instead of counting birds directly, researchers estimated numbers with distance-sampling methods.\",\"ru\":\"Вместо подсчёта птиц исследователи оценивали численность методами дистанционной выборки.\",\"quotes\":[\"they managed to estimate with various standard distance sampling methods\"]},\"33\":{\"part\":4,\"en\":\"A mapping system was used to study birds’ companionship and nesting behaviour.\",\"ru\":\"Для изучения поведения птиц и мест гнездования использовали систему картирования.\",\"quotes\":[\"a mapping system was used to study their companionship behavior\"]},\"34\":{\"part\":4,\"en\":\"Leg tags transmitted signals, allowing researchers to follow birds’ whereabouts and trends over time.\",\"ru\":\"Метки на лапах передавали сигнал, позволяя отслеживать перемещения птиц и изменения со временем.\",\"quotes\":[\"assess the trends of birds over 15 months\"]},\"35\":{\"part\":4,\"en\":\"Pollution was linked to lower birth rates and threatened bird populations.\",\"ru\":\"Загрязнение связывали со снижением рождаемости и угрозой исчезновения видов.\",\"quotes\":[\"pollution had contributed greatly to the declining birth rates\"]},\"36\":{\"part\":4,\"en\":\"Local conservation groups introduced measures to increase birds’ survival rates.\",\"ru\":\"Местные природоохранные организации приняли меры для повышения выживаемости птиц.\",\"quotes\":[\"A number of measures were thus taken … to boost their alarming survival rates\"]},\"37\":{\"part\":4,\"en\":\"The identified danger is wind farms, especially collisions with turbine blades.\",\"ru\":\"Названная опасность — ветропарки и столкновения с лопастями турбин.\",\"quotes\":[\"safety of birds from wind farms\"]},\"38\":{\"part\":4,\"en\":\"The Conway study monitored how often birds called at night while flying.\",\"ru\":\"В исследовании Конуэя отслеживали частоту ночных криков птиц во время полёта.\",\"quotes\":[\"His team detected the calling frequency of seabirds flying at night\"]},\"39\":{\"part\":4,\"en\":\"Researchers took recordings to listen to birds’ sounds.\",\"ru\":\"Исследователи сделали записи, чтобы прослушивать звуки птиц.\",\"quotes\":[\"Surveyors also took recordings of the sounds of all the individual birds detected\"]},\"40\":{\"part\":4,\"en\":\"Noise-detection devices were placed at a great distance to collect the data.\",\"ru\":\"Устройства обнаружения шума разместили на большом расстоянии для сбора данных.\",\"quotes\":[\"all the sounds were recorded from a distance using microphones to detect noise\"]}}}]]\n"])</script></body></html>
