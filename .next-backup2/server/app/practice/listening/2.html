how about some water?\",\"Good idea\"]},\"3\":{\"part\":1,\"en\":\"WALK. The activity is a family walk: the father says families meet for a walk, and Claire agrees to join it with Lily.\",\"ru\":\"WALK — прогулка. Семьи собираются на совместную прогулку; Клэр соглашается пойти с Лили.\",\"quotes\":[\"families to get together for a walk\",\"That would be perfect\"]},\"4\":{\"part\":1,\"en\":\"WOODS. Claire guesses the park, but the father checks the advert and corrects her: they must meet in the woods.\",\"ru\":\"WOODS — лес. Клэр предполагает, что встреча в парке, но отец сверяется с объявлением и поправляет её: встречаться нужно в лесу.\",\"quotes\":[\"I suppose that's in the park\",\"No, you need to meet in the woods\"]},\"5\":{\"part\":1,\"en\":\"10. The walk starts at 10:15, but Claire is told to arrive at 10 so she has time to find the group. The answer is the arrival time, not the start time.\",\"ru\":\"10. Прогулка начинается в 10:15, но Клэр просят прийти к 10:00, чтобы найти группу. Вопрос спрашивает время прибытия, а не начала прогулки.\",\"quotes\":[\"starts at 10.15 in the morning\",\"you'd better be there at 10\"]},\"6\":{\"part\":1,\"en\":\"BOOTS. The father says the pushchair is unnecessary but advises taking Lily's boots in case the ground is muddy.\",\"ru\":\"BOOTS — ботинки/сапоги. Коляска не понадобится; отец советует взять обувь Лили на случай грязи.\",\"quotes\":[\"I don't think you'll need it\",\"you'd better take her boots in case it's muddy\"]},\"7\":{\"part\":1,\"en\":\"COUSIN. The party is for Lily's cousin. The possessive phrase in the notes asks whose party it is.\",\"ru\":\"COUSIN — двоюродный брат или сестра. Отец говорит, что Лили пригласили на праздник для её кузена/кузины; пропуск уточняет, чей это праздник.\",\"quotes\":[\"Lily's been invited to a party that's being held for her cousin\"]},\"8\":{\"part\":1,\"en\":\"RESTAURANT. The garden was the original plan, but they changed the venue to a restaurant on the High Street. Use the final arrangement.\",\"ru\":\"RESTAURANT — ресторан. Сначала праздник планировали провести в саду, но место изменили на ресторан на главной улице. Нужен окончательный вариант.\",\"quotes\":[\"The party was going to be in their garden\",\"they've decided to have it in a restaurant now instead\"]},\"9\":{\"part\":1,\"en\":\"PAY. The music lesson has moved from the school to Akehurst Hall, and Claire is reminded that she must pay for it.\",\"ru\":\"PAY — оплатить. Урок перенесли из школы в Akehurst Hall, и отец напоминает Клэр, что за него нужно заплатить.\",\"quotes\":[\"This week it's at Akehurst Hall\",\"you need to pay for that\"]},\"10\":{\"part\":1,\"en\":\"STAMPS. After collecting the laundry, Claire is asked to stop at the post office for stamps to send letters and a postcard.\",\"ru\":\"STAMPS — марки. После прачечной Клэр просят зайти на почту за марками для писем и открытки.\",\"quotes\":[\"Could you please get me some stamps?\",\"I need to send some letters and a postcard\"]},\"11\":{\"part\":2,\"en\":\"B — 1980. The charity has been based in Ivy Brook since 1990, but the question asks when it was started. Janice explicitly gives 1980 for its founding.\",\"ru\":\"B — 1980. The Hub находится в Ivy Brook с 1990 года, но спрашивают год основания. Дженис прямо называет 1980-й.\",\"quotes\":[\"when it was first set up in 1980\",\"which it's called home since 1990\"]},\"12\":{\"part\":2,\"en\":\"A — individual supporters. Local businesses give generously and school groups contribute too, but Janice says the most significant contribution has always come from individual supporters.\",\"ru\":\"A — индивидуальные сторонники. Местные компании и школьные группы тоже жертвуют деньги, но самый крупный вклад, по словам Дженис, всегда поступал от частных сторонников.\",\"quotes\":[\"the most significant contribution has always come from individual supporters\"]},\"13\":{\"part\":2,\"en\":\"C — people already working for The Hub. Most volunteers hear about the charity from an existing volunteer; the website also attracts interest, but Janice says this is not how most join.\",\"ru\":\"C — от тех, кто уже работает в The Hub. Большинство узнаёт о благотворительной организации от действующих волонтёров. Сайт тоже привлекает людей, но это не основной источник.\",\"quotes\":[\"they may hear about us from someone they meet who is already a volunteer\",\"That's how most people join us\"]},\"14\":{\"part\":2,\"en\":\"A — check lists of materials. Addressing envelopes is mentioned as work happening this week; the current need is specifically to verify that the lists are accurate.\",\"ru\":\"A — проверять списки материалов. Конверты упоминаются как работа одной группы на этой неделе. Сейчас же особенно нужны люди, которые проверят точность списков.\",\"quotes\":[\"one group are involved in addressing envelopes\",\"what we're specifically looking for at this time are people to help make sure our lists ... are accurate\"]},\"15\":{\"part\":2,\"en\":\"A — insufficient heating. Janice says the rooms feel cold in winter and a new boiler is being installed. Parking was a problem at their old location, not the current one.\",\"ru\":\"A — недостаточное отопление. Зимой в комнатах холодно, поэтому устанавливают новый котёл. С парковкой были проблемы по старому адресу, а не на нынешнем.\",\"quotes\":[\"the rooms can feel rather cold in the winter\",\"we're investing in a new boiler\",\"In our old town center location, we had lots of problems with parking, but not here\"]},\"16\":{\"part\":2,\"en\":\"B — music classes. Home visits and a reading group already exist; Janice hopes to organize music lessons in the near future.\",\"ru\":\"B — занятия музыкой. Домашние визиты и книжный клуб уже работают; в ближайшем будущем Дженис надеется организовать уроки музыки.\",\"quotes\":[\"we started a service where volunteers visit blind people in their homes\",\"We also set up a reading group\",\"I hope to organize music lessons ... in the near future\"]},\"21\":{\"part\":3,\"en\":\"G — easy to remember. Hannah says the visuals helped the main points stay in mind, and Martin agrees the session would be hard to forget. These are direct paraphrases of memorability.\",\"ru\":\"G — легко запомнить. Ханна говорит, что наглядные материалы помогли закрепить ключевые идеи, а Мартин соглашается, что занятие трудно забыть. Это прямо соответствует варианту о запоминаемости.\",\"quotes\":[\"visuals which helped fix the points they made in your mind\",\"it'd be hard to forget that session\"]},\"22\":{\"part\":3,\"en\":\"A — immediately useful advice. Martin says the employer tips can be used straight away in job applications, matching practical advice for immediate use.\",\"ru\":\"A — советы, полезные сразу. Мартин говорит, что рекомендации работодателей можно немедленно использовать при подаче заявок на работу.\",\"quotes\":[\"clear and relevant tips, which we can use straight away in our job applications\"]},\"23\":{\"part\":3,\"en\":\"B — helpful for future decisions. The networking event makes both students think about how their careers might develop and which choices they may need to make.\",\"ru\":\"B — помогает принимать решения в будущем. После встречи с представителями индустрии оба студента думают о развитии карьеры и о предстоящем выборе.\",\"quotes\":[\"made me think about how my career might develop in the long term\",\"what sort of choices I might have to make\"]},\"24\":{\"part\":3,\"en\":\"F — confidence boosting. Hannah says she felt more sure of herself after the hotel-manager interview, and Martin felt positive afterwards.\",\"ru\":\"F — укрепило уверенность. После интервью с управляющей отелем Ханна стала увереннее, а Мартин тоже почувствовал себя позитивно.\",\"quotes\":[\"I was more sure of myself after that\",\"I felt very positive afterwards\"]},\"25\":{\"part\":3,\"en\":\"B — show which work would suit each student. Hannah expected a subject-knowledge test, but corrects herself: its actual purpose was to indicate the type of job best suited to them.\",\"ru\":\"B — определить, какая работа подойдёт студентам. Ханна думала, что проверят знания предмета, но затем уточняет: оценка должна была показать подходящий тип работы.\",\"quotes\":[\"I thought it would check what we knew about our subject\",\"actually it was to indicate what sort of job would be best for each of us\"]},\"26\":{\"part\":3,\"en\":\"C — the session was interactive. Hannah says she liked that everyone had to take part in the discussion. She notes the coach was not especially engaging and Martin did not find the information substantial.\",\"ru\":\"C — занятие было интерактивным. Ханне понравилось, что все должны были участвовать в обсуждении. При этом она не считает выступающую особенно увлекательной, а Мартин — информацию особенно содержательной.\",\"quotes\":[\"we all had to get involved and take part in the discussion\"]},\"27\":{\"part\":3,\"en\":\"A — it was relevant to their needs. Martin found the activities practical because they resembled tasks students might face in future jobs. The timed challenge was Hannah's personal preference, not their shared reason.\",\"ru\":\"A — задания соответствовали их потребностям. Мартин объясняет пользу практической направленностью: упражнения напоминали задачи будущей работы. Ограничение по времени понравилось лично Ханне, но это не общая причина.\",\"quotes\":[\"the activities and exercises were exactly the sort of thing we might be doing in future jobs\",\"I enjoyed being given time limits\"]},\"28\":{\"part\":3,\"en\":\"C — how to give evidence of their skills. They disliked spending so long on the application letter and had already discussed body language; they valued learning to support claims about their skills with examples.\",\"ru\":\"C — как подтверждать свои навыки примерами. Студенты не оценили долгое написание сопроводительного письма, а язык тела уже обсуждали раньше. Полезным оказалось учиться подкреплять заявления о навыках доказательствами.\",\"quotes\":[\"ways of talking about our experience and supporting the claims we make about the skills we have\"]},\"29\":{\"part\":3,\"en\":\"C — she participated more in group discussions. The tutor said Hannah did not contribute enough, so Hannah deliberately made herself join in and found she enjoyed it.\",\"ru\":\"C — она стала активнее участвовать в групповых обсуждениях. Преподаватель заметила, что Ханна мало высказывалась; после этого Ханна заставила себя включаться и обнаружила, что ей это нравится.\",\"quotes\":[\"I didn't participate enough when we were talking in groups\",\"I forced myself to join in\"]},\"30\":{\"part\":3,\"en\":\"A — assignment titles and guidelines. Students said these often gave the wrong impression and they needed tutors to clarify the tasks. The grading issue was not raised by the other students.\",\"ru\":\"A — формулировки заданий и инструкции к ним. Студенты часто неверно понимали, что требуется, и просили преподавателей прояснить задания. Вопрос оценивания другие студенты не поднимали.\",\"quotes\":[\"the titles and guidelines for assignments\",\"Students said they often got the wrong idea and needed tutors' help to make tasks clear\",\"that didn't come up from other students\"]},\"31\":{\"part\":4,\"en\":\"NESTING. The example recommends avoiding construction during the months when birds are nesting; the gap asks what birds are doing then.\",\"ru\":\"NESTING — гнездятся. В примере рекомендуют не строить в месяцы, когда птицы вьют гнёзда; пропуск спрашивает, что они делают в это время.\",\"quotes\":[\"avoiding the months when birds are nesting\"]},\"32\":{\"part\":4,\"en\":\"PUBLIC. The non-technical summary is sent to the public so that people can comment. This matches the request to ask the public for feedback.\",\"ru\":\"PUBLIC — общественность. Краткое изложение отправляют общественности, чтобы люди могли оставить комментарии.\",\"quotes\":[\"We then issue this to the public, and invite feedback\"]},\"33\":{\"part\":4,\"en\":\"FARMING. Barrow Island avoided the environmental effects of farming as well as the introduction of non-native animals. The blank follows the second reason the island remained undisturbed.\",\"ru\":\"FARMING — сельское хозяйство. Остров избежал воздействия сельского хозяйства и появления чужеродных животных. В пропуске требуется второе из этих воздействий.\",\"quotes\":[\"The island has also been spared the environmental impact of farming\"]},\"34\":{\"part\":4,\"en\":\"FISHING. The speaker dates commercial fishing on the island to the 1930s. Mining came later, in the 1950s.\",\"ru\":\"FISHING — рыболовство. Коммерческое рыболовство появилось на острове в 1930-х годах; добыча полезных ископаемых началась позже, в 1950-х.\",\"quotes\":[\"in the 1930s when fishing was established here on a commercial basis\"]},\"35\":{\"part\":4,\"en\":\"MINING. The 1950s are explicitly linked to the establishment of mining, after the earlier fishing industry.\",\"ru\":\"MINING — добыча полезных ископаемых. С 1950-ми прямо связывают начало добычи; рыболовство на острове появилось раньше.\",\"quotes\":[\"Then, in the 1950s, mining was established\"]},\"36\":{\"part\":4,\"en\":\"GAS. Chandler Developers planned to extract gas from deep water off the coast. The question asks what they would remove from the ocean.\",\"ru\":\"GAS — газ. Компания планировала добывать газ в глубоководной части у побережья. Вопрос спрашивает, что именно будут извлекать из океана.\",\"quotes\":[\"extract gas from way out in the deep waters off the coast of Australia\"]},\"37\":{\"part\":4,\"en\":\"LIQUID. After extraction, the gas would be cleaned and compressed into a liquid before export. The gap describes the processed form.\",\"ru\":\"LIQUID — жидкость. После очистки газ планировали сжать и превратить в жидкость перед экспортом. Пропуск обозначает получившееся состояние.\",\"quotes\":[\"clean it up and compress it into a liquid\"]},\"38\":{\"part\":4,\"en\":\"NOISE. Construction noise would cause anxiety for turtles. The question asks what from the building work would stress marine life.\",\"ru\":\"NOISE — шум. Шум от строительства должен был вызывать тревогу у черепах. Вопрос спрашивает, что именно в строительных работах станет источником стресса.\",\"quotes\":[\"The amount of noise generated by this project would cause extreme anxiety\"]},\"39\":{\"part\":4,\"en\":\"SHARKS. Hatchling turtles that reach the water may be vulnerable to predators; the speaker identifies sharks as common and the main risk. Crocodiles are explicitly absent.\",\"ru\":\"SHARKS — акулы. Черепашата, добравшиеся до воды, могут стать добычей хищников. Акулы здесь обычны и представляют главную угрозу; крокодилов в этом районе нет.\",\"quotes\":[\"saltwater crocodiles are not found in this area\",\"sharks are common and represent the main risk\"]},\"40\":{\"part\":4,\"en\":\"RATS. The risk is that construction workers could bring pests to the island. Rats are given as the example of a pest that could establish a population and harm the ecology.\",\"ru\":\"RATS — крысы. Большое число строителей может случайно завезти вредителей. Крысы приведены как пример вида, который способен закрепиться и навредить экосистеме.\",\"quotes\":[\"a very real danger of pests being brought with them\",\"if, for example, a population of rats were to become established\"]},\"17–18\":{\"part\":2,\"en\":\"D + E — school textbooks and magazines, in either order. Janice first describes a rapid increase in requests for magazines, then says requests for textbooks have grown as the charity does more work for schools. Novels and local newspapers remain popular but are not the fastest-growing requests.\",\"ru\":\"D + E — школьные учебники и журналы, в любом порядке. Сначала Дженис говорит о быстром росте запросов на журналы, затем — о росте запросов на учебники из-за работы со школами. Романы и местные газеты популярны, но не растут быстрее всего.\",\"quotes\":[\"we're seeing a rapid increase in numbers asking for magazines\",\"a big increase in requests for textbooks\"]},\"19–20\":{\"part\":2,\"en\":\"A + E — knitting instructions and descriptions of cars, in either order. Janice calls knitting instructions a challenge even for keen crafters, and says detailed motoring descriptions are disliked even by car lovers. Chess summaries are described as easy.\",\"ru\":\"A + E — инструкции по вязанию и описания автомобилей, в любом порядке. Даже любителям рукоделия сложно читать инструкции по вязанию; подробные автомобильные описания не нравятся даже автолюбителям. Сводки шахматных партий, напротив, названы лёгкими.\",\"quotes\":[\"knitting instructions are always a real challenge for everyone\",\"pages and pages of detailed descriptions, which even car lovers hate reading\",\"chess players find the details of game summaries pretty easy\"]}}}]]\n"])</script></body></html>
