ovided-html\"},{\"part\":4,\"label\":\"FULL MOCK 05.10.2026.html\",\"type\":\"user-provided-html\"}]},\"explanations\":{\"1\":{\"part\":1,\"en\":\"The caller corrects the staff member: the student-athlete feature was moved to the front page.\",\"ru\":\"Звонившая поправляет сотрудника: материал о школьных спортсменах размещён на первой полосе.\",\"quotes\":[\"I clearly remember it being on the front\"]},\"2\":{\"part\":1,\"en\":\"She first says “month” but immediately corrects it to “week”; use the correction.\",\"ru\":\"Сначала она говорит «месяца», но сразу исправляется на «недели»; нужно записать исправленный вариант.\",\"quotes\":[\"Student Athlete of the month? ... I mean week\"]},\"3\":{\"part\":1,\"en\":\"The printed surname is wrong; the mother spells the correct surname Parkhurst.\",\"ru\":\"Фамилия в газете указана неверно; мать диктует правильное написание Parkhurst.\",\"quotes\":[\"it should be Parkhurst, that’s P-A-R-K-H-U-R-S-T\"]},\"4\":{\"part\":1,\"en\":\"She says the reprint is for personal use at home, not for business or commercial use.\",\"ru\":\"Фотография нужна для личного использования дома, а не для бизнеса или коммерческой публикации.\",\"quotes\":[\"it’s just for personal use\"]},\"5\":{\"part\":1,\"en\":\"Although the original is black and white, she chooses the colour version for the uniform to stand out.\",\"ru\":\"Хотя оригинал чёрно-белый, она выбирает цветную копию, чтобы форма сына выделялась.\",\"quotes\":[\"I’ll actually take the color\"]},\"6\":{\"part\":1,\"en\":\"The total price for the three regular-size copies is $80.\",\"ru\":\"Три отпечатка стандартного размера стоят в сумме 80 долларов.\",\"quotes\":[\"the total on that will be $80\"]},\"7\":{\"part\":1,\"en\":\"She declines the extra $15 for rush processing and chooses standard processing.\",\"ru\":\"Она отказывается доплачивать $15 за срочную обработку и выбирает обычную.\",\"quotes\":[\"I’ll just do normal processing\"]},\"8\":{\"part\":1,\"en\":\"She chooses to pay by cheque instead of using her credit card.\",\"ru\":\"Она выбирает оплату чеком вместо кредитной карты.\",\"quotes\":[\"I really prefer to pay by cheque\"]},\"9\":{\"part\":1,\"en\":\"A visit to the office is inconvenient, so the staff member will mail the prints.\",\"ru\":\"Ей неудобно заезжать в офис, поэтому фотографии отправят почтой.\",\"quotes\":[\"I’ll go ahead and mail them\"]},\"10\":{\"part\":1,\"en\":\"The survey asks how often they read the paper; she says they read it every day.\",\"ru\":\"В опросе спрашивают, как часто семья читает газету; ответ — каждый день.\",\"quotes\":[\"we read the entire paper on a daily basis\"]},\"11\":{\"part\":2,\"en\":\"C — He most enjoyed the variety of people he worked with, not jobs or countries.\",\"ru\":\"C — Больше всего ему нравилось разнообразие людей, с которыми он работал, а не профессий или стран.\",\"quotes\":[\"the incredible variety of workmates I’ve had\"]},\"12\":{\"part\":2,\"en\":\"A — Kitchen assistants arrive first and leave last, so the long commitment may not suit everyone.\",\"ru\":\"A — Помощники на кухне приходят первыми и уходят последними; такой график подходит не всем.\",\"quotes\":[\"arrive at work first and leave last\"]},\"13\":{\"part\":2,\"en\":\"A — Porters are undervalued: they shape guests’ first impression on arrival.\",\"ru\":\"A — Роль носильщика недооценивают, хотя именно он часто формирует первое впечатление гостя.\",\"quotes\":[\"A porter’s role is more important than many people realize\"]},\"14\":{\"part\":2,\"en\":\"C — Reception experience helps move a career forward in the long run.\",\"ru\":\"C — Работа на ресепшене со временем помогает продвинуться по карьерной лестнице.\",\"quotes\":[\"a good way of moving your career forward in the long run\"]},\"15\":{\"part\":2,\"en\":\"B — Interview skills can be developed with a little training and rehearsal.\",\"ru\":\"B — Навыки прохождения собеседования можно развить тренировкой и репетицией.\",\"quotes\":[\"not too difficult to develop these skills with a little training and rehearsal\"]},\"16\":{\"part\":2,\"en\":\"J — From the hall, turn right past the office; restaurant service is in the classroom next door, marked J.\",\"ru\":\"J — Из зала нужно повернуть направо и пройти к офису; ресторанный сервис находится в соседней аудитории J.\",\"quotes\":[\"the classroom immediately next door to that\"]},\"17\":{\"part\":2,\"en\":\"C — Kitchen Hands is across the square, in the left classroom of the two-room block; the plan labels it C.\",\"ru\":\"C — Kitchen Hands находится за площадью, в левой аудитории блока из двух комнат; на плане это C.\",\"quotes\":[\"you want the one on the left\"]},\"18\":{\"part\":2,\"en\":\"B — The combined porters/cleaners/dishwashers workshop is at the eastern end of the long northern classroom block, B.\",\"ru\":\"B — Общий семинар для носильщиков, уборщиков и мойщиков посуды — в восточном конце длинного северного блока, B.\",\"quotes\":[\"the one at the eastern end\"]},\"19\":{\"part\":2,\"en\":\"E — Reception is beyond the office, heading north between the classroom blocks; the plan marks it E.\",\"ru\":\"E — Ресепшен находится севернее офиса, между блоками аудиторий; на плане это E.\",\"quotes\":[\"head up north between the two sets of classrooms\"]},\"20\":{\"part\":2,\"en\":\"F — The interview-skills workshop is in the single large classroom on the western side of the square. That room is F on the plan.\",\"ru\":\"F — Занятие по собеседованиям проходит в единственной большой аудитории с западной стороны площади. На плане это F.\",\"quotes\":[\"on the western side of the square, there's a single large classroom\"]},\"21\":{\"part\":3,\"en\":\"B — They are presenting at the university Open Day to interest prospective students; the talk is not assessed.\",\"ru\":\"B — Они выступают на дне открытых дверей, чтобы заинтересовать будущих студентов; это не оценочная работа.\",\"quotes\":[\"for the university Open Day ... people thinking about coming here to study\"]},\"22\":{\"part\":3,\"en\":\"A — The bike reaches the same speed as petrol models but is much more efficient.\",\"ru\":\"A — По скорости мотоцикл сопоставим с бензиновыми, но его эффективность заметно выше.\",\"quotes\":[\"it has an efficiency of 90%, whereas ordinary bikes are far less\"]},\"23\":{\"part\":3,\"en\":\"C — Sarah means they have little preparation time because the talk is next week and they are busy.\",\"ru\":\"C — Сара говорит о нехватке времени на подготовку: выступление уже на следующей неделе, а они заняты.\",\"quotes\":[\"the talk’s next week, and we have a lot of other stuff on\"]},\"24\":{\"part\":3,\"en\":\"B — They settle on opening with a short film clip from the race, rather than splitting the speaking or leaving most time for questions.\",\"ru\":\"B — Они решают начать с короткого видео гонки, а не распределять речь или отдавать большую часть времени вопросам.\",\"quotes\":[\"start by showing a couple of minutes from the film of the race\"]},\"25\":{\"part\":3,\"en\":\"A — Sarah suggests photos from the project’s stages; she says they will be more engaging than diagrams or text-heavy slides.\",\"ru\":\"A — Сара предлагает фотографии разных этапов проекта: они нагляднее диаграмм и слайдов с большим количеством текста.\",\"quotes\":[\"I took lots of photos as we went along\"]},\"26\":{\"part\":3,\"en\":\"A — They decide to ask Amish, a student in the fourth year, for pointers that afternoon.\",\"ru\":\"A — Они решают после обеда поговорить с Амышем, студентом четвёртого курса, и попросить совета.\",\"quotes\":[\"have a word with Amish in the fourth year\"]},\"27\":{\"part\":3,\"en\":\"D — Sarah’s sister proofread the report and caught several careless errors.\",\"ru\":\"D — Сестра Сары вычитала отчёт и нашла несколько небрежных ошибок.\",\"quotes\":[\"your sister had time to proofread it\"]},\"28\":{\"part\":3,\"en\":\"A — The students say keeping the log book was unexpectedly time-consuming.\",\"ru\":\"A — Студенты отмечают, что ведение журнала заняло больше времени, чем они ожидали.\",\"quotes\":[\"I actually found it really time consuming ... I hadn’t anticipated that\"]},\"29\":{\"part\":3,\"en\":\"E — The tutor noticed an error in their aerodynamic sketches before it caused a problem.\",\"ru\":\"E — Преподаватель заметил ошибку в аэродинамических эскизах до того, как она привела бы к проблемам.\",\"quotes\":[\"the tutor picked up on that mistake we made in our aerodynamic sketches\"]},\"30\":{\"part\":3,\"en\":\"C — The tutor had useful industry contacts and helped the students find sponsors.\",\"ru\":\"C — У преподавателя оказались полезные связи в отрасли, которые помогли найти спонсоров.\",\"quotes\":[\"such useful contacts in industry\"]},\"31\":{\"part\":4,\"en\":\"Researchers benefited from Bacon’s magnifying glass: it helped them read despite impaired vision. The gap asks who was helped.\",\"ru\":\"Учёным с ослабленным зрением лупа помогала читать. Пропуск спрашивает, кому помогло изобретение: researchers.\",\"quotes\":[\"This proved to be a benefit mostly for researchers\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"32\":{\"part\":4,\"en\":\"The first small telescope was taken to the theatre to see the stage more clearly. Write the place, theatre.\",\"ru\":\"Маленький телескоп брали в театр, чтобы лучше видеть сцену. Нужное место — theatre.\",\"quotes\":[\"people took it to the theatre for a better view of the stage\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"33\":{\"part\":4,\"en\":\"Opticians’ lenses were not powerful enough, so Galileo started production of his own lenses. The noun after started is production.\",\"ru\":\"Линзы оптиков были недостаточно мощными, поэтому Галилей начал их собственное производство — production.\",\"quotes\":[\"he would have to start the production of his own lenses\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"34\":{\"part\":4,\"en\":\"Venice’s government saw military potential in the improved instrument. The intended user was the army.\",\"ru\":\"Правительство Венеции увидело военное применение прибора: его собирались использовать для армии — army.\",\"quotes\":[\"the advantages this eyeglass could have for the army\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"35\":{\"part\":4,\"en\":\"Galileo estimated mountain heights from bright spots in the Moon’s dark areas. The gap describes the spots, so use bright.\",\"ru\":\"Высоту гор Галилей оценивал по ярким пятнам в тёмных областях Луны. Пятна были bright.\",\"quotes\":[\"by looking for bright spots in the dark areas\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"36\":{\"part\":4,\"en\":\"He turned his calculations into charts showing the Moon’s terrain and mountain heights. The thing he created was charts.\",\"ru\":\"На основе расчётов он рисовал карты рельефа и высоты гор. Созданный результат — charts.\",\"quotes\":[\"he was able to draw charts of the terrain\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"37\":{\"part\":4,\"en\":\"The objects near Jupiter initially looked like stars, but their daily orbits showed they were moons. The gap asks what they were not: stars.\",\"ru\":\"Объекты возле Юпитера сначала приняли за звёзды, но их орбиты показали, что это спутники. В пропуске после not нужно stars.\",\"quotes\":[\"they were moons, not stars\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"38\":{\"part\":4,\"en\":\"Increasing the telescope’s length improved magnification. The examples of four and 43 metres illustrate that dimension.\",\"ru\":\"Увеличение длины телескопа улучшало увеличение. Примеры 4 и 43 метра относятся к length.\",\"quotes\":[\"when they increased the length of the telescope, the intensity of magnification improved\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"39\":{\"part\":4,\"en\":\"Even the slightest wind moved the long telescope, preventing accurate observation. The cause of movement was wind.\",\"ru\":\"Даже слабый ветер сдвигал длинный телескоп и мешал точным наблюдениям. Причина движения — wind.\",\"quotes\":[\"the slightest wind caused the instrument to shift\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false},\"40\":{\"part\":4,\"en\":\"Mounting the telescope on a building provided a more stable support. The gap asks what it was attached to.\",\"ru\":\"Телескоп закрепили на здании ради устойчивости. В пропуске спрашивается опора — building.\",\"quotes\":[\"mounted the telescope on a building\"],\"basis\":\"question-and-current-transcript\",\"audioVerified\":false}}}]]\n"])</script></body></html>
