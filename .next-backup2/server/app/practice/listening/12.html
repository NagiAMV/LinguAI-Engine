).html\"},{\"part\":4,\"type\":\"user-provided-html\",\"label\":\"FULL LISTENING (4).html\",\"reference\":\"FULL LISTENING (4).html\"}]},\"explanations\":{\"1\":{\"part\":1,\"en\":\"£3,834. The standard room costs £3,276, while the ensuite option is £3,834. The notes ask for the ensuite price.\",\"ru\":\"3 834 фунта. Стандартная комната стоит £3 276, а вариант с отдельной ванной — £3 834. Вопрос просит цену второго варианта.\",\"quotes\":[\"three thousand eight hundred and … thirty-four pounds\"]},\"2\":{\"part\":1,\"en\":\"HOLIDAYS. The college room is let for 36 weeks and students must leave during the holidays, so it is not available then.\",\"ru\":\"HOLIDAYS — каникулы. Комната в колледже сдаётся на 36 недель; на каникулы жильцы должны освободить её.\",\"quotes\":[\"it's for 36 weeks\",\"It doesn't include holidays. You have to vacate the room then\"]},\"3\":{\"part\":1,\"en\":\"HOME WELCOME. This is the name of the arrangement where a student stays with a local family, including meals and heating.\",\"ru\":\"HOME WELCOME — проживание в семье. Так называется вариант, при котором студент живёт у местной семьи; питание и отопление включены.\",\"quotes\":[\"We call this arrangement home welcome\"]},\"4\":{\"part\":1,\"en\":\"FLEXIBLE. Unlike the 36-week college contract, the family arrangement does not require a full-year stay; the agent describes it as flexible.\",\"ru\":\"FLEXIBLE — гибкий. В отличие от договора на комнату в колледже, здесь не требуется жить целый год; условия называют гибкими.\",\"quotes\":[\"No. It's flexible\"]},\"5\":{\"part\":1,\"en\":\"STUDIO. For a student who does not want to share kitchen and bathroom facilities, the alternative private rental is a studio.\",\"ru\":\"STUDIO — студия. Если студент не хочет делить кухню и ванную с соседями, можно снять студию.\",\"quotes\":[\"What about if I don't want to share?\",\"You can get what we call a studio\"]},\"6\":{\"part\":1,\"en\":\"48. Last year the average gas and electricity bill was £43 per month; this year it is expected to be about £48.\",\"ru\":\"48. В прошлом году газ и электричество обходились примерно в £43 в месяц; на этот год ожидают около £48.\",\"quotes\":[\"last year, students were paying, on average, about £43 per month\"]},\"7\":{\"part\":1,\"en\":\"WATER. In addition to gas and electricity, the student will need to pay about £9 for water.\",\"ru\":\"WATER — вода. Помимо газа и электричества, нужно будет платить около £9 за воду.\",\"quotes\":[\"on top of that you have to pay for water\",\"around nine pounds\"]},\"8\":{\"part\":1,\"en\":\"TRANSPORTATION. The student realizes travel costs are another expense because private rentals are usually some distance from college.\",\"ru\":\"TRANSPORTATION — транспорт. Студентка понимает, что придётся платить за дорогу: частное жильё обычно находится далеко от колледжа.\",\"quotes\":[\"I'd have to pay for transportation, too\",\"Most of these properties are quite a long way from the college\"]},\"9\":{\"part\":1,\"en\":\"A DEPOSIT. The landlord requires an initial deposit; this is separate from the six-month minimum contract.\",\"ru\":\"DEPOSIT — залог. При аренде нужно внести залог. Это отдельное условие от минимального договора на шесть месяцев.\",\"quotes\":[\"To pay a deposit\"]},\"10\":{\"part\":1,\"en\":\"REFERENCES. Two references from people in the country are required before the student can rent privately.\",\"ru\":\"REFERENCES — рекомендации. Для частной аренды нужны две рекомендации от людей, живущих в этой стране.\",\"quotes\":[\"you'd have to provide references\",\"They want two from someone in this country\"]},\"11\":{\"part\":2,\"en\":\"B — local residents. People from the area spent two years preparing the Heritage Clothes exhibition and contributed garments from their own communities.\",\"ru\":\"B — местные жители. Жители района два года готовили выставку и предоставили одежду из своих общин.\",\"quotes\":[\"People who live in the area have spent two years preparing this exhibition\"]},\"12\":{\"part\":2,\"en\":\"A — the clothes’ owners. The photographs show real people wearing their own traditional clothes in everyday life, not models or design students.\",\"ru\":\"A — владельцы одежды. На фотографиях обычные люди носят свою традиционную одежду в повседневной жизни, а не профессиональные модели или студенты.\",\"quotes\":[\"show the clothes being modelled by the real people who wear them\"]},\"13\":{\"part\":2,\"en\":\"B — it is on show for a limited time. The travelling exhibition will be at this museum for ten weeks only.\",\"ru\":\"B — выставка временная. Передвижную экспозицию можно увидеть в этом музее только десять недель.\",\"quotes\":[\"is on tour … throughout the country and will be here for 10 weeks only\"]},\"14\":{\"part\":2,\"en\":\"C — see the board games. Visitors are told not to miss the giant board games laid out on the gallery floor; the trains and dolls are described but are not the recommendation.\",\"ru\":\"C — посмотреть на настольные игры. Посетителям рекомендуют не пропустить гигантские игры на полу галереи. Поезда и куклы упоминаются как экспонаты, но не как главная рекомендация.\",\"quotes\":[\"The gigantic board games ... are one of the most popular activities ... and should not be missed\"]},\"15\":{\"part\":2,\"en\":\"C — borrowed. The miniature toys are on loan from countries around the world, so the museum has borrowed them rather than made or purchased them.\",\"ru\":\"C — взяты взаймы. Миниатюрные игрушки предоставлены музеям других стран во временное пользование.\",\"quotes\":[\"These small objects are on loan from countries all over the world\"]},\"16\":{\"part\":2,\"en\":\"B — tins of different shapes. The factory produced round, square, triangular and hexagonal tins for different occasions.\",\"ru\":\"B — жестяные коробки разных форм. Фабрика выпускала круглые, квадратные, треугольные и шестиугольные коробки для разных случаев.\",\"quotes\":[\"The factory made tins round, square, triangular, hexagonal\"]},\"17\":{\"part\":2,\"en\":\"A — an unsweetened biscuit. The most popular biscuit was a plain savoury one eaten with cheese, not a chocolate or cream-filled biscuit.\",\"ru\":\"A — несладкое печенье. Больше всего людям нравилось простое солёное печенье к сыру, а не шоколадное или с кремовой начинкой.\",\"quotes\":[\"people's favourite biscuit was ... a plain savoury one which was eaten with cheese\"]},\"18\":{\"part\":2,\"en\":\"C — pack a biscuit tin. The hands-on task is to arrange replica biscuits neatly inside a tin, not to bake or taste them.\",\"ru\":\"C — собрать печенье в жестяную коробку. В интерактивном задании нужно аккуратно уложить деревянные копии печенья в коробку; их не выпекают и не пробуют.\",\"quotes\":[\"fill your own biscuit tin\",\"Your job is to fill a tin with biscuits\"]},\"19\":{\"part\":2,\"en\":\"INFORMATION DESK. The gift shop is next to the information desk on the ground floor.\",\"ru\":\"INFORMATION DESK — стойка информации. Магазин музея находится рядом со стойкой информации на первом этаже.\",\"quotes\":[\"a museum gift shop ... next to the information desk on the ground floor\"]},\"20\":{\"part\":2,\"en\":\"LOCKERS. Visitors can store their coats and bags in the free lockers provided by the museum.\",\"ru\":\"LOCKERS — шкафчики. Верхнюю одежду и сумки можно оставить в бесплатных шкафчиках музея.\",\"quotes\":[\"please make use of the free lockers provided by the museum\"]},\"21\":{\"part\":3,\"en\":\"C — a wider range of uses. Many cultures make bark cloth, but Pacific tapa is distinctive for the variety of roles it has played.\",\"ru\":\"C — более широкий круг применений. Кору для ткани используют и в других культурах, но тихоокеанская тапа отличается разнообразием функций.\",\"quotes\":[\"the incredible variety of roles it's … played in this region\"]},\"22\":{\"part\":3,\"en\":\"B — it is not native to the Pacific. The paper mulberry was brought to the islands by early migrants; breadfruit, by contrast, is also a food source.\",\"ru\":\"B — это дерево не было местным для островов. Бумажную шелковицу привезли первые переселенцы; хлебное дерево, в отличие от неё, даёт ещё и пищу.\",\"quotes\":[\"it wasn't originally found in the islands\",\"was carried in their canoes by the first migrants\"]},\"23\":{\"part\":3,\"en\":\"C — they found a better fabric material. In New Zealand, flax produced stronger cloth than tapa, so the Maori switched to it.\",\"ru\":\"C — они нашли более подходящий материал. В Новой Зеландии лён давал более прочную ткань, поэтому маори перешли на него.\",\"quotes\":[\"they found the flax plant … because it makes a stronger fabric\"]},\"24\":{\"part\":3,\"en\":\"A — the pieces are glued together. An arrowroot paste joins smaller pieces; the bark strips are too fine to weave, and stitching is not strong enough.\",\"ru\":\"A — куски склеивают. Их соединяют пастой из корня аррорута: волокна слишком тонкие для плетения, а швы недостаточно прочны.\",\"quotes\":[\"the different pieces are glued together using an adhesive paste\",\"too fine to be woven together and stitching isn't strong enough\"]},\"25\":{\"part\":3,\"en\":\"C — spiritual. Samoan tapa robes are worn at important ceremonies and decorated with images of ancestors.\",\"ru\":\"C — духовная/ритуальная. Самоанские одежды из тапы надевают на важные церемонии и украшают изображениями предков.\",\"quotes\":[\"hand-painted with representations of the ancestors\",\"at the most profound events in life\"]},\"26\":{\"part\":3,\"en\":\"B — practical. Tongan tapa is quick to make and used for everyday household items such as bedcovers, mosquito nets and curtains.\",\"ru\":\"B — практическая. Тонганскую тапу быстро изготовить; её используют в быту для покрывал, москитных сеток и штор.\",\"quotes\":[\"everyday functions around the house like bedcovers, mosquito nets and curtains\"]},\"27\":{\"part\":3,\"en\":\"C — spiritual. Cook Islands tapa was wrapped around poles to mark entrances to places of worship.\",\"ru\":\"C — духовная/ритуальная. Тапой с островов Кука оборачивали столбы у входов в места поклонения.\",\"quotes\":[\"wrapped around the poles and used to mark the entrances to places of worship\"]},\"28\":{\"part\":3,\"en\":\"D — commercial. In Fiji, people exchanged tapa for other goods such as canoes or pigs, so it functioned as currency.\",\"ru\":\"D — коммерческая. На Фиджи тапу обменивали на другие товары, например каноэ или свиней; она служила валютой.\",\"quotes\":[\"tapa was actually used as a currency\",\"exchange tapa for other commodities\"]},\"29\":{\"part\":3,\"en\":\"A — recreational. Tahitian coloured patterns are decorative; people wear bright robes for dancing and games for enjoyment.\",\"ru\":\"A — развлекательная. Цветные узоры на Таити служат украшением: яркие одежды надевают для танцев и игр.\",\"quotes\":[\"The colours are only a decoration\",\"for dancing and competitive games, and do it just for fun\"]},\"30\":{\"part\":3,\"en\":\"B — practical. In Tikopia, tapa is worn for everyday work, including working in gardens, rather than being saved for special occasions.\",\"ru\":\"B — практическая. На Тикопии одежду из тапы носят в повседневной жизни, в том числе во время работы в садах, а не только по праздникам.\",\"quotes\":[\"people working in the gardens wearing\"]},\"31\":{\"part\":4,\"en\":\"B — geographical area. Participants came from the local region, while the sample deliberately included people of different ages and varied home backgrounds.\",\"ru\":\"B — географический регион. Все участники жили в местном регионе, хотя возраст и семейный фон у них различались.\",\"quotes\":[\"all respondents were living at home in the local region\",\"sample was drawn from a range of ages\"]},\"32\":{\"part\":4,\"en\":\"A — effects on home life. Mature students with children were particularly concerned about how study might affect their relationships with them.\",\"ru\":\"A — влияние на домашнюю жизнь. Студенты постарше с детьми особенно беспокоились, как учёба скажется на отношениях с детьми.\",\"quotes\":[\"mature students with children tended to emphasize uncertainties about their relationship with them\"]},\"33\":{\"part\":4,\"en\":\"CHALLENGE. At the highest importance level, students said they took pleasure in challenge as a personal characteristic supporting persistence.\",\"ru\":\"CHALLENGE — сложная задача/вызов. Среди личных качеств, помогающих продолжать учёбу, участники особенно выделили удовольствие от преодоления трудностей.\",\"quotes\":[\"they took pleasure in challenge\"]},\"34\":{\"part\":4,\"en\":\"SCHOOL. At the second level, students reported that positive experiences at school supported their persistence.\",\"ru\":\"SCHOOL — школа. На втором уровне участники называли положительный опыт в школе фактором, помогавшим продолжать учёбу.\",\"quotes\":[\"they had enjoyed themselves in school\"]},\"35\":{\"part\":4,\"en\":\"HEALTH. The second-level finding under other factors is decent health, which had a fairly strong influence on persistence.\",\"ru\":\"HEALTH — здоровье. Среди других факторов второго уровня назвали хорошее здоровье, которое заметно влияло на продолжение учёбы.\",\"quotes\":[\"what was of most importance was decent health\",\"strong influence on their persistence\"]},\"36\":{\"part\":4,\"en\":\"INTERESTS. Students valued having many interests in daily life because they provided perspective and depth.\",\"ru\":\"INTERESTS — интересы. Участники считали важным иметь много повседневных интересов: это давало широту взглядов и перспективу.\",\"quotes\":[\"lots of interests in their everyday lives\",\"a depth and sense of perspective\"]},\"37\":{\"part\":4,\"en\":\"TUTORS. Good relationships with tutors were named as a social factor at the third level of importance.\",\"ru\":\"TUTORS — преподаватели. Хорошие отношения с преподавателями указаны как социальный фактор третьего уровня важности.\",\"quotes\":[\"good relationships with their tutors\"]},\"38\":{\"part\":4,\"en\":\"MATURITY. The proposed questionnaire would help identify new students’ maturity when they start the course.\",\"ru\":\"MATURITY — зрелость. Анкета нужна, чтобы оценить зрелость новых студентов в начале курса.\",\"quotes\":[\"questionnaires to first-year students to help get an idea of their maturity\"]},\"39\":{\"part\":4,\"en\":\"ADVISORS. Selected students would be trained to take on the role of advisors and provide accessible support to others.\",\"ru\":\"ADVISORS — консультанты. Некоторых студентов предлагают обучить роли консультантов, чтобы они могли поддерживать однокурсников.\",\"quotes\":[\"offering induction courses for some selected students to allow them to take on the role of advisors\"]},\"40\":{\"part\":4,\"en\":\"ONLINE. Because students often need support when offices are closed, the recommendation is to provide online services outside office hours.\",\"ru\":\"ONLINE — онлайн. Помощь часто нужна вечером и ночью, когда офисы закрыты, поэтому предлагается организовать онлайн-сервисы.\",\"quotes\":[\"help is often most needed in the evening and night when offices are closed\",\"set up online services\"]}}}]]\n"])</script></body></html>
